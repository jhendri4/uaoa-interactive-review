:{"text":"Sweden"},"html":{"text":"\u003cp>In Sweden, online hate or abuse is not a separate legal category. The Swedish Police explains that the same criminal laws generally apply to conduct online as they do offline, with relevant offences potentially including unlawful threats, harassment, defamation, insult, unlawful invasion of privacy, sexual harassment, unlawful identity misuse (e.g. fake profiles in someone else's name), and agitation against a population group. If an offence is motivated by, for example, the victim's ethnicity, religion or sexual orientation, this is an aggravating circumstance in sentencing.\u003c/p>\u003cp>Swedish law also recognises unlawful persecution, which can arise from repeated criminal acts against the same person. Police guidance specifically advises people experiencing stalking to preserve emails, text messages, call records and other digital communications as potential evidence.\u003c/p>\u003cp>\u003cem>Sources: \u003ca href=\"https://polisen.se\" target=\"_blank\" rel=\"noopener\">polisen.se\u003c/a>; \u003ca href=\"https://www.riksdagen.se/sv/dokument-och-lagar/\" target=\"_blank\" rel=\"noopener\">Swedish Parliament\u003c/a>\u003c/em>\u003c/p>","note":"HTML allowed"}},"i6":{"title":{"text":"Slovenia"},"html":{"text":"\u003cp>Slovenian law addresses online abuse through existing legislation covering specific harmful behaviours. A particularly relevant example is \u003cstrong>Article 134a of the Slovenian Criminal Code (KZ-1)\u003c/strong>, which defines stalking to include repeated attempts to establish unwanted contact through electronic communications, where the conduct causes fear or a sense of threat. Slovenian authorities have also recognised the online dimension of stalking in guidance concerning the application of this provision.\u003c/p>\u003cp>Slovenian Police guidance recognises online violence as including behaviours such as threats, harassment, spreading false or insulting content, misuse of photographs, impersonation and the creation of harmful fake profiles. Whether particular conduct constitutes a criminal offence depends on the circumstances of the individual case.\u003c/p>\u003cp>\u003cem>Source: \u003ca href=\"https://www.gov.si/\" target=\"_blank\" rel=\"noopener\">GOV.SI\u003c/a>\u003c/em>\u003c/p>","note":"HTML allowed"}}}},"check":{"questions":{"q1":{"prompt":{"text":"An abusive online incident may potentially involve more than one legal pathway. Which statement best explains why?"},"choices":{"c0":{"text":"The person targeted can choose whichever law they prefer."},"c1":{"text":"The same incident may raise different legal issues depending on the conduct, circumstances, and applicable law."},"c2":{"text":"Online incidents automatically involve criminal and civil law."},"c3":{"text":"Each social media platform determines which legal pathway applies."}},"ok":{"text":"\u003cstrong>Correct!\u003c/strong>","note":"HTML allowed"}},"q2":{"prompt":{"text":"Someone experiences harmful online behaviour, but the conduct does not meet the legal threshold for an offence or claim. What does this mean?"},"choices":{"c0":{"text":"The behaviour cannot be considered online abuse because the words used in the comments are not identical to what the law describes."},"c1":{"text":"The platform is solely responsible for responding and deciding what is online abuse."},"c2":{"text":"Other responses may still be available through platform rules, organisational policies, safeguarding procedures, or codes of conduct."},"c3":{"text":"The person should wait to see whether the behaviour becomes more serious."}},"ok":{"text":"\u003cstrong>Correct!\u003c/strong>","note":"HTML allowed"}},"q3":{"prompt":{"text":"Why can responding to online abuse through the law be challenging?"},"choices":{"c0":{"text":"Online behaviour falls outside national laws."},"c1":{"text":"People, platforms, and harmful activity may cross jurisdictions, and identifying those responsible or gathering evidence can be difficult."},"c2":{"text":"Online abuse can only be investigated when the responsible account uses a real name."},"c3":{"text":"Sporting organisations must complete their own investigation before authorities can become involved."}},"ok":{"text":"\u003cstrong>Correct!\u003c/strong>","note":"HTML allowed"}},"q4":{"prompt":{"text":"Which statement best describes how legal responses to online abuse can differ between countries?"},"choices":{"c0":{"text":"Every country has a specific offence called online abuse."},"c1":{"text":"European countries apply the same national laws because they share regional regulations."},"c2":{"text":"Online conduct is governed primarily by the country where the social media company is based."},"c3":{"text":"Countries may apply different existing laws to online conduct, and some legislation explicitly addresses particular digital behaviours."}},"ok":{"text":"\u003cstrong>Correct!\u003c/strong>","note":"HTML allowed"}}}},"takeaways":{"heading":{"text":"Key Takeaways"},"items":{"i1":{"text":"\u003cstrong>Online abuse can engage different areas of law.\u003c/strong> Criminal, civil, and administrative pathways involve different processes, actors, and possible outcomes.","note":"HTML allowed"},"i2":{"text":"\u003cstrong>More than one pathway may apply.\u003c/strong> The same incident can raise criminal, civil, or regulatory issues depending on the circumstances.","note":"HTML allowed"},"i3":{"text":"\u003cstrong>Legal responses depend on context and jurisdiction.\u003c/strong> The applicable law, available evidence, and location of the people and services involved can affect what action is possible.","note":"HTML allowed"},"i4":{"text":"\u003cstrong>Legal pathways have practical limits.\u003c/strong> Cross-border activity, identifying responsible individuals, enforcement capacity, and legal thresholds can make action difficult.","note":"HTML allowed"},"i5":{"text":"\u003cstrong>Responsibility extends beyond the law.\u003c/strong> Sporting organisations can establish policies, reporting procedures, safeguarding support, and consequences for harmful behaviour.","note":"HTML allowed"},"i6":{"text":"\u003cstrong>Sportsmanship extends to digital spaces.\u003c/strong> Respect, fair play, and responsible conduct remain relevant when people participate in sport online.","note":"HTML allowed"}}},"slide":{"title":{"text":"Module 4 - Knowing Your Rights and Responsibilities","note":"slide_intro title"},"continueToModule5":{"text":"Continue to Module 5","note":"End-of-module navigation_button label"},"callout":{"pleaseNote":{"body":{"text":"\u003cp>\u003cspan style=\"color: #091324\">This module provides a general overview of legal responses to online abuse and does not constitute legal advice. Laws differ between jurisdictions and can change over time. For advice about a specific situation, consult an appropriately qualified professional.\u003c/span>\u003c/p>","note":"Callout body on Knowing Your Rights and Responsibilities"},"title":{"text":"\u003cspan style=\"color: #1c3564\">Please note\u003c/span>","note":"Callout title on Knowing Your Rights and Responsibilities"}}},"howCanLegalResponsesDifferBy":{"body":{"text":"\u003cp>\u003cspan style=\"color: #091324\">The legal response to online abuse depends on where an incident occurs and which laws apply. Select a region to see an example of how existing laws can apply to online behaviour.\u003c/span>\u003c/p>","note":"Native text body on Knowing Your Rights and Responsibilities"},"heading":{"text":"\u003cspan style=\"color: #1c3564\">How can legal responses differ by country?\u003c/span>","note":"Native heading on Knowing Your Rights and Responsibilities"}},"internationalFederationsNationalGoverningBodiesClubs":{"body":{"text":"\u003cp>\u003cspan style=\"color: #091324\">International federations, national governing bodies, clubs, leagues, and other sporting organisations may have different responsibilities and resources. \u003cstrong>Clear policies and consistent processes help translate shared standards into action across different levels of sport\u003c/strong>.\u003c/span>\u003c/p>","note":"Native text body on Knowing Your Rights and Responsibilities"}},"introSubtitle":{"text":"Estimated time: 15 minutes","note":"slide_intro subtitle (estimated time)"},"responsibilitiesBeyondTheLaw":{"body":{"text":"\u003cp>\u003cspan style=\"color: #091324\">The law establishes legal obligations. \u003cstrong>Sport also establishes standards for participation and conduct\u003c/strong>.\u003c/span>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003cspan style=\"color: #091324\">Codes of conduct, safeguarding procedures, safety policies, disciplinary processes, and community standards can help sporting organisations \u003cstrong>respond to harmful behaviour even when a legal pathway is unavailable or inappropriate.\u003c/strong>\u003c/span>\u003c/p>","note":"Native text body on Knowing Your Rights and Responsibilities"},"heading":{"text":"\u003cspan style=\"color: #1c3564\">Responsibilities beyond the law\u003c/span>","note":"Native heading on Knowing Your Rights and Responsibilities"}},"selectTheBestOptionForEach":{"body":{"text":"\u003cp>\u003cspan style=\"color: #091324\">Select the best option for each question. You must answer each question correctly before continuing. You can retry as many times as you like.\u003c/span>\u003c/p>","note":"Native text body on Knowing Your Rights and Responsibilities"}},"threeLegalPathways":{"body":{"text":"\u003cp>Online abuse may engage \u003cstrong>criminal, civil, or administrative law and regulations\u003c/strong>. Each pathway involves different actors, processes, and potential outcomes, and the same incident may involve more than one.\u003c/p>\u003cp>\u003c/p>\u003cp>These pathways are not mutually exclusive. The same incident may raise different legal issues depending on what occurred and which laws apply.\u003c/p>\u003cp>\u003c/p>","note":"Native text body on Knowing Your Rights and Responsibilities"},"heading":{"text":"\u003cspan style=\"color: #1c3564\">Three legal pathways\u003c/span>","note":"Native heading on Knowing Your Rights and Responsibilities"}},"whenOnlineAbuseOccursImportantQuestions":{"body":{"text":"\u003cp>\u003cspan style=\"color: #091324\">When online abuse occurs, important questions can arise: \u003cstrong>What legal protections are available? Who can take action? What responsibilities do individuals and organisations have?\u003c/strong>\u003c/span>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003cspan style=\"color: #091324\">The answers depend on the behaviour, where it occurs, and the applicable laws. Understanding the main legal pathways can help you recognise \u003cstrong>your rights and responsibilities, where legal accountability may be possible, and when other forms of action are important.\u003c/strong>\u003c/span>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003cspan style=\"color: #091324\">In sport, legal protections work alongside \u003cstrong>organisational policies, codes of conduct, safeguarding procedures, and standards of sportsmanship.\u003c/strong> Together, these mechanisms help establish expectations for safer participation online.\u003c/span>\u003c/p>","note":"Native text body on Knowing Your Rights and Responsibilities"},"heading":{"text":"\u003cspan style=\"color: #1c3564; font-size: 14px\">When online abuse occurs, important questions can arise: \u003cstrong>What legal protections are available? Who can take action? What responsibilities do individuals and organisations have?\u003c/strong>\u003c/span>\u003cbr>\u003cspan style=\"color: #1c3564; font-size: 14px\">The answers depend on the behaviour, where it occurs, and the applicable laws. Understanding the main legal pathways can help you recognise \u003cstrong>your rights and responsibilities, where legal accountability may be possible, and when other forms of action are important.\u003c/strong>\u003c/span>\u003cbr>\u003cspan style=\"color: #1c3564; font-size: 14px\">In sport, legal protections work alongside \u003cstrong>organisational policies, codes of conduct, safeguarding procedures, and standards of sportsmanship.\u003c/strong> Together, these mechanisms help establish expectations for safer participation online.\u003c/span>","note":"Native heading on Knowing Your Rights and Responsibilities"}},"whereLegalResponsesHaveLimits":{"body":{"text":"\u003cp>\u003cspan style=\"color: #091324\">Legal pathways can provide important forms of accountability, but online environments create practical challenges for investigation and enforcement.\u003c/span>\u003c/p>","note":"Native text body on Knowing Your Rights and Responsibilities"},"heading":{"text":"\u003cspan style=\"color: #1c3564\">Where legal responses have limits\u003c/span>","note":"Native heading on Knowing Your Rights and Responsibilities"}},"whoCanDoWhat":{"col1":{"text":"\u003ch4 class=\"course-block-heading\">\u003cspan style=\"color: #091324\">Sporting organisations should:\u003c/span>\u003c/h4>\u003cul style=\"margin-left: 10px; padding-left: 1.25em;\">\u003cli>\u003cp>\u003cspan style=\"color: #091324\">Define online abuse and expected online conduct codes in organisational policies\u003c/span>\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cspan style=\"color: #091324\">Establish clear and accessible reporting procedures\u003c/span>\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cspan style=\"color: #091324\">Apply organisational consequences when codes of conduct are breached\u003c/span>\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cspan style=\"color: #091324\">Provide education on recognising, preventing, and responding to online abuse\u003c/span>\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cspan style=\"color: #091324\">Provide access to welfare and safeguarding support\u003c/span>\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cspan style=\"color: #091324\">Cooperate with platforms, regulators, or relevant authorities where appropriate\u003c/span>\u003c/p>\u003c/li>\u003c/ul>","note":"Native text body on Knowing Your Rights and Responsibilities"},"col2":{"text":"\u003ch4 class=\"course-block-heading\">\u003cspan style=\"color: #091324\">Everyone in sport should:\u003c/span>\u003c/h4>\u003cul style=\"margin-left: 10px; padding-left: 1.25em;\">\u003cli>\u003cp>\u003cspan style=\"color: #091324\">Follow the codes of conduct and policies associated with their role\u003c/span>\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cspan style=\"color: #091324\">Use appropriate channels to report harmful behaviour\u003c/span>\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cspan style=\"color: #091324\">Avoid sharing or amplifying abusive content\u003c/span>\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cspan style=\"color: #091324\">Support people who are targeted\u003c/span>\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cspan style=\"color: #091324\">Recognise that standards of respect, fair play, and sportsmanship also apply in digital spaces\u003c/span>\u003c/p>\u003c/li>\u003c/ul>","note":"Native text body on Knowing Your Rights and Responsibilities"},"heading":{"text":"Who can do what","note":"Native heading on Knowing Your Rights and Responsibilities"}}}},"m5":{"layers":{"ui":{"prompt":{"text":"Safer sport depends on action at every level. Select a layer to explore what each one can do."},"tracksAria":{"text":"Action layers"},"backToLayers":{"text":"Back to layers"},"done":{"text":"All three layers explored"},"openLayer":{"text":"Explore"},"overview":{"text":"Overview"},"exploredOf":{"text":"{n} of 3 layers explored"},"exploredReview":{"text":"Explored · Review"},"startExploring":{"text":"Start exploring"},"whyMatter":{"text":"Why does this matter?"},"hideWhy":{"text":"Hide explanation"},"orpShort":{"text":"ORP"},"clickToReveal":{"text":"Click to reveal"},"nextPrefix":{"text":"Next:"},"howItConnects":{"text":"How it Connects"},"actionLevelOf":{"text":"Action level {n} of 3"},"layerOf":{"text":"Layer {n} of 3"},"title":{"text":"Three layers of action","note":"Overview heading"},"layerAria":{"text":"Layer {n}: {title}","note":"aria-label on layer banner; {n} number, {title} layer name"},"exploredAria":{"text":"explored","note":"aria suffix in parentheses when a layer is explored"},"layerN":{"text":"Layer {n}","note":"Fallback eyebrow; {n} = layer number"}},"tracks":{"t1":{"num":{"text":"1"},"title":{"text":"Individual"},"eyebrow":{"text":"Layer 1 · Individuals"},"headline":{"text":"Action starts with people."},"prompt":{"text":"Explore ways in which you can:"},"labels":{"l1":{"text":"Protect yourself"},"l2":{"text":"Support others"},"l3":{"text":"Act safely"}},"intro":{"text":"\u003cp>\u003cstrong>Action starts with people.\u003c/strong>\u003c/p>\u003cp>Everyone in sport can contribute, whether they are experiencing online abuse, witnessing it, or supporting someone who has been targeted.\u003c/p>\u003cp>Explore ways in which you can:\u003c/p>\u003cul>\u003cli>Protect yourself\u003c/li>\u003cli>Support others\u003c/li>\u003cli>Act safely\u003c/li>\u003c/ul>","note":"HTML allowed"}},"t2":{"num":{"text":"2"},"title":{"text":"Organisations"},"eyebrow":{"text":"Layer 2 · Organisations"},"headline":{"text":""},"prompt":{"text":"Explore how organisations can prepare for, prevent and respond to online abuse:"},"labels":{"l1":{"text":"Build frameworks"},"l2":{"text":"Strengthen safeguarding"},"l3":{"text":"Coordinate action"}},"intro":{"text":"\u003cp>Organisations can provide the framework, resources, and coordinated support needed to protect people and respond effectively to online abuse. These include sporting organisations and federations, clubs and associations, media organisations, online platforms, advocacy groups, and other institutions across the sporting community.\u003c/p>\u003cp>Explore how organisations can prepare for, prevent and respond to online abuse:\u003c/p>\u003cul>\u003cli>Build frameworks\u003c/li>\u003cli>Strengthen safeguarding\u003c/li>\u003cli>Coordinate action\u003c/li>\u003c/ul>","note":"HTML allowed"},"safeguardLead":{"text":"Safeguarding means protecting people at risk and responding effectively when abuse happens."},"prepareItems":{"i1":{"text":"Policies and codes of conduct"},"i2":{"text":"Education and training"},"i3":{"text":"Clear expectations for digital behaviour"}},"protectItems":{"i1":{"text":"Welfare and safeguarding support"},"i2":{"text":"Platform safety tools and moderation"},"i3":{"text":"Mechanisms for people at risk"}},"respondItems":{"i1":{"text":"Accessible reporting pathways"},"i2":{"text":"Appropriate record keeping"},"i3":{"text":"Organisational procedures and escalation"}},"whoLabel":{"text":"Who does what"},"who":{"clubs":{"title":{"text":"Clubs"},"body":{"text":"Provide frontline support to athletes."}},"federations":{"title":{"text":"Federations"},"body":{"text":"Coordinate shared standards."}},"platforms":{"title":{"text":"Digital Platforms"},"body":{"text":"Enable reporting and moderation."}},"media":{"title":{"text":"Media organizations"},"body":{"text":"Manage published content."}},"advocacy":{"title":{"text":"Advocacy groups"},"body":{"text":"Contribute specialized support and education."}}},"orpTitle":{"text":""},"orpBody":{"text":"\u003cstrong>\u003ca href=\"https://orp.unitedagainstonlineabuse.com\" target=\"_blank\" rel=\"noopener noreferrer\">UAOA's Organisational Readiness Platform (ORP)\u003c/a>\u003c/strong> supports these efforts by helping sporting organisations assess their preparedness, identify areas for improvement, and strengthen their approaches to preventing and responding to online abuse.","note":"HTML allowed"}},"t3":{"num":{"text":"3"},"title":{"text":"Society"},"eyebrow":{"text":"Layer 3 · Society"},"headline":{"text":""},"prompt":{"text":"Learn how wider social contexts can influence online abuse and help create safer digital spaces in sport:"},"labels":{"l1":{"text":"Advance education"},"l2":{"text":"Generate evidence"},"l3":{"text":"Shape norms"}},"intro":{"text":"\u003cp>Online abuse is often shaped by factors beyond the immediate control of individuals and organisations. The personal contexts of people, the technologies they use, their access to education, and the general cultural norms around them can all influence whether harmful behaviour is encouraged, normalised, challenged, or prevented.\u003c/p>\u003cp>Learn how wider social contexts can influence online abuse and help create safer digital spaces in sport:\u003c/p>\u003cul>\u003cli>Advance education\u003c/li>\u003cli>Generate evidence\u003c/li>\u003cli>Shape norms\u003c/li>\u003c/ul>","note":"HTML allowed"}}}},"flow1":{"ui":{"title":{"text":"What each of us can do"}},"steps":{"s1":{"title":{"text":"Protect yourself"},"body":{"text":"\u003cp>For athletes and others with public-facing roles:\u003c/p>\u003cul>\u003cli>\u003cstrong>Manage your exposure.\u003c/strong> Review privacy and safety settings and control who can contact, mention, or tag you.\u003c/li>\u003cli>\u003cstrong>Use safety tools.\u003c/strong> Mute, restrict, block, and report harmful accounts or content.\u003c/li>\u003cli>\u003cstrong>Preserve evidence.\u003c/strong> Save relevant information when behaviour may need to be reported or escalated.\u003c/li>\u003cli>\u003cstrong>Protect your wellbeing.\u003c/strong> You can choose to take a break from online interactions and seek support from people you trust.\u003c/li>\u003c/ul>\u003cdetails>\u003csummary>\u003cstrong>Why does this matter?\u003c/strong>\u003c/summary>\u003cp>Your wellbeing matters, and support is a shared responsibility. When people use safety and wellbeing tools, they are better equipped to prevent harm within the wider sporting community.\u003c/p>\u003c/details>","note":"HTML allowed"}},"s2":{"title":{"text":"Support others"},"body":{"text":"\u003cp>As a teammate, colleague, fan, friend, or bystander:\u003c/p>\u003cul>\u003cli>\u003cstrong>Avoid amplification.\u003c/strong> Prevent further circulation of abusive content.\u003c/li>\u003cli>\u003cstrong>Check in privately.\u003c/strong> Offer personal support to the person targeted.\u003c/li>\u003cli>\u003cstrong>Report appropriately.\u003c/strong> Take action through established channels, generally without public confrontation.\u003c/li>\u003cli>\u003cstrong>Speak up safely.\u003c/strong> Express concern about abusive behaviour or seek help from someone who can intervene, including organisational authorities or the police when necessary.\u003c/li>\u003c/ul>\u003cdetails>\u003csummary>\u003cstrong>Why does this matter?\u003c/strong>\u003c/summary>\u003cp>Supporting others strengthens the sporting community. Small actions from teammates, colleagues, friends, fans, and other bystanders can help create a social support system where people feel heard, protected, and cared for, and harmful behaviour is less likely to go unchallenged.\u003c/p>\u003c/details>","note":"HTML allowed"}},"s3":{"title":{"text":"Act safely"},"body":{"text":"\u003cp>When responding to online abuse, consider the situation, personal safety, and whether additional support is needed:\u003c/p>\u003cul>\u003cli>\u003cstrong>Assess the situation.\u003c/strong> Consider the nature of the behaviour, whether it is escalating, and whether anyone may be at risk.\u003c/li>\u003cli>\u003cstrong>Avoid unsafe engagement.\u003c/strong> Do not confront or engage directly when doing so could increase harm or place someone at risk.\u003c/li>\u003cli>\u003cstrong>Know when to seek support.\u003c/strong> Involve a trusted person or the appropriate organisational contact when the situation requires additional help.\u003c/li>\u003cli>\u003cstrong>Escalate safety concerns.\u003c/strong> Threats, repeated unwanted contact, exposure of personal information, or other safety concerns may require further organisational or external support.\u003c/li>\u003c/ul>\u003cdetails>\u003csummary>\u003cstrong>Why does this matter?\u003c/strong>\u003c/summary>\u003cp>Acting safely helps connect individual action with the right level of support. Recognising when a situation requires additional help allows others to become involved and helps ensure that safety remains the priority.\u003c/p>\u003c/details>","note":"HTML allowed"}}}},"flow2":{"ui":{"title":{"text":"What organisations can do"}},"steps":{"s1":{"title":{"text":"Prepare"},"body":{"text":"\u003cp>Develop policies and codes of conduct, provide education and training, and establish clear expectations for digital behaviour.\u003c/p>","note":"HTML allowed"}},"s2":{"title":{"text":"Protect"},"body":{"text":"\u003cp>Provide welfare and safeguarding support, platform safety tools, moderation, and appropriate mechanisms for people at risk.\u003c/p>","note":"HTML allowed"}},"s3":{"title":{"text":"Respond"},"body":{"text":"\u003cp>Create accessible reporting pathways, preserve appropriate records, apply organisational procedures, and coordinate escalation when necessary.\u003c/p>","note":"HTML allowed"}},"s4":{"title":{"text":"Connect"},"body":{"text":"\u003cp>\u003cstrong>Connect.\u003c/strong> Work with other organisations, platforms, authorities, researchers, advocacy groups, and specialist services when a response extends beyond the organisation’s own capabilities.\u003c/p>","note":"HTML allowed"}},"s5":{"title":{"text":"Stronger together"},"body":{"text":"\u003cp>Organizations are stronger when they work together. Each one plays a different role, and together they can create a \u003cstrong>coordinated network of protection\u003c/strong> and response against online abuse.\u003c/p>\u003cp>\u003cstrong>UAOA’s Organisational Readiness Platform (ORP)\u003c/strong> supports these efforts by helping sporting organisations assess their preparedness, identify areas for improvement, and strengthen their approaches to preventing and responding to online abuse.\u003c/p>","note":"HTML allowed"}}}},"flow3":{"ui":{"title":{"text":"What shapes safer digital sport"}},"steps":{"s1":{"title":{"text":"Education"},"body":{"text":"\u003cp>Education can help people recognise online abuse, understand its consequences, and know how to respond safely. Digital and media literacy can also strengthen critical thinking about what behaviours are appropriate in online settings.\u003c/p>","note":"HTML allowed"}},"s2":{"title":{"text":"Shared standards"},"body":{"text":"\u003cp>Clear expectations help establish which behaviours are considered acceptable within sporting communities. Shared standards around respect, inclusion, fair play, and digital participation can guide behaviour and give individuals and organisations a stronger basis for challenging abuse.\u003c/p>","note":"HTML allowed"}},"s3":{"title":{"text":"Research and evidence"},"body":{"text":"\u003cp>Evidence and data-driven research help map the patterns where online abuse occurs, how harmful behaviour evolves in time, and which responses are more effective. Stronger knowledge can inform prevention, education, organisational practice, technology, and policy.\u003c/p>","note":"HTML allowed"}},"s4":{"title":{"text":"Policy and law"},"body":{"text":"\u003cp>Policies and laws can establish boundaries, responsibilities, protections, and routes to accountability. They can influence behaviour by clarifying consequences and providing mechanisms for reporting, intervention, and redress.\u003c/p>","note":"HTML allowed"}},"s5":{"title":{"text":"Technology and platform design"},"body":{"text":"\u003cp>The design of digital platforms can influence how easily harmful content is created, discovered, amplified, reported, or removed. Moderation, detection, reporting tools, and other safety features can help reduce opportunities for abuse to spread and persist.\u003c/p>","note":"HTML allowed"}},"s6":{"title":{"text":"Community norms"},"body":{"text":"\u003cp>Social norms influence what people perceive as normal, acceptable, or worth challenging. Athletes, fans, media, organisations, and public figures all contribute to the culture surrounding sport. When communities consistently challenge abusive behaviour and reinforce respect, they can help shift the norms that allow online abuse to persist.\u003c/p>","note":"HTML allowed"}},"s7":{"title":{"text":"Working together"},"body":{"text":"\u003cp>\u003cstrong>These factors work together across sport and in our society.\u003c/strong>\u003c/p>\u003cp>Education can shape how people understand online behaviours, while shared standards and laws can clarify expectations, research can identify emerging risks, and technology can influence how harmful content spreads.\u003c/p>\u003cp>Sporting communities are only a part of our society: they are influenced by broader cultural norms, and athletes, fans, media, organisations, and other voices in sport can also help shape the world we live in together.\u003c/p>","note":"HTML allowed"}}}},"match":{"ui":{"eyebrow":{"text":"Check your understanding"},"prompt":{"text":"Match each scenario to a level"},"hint":{"text":"Drag each level card into the matching scenario on the right. Place all three before submitting."},"choicesAria":{"text":"Choose a level of action"},"trayAria":{"text":"Level cards"},"dropHint":{"text":"Drop level here"},"submit":{"text":"Submit"},"feedbackOk":{"text":"\u003cstrong>That’s right!\u003c/strong> You’ve matched each scenario to the appropriate level of action.","note":"HTML allowed"},"feedbackBad":{"text":"\u003cstrong>Not quite.\u003c/strong> Review your choices and try again.","note":"HTML allowed"},"done":{"text":"\u003cstrong>That’s right!\u003c/strong> You’ve matched each scenario to the appropriate level of action.","note":"HTML allowed"}},"labels":{"l0":{"text":"Individual"},"l1":{"text":"Organisation"},"l2":{"text":"Society"}},"scenarios":{"s1":{"text":{"text":"After seeing an athlete targeted online, someone checks in privately and reports the harmful content without sharing it further."},"ok":{"text":"\u003cstrong>Correct!\u003c/strong> Checking in privately and reporting without amplifying are individual actions.","note":"HTML allowed"},"bad":{"text":"\u003cstrong>Not quite.\u003c/strong> Think about who is taking this action in the moment. \u003cstrong>Try again.\u003c/strong>","note":"HTML allowed"}},"s2":{"text":{"text":"Following several online abuse incidents, a sports federation introduces a reporting pathway, staff training, and safeguarding procedures."},"ok":{"text":"\u003cstrong>Correct!\u003c/strong> Reporting pathways, training, and safeguarding procedures are organisational frameworks.","note":"HTML allowed"},"bad":{"text":"\u003cstrong>Not quite.\u003c/strong> Consider which level sets frameworks and procedures for a sporting body. \u003cstrong>Try again.\u003c/strong>","note":"HTML allowed"}},"s3":{"text":{"text":"Research shows how a new form of online abuse is spreading, helping inform education, technology, and future public policy responses."},"ok":{"text":"\u003cstrong>Correct!\u003c/strong> Research and evidence that informs education, technology, and policy operate at the level of society.","note":"HTML allowed"},"bad":{"text":"\u003cstrong>Not quite.\u003c/strong> Consider which level shapes wider education, technology, and policy. \u003cstrong>Try again.\u003c/strong>","note":"HTML allowed"}}}},"widerSystem":{"heading":{"text":"You are part of a wider system"},"rows":{"individual":{"text":"\u003cstrong>Individual\u003c/strong> actions can reduce harm and support others.","note":"HTML allowed"},"organisations":{"text":"\u003cstrong>Organisations\u003c/strong> provide the structures that turn those actions into collective responses.","note":"HTML allowed"},"society":{"text":"Across \u003cstrong>society\u003c/strong>, connected efforts in education, policy, technology, research, and community standards can help create safer digital spaces in sport.","note":"HTML allowed"}},"connectLead":{"text":"UAOA helps connect these levels of action."},"connectBody":{"text":"Through \u003ca href=\"https://unitedagainstonlineabuse.com/about-us/\" target=\"_blank\" rel=\"noopener\">Stronger Together, UAOA\u003c/a> brings people and organisations across sport together to strengthen how they prepare for, prevent, and respond to online abuse, turning shared knowledge and coordinated action into practical support for the sporting community.","note":"HTML allowed"}},"takeaways":{"heading":{"text":"Key Takeaways"},"items":{"i1":{"text":"\u003cstrong>Tackling online abuse is a shared responsibility.\u003c/strong> Individuals, sport organisations, platforms, media, advocacy groups, policymakers, and other stakeholders each have a role in prevention and response.","note":"HTML allowed"},"i2":{"text":"\u003cstrong>Individual actions can reduce harm.\u003c/strong> Managing exposure, using safety tools, preserving evidence, supporting others, and knowing when to seek additional help can protect safety and wellbeing.","note":"HTML allowed"},"i3":{"text":"\u003cstrong>Organisations provide structure and support.\u003c/strong> Clear frameworks, safeguarding, reporting pathways, and coordinated action help organisations prepare for and respond to online abuse.","note":"HTML allowed"},"i4":{"text":"\u003cstrong>Cooperation strengthens the response.\u003c/strong> Clubs, federations, platforms, media organisations, advocacy groups, and other stakeholders can contribute different forms of support, expertise, and action.","note":"HTML allowed"},"i5":{"text":"\u003cstrong>Social conditions influence online behaviour.\u003c/strong> Education, standards, research, policy, technology, and cultural norms can affect how online abuse is understood, enabled, prevented, and challenged.","note":"HTML allowed"},"i6":{"text":"\u003cstrong>Sport is part of a wider social context.\u003c/strong> Sporting communities are influenced by wider cultural norms and can also contribute to shaping expectations and behaviour across society.","note":"HTML allowed"}}},"slide":{"title":{"text":"Module 5 - Take Action: Building Safer Digital Sport Communities","note":"slide_intro title"},"continueLayer2":{"text":"Continue to Layer 2","note":"Nav button label"},"continueLayer3":{"text":"Continue to Layer 3","note":"Nav button label"},"goToFinalQuiz":{"text":"Go to Final Quiz","note":"Nav button label"},"exploreTheThreeLayersOfAction":{"body":{"text":"\u003cp>Action happens at three connected levels. The layers are interconnected and complementary: individual actions connect with organisational support and with wider collective action.\u003c/p>","note":"Native text body on Take Action: Building Safer Digital Sport Communities"},"heading":{"text":"\u003cspan style=\"color: #1c3564\">Explore the three layers of action\u003c/span>","note":"Native heading on Take Action: Building Safer Digital Sport Communities"}},"image":{"throughStrongerTogetherUaoaBringsPeople":{"text":"\u003cp>Through Stronger Together, UAOA brings people and organisations across sport together to strengthen how they prepare for, prevent, and respond to online abuse, turning shared knowledge and coordinated action into practical support for the sporting community.\u003c/p>","note":"Image body text on Take Action: Building Safer Digital Sport Communities"}},"introSubtitle":{"text":"Estimated time: 15 minutes","note":"slide_intro subtitle (estimated time)"},"onlineAbuseCanBeAddressedAt":{"body":{"text":"\u003cp>\u003cspan style=\"color: #091324\">Online abuse can be addressed at different levels. \u003c/span>\u003cbr>\u003cspan style=\"color: #091324\">\u003cstrong>Drag each scenario to the level best placed to take action.\u003c/strong>\u003c/span>\u003c/p>","note":"Native text body on Take Action: Building Safer Digital Sport Communities"}},"onlineAbuseInSportCanAffect":{"body":{"text":"\u003cp>\u003cspan style=\"color: #091324\">Online abuse in sport can affect one person directly, but \u003cstrong>no one has to respond to it alone\u003c/strong>. We can each play a part in creating safer digital spaces, whether we are protecting our own wellbeing, supporting someone who is being targeted, witnessing harmful behaviour, or helping others through our work in sport.\u003c/span>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003cspan style=\"color: #091324\">The actions we can take depend on our role and circumstances. Individuals can protect themselves and support others. Organisations can provide clear pathways for reporting, support, and coordinated action. Across sporting communities, education, research, policy, and shared standards can help prevent harm and strengthen how we respond.\u003c/span>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003cspan style=\"color: #091324\">In this final module, you will explore how these different levels of action connect, where you can contribute, and how working together can help build safer digital sporting communities.\u003c/span>\u003c/p>","note":"Native text body on Take Action: Building Safer Digital Sport Communities"},"heading":{"text":"\u003cspan style=\"color: #1c3564; font-size: 14px\">Online abuse in sport can affect one person directly, but \u003cstrong>no one has to respond to it alone\u003c/strong>. We can each play a part in creating safer digital spaces, whether we are protecting our own wellbeing, supporting someone who is being targeted, witnessing harmful behaviour, or helping others through our work in sport.\u003c/span>\u003cbr>\u003cbr>\u003cspan style=\"color: #1c3564; font-size: 14px\">The actions we can take depend on our role and circumstances. Individuals can protect themselves and support others. Organisations can provide clear pathways for reporting, support, and coordinated action. Across sporting communities, education, research, policy, and shared standards can help prevent harm and strengthen how we respond.\u003c/span>\u003cbr>\u003cbr>\u003cspan style=\"color: #1c3564; font-size: 14px\">In this final module, you will explore how these different levels of action connect, where you can contribute, and how working together can help build safer digital sporting communities.\u003c/span>","note":"Native heading on Take Action: Building Safer Digital Sport Communities"}},"uaoaHelpsConnectTheseLevelsOf":{"heading":{"text":"\u003cspan style=\"color: #1c3564\">UAOA helps connect these levels of action.&nbsp;\u003c/span>","note":"Native heading on Take Action: Building Safer Digital Sport Communities"}},"youArePartOfAWider":{"heading":{"text":"\u003cspan style=\"color: #1c3564\">You are part of a wider system\u003c/span>","note":"Native heading on Take Action: Building Safer Digital Sport Communities"}}}},"summary":{"quiz":{"questions":{"q1":{"prompt":{"text":"In the \u003cstrong>2025 UAOA Barometer\u003c/strong>, about how many sporting federations were concerned that online abuse could drive talented athletes out of sport?","note":"HTML allowed — do not bold option list items"},"choices":{"c0":{"text":"Less than 50%"},"c1":{"text":"About 72%"},"c2":{"text":"About 90%"}},"reveal":{"text":"\u003cstrong>About 90%\u003c/strong>\u003cbr>The UAOA Barometer shows that about nine in ten sporting federations surveyed expressed concern that online abuse could drive talented athletes out of sport. Online abuse can ultimately influence whether people continue participating in sporting communities.","note":"HTML allowed"},"next":{"text":"That seems a lot"}},"q2":{"prompt":{"text":"According to research, what has greater exposure to online harassment been associated with among sportspeople?"},"choices":{"c0":{"text":"Psychological distress"},"c1":{"text":"Fewer friends"},"c2":{"text":"More training hours"}},"reveal":{"text":"Greater exposure to online harassment has been associated with \u003cstrong>higher levels of psychological distress\u003c/strong>, highlighting how hostile online content can affect psychological wellbeing.","note":"HTML allowed"},"next":{"text":"That is concerning"}},"q3":{"prompt":{"text":"When a harmful comment about an athlete appears online, which features can influence how far it travels?"},"choices":{"c0":{"text":"Platform design and recommendation systems"},"c1":{"text":"User interactions and reporting mechanisms"},"c2":{"text":"Both"}},"reveal":{"text":"\u003cstrong>Both.\u003c/strong> Platform design, recommendation systems, user interactions, and reporting mechanisms can influence how harmful content travels and reaches new audiences.","note":"HTML allowed"},"next":{"text":"That makes sense"}},"q4":{"prompt":{"text":"\u003cspan class=\"scenario\">If a player receives humiliating comments after a loss. Similar messages flood their account for days, also attacking their race.\u003c/span>What is happening?","note":"HTML allowed"},"choices":{"c0":{"text":"Offensive speech only"},"c1":{"text":"Digital hostility and hate speech only"},"c2":{"text":"Several forms of online abuse are overlapping"}},"reveal":{"text":"\u003cstrong>Several forms can overlap.\u003c/strong>\u003cbr>The humiliating language is offensive speech, the repeated public aggression creates digital hostility, and racist targeting may constitute hate speech.","note":"HTML allowed"},"next":{"text":"Let’s take action!"}},"q5":{"prompt":{"text":"What is the best recommendation for staying safe when someone encounters online abuse?"},"choices":{"c0":{"text":"Respond directly to stop the behaviour"},"c1":{"text":"Assess the situation, avoid unsafe engagement, and report appropriately"},"c2":{"text":"Delete the content and leave the platform"}},"reveal":{"text":"\u003cstrong>Act safely and use the right reporting channels.\u003c/strong>\u003cbr>Assess whether the behaviour is escalating or anyone may be at risk, avoid unsafe engagement, preserve relevant evidence, and report through the appropriate platform or organisational channels. Seek additional support when needed.","note":"HTML allowed"},"next":{"text":"Keep going"}},"q6":{"prompt":{"text":"Can existing laws help protect people from online abuse, including abuse involving AI-generated content?"},"choices":{"c0":{"text":"Yes, but protections vary between countries."},"c1":{"text":"Only when the abuse involves physical threats."},"c2":{"text":"Only when the content is shared publicly."}},"reveal":{"text":"\u003cstrong>Laws can help protect people from online abuse.\u003c/strong>\u003cbr>However, legal protections and responsibilities vary between countries. Some jurisdictions have introduced specific measures addressing AI-generated intimate images and other forms of digital abuse.","note":"HTML allowed"},"next":{"text":"Laws are only part of the response. What else can we do?"}},"q7":{"prompt":{"text":"\u003cspan class=\"scenario\">A teammate has been receiving abusive messages and seems increasingly distressed.\u003c/span>What is the strongest response from a supportive system?","note":"HTML allowed"},"choices":{"c0":{"text":"Share the messages publicly so others can defend them"},"c1":{"text":"Check in privately and help them access appropriate support"},"c2":{"text":"Limit interactions with the teammate"}},"reveal":{"text":"\u003cstrong>Support starts with you!\u003c/strong>\u003cbr>Check in privately, avoid amplifying the abuse, use appropriate reporting channels, and speak up when it is safe to do so.","note":"HTML allowed"},"next":{"text":"Everyone’s safety matters!"}},"q8":{"prompt":{"text":"Positive action starts with each of us. What can we do?"},"choices":{"c0":{"text":"Protect yourself, Support others, Act safely"},"c1":{"text":"Monitor content, Confront abuser, Delete evidence"},"c2":{"text":"Report everything, Respond publicly, Stay online"}},"reveal":{"text":"\u003cstrong>Protect yourself. Support others. Act safely.\u003c/strong>\u003cbr>We can manage our social media exposure, use safety tools, preserve evidence, support others who are targeted, and recognise when a situation requires additional help.","note":"HTML allowed"},"next":{"text":"Of course we can!"}},"q9":{"prompt":{"text":"\u003cstrong>Organisations have a role too.\u003c/strong> Several people in a sporting organisation have reported online abuse.\u003cbr>What would create the strongest organisational response?","note":"HTML allowed"},"choices":{"c0":{"text":"Focus primarily on responding to individual incidents"},"c1":{"text":"Build frameworks, strengthen safeguarding and coordinate action"},"c2":{"text":"Expect the platforms to manage the problem"}},"reveal":{"text":"Effective organisational responses connect preparation, protection, response and cooperation.","note":"HTML allowed"},"next":{"text":"Tell me more!"}},"q10":{"prompt":{"text":"\u003cspan class=\"scenario\">Online abuse is also shaped by conditions beyond any one person or organisation.\u003c/span>Which can influence whether harmful behaviour is normalised, challenged or prevented?","note":"HTML allowed"},"choices":{"c0":{"text":"Education and community norms"},"c1":{"text":"Research and policies"},"c2":{"text":"Technology and AI solutions"},"c3":{"text":"All of these"}},"reveal":{"text":"\u003cstrong>All of these.\u003c/strong> Education, shared standards, research and evidence, policy and law, technological solutions and platform design, and community norms can all shape online behaviour.\u003cbr>\u003cbr>Sport is influenced by these wider social conditions, and sporting communities can also help shape the world we live in together.","note":"HTML allowed"},"next":{"text":"Stronger together!"}},"q11":{"prompt":{"text":"Would you like to take further action with UAOA?"},"choices":{"c0":{"text":"I want to take action"},"c1":{"text":"I want to keep learning"},"c2":{"text":"I want to strengthen my organisation"},"c3":{"text":"Not right now"}},"reveal":{"text":"\u003cstrong>There are different ways to take action.\u003c/strong> UAOA brings people and organisations across sport together to strengthen how they prepare for, prevent and respond to online abuse.","note":"HTML allowed — ungraded item"},"next":{"text":"See your readiness!"},"links":{"act":{"note":"Inline masked links for Q11 choice c0 — multiple items join with a plain “ / ” separator inside the answer pill","items":[{"text":"UAOA resources","url":{"text":"https://unitedagainstonlineabuse.com/resources/","note":"External URL for Q11 choice c0 — opens in new tab"}},{"text":"#UAOAday","url":{"text":"https://unitedagainstonlineabuse.com/uaoa-day/","note":"External URL for Q11 choice c0 — opens in new tab"}}]},"learn":{"text":"UAOA webinar series","url":{"text":"https://unitedagainstonlineabuse.com/webinar-series/","note":"External URL for Q11 choice c1 — opens in new tab"}},"org":{"text":"UAOA – Organisational Readiness Platform","url":{"text":"https://orp.unitedagainstonlineabuse.com/","note":"External URL for Q11 choice c2 — opens in new tab"}}}}},"ui":{"chooseOne":{"text":"Choose one answer","note":"Hint under the question on the open final-quiz layout"},"ok":{"text":"OK","note":"Confirm selection before reveal"},"pressEnter":{"text":"press Enter ↵","note":"Keyboard hint beside OK"},"questionOf":{"text":"Question {n} of {total}","note":"Footer progress; {n} and {total} are replaced in JS"},"choicesAria":{"text":"Answer choices","note":"aria-label on options group"},"prevAria":{"text":"Previous question","note":"aria-label on prev chevron"},"nextAria":{"text":"Next question","note":"aria-label on next chevron when advancing"},"openResource":{"text":"Open resource","note":"Legacy; Q11 now shows masked link labels inline inside answer pills"}},"score":{"youScored":{"text":"You scored","note":"Flip-card modal front label above large % when passed"},"yourScore":{"text":"Your score","note":"Flip-card modal front label above large % on any failed attempt (unlimited retries until pass)"},"clickToComplete":{"text":"Click to complete","note":"Flip-card modal front CTA when passed (block completes only on pass)"},"clickForDetails":{"text":"Click for details","note":"Flip-card modal front CTA on any fail; Try again stays available until pass"},"headline":{"text":"You scored {pct}%!","note":"Legacy / optional; modal uses youScored + large %"},"body":{"text":"You’ve learned how to recognise online abuse, understand its impact, and respond more safely across individual, organisational, and wider sp ummary.quiz"}}}},"slide":{"title":{"text":"Summary: Key Takeaways","note":"Module / summary slide title"},"finishCourse":{"text":"Finish Course","note":"Nav button label"},"postSurvey":{"text":"Take the post-course survey","note":"Nav button label"},"getCertificate":{"text":"Exit and Get Certificate","note":"Nav button label"},"exit":{"congratulations":{"heading":{"text":"\u003cspan style=\"color: #1c3564\">Congratulations!\u003c/span>","note":"Native heading on Exit Page"}},"youAreNowBetterPreparedTo":{"body":{"text":"\u003cp>\u003cspan style=\"color: rgb(9, 19, 36)\">\u003cstrong>You are now better prepared to take action against online abuse.\u003c/strong>\u003cbr>\u003cbr>Thank you for taking the time to learn with us. The knowledge and practical understanding you have developed can help you recognise harmful behaviour, respond more confidently, support others, and contribute to safer digital sporting communities.\u003c/span>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003cspan style=\"color: rgb(9, 19, 36)\">Every informed action matters. Together, we can help make sport safer online.\u003c/span>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003cspan style=\"color: rgb(9, 19, 36)\">Thank you for completing the UAOA eLearning course!\u003c/span>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003cspan style=\"color: rgb(9, 19, 36)\">\u003cstrong>UAOA\u003c/strong>\u003c/span>\u003c/p>","note":"Native text body on Exit Page"}},"yourReadiness":{"body":{"text":"\u003cp>\u003cspan style=\"color: #091324; font-size: 30px\">\u003cstrong>Your Readiness Score is \u003cspan data-uaoa-readiness-score>{{score}}\u003c/span>%!\u003c/strong>\u003c/span>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003cspan style=\"color: #091324\">You’ve learned how to recognise online abuse, understand its impact, and respond more safely across individual, organisational, and wider sporting contexts.\u003c/span>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003cspan style=\"color: #091324\">Your score reflects your current readiness to recognise online abuse and make informed decisions when it occurs.\u003c/span>\u003c/p>","note":"Native text body on Exit Page; data-uaoa-readiness-score is updated on quiz retry via course custom JS"},"heading":{"text":"Your readiness","note":"Native heading on Exit Page"}}},"finalQuiz":{"summaryScoredQuiz":{"body":{"text":"\u003cp>\u003cspan style=\"color: #091324\">Check what you have learned across the course. Answer each question, then review your results.\u003c/span>\u003c/p>","note":"Native text body on Final Quiz"},"heading":{"text":"\u003cspan style=\"color: var(--background)\">\u003cstrong>Summary (scored quiz)\u003c/strong>\u003c/span>","note":"Native heading on Final Quiz"}},"youAreReadyToActAgainst":{"body":{"text":"\u003cp>\u003cspan style=\"color: #091324\">You started this course with a goal: to move from \u003cstrong>awareness to readiness\u003c/strong>. You now have the knowledge and practical tools to recognise online abuse, understand how and why it happens, respond with greater confidence, and support others in your sporting community.\u003c/span>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003cspan style=\"color: #091324\">\u003cstrong>One final step\u003c/strong>: bring what you have learned together in the final quiz.\u003c/span>\u003c/p>","note":"Native text body on Final Quiz"},"heading":{"text":"\u003cspan style=\"color: #1c3564\">You are ready to act against online abuse\u003c/span>","note":"Native heading on Final Quiz"}}}}},"embeds":{"sensitiveNotice":{"title":{"text":"Sensitive Topic Notice"},"body":{"text":"This course covers topics that some learners may find difficult or upsetting. You are encouraged to work through the material at a pace that feels appropriate and to access support where needed. Please remember that you may step out of the course at any time, and return when you feel ready."},"viewSupport":{"text":"View support options"},"supportTitle":{"text":"Support options"},"supportIntro":{"text":"If anything in this course has affected you, you can pause and come back when you feel ready."},"someoneTrusted":{"text":"Someone you trust"},"someoneTrustedDetail":{"text":"Speak to someone you trust: A friend, family member, teammate or coach."},"orgLead":{"text":"Your organisation’s welfare or safeguarding lead"},"closeAria":{"text":"Close"},"close":{"text":"Close","note":"Support dialog primary close button"},"orgLeadDetail":{"text":"Clubs and federations can offer support and act on abuse."},"platformReporting":{"text":"Platform reporting tools"},"platformReportingDetail":{"text":"Every major platform lets you report posts and accounts."},"emergencyServices":{"text":"Emergency services"},"emergencyServicesDetail":{"text":"If you or someone else is in immediate danger, contact your local emergency number."},"bodyM2":{"text":"This module discusses the emotional and psychological effects of online abuse. You are encouraged to work through the material at a pace that feels appropriate and to access support where needed. You can return to the course whenever you are ready.","note":"Module 2 sensitive-notice body"},"bodyM3":{"text":"This module refers to forms of online abuse. No abusive content is shown. Take breaks when you need them, and remember that support is available. You can return to the course whenever you are ready.","note":"Module 4 sensitive-notice body (forms-of-abuse wording)"},"bodyM4":{"text":"This module discusses online abuse and responses to it. No abusive content is shown. Take breaks when you need them, and remember that support is available. You can return to the course whenever you are ready.","note":"Module 5 sensitive-notice body"}},"miniDictionary":{"teaser":{"text":"Want to learn about other forms of online abuse?"},"bodyBefore":{"text":"Online abuse can take many forms beyond the three behaviours introduced here. Explore the"},"linkLabel":{"text":"Mini Dictionary"},"bodyAfter":{"text":"for a quick reference to other tactics you may encounter online."},"discretionLabel":{"text":"Reader discretion:"},"discretion":{"text":"Some entries describe harmful or abusive behaviours that may be sensitive or upsetting. Explore this resource at your own discretion, and return to the course whenever you are ready."},"cta":{"text":"Explore the Mini Dictionary"},"closeAria":{"text":"Close"},"backToCourse":{"text":"Back to course","note":"Mini Dictionary dialog close button"},"termsCount":{"text":"{n} terms","note":"Section badge in Mini Dictionary; {n} = entry count"},"title":{"text":"Mini Dictionary: Other Possible Forms of Online Abuse","note":"Dictionary document title"},"fullText":{"text":"Mini Dictionary: Other Possible Forms of Online Abuse\nToxic Content\n* Purposeful embarrassment - Intentionally causing someone shame or humiliation, often publicly.\n* Cyberbullying - Repeated use of electronic communication to intimidate, scare, or shame a person.\n* Trolling - Posting provocative or offensive messages to trigger strong reactions or disrupt discussion.\n* Profane or offensive content - Vulgar or disrespectful language, images, or communication.\n* Threats of violence - Messages meant to create fear of physical harm.\n* Incitement - Urging others to act violently or unlawfully.\n* Sexual harassment - Unwanted sexual advances or comments.\n* Unwanted explicit content - Sharing sexually explicit images or messages without consent.\nContent Leakage\n* Sextortion - Blackmail that threatens to release private material unless demands are met.\n* Doxxing - Publishing private or identifying information with malicious intent.\n* Outing - Disclosing someone's sexuality or gender identity without permission.\n* Deadnaming - Using a transgender or non-binary person's former name without consent.\n* Non-consensual image exposure - Sharing private or intimate images or videos without consent.\n* Leaked chats or profiles - Exposing private conversations or accounts without authorisation.\nOverloading\n* System or account flooding - Overwhelming a person or platform with excessive content or requests to disrupt service or silence speech.\n* Zoombombing - Uninvited intrusion into a video call to disrupt it.\n* Negative ratings and reviews - Coordinated unfair or biased feedback meant to damage a reputation.\nFalse Reporting\n* Swatting - A hoax emergency call meant to trigger an armed police response at someone's location.\n* Falsified abuse report - Knowingly submitting a false report to cause harm.\n* Falsified abuse flag - Wrongly flagging legitimate content as abusive to have it removed or censored.\nImpersonation\n* Impersonated profiles - Fake accounts created to deceive or defraud.\n* Impersonated chats or images - Fabricated or altered content falsely attributed to someone.\n* Synthetic pornography - Deepfake technology used to create explicit content without consent.\n* Impersonated web pages - Counterfeit sites built to deceive users or harm a competitor's standing.\n* Hijacked communication - Unauthorised takeover of an account or channel to spread false messages.\nSurveillance\n* Stalking or tracking - Repeated, unwanted monitoring of a person's movements or activity.\n* Account monitoring - Unauthorised access to and tracking of someone's account activity.\n* Device monitoring - Unauthorised tracking of activity on a person's phone, computer, or tablet.\n* IoT monitoring - Passive data collection from wearables or smart devices without consent.\n* Browser monitoring - Tracking someone's browsing history or activity without their knowledge.\nLockout and Control\n* Content deletion - Unauthorised removal of files, posts, or data to suppress information or cause harm.\n* Browser or device hijacking - Taking control of someone's browser or connected devices without consent.\n* Account lockouts - Deliberately blocking a person from accessing their own accounts or content.","note":"Full mini-dictionary source; HTML/markdown structure — translate carefully"}},"scroll":{"continue":{"text":"Continue","note":"Scroll / fade continue control"},"continueAria":{"text":"Continue to more content"},"continueRevealAria":{"text":"Continue to reveal more content"},"noBlock":{"text":"No following block found on this slide.","note":"Dev/fallback message"},"restoreFailed":{"text":"Could not restore the following content. Refresh and try again.","note":"Scroll-fade error state"},"previewOnly":{"text":"Preview only works inside the course player.","note":"Scroll-fade outside player"}},"supportFloater":{"breakPill":{"text":"Need to take a break?","note":"Bottom-left floater pill → support options dialog"},"regionAria":{"text":"Course support","note":"aria-label on floater stack"}},"disclaimerModal":{"navAria":{"text":"View Disclaimer","note":"Left-nav control above the support pill. Visible label on wide layout; icon-only below 768px. Accessible name in both states."},"confirm":{"text":"I confirm that I have read and understood the disclaimer.","note":"Kept in the catalog. The Welcome disclaimer modal no longer shows this sentence; the short button is embeds.disclaimerModal.understand."},"understand":{"text":"I understand","note":"Short pill button on the Welcome disclaimer modal. Clicking it acknowledges and dismisses. Same persistence as the former checkbox."},"coFunded":{"text":"Co-funded by the European Union","note":"Caption under the EU flag in the disclaimer modal. No existing course string; official EU co-funded wording."},"logoAria":{"text":"UAOA","note":"Alt text for the UAOA mark in the disclaimer modal."}}},"welcome":{"partners":{"caption":{"text":"United Against Online Abuse (UAOA) gratefully acknowledges the contributions of its Erasmus+ partners to the development of this eLearning Course: FIA member clubs Autoklub České republiky (Czech Republic), Zveza za avto šport Slovenije – AŠ (Slovenia), Real Federación Española de Automovilismo (Spain), and Svenska Bilsportförbundet (Sweden), alongside academic partners Charles University (Czech Republic), Prof. Matej Tušak (Slovenia), European Sport Business School (Spain), and Docent Lisa Kaati, Stockholm University (Sweden).","note":"Welcome partner-acknowledgements body (teal, not italic, inside navy-outline box under video)"},"heading":{"text":"Acknowledging Our Erasmus+ Partners","note":"Welcome partner-acknowledgements heading (navy, bold, inside navy-outline box under video)"}},"outcomes":{"listAria":{"text":"What you will gain from this course","note":"aria-label on Welcome learning-objectives timeline list"},"items":{"i1":{"text":"\u003cstrong>Recognise\u003c/strong> online abuse and its different forms, including who may face disproportionate risk.","note":"HTML allowed — bold lead verb"},"i2":{"text":"\u003cstrong>Understand\u003c/strong> the impact of online abuse in your sporting community, using real-world evidence to identify its consequences for mental health and athletic performance.","note":"HTML allowed — bold lead verb"},"i3":{"text":"\u003cstrong>Explore\u003c/strong> how digital platforms, social media algorithms, and AI can amplify online abuse, and how effective governance can help reduce it.","note":"HTML allowed — bold lead verb"},"i4":{"text":"\u003cstrong>Apply\u003c/strong> reporting procedures with confidence, safely and effectively flagging abusive content across major social media and gaming platforms.","note":"HTML allowed — bold lead verb"},"i5":{"text":"\u003cstrong>Take\u003c/strong> informed action in your sporting environment, individually and alongside others, to help create safer spaces in sport.","note":"HTML allowed — bold lead verb"}}},"slide":{"whatYouWillGain":{"text":"What you will gain from this course:","note":"Welcome native subheading above learning-objectives timeline"},"buildReadiness":{"text":"Build your readiness to act","note":"Welcome native subheading above Continue CTA"},"euDisclaimer":{"body":{"text":"\u003cp style=\"text-align: left\">\u003cspan style=\"font-size: 11px\">\u003cem>Funded by the European Union. Views and opinions expressed are however those of the author(s) only and do not necessarily reflect those of the European Union or the European Education and Culture Executive Agency (EACEA). Neither the European Union nor EACEA can be held responsible for them.\u003c/em>\u003c/span>\u003c/p>","note":"EU disclaimer body for the Welcome modal only. The Welcome-page footer block was removed."}},"sportConnectsMillionsOfPeopleAcross":{"body":{"text":"\u003cp>\u003cspan style=\"color: #091324\">\u003cstrong>Sport connects millions of people\u003c/strong> across countries, cultures, and generations through passion, pride, and the thrill of competition.\u003cbr>\u003cbr>\u003cstrong>Online abuse puts that connection at risk.\u003c/strong> When athletes, officials, volunteers, and fans are attacked online for who they are or how they perform, the consequences can extend far beyond the screen - hurting people, derailing careers, and normalising abusive behaviour.\u003cbr>\u003cbr>\u003cstrong>United Against Online Abuse (UAOA)\u003c/strong>, founded by FIA President Mohammed Ben Sulayem, brings together more than 75 governments, sporting organisations, academic institutions, and technology platforms around a shared goal: \u003cstrong>making sport safer from online abuse.\u003c/strong> Lasting change requires action across institutions, communities, and individuals, and that includes you.\u003c/span>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003cspan style=\"color: #091324\">Developed in collaboration with the University of Notre Dame, \u003cstrong>this eLearning Course\u003c/strong> will help you recognise different forms of online abuse, understand their impact on your sporting community, and use reporting procedures with confidence. By completing the course, \u003cstrong>you will be better prepared\u003c/strong> to take informed action and contribute to a safer sporting environment.\u003c/span>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003cspan style=\"color: #091324\">\u003cstrong>Your journey towards a safer sporting environment starts here.\u003c/strong>\u003c/span>\u003c/p>","note":"Native text body on Welcome"},"p3":{"text":"\u003cp>United Against Online Abuse (UAOA), founded by FIA President Mohammed Ben Sulayem, brings together more than 75 governments, sporting organisations, academic institutions, and technology platforms around a shared goal: making sport safer from online abuse. Lasting change requires action across institutions, communities, and individuals, and that includes you.\u003c/p>","note":"Native text body on Welcome"}},"welcomeTitle":{"heading":{"text":"\u003cspan style=\"color: #1c3564\">Welcome: Thanks for joining the UAOA mission!\u003c/span>","note":"Native heading on Welcome"}},"buildReadinessBody":{"text":"\u003cp>\u003cspan style=\"color: #091324\">\u003cstrong>Awareness is only the beginning.\u003c/strong> This course equips you with the knowledge and practical skills to understand online abuse and take informed action.\u003c/span>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003cspan style=\"color: #091324\">Whether you are new to the topic or already familiar with it, you will explore reporting systems, digital platforms, AI, and approaches to prevention and response.\u003c/span>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003cspan style=\"color: #091324\">By the end of the course, you will be better prepared to \u003cstrong>recognise online abuse, respond with confidence, and contribute to safer sport.\u003c/strong>\u003c/span>\u003c/p>","note":"Native text body on Welcome"},"unitedAgainstOnlineAbuseUaoaBrings":{"p3":{"text":"\u003cp>United Against Online Abuse (UAOA), founded by FIA President Mohammed Ben Sulayem, brings together more than 75 governments, sporting organisations, academic institutions, and technology platforms around a shared goal: making sport safer from online abuse. Lasting change requires action across institutions, communities, and individuals, and that includes you.\u003c/p>","note":"Native text on Welcome"}},"fiaDisclaimer":{"body":{"text":"\u003cp>\u003cspan style=\"font-size: 12px\">\u003cem>This course contains educational materials, including third-party research, data, and citations, provided for informational and educational purposes only. While we select reputable sources, we do not independently verify or guarantee the absolute accuracy, completeness, or current validity of this external information, as research and industry standards continuously evolve. Any reliance on or application of these materials or guidelines is strictly at the learner's own risk; for learners who are minors, parents or legal guardians are entirely responsible for reviewing the course content and supervising its use. The inclusion of third-party citations does not imply any endorsement, sponsorship, or formal partnership between UAOA and the referenced institutions or authors.\u003c/em>\u003c/span>\u003c/p>","note":"FIA disclaimer body for the Welcome modal only. The Welcome-page footer block was removed."}}},"about":{"aboutTheCourse":{"body":{"text":"\u003cp>\u003cspan style=\"color: #091324\">\u003cstrong>Duration\u003c/strong>\u003c/span>\u003c/p>\u003cp>\u003cspan style=\"color: #091324\">Approximately \u003cstrong>90 minutes\u003c/strong>, completed at your own pace.\u003c/span>\u003c/p>\u003cp>\u003cspan style=\"color: #091324\">\u003cbr>\u003c/span>\u003c/p>\u003cp>\u003cspan style=\"color: #091324\">\u003cstrong>Who is it for?\u003c/strong>\u003c/span>\u003c/p>\u003cp>\u003cspan style=\"color: #091324\">Anyone who participates in, works in, or engages with sport and wants to better understand and respond to online abuse, including \u003cstrong>athletes, coaches, officials, staff, volunteers, administrators, media professionals, fans, and others across the sporting community\u003c/strong>.\u003c/span>\u003c/p>\u003cp>\u003cspan style=\"color: #091324\">\u003cbr>\u003cstrong>What can you expect?\u003c/strong>\u003c/span>\u003c/p>\u003cp>\u003cspan style=\"color: #091324\">Five short modules combine practical guidance, scenarios, and opportunities to apply what you learn. No prior knowledge of online abuse is required.\u003c/span>\u003c/p>\u003cp>\u003c/p>","note":"Source copy for the About cards embed (duration, who, expect — three heading+body pairs). Live paragraph is cleared so learners only see the cards. Do not flatten this HTML."},"heading":{"text":"\u003cspan style=\"color: #1c3564\">About the course\u003c/span>","note":"Native heading on About This Course"}},"courseTitle":{"text":"\u003cdiv class=\"uaoa-about-header\" style=\"display:block;width:100%;max-width:none;min-width:100%;position:relative;overflow:hidden;background:#1c3564;border-radius:10px;min-height:176px;padding:32px 36% 32px 28px;box-sizing:border-box;\">\u003cspan style=\"display:block;color:#ffffff;font-size:36px;font-weight:700;line-height:1.15;\">UAOA eLearning Course\u003c/span>\u003cspan style=\"display:block;color:#ffffff;font-size:24px;font-weight:400;line-height:1.3;margin-top:8px;\">Understanding and Responding\u003cbr>to Online Abuse in Sport\u003c/span>\u003cimg src=\"https://preview.scormstack.io/medias/courses/428b8e0e-9238-4608-a1a3-962afd799ccf/art_uaoa_header_figu_fb0c9f9a-1f10-453c-b6ca-6324e485bb78.png\" alt=\"\" width=\"300\" height=\"84\" style=\"position:absolute;right:10px;bottom:-16px;width:34%;max-width:300px;height:auto;pointer-events:none;\" />\u003c/div>","note":"About course hero banner (HTML) — navy title + subtitle + figures icon"},"readyToBegin":{"heading":{"text":"\u003cdiv class=\"uaoa-ready-banner\" style=\"display:flex;flex-direction:row;align-items:center;gap:24px;width:100%;max-width:100%;position:relative;overflow:hidden;background:#1c3564;border-radius:16px;box-sizing:border-box;padding:16px 28px;\">\u003cspan class=\"uaoa-ready-copy\" style=\"display:block;position:relative;z-index:1;flex:1 1 auto;min-width:0;\">\u003cspan class=\"uaoa-ready-title\" style=\"display:block;color:#ffffff;font-size:36px;font-weight:700;line-height:1.15;margin:0;white-space:nowrap;\">Ready to Begin?\u003c/span>\u003cspan class=\"uaoa-ready-body\" style=\"display:block;color:#ffffff;font-size:16px;font-weight:400;line-height:1.35;margin:4px 0 0;\">Five modules, from understanding online abuse to taking action in your community.\u003c/span>\u003c/span>\u003cbutton type=\"button\" class=\"uaoa-ready-cta\" style=\"position:relative;z-index:2;flex:0 0 auto;display:inline-flex;align-items:center;background-color:#21b7cb;color:#1c3564;font-size:16px;font-weight:700;line-height:1.2;padding:8px 18px;border-radius:999px;border:5px solid rgba(33,183,203,0.6);background-clip:padding-box;cursor:pointer;white-space:nowrap;\">Start Course →\u003c/button>\u003cimg class=\"uaoa-ready-mark\" src=\"https://preview.scormstack.io/medias/courses/428b8e0e-9238-4608-a1a3-962afd799ccf/art_uaoa_individual__93c9e800-9785-4df3-8306-7fe37621e1fb.png\" alt=\"\" width=\"1024\" height=\"1024\" style=\"position:absolute;right:-72px;top:50%;transform:translateY(-50%);height:220px;width:auto;opacity:0.26;pointer-events:none;z-index:0;\" />\u003c/div>","note":"Ready banner — 36px title, 16px subtitle, Start Course pill inside the bar. The next navigation_button stays next_slide and always enabled; course CSS hides it."}},"startCourse":{"text":"Start Course","note":"Native navigation_button on About This Course"},"tagline":{"body":{"text":"\u003cp>\u003cspan style=\"color: #091324; font-size: 18px\">This course from \u003cstrong>United Against Online Abuse (UAOA)\u003c/strong> provides practical knowledge and tools to help you recognise online abuse, understand its impact, navigate reporting procedures, and take informed action within your sporting community.\u003c/span>\u003c/p>","note":"Native text body on About This Course"},"heading":{"text":"\u003cspan style=\"color: #1c3564\">Building Safer Digital Spaces in Sport\u003c/span>","note":"Native heading on About This Course"}},"whatYoullExplore":{"body":{"text":"\u003cdiv style=\"margin:0;border:0;border-left:none;background:transparent;\">\u003cul style=\"margin:0; padding-left:1.25em; list-style:disc; color: #091324;\">\u003cli style=\"margin:0 0 1.35em; color: #091324;\">\u003cp style=\"margin:0 0 0.35em;\">\u003cspan style=\"color: #091324\">\u003cstrong>Module 1 · Understanding Online Abuse\u003c/strong>\u003c/span>\u003c/p>\u003cp style=\"margin:0; padding-left: 5em;\">\u003cspan style=\"color: #091324\">Learn to recognise different forms of online abuse, how they can overlap and escalate, and what groups of people face disproportionate risk.\u003c/span>\u003c/p>\u003c/li>\u003cli style=\"margin:0 0 1.35em; color: #091324;\">\u003cp style=\"margin:0 0 0.35em;\">\u003cspan style=\"color: #091324\">\u003cstrong>Module 2 · Online Abuse in Sport: The Human Impact\u003c/strong>\u003c/span>\u003c/p>\u003cp style=\"margin:0; padding-left: 5em;\">\u003cspan style=\"color: #091324\">Explore how online abuse can affect athletes’ wellbeing, performance, participation, and sporting communities.\u003c/span>\u003c/p>\u003c/li>\u003cli style=\"margin:0 0 1.35em; color: #091324;\">\u003cp style=\"margin:0 0 0.35em;\">\u003cspan style=\"color: #091324\">\u003cstrong>Module 3 · How Online Harm Spreads\u003c/strong>\u003c/span>\u003c/p>\u003cp style=\"margin:0; padding-left: 5em;\">\u003cspan style=\"color: #091324\">Understand how digital platforms, online behaviours, and emerging technologies can amplify harmful content and influence how abuse develops and spreads.\u003c/span>\u003c/p>\u003c/li>\u003cli style=\"margin:0 0 1.35em; color: #091324;\">\u003cp style=\"margin:0 0 0.35em;\">\u003cspan style=\"color: #091324\">\u003cstrong>Module 4 · Knowing Your Rights and Responsibilities\u003c/strong>\u003c/span>\u003c/p>\u003cp style=\"margin:0; padding-left: 5em;\">\u003cspan style=\"color: #091324\">Build awareness of your rights, responsibilities, and available reporting pathways, including the roles of platforms, sporting organisations, and other relevant bodies.\u003c/span>\u003c/p>\u003c/li>\u003cli style=\"margin:0; color: #091324;\">\u003cp style=\"margin:0 0 0.35em;\">\u003cspan style=\"color: #091324\">\u003cstrong>Module 5 · Take Action: Building Safer Digital Sport Communities\u003c/strong>\u003c/span>\u003c/p>\u003cp style=\"margin:0; padding-left: 5em;\">\u003cspan style=\"color: #091324\">Turn knowledge into action by exploring practical ways to prevent, respond to, and challenge online abuse within your sporting community.\u003c/span>\u003c/p>\u003c/li>\u003c/ul>\u003c/div>","note":"Native text body on About This Course"},"heading":{"text":"\u003cspan style=\"color: #1c3564\">What you’ll explore\u003c/span>","note":"Native heading on About This Course"}},"courseSubtitle":{"text":"","note":"Unused (header banner is self-contained in courseTitle); kept for map compatibility"}}},"course":{"outline":{"sections":{"uaoaCourse":{"text":"UAOA eLearning Course","note":"Sidebar section title (outline) — ScormStack section `71c3c17e-9739-4b2e-8e61-040352b392d8`"},"introduction":{"text":"Introduction","note":"Sidebar section title (outline) — ScormStack section `b883660a-734f-415f-bb1b-6040ed02f678`"},"preCourseSurvey":{"text":"Pre-course survey","note":"Sidebar section title (outline) — ScormStack section `0a7799a0-b6bf-43cc-a775-5bcb87c82c06`"},"module1":{"text":"Module 1","note":"Sidebar section title (outline) — ScormStack section `794a5240-3c59-48d9-9826-a7186f534c7b`"},"module2":{"text":"Module 2","note":"Sidebar section title (outline) — ScormStack section `1f70a65e-08ab-476d-a110-ada1d643bb20`"},"module3":{"text":"Module 3","note":"Sidebar section title (outline) — ScormStack section `255cbf0a-45ee-4be0-98be-6691a6b8d043`"},"module4":{"text":"Module 4","note":"Sidebar section title (outline) — ScormStack section `3ff043da-8292-422a-aef1-87c0c1090145`"},"module5":{"text":"Module 5","note":"Sidebar section title (outline) — ScormStack section `0555be9c-0bc5-49a0-939f-7fd32d68b3c2`"},"summary":{"text":"Summary","note":"Sidebar section title (outline) — ScormStack
