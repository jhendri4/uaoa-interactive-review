lop into repeated or coordinated attacks against an individual."}},"g4":{"title":{"text":"Discussion Communities"},"platforms":{"text":"Reddit, Facebook Groups"},"body":{"text":"Harmful comments can spread within online communities as members respond, share, or encourage similar behaviour. Group discussions may reinforce negative attitudes and lead to repeated abuse targeting the same person."}},"g5":{"title":{"text":"Messaging & Group Chats"},"platforms":{"text":"Discord, WhatsApp"},"body":{"text":"Abusive messages can be forwarded or shared between individuals and groups, spreading harmful content through private conversations. Limited visibility outside these spaces can make it difficult to identify and address ongoing abuse."}}}},"factors":{"ui":{"prompt":{"text":"Select the three factors that can directly influence how harmful content travels and reaches new audiences online."},"hint":{"text":"Select exactly three options."},"hintReady":{"text":"Three selected — ready to submit."},"hintDone":{"text":"All three correct factors selected."},"choicesAria":{"text":"Select exactly three factors"},"count":{"text":"{n} of {total} selected"},"ok":{"text":"\u003cstrong>Correct!\u003c/strong> Platform features, recommendation systems, and user interactions can all influence how content is distributed, amplified, and exposed to new audiences.","note":"HTML allowed"},"bad":{"text":"\u003cstrong>Not quite. Review the options and try again.\u003c/strong>","note":"HTML allowed"}},"labels":{"a":{"text":"Platform design and features","note":"Correct"},"b":{"text":"The age of the person targeted"},"c":{"text":"Recommendation and distribution systems","note":"Correct"},"d":{"text":"The type of sport being played"},"e":{"text":"User interactions such as commenting, sharing, and reposting","note":"Correct"},"f":{"text":"The location where a sporting event takes place"}}},"check":{"ui":{"instructionComplete":{"text":"Complete the sentence."},"instructionBlanks":{"text":"Choose a word for each blank. Each word is used once."},"instructionMulti":{"text":"Select all that apply."},"instructionPair":{"text":"Choose the pair of words that completes the sentence."},"blankAria":{"text":"Blank {n}","note":"aria-label; {n} = 1-based index"},"questionsCorrect":{"text":"questions correct"},"scorePerfect":{"text":"Perfect — you got every question right.","note":"Score message; may vary — check widget"},"scorePartial":{"text":"Nice work — review any missed items below.","note":"Fallback score message"},"scoreLow":{"text":"Keep going — try again to strengthen your understanding."}},"questions":{"q1":{"label":{"text":"1. Complete the sentence: What defines online abuse?"},"prompt":{"text":"Online abuse involves harmful behaviour directed at a person or group through __________."},"choices":{"a":{"text":"competitive environments"},"b":{"text":"digital platforms","note":"Correct"},"c":{"text":"public spaces"},"d":{"text":"sporting events"}}},"q2":{"label":{"text":"2. Complete the statement: What helps you understand the context that defines online abuse?"},"sentenceBefore":{"text":"When identifying online abuse, consider the"},"sentenceMid1":{"text":"being used, whether the behaviour has a clear"},"sentenceMid2":{"text":"and the"},"sentenceAfter":{"text":"of repeated interactions."},"choices":{"language":{"text":"language","note":"Correct blank 1"},"target":{"text":"target","note":"Correct blank 2 — clear target"},"pattern":{"text":"pattern","note":"Correct blank 3 — pattern of repeated interactions"}}},"q3":{"label":{"text":"3. Which is a protected characteristic?"},"choices":{"religion":{"text":"Religion","note":"Correct"},"performance":{"text":"Athletic performance"},"disability":{"text":"Disability","note":"Correct"},"position":{"text":"Team position"},"ethnicity":{"text":"Ethnicity","note":"Correct"}}},"q4":{"label":{"text":"4. Fill in the blanks: How can online abuse develop?"},"prompt":{"text":"Different forms of online abuse can __________, and a single harmful interaction can __________ as others comment, share, repost, or amplify it."},"choices":{"a":{"text":"overlap · escalate","note":"Correct"},"b":{"text":"remain separate · disappear"},"c":{"text":"alternate · become private"},"d":{"text":"interact · become harmless"}}}}},"matteo":{"ui":{"navAria":{"text":"Card navigation"},"prevAria":{"text":"Previous card"},"nextAria":{"text":"Next card"}},"cards":{"c1":{"title":{"text":"1 - Pressure"},"alt":{"text":"Matteo preparing under pressure","note":"Image alt text"},"html":{"text":"\u003cp>\u003cstrong>Matteo is a high-performing college volleyball athlete with ambitions of joining the national team.\u003c/strong>\u003c/p>\u003cp>Between demanding coursework and intensive training, he has been under considerable pressure and struggling to stay focused.\u003c/p>","note":"HTML allowed"}},"c2":{"title":{"text":"2 - The Match"},"alt":{"text":"Matteo during the match","note":"Image alt text"},"html":{"text":"\u003cp>During an important match, Matteo serves into the net on match point, costing his team the match. The crowd reacts strongly, and some spectators begin shouting harsh criticism about his performance from the stands. The reaction continues as Matteo leaves the court.\u003c/p>\u003cp>\u003cstrong>Is this online abuse? No.\u003c/strong>\u003c/p>\u003cp>The criticism may be aggressive and harmful, but this is still happening \u003cstrong>offline\u003c/strong>. However, reactions that begin at a sporting event / on the ground, can quickly move into digital spaces, where they may reach a much wider audience.\u003c/p>","note":"HTML allowed"}},"c3":{"title":{"text":"3 - It moves online"},"alt":{"text":"Criticism moving onto social media","note":"Image alt text"},"html":{"text":"\u003cp>After the match, the criticism moves online. A fan posts a video of Matteo’s missing serve, tags Matteo’s social media account, and adds insulting and humiliating comments intended to ridicule him.\u003c/p>\u003cp>\u003cstrong>The situation has become online abuse.\u003c/strong>\u003c/p>\u003cp>The fan is using insulting and humiliating content directed at Matteo through a digital platform. This is \u003cstrong>offensive speech.\u003c/strong>\u003c/p>","note":"HTML allowed"}},"c4":{"title":{"text":"4 - The situation escalates"},"alt":{"text":"Hostile comments spreading online","note":"Image alt text"},"html":{"text":"\u003cp>By the next day, many users had joined in. Hostile comments are appearing across Matteo’s social media accounts, and the video of his missed serve is being repeatedly shared alongside insulting posts.\u003c/p>\u003cp>\u003cstrong>The situation has escalated to digital hostility.\u003c/strong>\u003c/p>\u003cp>What began with one user has developed into a \u003cstrong>repeated and collective pattern of hostile online interactions.\u003c/strong>\u003c/p>","note":"HTML allowed"}}}},"takeaways":{"heading":{"text":"Key Takeaways"},"items":{"i1":{"text":"\u003cstrong>Online abuse takes different forms.\u003c/strong> Offensive speech, hate speech, and digital hostility help us recognise different ways harmful behaviour can appear and develop online.","note":"HTML allowed"},"i2":{"text":"\u003cstrong>Context matters.\u003c/strong> Consider the language being used, who or what is being targeted, and the pattern of interactions when identifying online abuse.","note":"HTML allowed"},"i3":{"text":"\u003cstrong>Different forms of abuse can overlap.\u003c/strong> A single interaction may involve more than one behaviour, and its characteristics can change as the situation develops.","note":"HTML allowed"},"i4":{"text":"\u003cstrong>Online abuse can escalate.\u003c/strong> A single harmful post can develop into repeated or collective hostility as others comment, share, repost, or amplify the content.","note":"HTML allowed"},"i5":{"text":"\u003cstrong>Some people face disproportionate risk.\u003c/strong> Identity, visibility, role, and other contextual factors can affect who is targeted and the nature or intensity of the abuse they experience.","note":"HTML allowed"},"i6":{"text":"\u003cstrong>Recognition is the first step towards action.\u003c/strong> Understanding what online abuse looks like helps people identify harmful situations and respond more effectively.","note":"HTML allowed"}}},"slide":{"title":{"text":"Module 1 - Understanding Online Abuse","note":"slide_intro title"},"continueToModule2":{"text":"Continue to Module 2","note":"End-of-module navigation_button label"},"applyWhatDoYouSee":{"body":{"text":"\u003cp>\u003cspan style=\"color: #091324\">\u003cstrong>Online abuse can take different forms.\u003c/strong> Read each scenario and choose the behaviour that best describes what is happening.\u003c/span>\u003c/p>","note":"Native text body on Understanding Online Abuse"},"heading":{"text":"\u003cspan style=\"color: #1c3564\">Apply: What do you see?\u003c/span>","note":"Native heading on Understanding Online Abuse"}},"contextMatters":{"body":{"text":"\u003cp>\u003cspan style=\"color: #091324\">Online abuse does not always fit neatly into one category. To understand what is happening, consider:\u003c/span>\u003c/p>","note":"Native text body on Understanding Online Abuse"},"heading":{"text":"\u003cspan style=\"color: #1c3564\">Context matters\u003c/span>","note":"Native heading on Understanding Online Abuse"}},"exploreHowCanOnlineAbuseEvolve":{"body":{"text":"\u003cp>\u003cspan style=\"color: #091324\">\u003cstrong>Online abuse can begin with in-person interactions and evolve\u003c/strong> as harmful content spreads and others become involved. Follow Matteo’s experience to see how this can happen.\u003c/span>\u003c/p>","note":"Native text body on Understanding Online Abuse"},"heading":{"text":"\u003cspan style=\"color: #1c3564\">Explore: How can online abuse evolve?\u003c/span>","note":"Native heading on Understanding Online Abuse"}},"introSubtitle":{"text":"Estimated time: 15 minutes","note":"slide_intro subtitle (estimated time)"},"languageWhatIsBeingSaidOr":{"body":{"text":"\u003cul style=\"margin:0; padding-left: 3.0em; list-style:disc; color: #091324; font-family:'Cerebri Sans Pro', system-ui, -apple-system, 'Segoe UI', sans-serif; font-size:16px; line-height:1.55;\">\u003cli style=\"margin:0 0 8px;\">\u003cp>\u003cstrong>Language:\u003c/strong> What is being said or shared?\u003c/p>\u003c/li>\u003cli style=\"margin:0 0 8px;\">\u003cp>\u003cstrong>Target:\u003c/strong> Is the attack focused on performance, appearance, identity, or a protected characteristic?\u003c/p>\u003c/li>\u003cli style=\"margin:0;\">\u003cp>\u003cstrong>Pattern:\u003c/strong> Is it a single interaction or part of repeated or collective hostility?\u003c/p>\u003c/li>\u003c/ul>","note":"Native text body on Understanding Online Abuse"}},"onlineAbuseDoesNotAffectEveryone":{"body":{"text":"\u003cp style=\"text-align: left\">\u003cspan style=\"color: #091324\">\u003cstrong>Online abuse does not affect everyone equally.\u003c/strong> Some people face more frequent or targeted abuse when hostility focuses on personal characteristics that are considered protected.&nbsp;\u003cbr>\u003cbr>\u003cstrong>Protected characteristics\u003c/strong> can include \u003cstrong>race, ethnicity, nationality, religion, gender, sexual orientation, disability, age, pregnancy status, and marital status\u003c/strong>.\u003c/span>\u003c/p>\u003cp style=\"text-align: left\">\u003c/p>\u003cp style=\"text-align: left\">\u003cspan style=\"color: #091324\">This list is not exhaustive, and recognised or protected characteristics may vary across legal systems, languages, cultures, and countries. When hostile or malicious language targets someone based on these or other protected characteristics, it may constitute \u003c/span>\u003cspan style=\"color: #091324\">\u003cstrong>hate speech\u003c/strong>.\u003c/span>\u003c/p>","note":"Native text body on Understanding Online Abuse"}},"onlineConversationsArePartOfSport":{"body":{"text":"\u003cp>\u003cspan style=\"color: #091324; font-size: 18px\">\u003cstrong>Online conversations are part of sport: \u003c/strong>celebrating a result, discussing a decision, or connecting with a team or athlete. The same interactions that bring people together can also expose them to humiliation, harassment, and abuse.\u003c/span>\u003c/p>","note":"Native text body on Understanding Online Abuse"},"heading":{"text":"\u003cspan style=\"color: #1c3564; font-size: 14px\">Online conversations are part of sport: celebrating a result, discussing a decision, or connecting with a team or athlete. The same interactions that bring people together can also expose them to humiliation, harassment, and abuse.\u003c/span>","note":"Native heading on Understanding Online Abuse"}},"whatDoWeUnderstandByOnline":{"body":{"text":"\u003cp>\u003cspan style=\"color: #091324\">\u003cstrong>Online abuse is any harmful behaviour directed at a person or group through digital platforms.\u003c/strong>\u003cbr>\u003cbr>Definitions vary across countries and contexts, so we focus on \u003cem>\u003cu>what matters most:\u003c/u>\u003c/em> recognising the harm and building the knowledge to prevent it in sport.\u003c/span>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003cspan style=\"color: #091324\">To recognise online abuse, it helps to understand the different forms it can take. Think of it as \u003cstrong>an umbrella covering three connected behaviours:\u003c/strong>\u003c/span>\u003c/p>","note":"Native text body on Understanding Online Abuse"},"heading":{"text":"\u003cspan style=\"color: #1c3564\">What do we mean about online abuse?\u003c/span>","note":"Native heading on Understanding Online Abuse"},"p4":{"text":"\u003cp>To recognise online abuse, it helps to understand the different forms it can take. Think of it as an umbrella covering three connected behaviours. Select each card to reveal the definition.\u003c/p>","note":"Native text body on Understanding Online Abuse"},"p3":{"text":"\u003cp>Definitions vary across countries and contexts, so we focus on \u003cem>what matters most\u003c/em>: recognising the harm and building the knowledge to prevent it in sport.\u003c/p>","note":"Native text on Understanding Online Abuse"}},"whenTheBehavioursOverlap":{"body":{"text":"\u003cp style=\"text-align: left\">\u003cspan style=\"color: #091324\">Imagine a player receives a humiliating comment after a loss. Similar messages then flood their account for days. Some also attack their race.\u003cbr>\u003cbr>The humiliating language is \u003cstrong>offensive speech\u003c/strong>. The repeated public aggression in one or across social media platforms creates \u003cstrong>digital hostility\u003c/strong>. The racist targeting is considered \u003cstrong>hate speech\u003c/strong>.\u003c/span>\u003c/p>","note":"Native text body on Understanding Online Abuse"},"heading":{"text":"\u003cspan style=\"color: #1c3564\">When the behaviours overlap:\u003c/span>","note":"Native heading on Understanding Online Abuse"}}},"protectedAria":{"text":"Protected characteristics","note":"aria-label on protected characteristics tile group"}},"m2":{"check":{"questions":{"q1":{"prompt":{"text":"Which option best reflects the range of people who can be affected by online abuse in sport?","note":"MCQ stem"},"choices":{"c0":{"text":"Only professional athletes and match officials."},"c1":{"text":"People who follow sport on social media."},"c2":{"text":"Athletes, officials, journalists, organisations and their representatives, families, fans, and others across sporting communities.","note":"Correct answer"},"c3":{"text":"Primarily people whose work involves communicating directly with fans."}},"ok":{"text":"\u003cstrong>Correct!\u003c/strong> Online abuse can affect people across the sporting ecosystem, including those directly targeted and others who witness or experience its wider consequences.","note":"HTML allowed"}},"q2":{"prompt":{"text":"Which statement best describes the potential impact of online abuse in sport?"},"choices":{"c0":{"text":"Its effects are mainly limited to how people feel or react immediately after receiving abusive content."},"c1":{"text":"It can have long-term effects on wellbeing, professional activity, relationships, participation, and the wider sporting community.","note":"Correct answer"},"c2":{"text":"It is something that concerns only the elite athletes because they have the greatest public visibility."},"c3":{"text":"Its impact depends mainly on how frequently someone uses social media."}},"ok":{"text":"\u003cstrong>Correct!\u003c/strong> Online abuse can have effects across multiple areas of a person’s life and work. While in sport, it might affect athletes the most, irrespective of their levels, but the consequences can also extend to families, colleagues, teams, fans, and sporting communities.","note":"HTML allowed"}},"q3":{"prompt":{"text":"An athlete who has experienced repeated online abuse begins sleeping poorly, struggles to concentrate during training, and posts less frequently online. What does this example illustrate?"},"choices":{"c0":{"text":"Different impacts of online abuse can overlap and influence several areas of a person’s life.","note":"Correct answer"},"c1":{"text":"Reduced social media activity is usually the primary effect of online abuse."},"c2":{"text":"Performance effects occur after a coach recommends using less social media."},"c3":{"text":"The effects of online abuse depend mainly on how frequently a person uses social media."}},"ok":{"text":"\u003cstrong>Correct!\u003c/strong> Effects can be interconnected. Emotional distress, sleep, confidence, safety, performance, and participation can influence one another and may develop over time.","note":"HTML allowed"}},"q4":{"prompt":{"text":"What does the evidence presented in this module suggest about how people respond to online abuse?"},"choices":{"c0":{"text":"People generally experience similar effects when exposed to similar content."},"c1":{"text":"Strong resilience prevents online abuse from affecting wellbeing."},"c2":{"text":"Effects can vary between people, and personal and contextual factors can shape how someone responds.","note":"Correct answer"},"c3":{"text":"People who continue participating in sport are unlikely to have been significantly affected."}},"ok":{"text":"\u003cstrong>Correct!\u003c/strong> The impact of online abuse varies. Research discussed in the module indicates that factors such as resilience and self-esteem can be associated with how people respond, but continuing to participate does not mean that someone has been unaffected.","note":"HTML allowed"}}}},"affected":{"ui":{"progress":{"text":"{n} of {total} explored"},"done":{"text":"All groups explored","note":"Flip done banner — who is affected"}},"cards":{"c1":{"name":{"text":"Athletes"},"body":{"text":"High public visibility can make athletes frequent targets of online abuse. Hateful reactions may arise from sporting outcomes, public perceptions, or interpretations of an athlete’s performance, actions, or personal decisions. These reactions can escalate quickly, allowing harmful content to spread across digital platforms."}},"c2":{"name":{"text":"Sport Officials"},"body":{"text":"Officials can face online abuse following decisions made during competition, adding to the verbal and physical abuse they may already experience in person. Repeated criticism, threats, and hostility can contribute to stress and affect their confidence, perceived authority, and wellbeing."}},"c3":{"name":{"text":"Media Professionals"},"body":{"text":"Journalists play an important role in connecting athletes, teams, and sporting organisations with wider audiences. Journalists may become targets of online hostility in response to their reporting, commentary or perceived position on an issue."}},"c4":{"name":{"text":"Sports federations and organisations"},"body":{"text":"Sporting organisations and the people who fund, manage, and represent them can also become targets of online abuse. Hostile content may be directed at an organisation itself, its decisions, policies or actions, or at individual staff and representatives. This can affect organisational reputation, professional activity, decision-making, and the wellbeing of those involved."}},"c5":{"name":{"text":"Families"},"body":{"text":"The effects of online abuse can extend to the families and loved ones of those targeted. They may witness the abuse and its impact, become indirect targets through their association with the person experiencing abuse, or receive harmful messages directed at them personally. These experiences can also increase concern and fear for the safety and wellbeing of someone close to them."}},"c6":{"name":{"text":"Fans"},"body":{"text":"Fans are the largest group in sport and are often overlooked. They can be affected by the abuse they encounter within sporting communities, even when they are not a direct target. Identity-based abuse aimed at an athlete, official, or other public figure can also affect fans who share that identity, contributing to an environment in which they may feel unwelcome or unsafe."}}}},"exploreImpacts":{"ui":{"eyebrow":{"text":"Explore"},"prompt":{"text":"After receiving repeated abusive messages online, an athlete begins posting on social media less frequently. Their coach notices they seem distracted during training, and they have recently mentioned sleeping poorly and feeling anxious about attending public events."},"hint":{"text":"Select at least 4 that apply, then submit."},"count":{"text":"{n} selected"},"ok":{"text":"\u003cstrong>These impacts can be interconnected and thus each of them are correct.\u003c/strong> Online abuse may affect several areas of a person’s life at the same time, and the effects may develop or intensify over time. Recognising these signs can help people across sport respond with greater awareness and support.","note":"HTML allowed"},"bad":{"text":"\u003cstrong>Not quite. Try again.\u003c/strong>","note":"HTML allowed — shown when submit has fewer than 4 impacts selected"}},"labels":{"c0":{"text":"Emotional distress"},"c1":{"text":"Sleep disruption"},"c2":{"text":"Reduced confidence"},"c3":{"text":"Sense of safety"},"c4":{"text":"Focus and performance"},"c5":{"text":"Stepping away"}}},"impacts":{"ui":{"pathwayAria":{"text":"Impact pathway"},"navAria":{"text":"Carousel navigation"},"prevAria":{"text":"Previous impact"},"nextAria":{"text":"Next impact"},"researchHeading":{"text":"What the research shows"},"done":{"text":"Activity complete — you’ve reviewed all six impacts"},"sourceLabel":{"text":"Source:","note":"Prefix before the citation under each impact card; a space and the source follow"}},"cards":{"c1":{"title":{"text":"Emotional distress"},"short":{"text":"Distress","note":"Pathway short label"},"alt":{"text":"Temporary illustration · emotional distress","note":"Image alt"},"body":{"text":"\u003cp>Receiving online abuse can trigger feelings of fear, sadness, anger, and frustration. For athletes, these experiences may also raise concerns about their reputation, career opportunities, relationships with family and friends, and team performance. When abuse occurs publicly, its visibility and potential spread can further intensify psychological distress.\u003c/p>","note":"HTML allowed"},"research":{"text":"In a survey of 85 NCAA Division I athletes, greater exposure to online harassment was associated with \u003cstrong>higher levels of depressive symptoms\u003c/strong>. The researchers describe hostile online content as a meaningful source of psychological stress for college athletes.","note":"HTML allowed"},"source":{"text":"Hughes, M. C., Demaray, M. K., Skiba, E. A., & Warriner, S. E. (2026). Online harassment and mental health among collegiate student-athletes: Findings from an NCAA Division I conference survey. Journal of Issues in Intercollegiate Athletics.","note":"Citation; keep author names"}},"c2":{"title":{"text":"Sleep"},"short":{"text":"Sleep","note":"Pathway short label"},"alt":{"text":"Temporary illustration · sleep","note":"Image alt"},"body":{"text":"\u003cp>Online abuse can disrupt sleep and recovery. Harmful online experiences may affect an athlete’s sleep patterns, making it harder to wake up feeling rested and recover fully after training or competition.\u003c/p>","note":"HTML allowed"},"research":{"text":"In a study of 912 young athletes aged 12–24, \u003cstrong>10.4% reported experiencing online abuse.\u003c/strong> Among those affected, \u003cstrong>44.3%\u003c/strong> reported moderate to severe \u003cstrong>effects on their sleep quality\u003c/strong>.","note":"HTML allowed"},"source":{"text":"Tooth, C., Kaux, J.-F., Tscholl, P., Touré, A., Muller, F., & Seil, K. (2026). The influence of social media on young athletes' mental health: A cross-sectional study. Frontiers in Psychology.","note":"Citation; keep author names"}},"c3":{"title":{"text":"Confidence and self-esteem"},"short":{"text":"Confidence","note":"Pathway short label"},"alt":{"text":"Temporary illustration · confidence","note":"Image alt"},"body":{"text":"\u003cp>Online abuse often targets a person's abilities, body, or identity. Repeated criticism, including comments shared publicly to humiliate or hurt someone, can affect the targeted person's confidence and make them doubt their skills, decisions, and place in sport.\u003c/p>","note":"HTML allowed"},"research":{"text":"Research suggests that internal factors can shape how people respond to online hate. In a study of \u003cstrong>60 public figures, including Olympic athletes, and 1,128 internet users\u003c/strong>, higher \u003cstrong>resilience and self-esteem were associated with lower levels of concern about the online hate they received\u003c/strong>. This suggests that people can experience the same type of hostility differently, depending in part on their psychological resources.","note":"HTML allowed"},"source":{"text":"Jędryczka, W., Sorokowski, P., & Dobrowolska, M. (2022). The role of victim's resilience and self-esteem in experiencing internet hate. International Journal of Environmental Research and Public Health.","note":"Citation; keep author names"}},"c4":{"title":{"text":"Sense of safety"},"short":{"text":"Safety","note":"Pathway short label"},"alt":{"text":"Temporary illustration · sense of safety","note":"Image alt"},"body":{"text":"\u003cp>Threats and hostility online can extend concerns about safety \u003cstrong>beyond digital spaces\u003c/strong>. People targeted may worry about their own safety \u003cstrong>at home, during competition, and in public spaces.\u003c/strong> When threats also involve those close to them, these concerns can extend to \u003cstrong>family members and loved ones.\u003c/strong>\u003c/p>","note":"HTML allowed"},"research":{"text":"In the 2025 UAOA Barometer, \u003cstrong>nearly three in four sporting federations surveyed\u003c/strong> reported that threats to harm sportspeople or their dependents remain a reality for those using social media platforms. The finding was also reported in the previous edition of the Barometer, indicating an ongoing concern across sport.","note":"HTML allowed"},"source":{"text":"United Against Online Abuse. (2025). Online Abuse in Sport Barometer 2025.","note":"Citation; keep author names"}},"c5":{"title":{"text":"Focus and performance"},"short":{"text":"Focus","note":"Pathway short label"},"alt":{"text":"Temporary illustration · focus and performance","note":"Image alt"},"body":{"text":"\u003cp>The detrimental effects of psychological stress on focus and performance are well documented. Because online abuse can cause mental distress, it can thus negatively affect the focus and performance of sportpeople, making it harder to concentrate, make decisions under pressure, and perform consistently.\u003c/p>","note":"HTML allowed"},"research":{"text":"In a study of \u003cstrong>274 Canadian basketball referees\u003c/strong>, higher wellbeing was significantly associated with \u003cstrong>better self-rated officiating performance\u003c/strong>, even after accounting for experience. Previous research cited by the authors also found that \u003cstrong>90% of football referees believed common mental health symptoms could negatively affect their refereeing performance.\u003c/strong>","note":"HTML allowed"},"source":{"text":"Taylor, N., Hancock, D., & Sullivan, P. (2026). Mental health and officiating performance. Frontiers in Psychology.","note":"Citation; keep author names"}},"c6":{"title":{"text":"Stepping away"},"short":{"text":"Stepping away","note":"Pathway short label"},"alt":{"text":"Temporary illustration · stepping away","note":"Image alt"},"body":{"text":"\u003cp>Online abuse can influence whether people \u003cstrong>continue participating, working, or communicating openly in sport.\u003c/strong> Some may reduce their social media presence, reconsider their involvement, or become more cautious about what they share publicly.\u003c/p>","note":"HTML allowed"},"research":{"text":"Research on abuse in sport found that both \u003cstrong>physical and non-physical abuse were associated with a greater intention to quit\u003c/strong> among association football referees in England and Canada. Abuse was also associated with reduced wellbeing. In the 2025 UAOA Barometer, \u003cstrong>90% of sporting federations surveyed expressed concern that online abuse could drive talented athletes out of sport.\u003c/strong>","note":"HTML allowed"},"source":{"text":"Downward, P., Webb, T., & Dawson, P. (2024). Referee abuse, intention to quit, and well-being. Research Quarterly for Exercise and Sport. United Against Online Abuse. (2025). Online Abuse in Sport Barometer 2025.","note":"Citation; keep author names"}}}},"takeaways":{"heading":{"text":"Key Takeaways"},"items":{"i1":{"text":"\u003cstrong>Online abuse can have wide-ranging effects.\u003c/strong> Its impact can extend across wellbeing, confidence, sense of safety, performance, participation, and other areas of a person’s life.","note":"HTML allowed"},"i2":{"text":"\u003cstrong>The effects can be interconnected.\u003c/strong> Emotional distress, disrupted sleep, reduced confidence, safety concerns, and difficulties with focus can overlap and influence one another.","note":"HTML allowed"},"i3":{"text":"\u003cstrong>People can be affected differently.\u003c/strong> Personal and contextual factors can shape how someone experiences and responds to online abuse.","note":"HTML allowed"},"i4":{"text":"\u003cstrong>The impact extends beyond those directly targeted.\u003c/strong> Families, teammates, colleagues, fans, organisations, and others across sporting communities can also experience its consequences.","note":"HTML allowed"},"i5":{"text":"\u003cstrong>Online abuse can affect participation and sporting culture.\u003c/strong> Persistent hostility can influence who feels safe, welcome, and able to participate in sport.","note":"HTML allowed"},"i6":{"text":"\u003cstrong>The consequences can extend beyond sport.\u003c/strong> When discriminatory and abusive behaviours become normalised, they can reinforce prejudice, exclusion, and hostility in wider society.","note":"HTML allowed"}}},"slide":{"title":{"text":"Module 2 - Online Abuse in Sport: The Human Impact","note":"slide_intro title"},"section1":{"text":"Why the human impact matters","note":"Section heading on Online Abuse in Sport: The Human Impact"},"section2":{"text":"Who is affected by online abuse?","note":"Section heading on Online Abuse in Sport: The Human Impact"},"section3":{"text":"The impact of online abuse on people","note":"Section heading on Online Abuse in Sport: The Human Impact"},"section4":{"text":"Explore: Which potential impacts of online abuse can you identify?","note":"Section heading on Online Abuse in Sport: The Human Impact"},"section5":{"text":"The wider picture","note":"Section heading on Online Abuse in Sport: The Human Impact"},"barometerCallout":{"text":"\u003cp>To learn more about the impact and harms of online abuse, we invite you to explore the findings of UAOA’s landmark study captured in the \u003ca href=\"https://unitedagainstonlineabuse.com/uaoa-barometer-2025/\" target=\"_blank\" rel=\"noopener\">UAOA Barometer 2025\u003c/a> - which measures online abuse in sport, with participation from leading NGOs and International Federations.\u003c/p>","note":"Module 2 Barometer image_with_text"},"continueToModule3":{"text":"Continue to Module 3","note":"End-of-module navigation_button label"},"checkYourUnderstandingOfTheKey":{"body":{"text":"\u003cp>\u003cspan style=\"color: #091324\">Check your understanding of the key ideas from this module.\u003c/span>\u003c/p>","note":"Native text body on Online Abuse in Sport: The Human Impact"}},"introSubtitle":{"text":"Estimated time: 15 minutes","note":"slide_intro subtitle (estimated time)"},"section1Body":{"text":"\u003cp>\u003cspan style=\"color: #091324\">\u003cstrong>Understanding how online abuse affects people\u003c/strong> helps us build empathy for those targeted and respond with care and respect. The effects of online abuse on people can be serious and far-reaching: a single post can leave someone feeling anxious, unsafe, or doubting themselves even long after the initial interaction.\u003c/span>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003cspan style=\"color: #091324\">As abuse continues or spreads across digital platforms, its \u003cstrong>impact can intensify\u003c/strong>. Online abuse can affect \u003cstrong>mental health and wellbeing\u003c/strong>, as well as how athletes perform, how officials approach decisions, and how journalists and other professionals engage with their work.\u003c/span>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003cspan style=\"color: #091324\">Such effects can also \u003cstrong>extend beyond the person being targeted.\u003c/strong> Families, teammates, colleagues, and fans may witness or experience the consequences of abuse. At a wider level, persistent online hostility can shape sporting culture, affect participation, and influence \u003cstrong>who feels safe and welcome in sport.\u003c/strong>\u003c/span>\u003c/p>","note":"Section body on Online Abuse in Sport: The Human Impact"},"section2Body":{"text":"\u003cp>\u003cspan style=\"color: #091324\">High-profile athletes tend to face a large volume of online abuse. However, \u003cstrong>athletes are not the only people targeted.\u003c/strong>\u003c/span>\u003c/p>","note":"Section body on Online Abuse in Sport: The Human Impact"},"section3Body":{"text":"\u003cp>\u003cspan style=\"color: #091324\">Online abuse can affect everyone involved in sport. Its consequences vary depending on the individual and their circumstances, with some impacts being particularly relevant to athletes. These effects can also reinforce one another: anxiety may disrupt sleep, poor sleep may affect concentration and confidence, and these combined effects can influence daily activities, sporting performance, and overall wellbeing.\u003c/span>\u003c/p>","note":"Section body on Online Abuse in Sport: The Human Impact"},"section4Body":{"text":"","note":"Section body on Online Abuse in Sport: The Human Impact"},"section5Body":{"text":"\u003cp>\u003cspan style=\"color: #091324\">The effects of online abuse can \u003cstrong>extend beyond individuals\u003c/strong>, shaping the culture of sport and the communities around it. Widespread hostility can affect \u003cstrong>who feels welcome, safe, and able to participate\u003c/strong>, with implications for inclusion and the sustainability of sporting communities.\u003cbr>\u003cbr>\u003c/span>\u003c/p>\u003cp>\u003cspan style=\"color: #091324\">Sport also has a \u003cstrong>wider social influence\u003c/strong>. The behaviours and attitudes expressed in sporting spaces can contribute to broader social norms. When discriminatory or abusive behaviour becomes normalised, it can reinforce \u003cstrong>prejudice, exclusion, and hostility beyond sport.\u003c/strong>\u003c/span>\u003c/p>\u003cp>\u003c/p>","note":"Section body on Online Abuse in Sport: The Human Impact"},"section5Body3":{"text":"\u003cp>To learn more, please read the \u003ca href=\"https://unitedagainstonlineabuse.com/uaoa-barometer-2025/\" target=\"_blank\" rel=\"noopener\">UAOA Barometer 2025\u003c/a>.\u003c/p>","note":"Section body on Online Abuse in Sport: The Human Impact"}}},"m3":{"regionTabs":{"ui":{"eyebrow":{"text":"Regional example"},"prompt":{"text":"Select a region"},"placeholder":{"text":"Select a region to view an example."},"regionsAria":{"text":"Regions"},"close":{"text":"Close"},"closeAria":{"text":"Close"},"subCountriesAria":{"text":"EU member examples"},"overview":{"text":"Overview"}},"tabs":{"t1":{"title":{"text":"European Union"},"html":{"text":"\u003cp>There are different laws which provide the framework for regulating AI and its use. For example, the \u003ca href=\"https://eur-lex.europa.eu/eli/reg/2024/1689/\" target=\"_blank\" rel=\"noopener\">\u003cstrong>European Union AI Act\u003c/strong>\u003c/a> uses a risk-based framework for AI and introduces transparency requirements for certain AI-generated and manipulated content, including some deepfakes. This Act is generally applicable across EU countries, with some of them adapting specific national legislations.\u003c/p>","note":"HTML allowed — European Union AI Act links to EUR-Lex"},"subs":{"slovenia":{"title":{"text":"Slovenia"},"html":{"text":"\u003cp>In Slovenia, AI is governed by \u003ca href=\"https://pisrs.si/pregledPredpisa?id=ZAKO9225#naslov-parent-393613415\" target=\"_blank\" rel=\"noopener\">national legislation\u003c/a> and the \u003ca href=\"https://eur-lex.europa.eu/legal-content/SL/TXT/HTML/?uri=OJ:L_202401689\" target=\"_blank\" rel=\"noopener\">EU AI Act\u003c/a> is also applicable. Additionally, there are also available national resources like \u003ca href=\"https://www.gov.si/novice/2026-08-03-zacela-so-se-uporabljati-pravila-o-preglednosti-sistemov-umetne-inteligence/\" target=\"_blank\" rel=\"noopener\">Government guidance\u003c/a>, \u003ca href=\"https://www.ip-rs.si/umetna-inteligenca/pogosta-vpra%C5%A1anja/\" target=\"_blank\" rel=\"noopener\">answers to common questions\u003c/a>, and \u003ca href=\"https://www.gov.si/en/state-authorities/ministries/ministry-of-the-interior-and-public-administration/about-the-ministry/\" target=\"_blank\" rel=\"noopener\">regulatory information from the responsible ministry\u003c/a>.\u003c/p>","note":"HTML allowed — linked phrases open official sources"}},"sweden":{"title":{"text":"Sweden"},"html":{"text":"\u003cp>In Sweden, the EU AI Act applies directly and provides the legal framework for regulating artificial intelligence, including AI-generated content. Sweden has no separate national legislation specifically addressing AI-generated content.\u003c/p>","note":"HTML allowed"}},"czechia":{"title":{"text":"Czechia"},"html":{"text":"\u003cp>In Czechia, the EU AI Act applies directly and provides the legal framework for regulating artificial intelligence, including AI-generated content.\u003c/p>","note":"HTML allowed"}},"spain":{"title":{"text":"Spain"},"html":{"text":"\u003cp>In Spain, the EU AI Act applies directly and provides the legal framework for regulating artificial intelligence, including AI-generated content. The \u003ca href=\"https://aesia.digital.gob.es/es\" target=\"_blank\" rel=\"noopener noreferrer\">Spanish Agency for the Supervision of Artificial Intelligence (AESIA)\u003c/a> oversees compliance with AI regulations and supports their implementation at the national level.\u003c/p>","note":"HTML allowed"}}}},"t2":{"title":{"text":"United Kingdom"},"html":{"text":"\u003cp>Under the \u003ca href=\"https://www.legislation.gov.uk/ukpga/2023/50\" target=\"_blank\" rel=\"noopener\">\u003cstrong>Online Safety Act\u003c/strong>\u003c/a>, AI-generated content shared by users can fall within the responsibilities of regulated online services, including relevant duties concerning illegal content and user safety.\u003c/p>","note":"HTML allowed"}},"t3":{"title":{"text":"United States"},"html":{"text":"\u003cp>The \u003ca href=\"https://www.congress.gov/bill/119th-congress/senate-bill/146\" target=\"_blank\" rel=\"noopener\">\u003cstrong>TAKE IT DOWN Act\u003c/strong>\u003c/a> addresses the sharing of intimate images without consent, including AI-generated deepfakes. It requires covered online platforms to provide a way to request their removal and to remove qualifying content within 48 hours of a valid request.\u003c/p>","note":"HTML allowed"}}}},"checklist":{"ui":{"eyebrow":{"text":"Checklist"},"title":{"text":"Reporting steps"},"progress":{"text":"{n} of {total} reviewed"},"hint":{"text":"Tick each step as you review it. Not graded.","note":"Removed from widget UI; kept for translators / legacy"}},"items":{"i1":{"text":"1. \u003cstrong>Assess the situation and your safety.\u003c/strong> Consider the nature of the content and whether you or someone else may be at immediate risk. If there is an immediate threat, seek appropriate assistance without delay.","note":"HTML allowed — first sentence in \u003cstrong> only"},"i2":{"text":"2. \u003cstrong>Collect evidence.\u003c/strong> Save copies of abusive posts, messages, profile information, URLs, and screenshots before the content is deleted or becomes inaccessible. Keep these records in a secure location in case they are needed for reporting or further action.","note":"HTML allowed — first sentence in \u003cstrong> only"},"i3":{"text":"3. \u003cstrong>Record key details.\u003c/strong> Record when and where the abuse occurred, the accounts involved, and any relevant circumstances. Note whether similar incidents have happened before or whether the behaviour appears to be part of a pattern of abuse.","note":"HTML allowed — first sentence in \u003cstrong> only"},"i4":{"text":"4. \u003cstrong>Use platform safety tools.\u003c/strong> Restrict, mute, or block accounts to limit further contact or exposure to harmful content. Adjust your privacy settings where appropriate to help prevent repeated incidents.","note":"HTML allowed — first sentence in \u003cstrong> only"},"i5":{"text":"5. \u003cstrong>Report through the platform.\u003c/strong> Review the platform’s policies and use its reporting tools to flag abusive content or accounts. Provide relevant details and supporting evidence where requested to help the platform assess the report.","note":"HTML allowed — first sentence in \u003cstrong> only"},"i6":{"text":"6. \u003cstrong>Seek additional support or escalate when needed.\u003c/strong> Contact your organisation’s welfare or safeguarding lead or other appropriate support services. If your safety is threatened, contact local authorities or emergency services as appropriate, regardless of whether you have completed the other steps.","note":"HTML allowed — first sentence in \u003cstrong> only"}}},"reportingSystems":{"ui":{"listAria":{"text":"Reporting systems by country","note":"aria-label on accordion list"},"placeholder":{"text":"Select a country to view reporting systems and support resources."},"closeAria":{"text":"Close"}},"items":{"uk":{"title":{"text":"United Kingdom"},"html":{"text":"\u003cp>In the UK, online abuse can be reported to the relevant platform or, when it may constitute a criminal offence, to the police. Individuals are encouraged to preserve evidence, including screenshots, messages and URLs. Specialist organisations also provide confidential support and guidance.\u003c/p>\u003cul>\u003cli>\u003cstrong>Police\u003c/strong> — Report threats, stalking, harassment and other potentially criminal online behaviour. Call 999 in an emergency or 101 for non-emergency assistance.\u003c/li>\u003cli>\u003ca href=\"https://reportharmfulcontent.com/\" target=\"_blank\" rel=\"noopener\">\u003cstrong>Report Harmful Content\u003c/strong>\u003c/a> — Guidance and assistance with reporting harmful online content, including harassment, threats and abuse.\u003c/li>\u003cli>\u003ca href=\"https://www.stophateuk.org/report-hate-crime/\" target=\"_blank\" rel=\"noopener\">\u003cstrong>Stop Hate UK\u003c/strong>\u003c/a> — Independent, confidential support and general hate crime reporting services in participating areas.\u003c/li>\u003c/ul>","note":"HTML allowed — linked resource names open official sources"}},"us":{"title":{"text":"United States"},"html":{"text":"\u003cp>In the United States, online abuse can be reported to the relevant platform or law enforcement, depending on the nature of the incident. Threats, stalking and other potentially criminal behaviour can be reported to local police, while federal agencies provide additional reporting channels. Individuals are encouraged to preserve evidence, including screenshots, messages and URLs.\u003c/p>\u003cul>\u003cli>\u003ca href=\"https://www.usa.gov/report-crime\" target=\"_blank\" rel=\"noopener\">\u003cstrong>Local Law Enforcement\u003c/strong>\u003c/a> — Police departments can receive reports of threats, stalking, harassment and other potentially criminal online behaviour. Call 911 in an emergency.\u003c/li>\u003cli>\u003ca href=\"https://www.stopbullying.gov/cyberbullying/how-to-report\" target=\"_blank\" rel=\"noopener\">\u003cstrong>StopBullying.gov: Report Cyberbullying\u003c/strong>\u003c/a> — Government guidance on documenting cyberbullying, reporting harmful content to platforms and contacting law enforcement when appropriate.\u003c/li>\u003cli>\u003ca href=\"https://www.ic3.gov/\" target=\"_blank\" rel=\"noopener\">\u003cstrong>FBI: Internet Crime Complaint Center (IC3)\u003c/strong>\u003c/a> — Reports of cyber-enabled crime, including online extortion, harassment and stalking where criminal conduct is suspected.\u003c/li>\u003cli>\u003ca href=\"https://tips.fbi.gov/\" target=\"_blank\" rel=\"noopener\">\u003cstrong>FBI: Report a Federal Crime\u003c/strong>\u003c/a> — Reports of suspected federal crimes, including serious threats and other criminal activity that may involve online abuse.\u003c/li>\u003c/ul>","note":"HTML allowed — linked resource names open official sources"}},"si":{"title":{"text":"Slovenia"},"html":{"text":"\u003cp>In Slovenia, athletes and sports professionals can seek independent support and guidance on online abuse through the Ombudsman for Athletes’ Rights. Additional resources address cybersecurity incidents, personal data protection and misconduct within sport, including dedicated reporting channels.\u003c/p>\u003cul>\u003cli>\u003ca href=\"https://www.gov.si/en/state-authorities/ministries/ministry-of-the-economy-labour-and-sport/about-the-ministry-of-economy-tourism-and-sport/sport-directorate/\" target=\"_blank\" rel=\"noopener\">\u003cstrong>Ombudsman for Athletes’ Rights\u003c/strong>\u003c/a> — Independent support and free legal guidance for athletes and sports professionals.\u003c/li>\u003cli>\u003ca href=\"https://www.cert.si/en/about-si-cert/\" target=\"_blank\" rel=\"noopener\">\u003cstrong>SI.CERT\u003c/strong>\u003c/a> — Slovenia’s national cybersecurity incident response centre, providing assistance with online security incidents.\u003c/li>\u003cli>\u003ca href=\"https://www.gov.si/drzavni-organi/vladne-sluzbe/urad-vlade-za-informacijsko-varnost/\" target=\"_blank\" rel=\"noopener\">\u003cstrong>Government Information Security Office\u003c/strong>\u003c/a> — Government authority responsible for national information security and cybersecurity.\u003c/li>\u003cli>\u003ca href=\"https://www.ip-rs.si/en/about/information-commissioner\" target=\"_blank\" rel=\"noopener\">\u003cstrong>Information Commissioner\u003c/strong>\u003c/a> — Independent authority overseeing personal data protection and privacy rights.\u003c/li>\u003cli>\u003ca href=\"https://oks.zvizgavka.si/\" target=\"_blank\" rel=\"noopener\">\u003cstrong>Olympic Committee of Slovenia: Whistleblowing Channel\u003c/strong>\u003c/a> — Reporting channel for raising concerns about misconduct within sport.\u003c/li>\u003c/ul>","note":"HTML allowed — linked resource names open official sources"}},"se":{"title":{"text":"Sweden"},"html":{"text":"\u003cp>In Sweden, potentially criminal online abuse, including threats, harassment and defamation, can be reported to the police. Athletes and sports professionals can also seek independent support or report misconduct within sport through the Swedish Sports Confederation’s Sports Ombudsman.\u003c/p>\u003cul>\u003cli>\u003ca href=\"https://polisen.se/utsatt-for-brott/polisanmalan/\" target=\"_blank\" rel=\"noopener\">\u003cstrong>Swedish Police\u003c/strong>\u003c/a> — Official reporting channel for potential crimes, including online threats, harassment and defamation. Reports can also be made by calling 114 14.\u003c/li>\u003cli>\u003ca href=\"https://www.rf.se/rf-arbetar-med/idrottsombudsmannen/kontakta-idrottsombudsmannen\" target=\"_blank\" rel=\"noopener\">\u003cstrong>Swedish Sports Confederation (RF): Sports Ombudsman\u003c/strong>\u003c/a> — Independent support and whistleblowing service for reporting harassment, abuse and misconduct within Swedish sport.\u003c/li>\u003c/ul>","note":"HTML allowed — linked resource names open official sources"}},"cz":{"title":{"text":"Czechia"},"html":{"text":"\u003cp>In Czechia, online abuse can be reported through several channels, depending on the nature of the incident. STOPonline accepts reports of illegal or harmful online content, including cyberbullying, cyber grooming, non-consensual sharing of intimate images and cyber threats. Reports are reviewed by specialists and may be referred to the Czech Police or international partners. Incidents involving potential criminal offences, such as threats, stalking or extortion, should be reported directly to the Czech Police. Individuals are encouraged to preserve evidence, including screenshots, messages and links, and can also report harmful content directly to online platforms.\u003c/p>\u003cul>\u003cli>\u003ca href=\"https://www.stoponline.cz/en/\" target=\"_blank\" rel=\"noopener\">\u003cstrong>STOPonline.cz\u003c/strong>\u003c/a> — Online reporting service operated by CZ.NIC in cooperation with CSIRT.CZ. Accepts reports of illegal or harmful online content and refers potentially illegal cases to relevant authorities. The service focuses on content assessment and reporting, not counselling.\u003c/li>\u003cli>\u003ca href=\"https://policie.gov.cz/hlaseni-kyberkriminality\" target=\"_blank\" rel=\"noopener\">\u003cstrong>Czech Police: Cybercrime Reporting\u003c/strong>\u003c/a> — Official information on reporting suspected cybercrime, including online threats, stalking, extortion and other potentially criminal activities.\u003c/li>\u003cli>\u003ca href=\"https://policie.gov.cz/kyberkriminalita/co-delat-vpripade-ze-se-setkate-spodezrelou-aktivitou-vonline-prostoru\" target=\"_blank\" rel=\"noopener\">\u003cstrong>Czech Police: Guidance on Suspicious Online Activity\u003c/strong>\u003c/a> — Practical guidance on responding to suspicious online activity, preserving evidence and seeking police assistance.\u003c/li>\u003c/ul>","note":"HTML allowed — linked resource names open official sources"}},"es":{"title":{"text":"Spain"},"html":{"text":"\u003cp>In Spain, potentially criminal online abuse, including harassment, threats and hate-related offences, can be reported to the Spanish National Police or Civil Guard. Individuals are encouraged to preserve evidence, including screenshots, messages and URLs. Additional services provide confidential guidance and assistance with removing harmful content.\u003c/p>\u003cul>\u003cli>\u003ca href=\"https://www.policia.es/\" target=\"_blank\" rel=\"noopener\">\u003cstrong>Spanish National Police (Policía Nacional)\u003c/strong>\u003c/a> and Civil Guard (Guardia Civil) — Official authorities for reporting potentially criminal online abuse.\u003c/li>\u003cli>\u003ca href=\"https://www.incibe.es/linea-de-ayuda-en-ciberseguridad\" target=\"_blank\" rel=\"noopener\">\u003cstrong>INCIBE: Cybersecurity Helpline (017)\u003c/strong>\u003c/a> — Free, confidential advice on cyberbullying, online harassment and digital privacy. This is an advisory service, not a formal criminal reporting channel.\u003c/li>\u003cli>\u003ca href=\"https://www.aepd.es/canalprioritario\" target=\"_blank\" rel=\"noopener\">\u003cstrong>Spanish Data Protection Agency (AEPD): Priority Channel\u003c/strong>\u003c/a> — Allows individuals to request the urgent removal of unlawfully shared sexual or violent content in particularly serious cases.\u003c/li>\u003c/ul>","note":"HTML allowed — linked resource names open official sources"}}}},"sorting":{"ui":{"eyebrow":{"text":"Ordering","note":"Removed from widget UI; kept for translators / legacy"},"prompt":{"text":"1. Put the steps below in the recommended order."},"hint":{"text":"Drag items or use the arrows to reorder, then submit."},"moveUp":{"text":"Move up"},"moveDown":{"text":"Move down"},"ok":{"text":"\u003cstrong>Correct!\u003c/strong> You’ve identified the recommended sequence for responding to online abuse on social media. Following a clear process helps preserve important information, reduce further exposure, and ensure the situation is reported or escalated appropriately.","note":"HTML allowed"},"bad":{"text":"\u003cstrong>Not quite. Review the options and try again.\u003c/strong>","note":"HTML allowed"}},"items":{"i1":{"text":"\u003cstrong>Assess the situation and your safety.\u003c/strong> Consider the nature of the content and whether you or someone else may be at immediate risk. If there is an immediate threat, seek appropriate assistance without delay.","note":"HTML allowed — first sentence in \u003cstrong> only. Same wording as m3.checklist.items; leading step number omitted so the sort does not reveal the answer."},"i2":{"text":"\u003cstrong>Collect evidence.\u003c/strong> Save copies of abusive posts, messages, profile information, URLs, and screenshots before the content is deleted or becomes inaccessible. Keep these records in a secure location in case they are needed for reporting or further action.","note":"HTML allowed — first sentence in \u003cstrong> only. Same wording as m3.checklist.items; leading step number omitted so the sort does not reveal the answer."},"i3":{"text":"\u003cstrong>Record key details.\u003c/strong> Record when and where the abuse occurred, the accounts involved, and any relevant circumstances. Note whether similar incidents have happened before or whether the behaviour appears to be part of a pattern of abuse.","note":"HTML allowed — first sentence in \u003cstrong> only. Same wording as m3.checklist.items; leading step number omitted so the sort does not reveal the answer."},"i4":{"text":"\u003cstrong>Use platform safety tools.\u003c/strong> Restrict, mute, or block accounts to limit further contact or exposure to harmful content. Adjust your privacy settings where appropriate to help prevent repeated incidents.","note":"HTML allowed — first sentence in \u003cstrong> only. Same wording as m3.checklist.items; leading step number omitted so the sort does not reveal the answer."},"i5":{"text":"\u003cstrong>Report through the platform.\u003c/strong> Review the platform’s policies and use its reporting tools to flag abusive content or accounts. Provide relevant details and supporting evidence where requested to help the platform assess the report.","note":"HTML allowed — first sentence in \u003cstrong> only. Same wording as m3.checklist.items; leading step number omitted so the sort does not reveal the answer."},"i6":{"text":"\u003cstrong>Seek additional support or escalate when needed.\u003c/strong> Contact your organisation’s welfare or safeguarding lead or other appropriate support services. If your safety is threatened, contact local authorities or emergency services as appropriate, regardless of whether you have completed the other steps.","note":"HTML allowed — first sentence in \u003cstrong> only. Same wording as m3.checklist.items; leading step number omitted so the sort does not reveal the answer."}}},"trueFalse":{"bad":{"text":"\u003cstrong>Not quite. Review the statement and try again.\u003c/strong>","note":"HTML allowed"},"questions":{"q1":{"prompt":{"text":"If an athlete receives abusive content, they should delete it immediately and respond directly to the person responsible."},"choices":{"c0":{"text":"True"},"c1":{"text":"False"}},"ok":{"text":"\u003cstrong>Correct!\u003c/strong> It is recommended to collect relevant evidence before deleting content, and avoid engaging directly with the person responsible for the abuse.","note":"HTML allowed"}},"q2":{"prompt":{"text":"Publicly sharing abusive content can help address the situation by drawing more attention to it."},"choices":{"c0":{"text":"True"},"c1":{"text":"False"}},"ok":{"text":"\u003cstrong>Correct!\u003c/strong> Sharing or reposting abusive content can increase its reach and expose the person targeted, and others, to the harmful content again. Use appropriate reporting channels instead.","note":"HTML allowed"}},"q3":{"prompt":{"text":"AI can help identify potentially harmful content, but human judgement remains important when interpreting context."},"choices":{"c0":{"text":"True"},"c1":{"text":"False"}},"ok":{"text":"\u003cstrong>Correct!\u003c/strong> AI can support early detection and flag potentially harmful content for review, but context, language, and changing abuse tactics can make human judgement important.","note":"HTML allowed"}}}},"takeaways":{"heading":{"text":"Key Takeaways"},"items":{"i1":{"text":"\u003cstrong>Platform design influences how content spreads.\u003c/strong> Different digital environments shape who encounters content, how people interact with it, and how long it remains visible.","note":"HTML allowed"},"i2":{"text":"\u003cstrong>Online harm can be amplified.\u003c/strong> Recommendation systems, sharing, live interaction, and community dynamics can increase the reach and intensity of harmful content.","note":"HTML allowed"},"i3":{"text":"\u003cstrong>Abusive tactics can adapt.\u003c/strong> Harmful content may use altered language, visual formats, indirect targeting, or different digital spaces to make detection more difficult.","note":"HTML allowed"},"i4":{"text":"\u003cstrong>People can take steps to reduce exposure.\u003c/strong> Privacy controls, interaction settings, blocking, muting, and thoughtful choices about online spaces can support digital wellbeing.","note":"HTML allowed"},"i5":{"text":"\u003cstrong>Effective reporting follows a clear process.\u003c/strong> Assess the situation, document relevant evidence, report through an appropriate channel, and seek support or escalate when safety is at risk.","note":"HTML allowed"},"i6":{"text":"\u003cstrong>AI has a dual role.\u003c/strong> It can increase the scale and sophistication of harmful content, and it can also support detection, moderation, and other online safety measures.","note":"HTML allowed"},"i7":{"text":"\u003cstrong>Technology alone cannot address online abuse.\u003c/strong> Effective responses combine platform tools, responsible user behaviour, human judgement, organisational support, and appropriate regulation.","note":"HTML allowed"}}},"slide":{"title":{"text":"Module 3 - How Online Harm Spreads","note":"slide_intro title"},"continueToModule4":{"text":"Continue to Module 4","note":"End-of-module navigation_button label"},"aiAndOnlineHarm":{"body":{"text":"\u003cp>\u003cspan style=\"color: #091324\">Artificial intelligence (AI) is changing how online harm is created and shared. While AI can enable new forms of abuse, it can also help detect harmful content, support moderation, and provide tools for online safety.\u003c/span>\u003c/p>","note":"Native text body on How Online Harm Spreads"},"heading":{"text":"\u003cspan style=\"color: #1c3564\">AI and Online Harm\u003c/span>","note":"Native heading on How Online Harm Spreads"}},"exploreReportingSystemsInYourCountry":{"body":{"text":"\u003cp>\u003cspan style=\"color: rgb(9, 19, 36)\">Learn where to report online abuse, seek support and access resources to help address harmful content and behaviour. \u003c/span>\u003cbr>\u003cbr>(The countries listed below are only for reference. More countries shall be added in the future.)\u003c/p>","note":"Native text body on How Online Harm Spreads"},"heading":{"text":"\u003cspan style=\"color: rgb(28, 53, 100)\">Explore Reporting and Support Resources in Your Country:&nbsp;\u003c/span>","note":"Native heading on How Online Harm Spreads"}},"exploreWhichFactorsCanInfluenceHow":{"body":{"text":"","note":"Native text body on How Online Harm Spreads (cleared; heading only above 3.2)"},"heading":{"text":"\u003cspan style=\"color: #1c3564\">Explore: Which factors can influence how harmful content travels online?\u003c/span>","note":"Native heading on How Online Harm Spreads"}},"howPlatformsHelpReduceOnlineAbuse":{"body":{"text":"\u003cp>\u003cspan style=\"color: #091324\">Platforms act as intermediaries between \u003cstrong>people, content, and communities\u003c/strong>. Their design can influence the reach of harmful content, and their built-in tools can also help \u003cstrong>detect, limit, report, and respond to abuse\u003c/strong>.\u003c/span>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003cspan style=\"color: #091324\">These measures can include \u003cstrong>content moderation, reduced distribution of harmful content, prompts before posting, user safety settings, reporting mechanisms, and community standards.\u003c/strong> Regulation is also increasingly shaping platform responsibilities.&nbsp;\u003c/span>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003cspan style=\"color: #091324\">In most countries of the world, these platforms have a fiduciary duty (in the UK, for example, the \u003ca href=\"https://www.gov.uk/government/publications/online-safety-act-explainer/online-safety-act-explainer\" target=\"_blank\" rel=\"noopener\">Online Safety Act\u003c/a> and in Europe, the \u003ca href=\"https://www.consilium.europa.eu/en/policies/digital-services-act/\" target=\"_blank\" rel=\"noopener noreferrer\">Digital Services Act\u003c/a>) to assess risks, protect users from illegal content, provide reporting mechanisms, and implement proportionate safety measures.\u003c/span>\u003c/p>","note":"Native text body on How Online Harm Spreads"},"heading":{"text":"\u003cspan style=\"color: #1c3564\">How platforms help reduce online abuse\u003c/span>","note":"Native heading on How Online Harm Spreads"}},"howPlatformsShapeTheSpreadOf":{"body":{"text":"\u003cp>\u003cspan style=\"color: #091324\">\u003cstrong>Every platform works differently.\u003c/strong> Design features influence how content travels, who encounters it, and how people interact with it.\u003c/span>\u003c/p>","note":"Native text body on How Online Harm Spreads"},"heading":{"text":"\u003cspan style=\"color: #1c3564\">How platforms shape the spread of online abuse\u003c/span>","note":"Native heading on How Online Harm Spreads"}},"humanJudgementRemainsEssentialLanguageContext":{"body":{"text":"\u003cp>\u003cspan style=\"color: #091324\">\u003cstrong>Human judgement remains essential.\u003c/strong> AI systems may struggle to interpret language, context, cultural differences, and evolving abuse tactics accurately. Human oversight is therefore important when assessing harmful content and deciding how to respond. As AI becomes more widely used, regulation is also evolving to address emerging risks and establish safeguards across different jurisdictions.\u003c/span>\u003c/p>","note":"Native text body on How Online Harm Spreads — leftover blurb below 3.5 widget (not a fourth card)"}},"image":{"useThisImageToIllustrateYour":{"text":"\u003cp>Use this image to illustrate your topic. Add a description that connects the visual to the main ideas of your lesson.\u003c/p>","note":"Image body text on How Online Harm Spreads"}},"introSubtitle":{"text":"Estimated time: 15 minutes","note":"slide_intro subtitle (estimated time)"},"lookingAhead":{"body":{"text":"\u003cp>\u003cspan style=\"color: #091324\">As AI-generated content becomes more common, \u003cstrong>transparency is becoming an important part of online safety\u003c/strong>. Emerging approaches include identifying or labelling AI-generated and manipulated content and providing information about its origin. Regulation will continue to evolve alongside technology.\u003c/span>\u003c/p>","note":"Native text body on How Online Harm Spreads"},"heading":{"text":"\u003cspan style=\"color: #1c3564\">Looking ahead\u003c/span>","note":"Native heading on How Online Harm Spreads"}},"noteTheseActionsProvidePracticalGuidance":{"body":{"text":"\u003cp>\u003cspan style=\"color: #091324\">NOTE: These actions provide practical guidance for responding to online abuse and do not need to be followed in a specific order. Depending on the circumstances, some actions may be taken simultaneously. Always prioritise your safety and seek immediate assistance from appropriate authorities if there is an immediate threat.\u003c/span>\u003c/p>","note":"Native text body on How Online Harm Spreads"}},"onlineAbuseCanSpreadQuicklyAnd":{"body":{"text":"\u003cp>\u003cspan style=\"color: #091324\">\u003cstrong>Online abuse can spread quickly and reach audiences far beyond the people involved\u003c/strong> in the original interaction. Digital platforms, user behaviour, and algorithmic systems all influence what content people see and how widely it travels.\u003c/span>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003cspan style=\"color: #091324\">Understanding these mechanisms helps us recognise \u003cstrong>how harmful content can be amplified\u003c/strong>, how online environments can reinforce hostility, and where opportunities exist to interrupt its spread. The same platforms and technologies that can amplify harmful content can also \u003cstrong>support its detection, moderation, and prevention.\u003c/strong>\u003c/span>\u003c/p>","note":"Native text body on How Online Harm Spreads"}},"reportingOnlineAbuseOnSocialMedia":{"body":{"text":"\u003cp>Reporting can help \u003cstrong>platforms and organisations respond to harmful content\u003c/strong> and can\u003cstrong> support further action\u003c/strong> when a situation becomes more serious.\u003c/p>\u003cp>\u003c/p>\u003cp>\u003cstrong>Read through these steps and tick each one as you learn.\u003c/strong>\u003c/p>","note":"Native text body on How Online Harm Spreads"},"heading":{"text":"\u003cspan style=\"color: #1c3564\">Reporting online abuse on social media\u003c/span>","note":"Native heading on How Online Harm Spreads"}},"selectARegionToLearnMore":{"body":{"text":"\u003cp>\u003cspan style=\"color: #091324\">AI regulations differ across locations and may influence how harmful content is addressed, what protections are available, and which responsibilities apply to online platforms.\u003c/span>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003cspan style=\"color: #091324\">Exploring these differences can help you understand how approaches to AI and online harm vary, and why the protections and resources available may depend on where you are.\u003c/span>\u003cbr>\u003cbr>(The countries listed below are only for reference. More countries shall be added in the future.)\u003c/p>","note":"Native text body on How Online Harm Spreads"},"heading":{"text":"\u003cspan style=\"color: #1c3564\">Explore AI Regulations and Online Harm\u003c/span>","note":"Native heading on How Online Harm Spreads"}}},"risksBenefits":{"risksHeading":{"text":"Potential Risks","note":"M3 AI risks/benefits widget"},"benefitsHeading":{"text":"Potential Benefits","note":"M3 AI risks/benefits widget"},"risks":{"r1":{"text":"\u003cstrong>Creating manipulated content:\u003c/strong> Generative AI can produce convincing fake images, audio, and videos, including deepfakes that falsely portray athletes saying or doing things that never happened.","note":"HTML allowed"},"r2":{"text":"\u003cstrong>Amplifying harassment:\u003c/strong> AI-powered tools can generate and distribute abusive messages rapidly and at scale, increasing the reach and impact of online harassment.","note":"HTML allowed"},"r3":{"text":"\u003cstrong>Spreading disinformation and impersonation:\u003c/strong> AI can be used to create misleading content or impersonate individuals, potentially damaging reputations and deceiving audiences.","note":"HTML allowed"}},"benefits":{"b1":{"text":"\u003cstrong>Detecting harmful content:\u003c/strong> AI can help identify potentially abusive messages and detect patterns of harmful behaviour across large volumes of online activity.","note":"HTML allowed"},"b2":{"text":"\u003cstrong>Supporting moderation:\u003c/strong> Automated systems can flag and prioritise potentially harmful content for human review, helping moderators assess incidents and take appropriate action.","note":"HTML allowed"},"b3":{"text":"\u003cstrong>Supporting users:\u003c/strong> AI-enabled tools can help individuals filter unwanted content, manage their online experience, and access reporting and safety features.","note":"HTML allowed"}}}},"m4":{"lawTabs":{"ui":{"navAria":{"text":"Card navigation","note":"aria-label on the six-card progress control"},"prevAria":{"text":"Previous card","note":"aria-label on the back arrow"},"nextAria":{"text":"Next card","note":"aria-label on the forward arrow"},"forExample":{"text":"For Example:","note":"Small label under the title on example cards 2, 4, and 6 only"}},"tabs":{"t1":{"title":{"text":"Criminal law"},"image":{"text":"https://preview.scormstack.io/medias/courses/428b8e0e-9238-4608-a1a3-962afd799ccf/UAOA_pathway_crimina_64f037dc-941a-4af3-90b3-ac5e5fb45a9f.jpg","note":"CDN URL for scenario illustration"},"imageAlt":{"text":"Referee receiving repeated warning alerts on a phone"},"pathway":{"text":"\u003cp>\u003cstrong>What it can cover:\u003c/strong> Conduct that constitutes a criminal offence under the applicable law, which may include certain threats, stalking, hate crimes, or non-consensual sharing of intimate images.\u003c/p>\u003cp>\u003cstrong>Who takes action:\u003c/strong> Law enforcement may investigate, and the relevant prosecuting authority determines whether a case proceeds.\u003c/p>\u003cp>\u003cstrong>Possible outcomes:\u003c/strong> Criminal penalties can include fines or imprisonment, depending on the offence and jurisdiction.\u003c/p>","note":"HTML allowed"},"example":{"text":"\u003cp>Following a decision during a match, a referee begins receiving repeated messages in their social media from the same account. The messages become increasingly threatening and include references to seriously harming the referee and members of their family.\u003c/p>\u003cp>Depending on the applicable law and circumstances, threats of this nature could lead to a report to law enforcement and a criminal investigation.\u003c/p>","note":"HTML allowed"}},"t2":{"title":{"text":"Civil law"},"image":{"text":"https://preview.scormstack.io/medias/courses/428b8e0e-9238-4608-a1a3-962afd799ccf/UAOA_pathway_civil_e89ec7dc-a23c-4bea-af45-ba6d00b25544.jpg","note":"CDN URL for scenario illustration"},"imageAlt":{"text":"Athlete facing circulating online claims and a lost sponsorship"},"pathway":{"text":"\u003cp>\u003cstrong>What it can cover:\u003c/strong> Disputes involving legal rights between individuals or organisations, which may include defamation, harassment, misuse of private information, or other privacy-related claims.\u003c/p>\u003cp>\u003cstrong>Who takes action:\u003c/strong> The person or organisation bringing the claim initiates the legal process.\u003c/p>\u003cp>\u003cstrong>Possible outcomes:\u003c/strong> Depending on the applicable law, remedies can include compensation or court orders requiring particular conduct to stop.\u003c/p>","note":"HTML allowed"},"example":{"text":"\u003cp>False allegations about an athlete begin circulating online and are repeatedly shared. The claims damage the athlete’s professional reputation, and a sponsor ends its relationship with them after seeing such allegations.\u003c/p>\u003cp>Depending on the applicable law and circumstances, the athlete may be able to bring a civil claim seeking a remedy for the harm caused, including orders for removal of existing false content, injunctions to prevent further publication, monetary claims against the perpetuator if identifiable.\u003c/p>","note":"HTML allowed"}},"t3":{"title":{"text":"Administrative law and regulations"},"image":{"text":"https://preview.scormstack.io/medias/courses/428b8e0e-9238-4608-a1a3-962afd799ccf/UAOA_pathway_admin_55f163bb-0d7b-4f46-9cb3-20fd51f67cd0.jpg","note":"CDN URL for scenario illustration"},"imageAlt":{"text":"Athlete concerned about personal contact details exposed online"},"pathway":{"text":"\u003cp>\u003cstrong>What it can cover:\u003c/strong> Legal obligations enforced by regulators, including rules applying to online services or the handling of personal data.\u003c/p>\u003cp>\u003cstrong>Who takes action:\u003c/strong> Relevant regulatory authorities oversee and enforce these requirements. Individuals and organisations may also be able to submit complaints.\u003c/p>\u003cp>\u003cstrong>Possible outcomes:\u003c/strong> Regulators may investigate, require changes, or impose penalties where the applicable law gives them those powers.\u003c/p>","note":"HTML allowed"},"example":{"text":"\u003cp>An athlete discovers that their personal contact information has been published online without their permission. The information continues to circulate, creating concerns about their privacy and safety.\u003c/p>\u003cp>Depending on the applicable data protection rules, the athlete or their organisation may be able to raise the matter with the relevant regulatory authority.\u003c/p>","note":"HTML allowed"}}}},"limits":{"items":{"i1":{"title":{"text":"Jurisdiction"},"html":{"text":"\u003cp>Online abuse can cross national borders immediately. The person targeted, the person responsible, and the platform may all be located in different jurisdictions, with different laws and enforcement processes.\u003c/p>","note":"HTML allowed"}},"i2":{"title":{"text":"Identifying who is responsible"},"html":{"text":"\u003cp>Accounts may use pseudonyms, false identities, or limited identifying information, making it difficult to determine who is responsible for particular behaviour. Identifying an account holder can require information held by platforms and, in some cases, formal legal processes.\u003c/p>","note":"HTML allowed"}},"i3":{"title":{"text":"Enforcement"},"html":{"text":"\u003cp>The volume and speed of online activity can make investigation and enforcement difficult. Available resources, specialist expertise, evidentiary requirements, and enforcement priorities can all affect what happens after an incident is reported.\u003c/p>","note":"HTML allowed"}},"i4":{"title":{"text":"Legal thresholds"},"html":{"text":"\u003cp>Not all harmful or abusive behaviour constitutes a legal offence or provides grounds for legal action. The applicable legal definitions, evidence, context, and jurisdiction all matter.\u003c/p>\u003cp>Legal action is therefore only one part of the response to online abuse. Online platform policies and sporting organisations’ own standards and procedures can also help address behaviours that may not meet the legal requirements for action.\u003c/p>","note":"HTML allowed"}}}},"regions":{"ui":{"prompt":{"text":"Select a region"},"placeholder":{"text":"Select a region to see an example of how existing laws can apply to online behaviour."},"countriesAria":{"text":"Regions"}},"items":{"i1":{"title":{"text":"United Kingdom"},"html":{"text":"\u003cp>In the UK, several laws address harmful online conduct. The \u003cstrong>Online Safety Act 2023\u003c/strong> introduces offences relating to threatening communications, cyberflashing, and sharing or threatening to share intimate images without consent. The \u003cstrong>Protection from Harassment Act 1997\u003c/strong> also covers harassment and stalking, including conduct involving digital communications. The Online Safety Act additionally places duties on regulated platforms to address illegal content and protect children from harmful material. The applicable protections depend on the conduct and jurisdiction.\u003c/p>\u003cp>\u003cem>Source: \u003ca href=\"https://www.legislation.gov.uk/\" target=\"_blank\" rel=\"noopener\">Legislation.gov.uk\u003c/a>\u003c/em>\u003c/p>","note":"HTML allowed"}},"i2":{"title":{"text":"United States"},"html":{"text":"\u003cp>In the United States, online abuse is addressed through a combination of federal and state laws. Federal legislation, including \u003cstrong>18 U.S.C. 2261A\u003c/strong>, addresses certain forms of cyberstalking involving electronic communications. Other federal provisions cover threats and specific forms of online harassment, while state laws may provide additional protections against cyberbullying, harassment, stalking, and non-consensual sharing of intimate images. Legal definitions, enforcement, and available remedies vary by jurisdiction and the circumstances of each case.\u003c/p>\u003cp>\u003cem>Source: \u003ca href=\"https://uscode.house.gov/\" target=\"_blank\" rel=\"noopener\">U.S. Code\u003c/a>\u003c/em>\u003c/p>","note":"HTML allowed"}},"i3":{"title":{"text":"Czechia"},"html":{"text":"\u003cp>Czech law does not rely on a single offence of “online abuse”. Existing legislation can apply to specific harmful behaviours carried out online. For example, \u003cstrong>Section 354 of the Czech Criminal Code (Act No. 40/2009 Coll.)\u003c/strong> addresses stalking, including conduct carried out through electronic communications. \u003ca href=\"https://policie.gov.cz/stalking---nebezpecne-pronasledovani--354-trestniho-zakoniku\" target=\"_blank\" rel=\"noopener\">Czech Police guidance on stalking\u003c/a> explains this provision and identifies repeated social media messages, threats, misuse of personal data, and reputational attacks among behaviours that may occur in stalking cases.\u003c/p>\u003cp>The \u003cstrong>Czech Civil Code (Act No. 89/2012 Coll.)\u003c/strong> also protects personality rights, including a person’s dignity, honour and privacy. A person affected by unlawful interference can seek to have the interference stopped and its consequences remedied.\u003c/p>\u003cp>\u003cem>Source: \u003ca href=\"https://e-sbirka.gov.cz\" target=\"_blank\" rel=\"noopener\">e-Sbírka\u003c/a>\u003c/em>\u003c/p>","note":"HTML allowed"}},"i4":{"title":{"text":"Spain"},"html":{"text":"\u003cp>\u003ca href=\"https://www.boe.es/buscar/act.php?id=BOE-A-1995-25444\" target=\"_blank\" rel=\"noopener\">\u003cstrong>Spain’s Criminal Code (Organic Law 10/1995)\u003c/strong>\u003c/a> addresses several forms of online abuse. \u003cstrong>Article 172 ter\u003c/strong> covers stalking, including repeated unwanted contact, misuse of personal data and the creation of fake social-media profiles using someone’s image without consent when this causes harassment or humiliation.\u003c/p>\u003cp>\u003cstrong>Article 510\u003c/strong> addresses online hate speech, with increased penalties for certain offences when digital platforms make the content accessible to a large audience.\u003c/p>\u003cp>Victims can report suspected offences to \u003ca href=\"https://www.policia.es/\" target=\"_blank\" rel=\"noopener\">the Spanish National Police\u003c/a> or Civil Guard (Guardia Civil). Additional support is available through \u003ca href=\"https://www.incibe.es/linea-de-ayuda-en-ciberseguridad\" target=\"_blank\" rel=\"noopener\">INCIBE’s free, confidential 017 helpline\u003c/a>, while the \u003ca href=\"https://www.aepd.es/canalprioritario\" target=\"_blank\" rel=\"noopener\">Spanish Data Protection Agency (AEPD)\u003c/a> provides a Priority Channel for requesting the urgent removal of unlawfully shared sexual or violent content.\u003c/p>\u003cp>\u003cem>Source: \u003ca href=\"https://www.mpr.gob.es/Paginas/index.aspx\" target=\"_blank\" rel=\"noopener\">Gobierno de España\u003c/a>\u003c/em>\u003c/p>","note":"HTML allowed"}},"i5":{"title"
