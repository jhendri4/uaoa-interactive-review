<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; color-scheme: light; }
  body {
    font-family: 'Cerebri Sans Pro', system-ui, -apple-system, 'Segoe UI', sans-serif;
    color: #091324; padding: 4px 2px 8px;
  }
  .card {
    width: 100%; max-width: 920px; margin: 0 auto;
    background: #fff; border: 1px solid #E5E7EB; border-radius: 16px;
    padding: 20px 20px 18px; box-shadow: 0 1px 2px rgba(28,53,100,.04);
  }
  .prompt {
    margin: 0 0 14px; font-size: 16px; line-height: 24px; font-weight: 700; color: #1C3564;
  }
  .layout {
    display: grid;
    grid-template-columns: minmax(160px, 220px) minmax(0, 1fr);
    gap: 14px;
    align-items: stretch;
  }
  .countries {
    display: flex; flex-direction: column; gap: 8px;
  }
  .country {
    font: inherit; font-weight: 700; font-size: 14px; letter-spacing: .01em;
    text-align: left; color: #1C3564; background: #fff;
    border: 1.5px solid #D1D5DB; border-radius: 12px;
    padding: 12px 14px; cursor: pointer;
    transition: border-color .15s, background .15s, color .15s, box-shadow .15s;
  }
  .country:hover { border-color: #21b7cb; }
  .country:focus-visible {
    outline: none; box-shadow: 0 0 0 2px #fff, 0 0 0 4px #7C5297;
  }
  .country.is-active {
    border-color: #1C3564; background: #1C3564; color: #fff;
  }
  .country.is-seen:not(.is-active) {
    border-color: #C9B6D9; background: #F3ECF7; color: #1C3564;
  }

  /* One grid cell = tallest pane (placeholder + every country). No collapse on switch. */
  .panel {
    border: 1.5px solid #E5E7EB;
    border-radius: 14px;
    background: #F7F8FA;
    min-height: 220px;
    padding: 16px;
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: minmax(0, auto);
    align-items: stretch;
  }
  .panel.is-filled {
    background: #fff;
    border-color: #DFE3EA;
  }
  .panel > .pane {
    grid-area: 1 / 1;
    min-width: 0;
    /* opacity (not visibility): a child with visibility:visible would
       otherwise punch through a visibility:hidden parent and stack text. */
    opacity: 1;
    z-index: 1;
    pointer-events: auto;
  }
  .panel > .pane.is-idle {
    opacity: 0;
    z-index: 0;
    pointer-events: none;
  }
  .placeholder {
    margin: 0; align-self: center; justify-self: center;
    text-align: center;
    font-size: 14px; line-height: 22px; font-weight: 600; color: #5A6478;
    max-width: 36ch;
  }
  .detail {
    display: flex; flex-direction: column; width: 100%;
  }
  .detail-title {
    margin: 0 0 10px; font-size: 17px; line-height: 24px; font-weight: 800; color: #1C3564;
  }
  .detail-body {
    font-size: 15px; line-height: 24px; color: #091324;
  }
  .detail-body p { margin: 0 0 12px; }
  .detail-body p:last-child { margin-bottom: 0; }
  .detail-body strong { color: #1C3564; font-weight: 800; }
  .detail-body a { color: #03707D; font-weight: 700; }
  .detail-body em { color: #5A6A85; font-style: italic; }

  @media (max-width: 640px) {
    .layout { grid-template-columns: 1fr; }
    .countries {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
  }
  @media (max-width: 400px) {
    .countries { grid-template-columns: 1fr; }
  }
</style></head><body>
<div class="card" id="root">
  <p class="prompt" data-i18n="m4.regions.ui.prompt">Select a country</p>
  <div class="layout">
    <div class="countries" id="countries" role="tablist" data-i18n-aria="m4.regions.ui.countriesAria" aria-label="Regions"></div>
    <div class="panel" id="panel" role="tabpanel">
      <p class="placeholder pane" id="placeholder" data-i18n="m4.regions.ui.placeholder">Select a country to see an example of how existing laws can apply to online behaviour.</p>
    </div>
  </div>
</div>
<!--UAOA_I18N-->
<script>
(function () {
  // Informational — not required; Continue after this is not gated on visit-all
  var t = window.t || function (k, fb) { return fb != null ? fb : k; };
  if (typeof window.applyDataI18n === 'function') window.applyDataI18n(document);

  function markComplete() {
    try {
      if (window.SCORMSTACK && typeof SCORMSTACK.markBlockCompleted === 'function') {
        SCORMSTACK.markBlockCompleted();
      }
    } catch (e) {}
  }

  var REGION_META = [
    {
      id: 'i1',
      title: 'United Kingdom',
      html: '<p>In the UK, several laws address harmful online conduct. The <strong>Online Safety Act 2023</strong> establishes duties for regulated platforms to address illegal content and protect children from harmful material. It also introduces offences relating to threatening communications, cyberflashing, and sharing or threatening to share intimate images without consent.</p><p>The <strong>Protection from Harassment Act 1997</strong> addresses harassment and stalking, including behaviour involving digital communications.</p><p>The applicable legal protections depend on the nature of the conduct and the relevant jurisdiction.</p><p><em>Source: <a href="https://www.legislation.gov.uk/" target="_blank" rel="noopener">Legislation.gov.uk</a></em></p>'
    },
    {
      id: 'i2',
      title: 'United States',
      html: '<p>In the United States, online abuse is addressed through a combination of federal and state laws. Federal legislation, including <strong>18 U.S.C. 2261A</strong>, addresses certain forms of cyberstalking involving electronic communications. Other federal provisions cover threats and specific forms of online harassment, while state laws may provide additional protections against cyberbullying, harassment, stalking, and non-consensual sharing of intimate images. Legal definitions, enforcement, and available remedies vary by jurisdiction and the circumstances of each case.</p><p><em>Source: <a href="https://uscode.house.gov/" target="_blank" rel="noopener">U.S. Code</a></em></p>'
    },
    {
      id: 'i3',
      title: 'Czechia',
      html: '<p>Czech law does not rely on a single offence of “online abuse”. Existing legislation can apply to specific harmful behaviours carried out online. For example, <strong>Section 354 of the Czech Criminal Code (Act No. 40/2009 Coll.)</strong> addresses stalking, including conduct carried out through electronic communications. <a href="https://policie.gov.cz/stalking---nebezpecne-pronasledovani--354-trestniho-zakoniku" target="_blank" rel="noopener">Czech Police guidance on stalking</a> explains this provision and identifies repeated social media messages, threats, misuse of personal data, and reputational attacks among behaviours that may occur in stalking cases.</p><p>The <strong>Czech Civil Code (Act No. 89/2012 Coll.)</strong> also protects personality rights, including a person’s dignity, honour and privacy. A person affected by unlawful interference can seek to have the interference stopped and its consequences remedied.</p><p><em>Source: <a href="https://e-sbirka.gov.cz" target="_blank" rel="noopener">e-Sbírka</a></em></p>'
    },
    {
      id: 'i4',
      title: 'Spain',
      html: '<p><a href="https://www.boe.es/buscar/act.php?id=BOE-A-1995-25444" target="_blank" rel="noopener"><strong>Spain’s Criminal Code (Organic Law 10/1995)</strong></a> addresses several forms of online abuse. <strong>Article 172 ter</strong> covers stalking, including repeated unwanted contact, misuse of personal data and the creation of fake social-media profiles using someone’s image without consent when this causes harassment or humiliation.</p><p><strong>Article 510</strong> addresses online hate speech, with increased penalties for certain offences when digital platforms make the content accessible to a large audience.</p><p>Victims can report suspected offences to <a href="https://www.policia.es/" target="_blank" rel="noopener">the Spanish National Police</a> or Civil Guard (Guardia Civil). Additional support is available through <a href="https://www.incibe.es/linea-de-ayuda-en-ciberseguridad" target="_blank" rel="noopener">INCIBE’s free, confidential 017 helpline</a>, while the <a href="https://www.aepd.es/canalprioritario" target="_blank" rel="noopener">Spanish Data Protection Agency (AEPD)</a> provides a Priority Channel for requesting the urgent removal of unlawfully shared sexual or violent content.</p><p><em>Source: <a href="https://www.mpr.gob.es/Paginas/index.aspx" target="_blank" rel="noopener">Gobierno de España</a></em></p>'
    },
    {
      id: 'i5',
      title: 'Sweden',
      html: '<p>In Sweden, online hate or abuse is not a separate legal category. The Swedish Police explains that the same criminal laws generally apply to conduct online as they do offline, with relevant offences potentially including unlawful threats, harassment, defamation, insult, unlawful invasion of privacy, sexual harassment, unlawful identity misuse (e.g. fake profiles in someone else\'s name), and agitation against a population group. If an offence is motivated by, for example, the victim\'s ethnicity, religion or sexual orientation, this is an aggravating circumstance in sentencing.</p><p>Swedish law also recognises unlawful persecution, which can arise from repeated criminal acts against the same person. Police guidance specifically advises people experiencing stalking to preserve emails, text messages, call records and other digital communications as potential evidence.</p><p><em>Sources: <a href="https://polisen.se" target="_blank" rel="noopener">polisen.se</a>; <a href="https://www.riksdagen.se/sv/dokument-och-lagar/" target="_blank" rel="noopener">Swedish Parliament</a></em></p>'
    },
    {
      id: 'i6',
      title: 'Slovenia',
      html: '<p>Slovenian law addresses online abuse through existing legislation covering specific harmful behaviours. A particularly relevant example is <strong>Article 134a of the Slovenian Criminal Code (KZ-1)</strong>, which defines stalking to include repeated attempts to establish unwanted contact through electronic communications, where the conduct causes fear or a sense of threat. Slovenian authorities have also recognised the online dimension of stalking in guidance concerning the application of this provision.</p><p>Slovenian Police guidance recognises online violence as including behaviours such as threats, harassment, spreading false or insulting content, misuse of photographs, impersonation and the creation of harmful fake profiles. Whether particular conduct constitutes a criminal offence depends on the circumstances of the individual case.</p><p><em>Source: <a href="https://www.gov.si/" target="_blank" rel="noopener">GOV.SI</a></em></p>'
    }
  ];
  function sortByTitle(list) {
    var loc = window.UAOA_I18N_LOCALE || document.documentElement.lang || 'en';
    var cmp;
    try { cmp = new Intl.Collator(loc, { sensitivity: 'base' }).compare; }
    catch (e) { cmp = function (a, b) { return a < b ? -1 : a > b ? 1 : 0; }; }
    return list.slice().sort(function (a, b) { return cmp(a.title, b.title); });
  }

  var REGIONS = sortByTitle(REGION_META.map(function (m) {
    var base = 'm4.regions.items.' + m.id;
    return {
      id: m.id,
      title: t(base + '.title', m.title),
      html: t(base + '.html', m.html)
    };
  }));

  var countriesEl = document.getElementById('countries');
  var panel = document.getElementById('panel');
  var placeholder = document.getElementById('placeholder');
  var buttons = [];
  var detailPanes = [];
  var activeIndex = -1;
  var seen = {};
  var lockedFrameH = 0;

  function syncHeight() {
    try {
      // No documentElement.scrollHeight: it never reports less than the iframe's
      // current height, so lockLayout() on resize re-locked the stale tall value.
      var h = Math.ceil(Math.max(
        document.body ? document.body.scrollHeight : 0,
        panel.getBoundingClientRect().bottom + 12
      ));
      lockedFrameH = Math.max(lockedFrameH, h);
      try {
        document.documentElement.style.minHeight = lockedFrameH + 'px';
        if (document.body) document.body.style.minHeight = lockedFrameH + 'px';
      } catch (e0) {}
      var f = window.frameElement;
      if (!f) return;
      f.style.setProperty('height', lockedFrameH + 'px', 'important');
      f.style.setProperty('min-height', lockedFrameH + 'px', 'important');
      f.style.setProperty('border', '0', 'important');
    } catch (e) {}
  }

  function maybeComplete() {
    if (Object.keys(seen).length >= REGIONS.length) markComplete();
  }

  function setActivePane(i) {
    var showPlaceholder = i < 0;
    placeholder.classList.toggle('is-idle', !showPlaceholder);
    placeholder.setAttribute('aria-hidden', showPlaceholder ? 'false' : 'true');
    detailPanes.forEach(function (pane, idx) {
      var on = idx === i;
      pane.classList.toggle('is-idle', !on);
      pane.setAttribute('aria-hidden', on ? 'false' : 'true');
    });
    panel.classList.toggle('is-filled', !showPlaceholder);
  }

  function showRegion(i) {
    if (activeIndex === i) return;
    var r = REGIONS[i];
    activeIndex = i;
    seen[r.id] = true;
    setActivePane(i);
    buttons.forEach(function (b, idx) {
      b.classList.toggle('is-active', idx === i);
      b.setAttribute('aria-selected', idx === i ? 'true' : 'false');
      if (seen[REGIONS[idx].id]) b.classList.add('is-seen');
    });
    maybeComplete();
    syncHeight();
  }

  /** Lock iframe/body to natural stacked height (tallest country always in flow). */
  function lockLayout() {
    lockedFrameH = 0;
    try {
      document.documentElement.style.minHeight = '';
      if (document.body) document.body.style.minHeight = '';
    } catch (e1) {}
    // Force layout with every pane contributing via CSS grid stack
    void panel.offsetHeight;
    syncHeight();
  }

  REGIONS.forEach(function (r, i) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'country';
    btn.id = 'region-tab-' + r.id;
    btn.setAttribute('role', 'tab');
    btn.setAttribute('aria-selected', 'false');
    btn.setAttribute('aria-controls', 'panel');
    btn.textContent = r.title;
    btn.addEventListener('click', function () { showRegion(i); });
    countriesEl.appendChild(btn);
    buttons.push(btn);

    var detail = document.createElement('div');
    detail.className = 'detail pane is-idle';
    detail.id = 'region-pane-' + r.id;
    detail.setAttribute('aria-hidden', 'true');
    detail.innerHTML =
      '<h2 class="detail-title"></h2><div class="detail-body"></div>';
    detail.querySelector('.detail-title').textContent = r.title;
    detail.querySelector('.detail-body').innerHTML = r.html;
    panel.appendChild(detail);
    detailPanes.push(detail);
  });

  // Informational / not required — complete on view; exploring countries is optional
  markComplete();
  setActivePane(-1);
  lockLayout();
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () { lockLayout(); });
  }
  var rt = null;
  var lastW = window.innerWidth;
  window.addEventListener('resize', function () {
    // Height-only resizes come from syncHeight sizing this frame — ignore them.
    if (window.innerWidth === lastW) return;
    lastW = window.innerWidth;
    clearTimeout(rt);
    rt = setTimeout(lockLayout, 120);
  });
  window.addEventListener('load', lockLayout);
  if (window.ResizeObserver) {
    new ResizeObserver(function () {
      // Grow-only: never let parent shrink when a shorter country is visible
      syncHeight();
    }).observe(document.body);
  }
})();
</script></body></html>
