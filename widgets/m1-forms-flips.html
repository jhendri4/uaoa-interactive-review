}},"s4":{"title":{"text":"Policy and law"},"body":{"text":"\u003cp>Policies and laws can establish boundaries, responsibilities, protections, and routes to accountability. They can influence behaviour by clarifying consequences and providing mechanisms for reporting, intervention, and redress.\u003c/p>","note":"HTML allowed"}},"s5":{"title":{"text":"Technology and platform design"},"body":{"text":"\u003cp>The design of digital platforms can influence how easily harmful content is created, discovered, amplified, reported, or removed. Moderation, detection, reporting tools, and other safety features can help reduce opportunities for abuse to spread and persist.\u003c/p>","note":"HTML allowed"}},"s6":{"title":{"text":"Community norms"},"body":{"text":"\u003cp>Social norms influence what people perceive as normal, acceptable, or worth challenging. Athletes, fans, media, organisations, and public figures all contribute to the culture surrounding sport. When communities consistently challenge abusive behaviour and reinforce respect, they can help shift the norms that allow online abuse to persist.\u003c/p>","note":"HTML allowed"}},"s7":{"title":{"text":"Working together"},"body":{"text":"\u003cp>\u003cstrong>These factors work together across sport and in our society.\u003c/strong> Education can shape how people understand online behaviours, while shared standards and laws can clarify expectations, research can identify emerging risks, and technology can influence how harmful content spreads.\u003c/p>\u003cp>Sporting communities are only a part of our society: they are influenced by broader cultural norms, and athletes, fans, media, organisations, and other voices in sport can also help shape the world we live in together.\u003c/p>","note":"HTML allowed"}}}},"match":{"ui":{"eyebrow":{"text":"Check your understanding"},"prompt":{"text":"Match each scenario to a level"},"hint":{"text":"Select the level best placed to take action."},"choicesAria":{"text":"Choose a level of action"},"done":{"text":"That’s right! You’ve matched each scenario to the appropriate level of action."}},"labels":{"l0":{"text":"Individual"},"l1":{"text":"Organisation"},"l2":{"text":"Society"}},"scenarios":{"s1":{"text":{"text":"After seeing an athlete targeted online, someone checks in privately and reports the harmful content without sharing it further."},"ok":{"text":"\u003cstrong>Correct!\u003c/strong> Checking in privately and reporting without amplifying are individual actions.","note":"HTML allowed"},"bad":{"text":"\u003cstrong>Not quite.\u003c/strong> Think about who is taking this action in the moment. \u003cstrong>Try again.\u003c/strong>","note":"HTML allowed"}},"s2":{"text":{"text":"Following several online abuse incidents, a sports federation introduces a reporting pathway, staff training, and safeguarding procedures."},"ok":{"text":"\u003cstrong>Correct!\u003c/strong> Reporting pathways, training, and safeguarding procedures are organisational frameworks.","note":"HTML allowed"},"bad":{"text":"\u003cstrong>Not quite.\u003c/strong> Consider which level sets frameworks and procedures for a sporting body. \u003cstrong>Try again.\u003c/strong>","note":"HTML allowed"}},"s3":{"text":{"text":"Research shows how a new form of online abuse is spreading, helping inform education, technology, and future public policy responses."},"ok":{"text":"\u003cstrong>Correct!\u003c/strong> Research and evidence that informs education, technology, and policy operate at the level of society.","note":"HTML allowed"},"bad":{"text":"\u003cstrong>Not quite.\u003c/strong> Consider which level shapes wider education, technology, and policy. \u003cstrong>Try again.\u003c/strong>","note":"HTML allowed"}}}},"takeaways":{"heading":{"text":"Key Takeaways"},"items":{"i1":{"text":"\u003cstrong>Tackling online abuse is a shared responsibility.\u003c/strong> Individuals, sport organisations, platforms, media, advocacy groups, policymakers, and other stakeholders each have a role in prevention and response.","note":"HTML allowed"},"i2":{"text":"\u003cstrong>Individual actions can reduce harm.\u003c/strong> Managing exposure, using safety tools, preserving evidence, supporting others, and knowing when to seek additional help can protect safety and wellbeing.","note":"HTML allowed"},"i3":{"text":"\u003cstrong>Organisations provide structure and support.\u003c/strong> Clear frameworks, safeguarding, reporting pathways, and coordinated action help organisations prepare for and respond to online abuse.","note":"HTML allowed"},"i4":{"text":"\u003cstrong>Cooperation strengthens the response.\u003c/strong> Clubs, federations, platforms, media organisations, advocacy groups, and other stakeholders can contribute different forms of support, expertise, and action.","note":"HTML allowed"},"i5":{"text":"\u003cstrong>Social conditions influence online behaviour.\u003c/strong> Education, standards, research, policy, technology, and cultural norms can affect how online abuse is understood, enabled, prevented, and challenged.","note":"HTML allowed"},"i6":{"text":"\u003cstrong>Sport is part of a wider social context.\u003c/strong> Sporting communities are influenced by wider cultural norms and can also contribute to shaping expectations and behaviour across society.","note":"HTML allowed"}}},"slide":{"title":{"text":"Module 5: Take Action: Building Safer Digital Sport Communities","note":"Module / summary slide title"},"continueLayer2":{"text":"Continue to Layer 2","note":"Nav button label"},"continueLayer3":{"text":"Continue to Layer 3","note":"Nav button label"},"goToFinalQuiz":{"text":"Go to final quiz","note":"Nav button label"}}},"summary":{"quiz":{"questions":{"q1":{"prompt":{"text":"In the \u003cstrong>2025 UAOA Barometer\u003c/strong>, about how many sporting federations were concerned that online abuse could drive talented athletes out of sport?","note":"HTML allowed — do not bold option list items"},"choices":{"c0":{"text":"Less than 50%"},"c1":{"text":"About 72%"},"c2":{"text":"About 90%"}},"reveal":{"text":"\u003cstrong>About 90%\u003c/strong>\u003cbr>The UAOA Barometer shows that about nine in ten sporting federations surveyed expressed concern that online abuse could drive talented athletes out of sport. Online abuse can ultimately influence whether people continue participating in sporting communities.","note":"HTML allowed"},"next":{"text":"That seems a lot"}},"q2":{"prompt":{"text":"According to research, what has greater exposure to online harassment been associated with among sportspeople?"},"choices":{"c0":{"text":"Psychological distress"},"c1":{"text":"Fewer friends"},"c2":{"text":"More training hours"}},"reveal":{"text":"Greater exposure to online harassment has been associated with \u003cstrong>higher levels of psychological distress\u003c/strong>, highlighting how hostile online content can affect psychological wellbeing.","note":"HTML allowed"},"next":{"text":"That is concerning"}},"q3":{"prompt":{"text":"When a harmful comment about an athlete appears online, which features can influence how far it travels?"},"choices":{"c0":{"text":"Platform design and recommendation systems"},"c1":{"text":"User interactions and reporting mechanisms"},"c2":{"text":"Both"}},"reveal":{"text":"\u003cstrong>Both.\u003c/strong> Platform design, recommendation systems, user interactions, and reporting mechanisms can influence how harmful content travels and reaches new audiences.","note":"HTML allowed"},"next":{"text":"That makes sense"}},"q4":{"prompt":{"text":"\u003cspan class=\"scenario\">If a player receives humiliating comments after a loss. Similar messages flood their account for days, also attacking their race.\u003c/span>What is happening?","note":"HTML allowed"},"choices":{"c0":{"text":"Offensive speech only"},"c1":{"text":"Digital hostility and hate speech only"},"c2":{"text":"Several forms of online abuse are overlapping"}},"reveal":{"text":"\u003cstrong>Several forms can overlap.\u003c/strong>\u003cbr>The humiliating language is offensive speech, the repeated public aggression creates digital hostility, and racist targeting may constitute hate speech.","note":"HTML allowed"},"next":{"text":"Let’s take action!"}},"q5":{"prompt":{"text":"What is the best recommendation for staying safe when someone encounters online abuse?"},"choices":{"c0":{"text":"Respond directly to stop the behaviour"},"c1":{"text":"Assess the situation, avoid unsafe engagement, and report appropriately"},"c2":{"text":"Delete the content and leave the platform"}},"reveal":{"text":"\u003cstrong>Act safely and use the right reporting channels.\u003c/strong>\u003cbr>Assess whether the behaviour is escalating or anyone may be at risk, avoid unsafe engagement, preserve relevant evidence, and report through the appropriate platform or organisational channels. Seek additional support when needed.","note":"HTML allowed"},"next":{"text":"Keep going"}},"q6":{"prompt":{"text":"Can existing laws help protect people from online abuse, including abuse involving AI-generated content?"},"choices":{"c0":{"text":"Yes, but protections vary between countries."},"c1":{"text":"Only when the abuse involves physical threats."},"c2":{"text":"Only when the content is shared publicly."}},"reveal":{"text":"\u003cstrong>Laws can help protect people from online abuse.\u003c/strong>\u003cbr>However, legal protections and responsibilities vary between countries. Some jurisdictions have introduced specific measures addressing AI-generated intimate images and other forms of digital abuse.","note":"HTML allowed"},"next":{"text":"Laws are only part of the response. What else can we do?"}},"q7":{"prompt":{"text":"\u003cspan class=\"scenario\">A teammate has been receiving abusive messages and seems increasingly distressed.\u003c/span>What is the strongest response from a supportive system?","note":"HTML allowed"},"choices":{"c0":{"text":"Share the messages publicly so others can defend them"},"c1":{"text":"Check in privately and help them access appropriate support"},"c2":{"text":"Limit interactions with the teammate"}},"reveal":{"text":"\u003cstrong>Support starts with you!\u003c/strong>\u003cbr>Check in privately, avoid amplifying the abuse, use appropriate reporting channels, and speak up when it is safe to do so.","note":"HTML allowed"},"next":{"text":"Everyone’s safety matters!"}},"q8":{"prompt":{"text":"Positive action starts with each of us. What can we do?"},"choices":{"c0":{"text":"Protect yourself, Support others, Act safely"},"c1":{"text":"Monitor content, Confront abuser, Delete evidence"},"c2":{"text":"Report everything, Respond publicly, Stay online"}},"reveal":{"text":"\u003cstrong>Protect yourself. Support others. Act safely.\u003c/strong>\u003cbr>We can manage our social media exposure, use safety tools, preserve evidence, support others who are targeted, and recognise when a situation requires additional help.","note":"HTML allowed"},"next":{"text":"Of course we can!"}},"q9":{"prompt":{"text":"\u003cstrong>Organisations have a role too.\u003c/strong> Several people in a sporting organisation have reported online abuse.\u003cbr>What would create the strongest organisational response?","note":"HTML allowed"},"choices":{"c0":{"text":"Focus primarily on responding to individual incidents"},"c1":{"text":"Build frameworks, strengthen safeguarding and coordinate action"},"c2":{"text":"Expect the platforms to manage the problem"}},"reveal":{"text":"Effective organisational responses connect preparation, protection, response and cooperation.","note":"HTML allowed"},"next":{"text":"Tell me more!"}},"q10":{"prompt":{"text":"\u003cspan class=\"scenario\">Online abuse is also shaped by conditions beyond any one person or organisation.\u003c/span>Which can influence whether harmful behaviour is normalised, challenged or prevented?","note":"HTML allowed"},"choices":{"c0":{"text":"Education and community norms"},"c1":{"text":"Research and policies"},"c2":{"text":"Technology and AI solutions"},"c3":{"text":"All of these"}},"reveal":{"text":"\u003cstrong>All of these.\u003c/strong> Education, shared standards, research and evidence, policy and law, technological solutions and platform design, and community norms can all shape online behaviour.\u003cbr>\u003cbr>Sport is influenced by these wider social conditions, and sporting communities can also help shape the world we live in together.","note":"HTML allowed"},"next":{"text":"Stronger together!"}},"q11":{"prompt":{"text":"Would you like to take further action with UAOA?"},"choices":{"c0":{"text":"I want to take action"},"c1":{"text":"I want to keep learning"},"c2":{"text":"I want to strengthen my organisation"},"c3":{"text":"Not right now"}},"reveal":{"text":"\u003cstrong>There are different ways to take action.\u003c/strong> UAOA brings people and organisations across sport together to strengthen how they prepare for, prevent and respond to online abuse.","note":"HTML allowed — ungraded item"},"next":{"text":"See your readiness!"},"links":{"act":{"text":"Explore UAOA initiatives and Stronger Together"},"learn":{"text":"UAOA research, evidence and educational resources"},"org":{"text":"UAOA organisational resources"}}}},"ui":{"chooseOne":{"text":"Choose one answer","note":"Hint under the question on the open final-quiz layout"},"ok":{"text":"OK","note":"Confirm selection before reveal"},"pressEnter":{"text":"press Enter ↵","note":"Keyboard hint beside OK"},"questionOf":{"text":"Question {n} of {total}","note":"Footer progress; {n} and {total} are replaced in JS"},"choicesAria":{"text":"Answer choices","note":"aria-label on options group"},"prevAria":{"text":"Previous question","note":"aria-label on prev chevron"},"nextAria":{"text":"Next question","note":"aria-label on next chevron when advancing"}},"score":{"youScored":{"text":"You scored","note":"Flip-card modal front label above large %"},"clickToComplete":{"text":"Click to complete","note":"Flip-card modal front CTA"},"headline":{"text":"You scored {pct}%!","note":"Legacy / optional; modal uses youScored + large %"},"body":{"text":"You’ve learned how to recognise online abuse, understand its impact, and respond more safely across individual, organisational, and wider sporting contexts."},"note":{"text":"Your score reflects your understanding of the key concepts covered in this course."},"finish":{"text":"Close","note":"Closes readiness flip modal on the back face"}}},"furtherAction":{"questions":{"q1":{"prompt":{"text":"Would you like to take further action with UAOA?"},"choices":{"c0":{"text":"I want to take action"},"c1":{"text":"I want to keep learning"},"c2":{"text":"I want to strengthen my organisation"},"c3":{"text":"Not right now"}},"ok":{"text":"\u003cstrong>There are different ways to take action.\u003c/strong> UAOA brings people and organisations across sport together to strengthen how they prepare for, prevent and respond to online abuse.","note":"HTML allowed — legacy further-action widget; Q11 lives in summary.quiz"}}}},"slide":{"title":{"text":"Summary: Key Takeaways","note":"Module / summary slide title"},"finishCourse":{"text":"Finish course","note":"Nav button label"},"postSurvey":{"text":"Take the post-course survey","note":"Nav button label"},"getCertificate":{"text":"Get your certificate","note":"Nav button label"}}},"embeds":{"sensitiveNotice":{"title":{"text":"Sensitive Topic Notice"},"body":{"text":"This course covers topics that some readers may find difficult or upsetting. You are encouraged to work through the material at a pace that feels appropriate and to access support where needed. Please remember that you may step out of the course at any time, and return when you feel ready."},"viewSupport":{"text":"View support options"},"supportTitle":{"text":"Support options"},"supportIntro":{"text":"If anything in this course has affected you, you can pause and come back when you feel ready."},"someoneTrusted":{"text":"Someone you trust"},"someoneTrustedDetail":{"text":"A friend, family member, teammate or coach."},"orgLead":{"text":"Your organisation’s welfare or safeguarding lead"},"closeAria":{"text":"Close"}},"miniDictionary":{"teaser":{"text":"Want to learn about other forms of online abuse?"},"bodyBefore":{"text":"Online abuse can take many forms beyond the three behaviours introduced here. Explore the"},"linkLabel":{"text":"Mini Dictionary"},"bodyAfter":{"text":"for a quick reference to other tactics you may encounter online."},"discretionLabel":{"text":"Reader discretion:"},"discretion":{"text":"Some entries describe harmful or abusive behaviours that may be sensitive or upsetting. Explore this resource at your own discretion, and return to the course whenever you are ready."},"cta":{"text":"Explore the Mini Dictionary"},"closeAria":{"text":"Close"},"title":{"text":"Mini Dictionary: Other Possible Forms of Online Abuse","note":"Dictionary document title"},"fullText":{"text":"Mini Dictionary: Other Possible Forms of Online Abuse\nToxic Content\n* Purposeful embarrassment - Intentionally causing someone shame or humiliation, often publicly.\n* Cyberbullying - Repeated use of electronic communication to intimidate, scare, or shame a person.\n* Trolling - Posting provocative or offensive messages to trigger strong reactions or disrupt discussion.\n* Profane or offensive content - Vulgar or disrespectful language, images, or communication.\n* Threats of violence - Messages meant to create fear of physical harm.\n* Incitement - Urging others to act violently or unlawfully.\n* Sexual harassment - Unwanted sexual advances or comments.\n* Unwanted explicit content - Sharing sexually explicit images or messages without consent.\nContent Leakage\n* Sextortion - Blackmail that threatens to release private material unless demands are met.\n* Doxxing - Publishing private or identifying information with malicious intent.\n* Outing - Disclosing someone's sexuality or gender identity without permission.\n* Deadnaming - Using a transgender or non-binary person's former name without consent.\n* Non-consensual image exposure - Sharing private or intimate images or videos without consent.\n* Leaked chats or profiles - Exposing private conversations or accounts without authorisation.\nOverloading\n* System or account flooding - Overwhelming a person or platform with excessive content or requests to disrupt service or silence speech.\n* Zoombombing - Uninvited intrusion into a video call to disrupt it.\n* Negative ratings and reviews - Coordinated unfair or biased feedback meant to damage a reputation.\nFalse Reporting\n* Swatting - A hoax emergency call meant to trigger an armed police response at someone's location.\n* Falsified abuse report - Knowingly submitting a false report to cause harm.\n* Falsified abuse flag - Wrongly flagging legitimate content as abusive to have it removed or censored.\nImpersonation\n* Impersonated profiles - Fake accounts created to deceive or defraud.\n* Impersonated chats or images - Fabricated or altered content falsely attributed to someone.\n* Synthetic pornography - Deepfake technology used to create explicit content without consent.\n* Impersonated web pages - Counterfeit sites built to deceive users or harm a competitor's standing.\n* Hijacked communication - Unauthorised takeover of an account or channel to spread false messages.\nSurveillance\n* Stalking or tracking - Repeated, unwanted monitoring of a person's movements or activity.\n* Account monitoring - Unauthorised access to and tracking of someone's account activity.\n* Device monitoring - Unauthorised tracking of activity on a person's phone, computer, or tablet.\n* IoT monitoring - Passive data collection from wearables or smart devices without consent.\n* Browser monitoring - Tracking someone's browsing history or activity without their knowledge.\nLockout and Control\n* Content deletion - Unauthorised removal of files, posts, or data to suppress information or cause harm.\n* Browser or device hijacking - Taking control of someone's browser or connected devices without consent.\n* Account lockouts - Deliberately blocking a person from accessing their own accounts or content.","note":"Full mini-dictionary source; HTML/markdown structure — translate carefully"}},"scroll":{"continue":{"text":"Continue","note":"Scroll / fade continue control"},"continueAria":{"text":"Continue to more content"},"continueRevealAria":{"text":"Continue to reveal more content"},"noBlock":{"text":"No following block found on this slide.","note":"Dev/fallback message"}}}};

  // English fallbacks keep cards readable if the i18n pack fails to parse.
  var CARD_META = [
    {id: "c1", name: "Offensive Speech", body: "Language targeting someone's identity, appearance, or performance with the intention of humiliating, insulting, or degrading them.", front1: "OFFENSIVE", front2: "SPEECH"},
    {id: "c2", name: "Digital Hostility", body: "Harmful behaviour directed at a person or group through repeated or coordinated negative online interactions, such as mass reporting or collective harassment.", front1: "DIGITAL", front2: "HOSTILITY"},
    {id: "c3", name: "Hate Speech", body: "Hostile or malicious language targeting someone because of a protected characteristic, including race, religion, gender, sexual orientation, or disability.", front1: "HATE", front2: "SPEECH"}
  ];
  var CARDS = CARD_META.map(function (m, idx) {
    var base = 'm1.forms.cards.' + m.id;
    var media = FORMS_MEDIA[idx];
    return {
      backName: t(base + '.name', m.name),
      theme: media.theme,
      body: t(base + '.body', m.body),
      image: media.image,
      frontLines: [t(base + '.front1', m.front1), t(base + '.front2', m.front2)]
    };
  });
  var DONE_LABEL = t('m1.forms.ui.done', 'All forms explored');
  var explored = {};
  var finished = false;
  var grid = document.getElementById('grid');
  var progress = document.getElementById('progress');
  var bar = document.getElementById('bar');
  var done = document.getElementById('done');
  var flips = [];
  var canHover = false;
  try { canHover = window.matchMedia('(hover: hover) and (pointer: fine)').matches; } catch (e) {}

  done.textContent = DONE_LABEL; // always in DOM so reserved height is correct

  function syncFrameHeight() {
    try {
      var f = window.frameElement;
      if (f) f.style.height = Math.ceil(document.documentElement.scrollHeight) + 'px';
    } catch (e) {}
  }

  function markComplete() {
    try {
      if (window.SCORMSTACK && typeof SCORMSTACK.markBlockCompleted === 'function') {
        SCORMSTACK.markBlockCompleted();
      }
    } catch (e) {}
  
    try {
      window.__uaoaInteractiveComplete = true;
      window.__uaoaAwaitComplete = false;
      try {
        var __uaoaAf2 = window.frameElement;
        if (__uaoaAf2) {
          __uaoaAf2.setAttribute('data-uaoa-complete', '1');
          __uaoaAf2.removeAttribute('data-uaoa-await');
        }
      } catch (__uaoaAe2) {}
      var __uaoaFrame = window.frameElement;
      if (__uaoaFrame && __uaoaFrame.ownerDocument) {
        __uaoaFrame.ownerDocument.dispatchEvent(new CustomEvent('uaoa-interactive-completed', {
          bubbles: true,
          detail: { frame: __uaoaFrame }
        }));
      }
    } catch (__uaoaE2) {}}

  function updateProgress() {
    var n = Object.keys(explored).length;
    progress.textContent = t('m1.forms.ui.progress','{n} of {total} explored').replace('{n}', String(n)).replace('{total}', String(CARDS.length));
    progress.classList.toggle('done', n >= CARDS.length);
    bar.style.width = Math.round((n / CARDS.length) * 100) + '%';
    if (n >= CARDS.length && !finished) {
      finished = true;
      done.classList.add('show');
      markComplete();
      syncFrameHeight();
    }
  }

  function markExplored(i, flip) {
    if (explored[i]) return;
    explored[i] = true;
    flip.classList.add('is-explored');
    updateProgress();
  }

  function sizeCells() {
    if (!flips.length) return;
    var width = flips[0].parentElement.clientWidth || 280;
    var maxBack = 0;
    var maxFront = 0;
    flips.forEach(function (flip) {
      // Fresh probe — do NOT clone .face (CSS inset:0 would stretch to the viewport)
      var backProbe = document.createElement('div');
      backProbe.style.cssText = 'position:absolute;visibility:hidden;left:0;top:0;width:' + width +
        'px;height:auto;inset:auto;display:flex;flex-direction:column;align-items:center;' +
        'justify-content:center;padding:18px 14px;gap:10px;box-sizing:border-box;font:inherit;text-align:center;';
      backProbe.innerHTML = flip.querySelector('.back').innerHTML;
      document.body.appendChild(backProbe);
      maxBack = Math.max(maxBack, Math.ceil(backProbe.getBoundingClientRect().height));
      document.body.removeChild(backProbe);

      var frontProbe = document.createElement('div');
      frontProbe.style.cssText = 'position:absolute;visibility:hidden;left:0;top:0;width:' + width +
        'px;height:auto;inset:auto;display:flex;flex-direction:column;align-items:center;' +
        'justify-content:center;padding:20px 16px;gap:14px;box-sizing:border-box;font:inherit;text-align:center;';
      frontProbe.innerHTML = flip.querySelector('.front').innerHTML;
      document.body.appendChild(frontProbe);
      maxFront = Math.max(maxFront, Math.ceil(frontProbe.getBoundingClientRect().height));
      document.body.removeChild(frontProbe);
    });
    // Front mock is tall/icon-forward — keep a generous floor so cards feel equal
    var h = Math.max(maxBack, maxFront, 280) + 2;
    flips.forEach(function (flip) {
      flip.parentElement.style.height = h + 'px';
    });
  }

  CARDS.forEach(function (c, i) {
    var cell = document.createElement('div');
    cell.className = 'cell';
    cell.setAttribute('role', 'listitem');

    var flip = document.createElement('div');
    flip.className = 'flip theme-' + c.theme;
    flip.setAttribute('aria-hidden', 'true');

    var media = '<div class="icon-slot"><img class="icon-img" src="' + c.image + '" alt="" draggable="false"></div>';

    var front = document.createElement('div');
    front.className = 'face front';
    var titleHtml = (c.frontLines || []).map(function (line) {
      return '<span>' + line + '</span>';
    }).join('');
    front.innerHTML = media + '<p class="name">' + titleHtml + '</p>';

    var back = document.createElement('div');
    back.className = 'face back';
    back.innerHTML = media + '<p class="back-name">' + c.backName + '</p><p class="back-body">' + c.body + '</p>';

    flip.appendChild(front);
    flip.appendChild(back);

    var hit = document.createElement('button');
    hit.type = 'button';
    hit.className = 'hit';
    hit.setAttribute('aria-label', c.backName + '. Activate to read more.');
    hit.setAttribute('aria-pressed', 'false');

    var stickTimer = null;
    var STICK_MS = 5000;
    function clearStick() {
      if (stickTimer) { clearTimeout(stickTimer); stickTimer = null; }
    }
    function stickHoverFlip() {
      flip.classList.add('is-hover');
      clearStick();
      stickTimer = setTimeout(function () {
        flip.classList.remove('is-hover');
        stickTimer = null;
      }, STICK_MS);
    }

    hit.addEventListener('click', function () {
      clearStick();
      var on = flip.classList.toggle('is-flipped');
      hit.setAttribute('aria-pressed', on ? 'true' : 'false');
      flip.classList.remove('is-hover');
      markExplored(i, flip);
    });

    if (canHover) {
      hit.addEventListener('pointerenter', function () {
        if (!explored[i] && !flip.classList.contains('is-flipped')) {
          stickHoverFlip();
          markExplored(i, flip);
        }
      });
    }

    hit.addEventListener('focus', function () {
      if (!explored[i] && !flip.classList.contains('is-flipped')) {
        stickHoverFlip();
        markExplored(i, flip);
      }
    });
    hit.addEventListener('blur', function () {
      if (!flip.classList.contains('is-flipped') && !stickTimer) {
        flip.classList.remove('is-hover');
      }
    });

    cell.appendChild(flip);
    cell.appendChild(hit);
    grid.appendChild(cell);
    flips.push(flip);
  });

  function layout() {
    sizeCells();
    syncFrameHeight();
  }

  updateProgress();
  layout();
  window.addEventListener('resize', layout);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
})();
