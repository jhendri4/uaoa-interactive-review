<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; background: transparent; color-scheme: light;
    overflow-x: hidden; /* flip mid-rotation must not toggle page scrollbar */
  }
  body {
    font-family: 'Cerebri Sans Pro', system-ui, -apple-system, 'Segoe UI', sans-serif;
    color: #091324; padding: 0;
  }
  .wrap {
    width: 100%; max-width: 920px; margin: 0 auto;
    background: #fff; border: 1px solid #E5E7EB; border-radius: 16px;
    padding: 20px 20px 16px; box-shadow: 0 1px 2px rgba(28,53,100,.04);
    overflow: hidden;
  }
  .head {
    display: flex; align-items: baseline; justify-content: flex-end;
    gap: 12px; flex-wrap: wrap; margin-bottom: 10px;
  }
  .progress {
    font-size: 13px; font-weight: 800; letter-spacing: .02em; color: #7C5297;
    white-space: nowrap;
  }
  .progress.done { color: #1C3564; }
  .bar {
    height: 4px; border-radius: 999px; background: #E8ECF3; overflow: hidden;
    margin: 0 0 14px;
  }
  .bar > i {
    display: block; height: 100%; width: 0; border-radius: inherit;
    background: linear-gradient(90deg, #7C5297, #21b7cb);
    transition: width .35s ease-out;
  }
  .grid {
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px;
    overflow: hidden;
  }
  .cell {
    position: relative; perspective: 1000px;
    overflow: hidden; /* clip 3D flip so it never expands layout width */
    border-radius: 16px;
  }
  .hit {
    position: absolute; inset: 0; z-index: 2; border: 0; padding: 0; margin: 0;
    background: transparent; cursor: pointer; border-radius: 16px;
  }
  .hit:focus-visible { outline: none; box-shadow: 0 0 0 2px #fff, 0 0 0 4px #7C5297; }
  .flip {
    position: relative; z-index: 1; width: 100%; height: 100%;
    transform-style: preserve-3d;
    transition: transform .7s cubic-bezier(.22,.6,.2,1);
    pointer-events: none; border-radius: 16px;
  }
  .flip.is-flipped, .flip.is-hover { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border-radius: 16px; padding: 20px 16px;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; /* image + text as one vertically centred group */
    text-align: center; border: 2px solid transparent;
  }
  .front {
    gap: 14px;
  }
  .back {
    gap: 10px;
    transform: rotateY(180deg);
    padding: 18px 14px;
  }
  /* Themed faces — match Jared front/back mocks */
  .theme-teal .front, .theme-teal .back {
    background: #E6F4F6; border-color: #35AEB9;
  }
  .theme-teal .name { color: #2A9EAE; } /* front teal */
  .theme-teal .back-name { color: #1C3564; } /* back navy — ≠ front */
  .theme-purple .front, .theme-purple .back {
    background: #F0EAF5; border-color: #7C5297;
  }
  .theme-purple .name, .theme-purple .back-name { color: #7C5297; }
  .theme-orange .front, .theme-orange .back {
    background: #FBF0E4; border-color: #E09A3E;
  }
  .theme-orange .name, .theme-orange .back-name { color: #D4892E; }

  /* Shared icon box — same size/position on every card; img centers inside */
  .icon-slot {
    flex: none; width: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  .front .icon-slot { height: 112px; }
  .back .icon-slot { height: 64px; }
  .icon-img {
    width: 92px; height: 92px; object-fit: contain; flex: none;
    display: block; margin: 0;
  }
  .back .icon-img { width: 56px; height: 56px; }
  .name {
    margin: 0; width: 100%;
    font-size: 18px; line-height: 22px; font-weight: 800;
    letter-spacing: .06em; text-transform: uppercase; flex: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px;
  }
  .name span { display: block; }
  .back-name {
    margin: 0; width: 100%; flex: none;
    font-size: 16px; line-height: 20px; font-weight: 800;
    letter-spacing: -.01em; text-transform: none;
  }
  .back-body {
    margin: 0; width: 100%; flex: none;
    font-size: 14px; line-height: 20px; font-weight: 500;
    color: #3D4A5C; text-align: center;
  }
  .done-banner {
    margin-top: 14px; padding: 12px 14px; border-radius: 10px;
    background: #EEF3FB; color: #1C3564; font-size: 14px; font-weight: 700;
    opacity: 0; pointer-events: none;
  }
  .done-banner.show { opacity: 1; }
  @media (max-width: 720px) {
    .wrap { padding: 14px 12px 12px; }
    .grid { grid-template-columns: repeat(1, minmax(0, 1fr)); gap: 10px; }
    .front .icon-slot { height: 100px; }
    .icon-img { width: 80px; height: 80px; }
  }
</style></head><body>

,"note":"HTML allowed"}},"s3":{"text":{"text":"After a controversial decision, a referee receives a comment using humiliating and degrading language from a section of fans who were not happy about it.","note":"Scenario prompt; answer = offensive speech"},"ok":{"text":"\u003cstrong>Correct!\u003c/strong> The comment uses insulting and degrading language directed at the referee, making this an example of \u003cstrong>offensive speech\u003c/strong>.","note":"HTML allowed"},"bad":{"text":"\u003cstrong>Not quite.\u003c/strong> Focus on the language being used and what makes it harmful. \u003cstrong>Try again.\u003c/strong>","note":"HTML allowed"}},"s4":{"text":{"text":"After an important match, a female athlete receives insulting comments from a fan criticizing her performance.","note":"Scenario prompt; answer = offensive speech"},"ok":{"text":"\u003cstrong>Correct!\u003c/strong> The comments use insulting and degrading language focused on the athlete’s performance, making this an example of \u003cstrong>offensive speech\u003c/strong>. Women may experience a greater volume of online abuse because of their gender, even when individual messages do not explicitly target gender as a protected characteristic.","note":"HTML allowed"},"bad":{"text":"\u003cstrong>Not quite.\u003c/strong> Consider what the comments are targeting. \u003cstrong>Try again.\u003c/strong>","note":"HTML allowed"}}}},"forms":{"ui":{"progress":{"text":"{n} of {total} explored","note":"Flip progress counter"},"done":{"text":"All forms explored"}},"cards":{"c1":{"name":{"text":"Offensive Speech","note":"Flip card 1 title"},"body":{"text":"Language targeting someone's identity, appearance, or performance with the intention of humiliating, insulting, or degrading them."},"front1":{"text":"OFFENSIVE","note":"Front-of-card stacked label line"},"front2":{"text":"SPEECH","note":"Front-of-card stacked label line"}},"c2":{"name":{"text":"Digital Hostility","note":"Flip card 2 title"},"body":{"text":"Harmful behaviour directed at a person or group through repeated or coordinated negative online interactions, such as mass reporting or collective harassment."},"front1":{"text":"DIGITAL","note":"Front-of-card stacked label line"},"front2":{"text":"HOSTILITY","note":"Front-of-card stacked label line"}},"c3":{"name":{"text":"Hate Speech","note":"Flip card 3 title"},"body":{"text":"Hostile or malicious language targeting someone because of a protected characteristic, including race, religion, gender, sexual orientation, or disability."},"front1":{"text":"HATE","note":"Front-of-card stacked label line"},"front2":{"text":"SPEECH","note":"Front-of-card stacked label line"}}}},"formsOverlap":{"line1":{"text":"More than one form of abuse can be"},"line2":{"text":"present at the same time."}},"protected":{"race":{"text":"Race"},"ethnicity":{"text":"Ethnicity"},"nationality":{"text":"Nationality"},"gender":{"text":"Gender"},"sexualOrientation":{"text":"Sexual Orientation","note":"May wrap to two lines on the tile"},"disability":{"text":"Disability"},"religion":{"text":"Religion"}},"platforms":{"ui":{"progress":{"text":"{n} of {total} explored"},"done":{"text":"All groups explored"}},"groups":{"g1":{"title":{"text":"Discovery & Social Feeds","note":"Primary front-of-card label"},"platforms":{"text":"[TikTok, Instagram, Facebook]","note":"Shown under title in bold brackets"},"body":{"text":"Recommendation feeds and sharing features can expose harmful content to people beyond the original audience. As more users view, comment on, or share the content, online abuse can spread quickly and reach larger audiences."}},"g2":{"title":{"text":"Video Sharing & Livestreaming"},"platforms":{"text":"[YouTube, Twitch, Kick]"},"body":{"text":"Harmful comments on videos can remain visible long after they are posted, allowing abuse to continue over time. During livestreams, abusive messages can appear and multiply rapidly as viewers react in real time."}},"g3":{"title":{"text":"Public Conversations"},"platforms":{"text":"[X, Threads]"},"body":{"text":"Replies, reposts, and mentions can spread abusive messages across public conversations. When many users join in, a single harmful comment can develop into repeated or coordinated attacks against an individual."}},"g4":{"title":{"text":"Discussion Communities"},"platforms":{"text":"[Reddit, Facebook Groups]"},"body":{"text":"Harmful comments can spread within online communities as members respond, share, or encourage similar behaviour. Group discussions may reinforce negative attitudes and lead to repeated abuse targeting the same person."}},"g5":{"title":{"text":"Messaging & Group Chats"},"platforms":{"text":"[Discord, WhatsApp]"},"body":{"text":"Abusive messages can be forwarded or shared between individuals and groups, spreading harmful content through private conversations. Limited visibility outside these spaces can make it difficult to identify and address ongoing abuse."}}}},"factors":{"ui":{"prompt":{"text":"Select the three factors that can directly influence how harmful content travels and reaches new audiences online."},"hint":{"text":"Select exactly three options."},"hintReady":{"text":"Three selected — ready to submit."},"hintDone":{"text":"All three correct factors selected."},"choicesAria":{"text":"Select exactly three factors"},"count":{"text":"{n} of {total} selected"},"ok":{"text":"\u003cstrong>Correct!\u003c/strong> Platform features, recommendation systems, and user interactions can all influence how content is distributed, amplified, and exposed to new audiences.","note":"HTML allowed"},"bad":{"text":"\u003cstrong>Not quite. Review the options and try again.\u003c/strong>","note":"HTML allowed"}},"labels":{"a":{"text":"Platform design and features","note":"Correct"},"b":{"text":"The age of the person targeted"},"c":{"text":"Recommendation and distribution systems","note":"Correct"},"d":{"text":"The sporting role of the person targeted"},"e":{"text":"User interactions such as commenting, sharing, and reposting","note":"Correct"},"f":{"text":"Whether the original content is considered offensive"}}},"check":{"ui":{"instructionComplete":{"text":"Complete the sentence."},"instructionBlanks":{"text":"Choose a word for each blank. Each word is used once."},"instructionMulti":{"text":"Select all that apply."},"instructionPair":{"text":"Choose the pair of words that completes the sentence."},"blankAria":{"text":"Blank {n}","note":"aria-label; {n} = 1-based index"},"questionsCorrect":{"text":"questions correct"},"scorePerfect":{"text":"Perfect — you got every question right.","note":"Score message; may vary — check widget"},"scorePartial":{"text":"Nice work — review any missed items below.","note":"Fallback score message"},"scoreLow":{"text":"Keep going — try again to strengthen your understanding."}},"questions":{"q1":{"label":{"text":"1. Complete the sentence: What defines online abuse?"},"prompt":{"text":"Online abuse involves harmful behaviour directed at a person or group through __________."},"choices":{"a":{"text":"competitive environments"},"b":{"text":"digital platforms","note":"Correct"},"c":{"text":"public spaces"},"d":{"text":"sporting events"}}},"q2":{"label":{"text":"2. Complete the statement: What helps you understand the context that defines online abuse"},"sentenceBefore":{"text":"When identifying online abuse, consider the"},"sentenceMid1":{"text":"being used, whether the behaviour has a clear"},"sentenceMid2":{"text":"and the"},"sentenceAfter":{"text":"of repeated interactions."},"choices":{"language":{"text":"language","note":"Correct blank 1"},"target":{"text":"target","note":"Correct blank 2 — clear target"},"pattern":{"text":"pattern","note":"Correct blank 3 — pattern of repeated interactions"}}},"q3":{"label":{"text":"3. Which is a protected characteristic?"},"choices":{"religion":{"text":"Religion","note":"Correct"},"performance":{"text":"Athletic performance"},"disability":{"text":"Disability","note":"Correct"},"position":{"text":"Team position"},"ethnicity":{"text":"Ethnicity","note":"Correct"}}},"q4":{"label":{"text":"4. Fill in the blanks: How can online abuse develop?"},"prompt":{"text":"Different forms of online abuse can __________, and a single harmful interaction can __________ as others comment, share, repost, or amplify it."},"choices":{"a":{"text":"overlap · escalate","note":"Correct"},"b":{"text":"remain separate · disappear"},"c":{"text":"alternate · become private"},"d":{"text":"interact · become harmless"}}}}},"matteo":{"ui":{"navAria":{"text":"Card navigation"},"prevAria":{"text":"Previous card"},"nextAria":{"text":"Next card"}},"cards":{"c1":{"title":{"text":"1 - Pressure"},"alt":{"text":"Matteo preparing under pressure","note":"Image alt text"},"html":{"text":"\u003cp>\u003cstrong>Matteo is a high-performing college volleyball athlete with ambitions of joining the national team.\u003c/strong>\u003c/p>\u003cp>Between demanding coursework and intensive training, he has been under considerable pressure and struggling to stay focused.\u003c/p>","note":"HTML allowed"}},"c2":{"title":{"text":"2 - The Match"},"alt":{"text":"Matteo during the match","note":"Image alt text"},"html":{"text":"\u003cp>During an important match, Matteo serves into the net on match point, costing his team the match. The crowd reacts strongly, and some spectators begin shouting harsh criticism about his performance from the stands. The reaction continues as Matteo leaves the court.\u003c/p>\u003cp>\u003cstrong>Is this online abuse? No.\u003c/strong>\u003c/p>\u003cp>The criticism may be aggressive and harmful, but this is still happening \u003cstrong>offline\u003c/strong>. However, reactions that begin at a sporting event / on the ground, can quickly move into digital spaces, where they may reach a much wider audience.\u003c/p>","note":"HTML allowed"}},"c3":{"title":{"text":"3 - It moves online"},"alt":{"text":"Criticism moving onto social media","note":"Image alt text"},"html":{"text":"\u003cp>After the match, the criticism moves online. A fan posts a video of Matteo’s missing serve, tags Matteo’s social media account, and adds insulting and humiliating comments intended to ridicule him.\u003c/p>\u003cp>\u003cstrong>The situation has become online abuse.\u003c/strong>\u003c/p>\u003cp>The fan is using insulting and humiliating content directed at Matteo through a digital platform. This is \u003cstrong>offensive speech.\u003c/strong>\u003c/p>","note":"HTML allowed"}},"c4":{"title":{"text":"4 - The situation escalates"},"alt":{"text":"Hostile comments spreading online","note":"Image alt text"},"html":{"text":"\u003cp>By the next day, many users had joined in. Hostile comments are appearing across Matteo’s social media accounts, and the video of his missed serve is being repeatedly shared alongside insulting posts.\u003c/p>\u003cp>\u003cstrong>The situation has escalated to digital hostility.\u003c/strong>\u003c/p>\u003cp>What began with one user has developed into a \u003cstrong>repeated and collective pattern of hostile online interactions.\u003c/strong>\u003c/p>","note":"HTML allowed"}}}},"takeaways":{"heading":{"text":"Key Takeaways"},"items":{"i1":{"text":"\u003cstrong>Online abuse takes different forms.\u003c/strong> Offensive speech, hate speech, and digital hostility help us recognise different ways harmful behaviour can appear and develop online.","note":"HTML allowed"},"i2":{"text":"\u003cstrong>Context matters.\u003c/strong> Consider the language being used, who or what is being targeted, and the pattern of interactions when identifying online abuse.","note":"HTML allowed"},"i3":{"text":"\u003cstrong>Different forms of abuse can overlap.\u003c/strong> A single interaction may involve more than one behaviour, and its characteristics can change as the situation develops.","note":"HTML allowed"},"i4":{"text":"\u003cstrong>Online abuse can escalate.\u003c/strong> A single harmful post can develop into repeated or collective hostility as others comment, share, repost, or amplify the content.","note":"HTML allowed"},"i5":{"text":"\u003cstrong>Some people face disproportionate risk.\u003c/strong> Identity, visibility, role, and other contextual factors can affect who is targeted and the nature or intensity of the abuse they experience.","note":"HTML allowed"},"i6":{"text":"\u003cstrong>Recognition is the first step towards action.\u003c/strong> Understanding what online abuse looks like helps people identify harmful situations and respond more effectively.","note":"HTML allowed"}}},"slide":{"title":{"text":"Module 1: Recognising Online Abuse","note":"Module / summary slide title"}}},"m2":{"check":{"questions":{"q1":{"prompt":{"text":"Who can be affected by online abuse in sport?","note":"MCQ stem"},"choices":{"c0":{"text":"Only primarily professional athletes and match officials."},"c1":{"text":"Anyone with a public social media account."},"c2":{"text":"Athletes, officials, journalists, organisations and their representatives, families, fans, and others across sporting communities.","note":"Correct answer"},"c3":{"text":"Primarily people whose work involves communicating directly with fans."}},"ok":{"text":"\u003cstrong>Correct!\u003c/strong> Online abuse can affect people across the sporting ecosystem, including those directly targeted and others who witness or experience its wider consequences.","note":"HTML allowed"}},"q2":{"prompt":{"text":"Which statement best describes the potential impact of online abuse in sport?"},"choices":{"c0":{"text":"Its effects are mainly limited to how people feel or react immediately after receiving abusive content."},"c1":{"text":"It can have long-term effects on wellbeing, professional activity, relationships, participation, and the wider sporting community.","note":"Correct answer"},"c2":{"text":"It is something that concerns only the elite athletes because they have the greatest public visibility."},"c3":{"text":"Its impact depends mainly on how frequently someone uses social media."}},"ok":{"text":"\u003cstrong>Correct!\u003c/strong> Online abuse can have effects across multiple areas of a person’s life and work. While in sport, it might affect athletes the most, irrespective of their levels, but the consequences can also extend to families, colleagues, teams, fans, and sporting communities.","note":"HTML allowed"}},"q3":{"prompt":{"text":"An athlete who has experienced repeated online abuse begins sleeping poorly, struggles to concentrate during training, and posts less frequently online. What does this example illustrate?"},"choices":{"c0":{"text":"Different impacts of online abuse can overlap and influence several areas of a person’s life.","note":"Correct answer"},"c1":{"text":"Reduced social media activity is usually the primary effect of online abuse."},"c2":{"text":"Performance effects occur after a coach recommends using less social media."},"c3":{"text":"The effects of online abuse depend mainly on how frequently a person uses social media."}},"ok":{"text":"\u003cstrong>Correct!\u003c/strong> Effects can be interconnected. Emotional distress, sleep, confidence, safety, performance, and participation can influence one another and may develop over time.","note":"HTML allowed"}},"q4":{"prompt":{"text":"What does the evidence presented in this module suggest about how people respond to online abuse?"},"choices":{"c0":{"text":"People generally experience similar effects when exposed to similar content."},"c1":{"text":"Strong resilience prevents online abuse from affecting wellbeing."},"c2":{"text":"Effects can vary between people, and personal and contextual factors can shape how someone responds.","note":"Correct answer"},"c3":{"text":"People who continue participating in sport are unlikely to have been significantly affected."}},"ok":{"text":"\u003cstrong>Correct!\u003c/strong> The impact of online abuse varies. Research discussed in the module indicates that factors such as resilience and self-esteem can be associated with how people respond, but continuing to participate does not mean that someone has been unaffected.","note":"HTML allowed"}}}},"affected":{"ui":{"progress":{"text":"{n} of {total} explored"}},"cards":{"c1":{"name":{"text":"Athletes"},"body":{"text":"High public visibility can make athletes frequent targets of online abuse. Hateful reactions may arise from sporting outcomes, public perceptions, or interpretations of an athlete’s performance, actions, or personal decisions. These reactions can escalate quickly, allowing harmful content to spread across digital platforms."}},"c2":{"name":{"text":"Match officials"},"body":{"text":"Officials can face online abuse following decisions made during competition, adding to the verbal and physical abuse they may already experience in person. Repeated criticism, threats, and hostility can contribute to stress and affect their confidence, perceived authority, and wellbeing."}},"c3":{"name":{"text":"Journalists"},"body":{"text":"Journalists play an important role in connecting athletes, teams, and sporting organisations with wider audiences. Journalists may become targets of online hostility in response to their reporting, commentary or perceived position on an issue."}},"c4":{"name":{"text":"Sponsors and representatives"},"body":{"text":"Sporting organisations and the people who fund, manage, and represent them can also become targets of online abuse. Hostile content may be directed at an organisation itself, its decisions, policies or actions, or at individual staff and representatives. This can affect organisational reputation, professional activity, decision-making, and the wellbeing of those involved."}},"c5":{"name":{"text":"Families"},"body":{"text":"The effects of online abuse can extend to the families and loved ones of those targeted. They may witness the abuse and its impact, become indirect targets through their association with the person experiencing abuse, or receive harmful messages directed at them personally. These experiences can also increase concern and fear for the safety and wellbeing of someone close to them."}},"c6":{"name":{"text":"Fans"},"body":{"text":"Fans are the largest group in sport and are often overlooked. They can be affected by the abuse they encounter within sporting communities, even when they are not a direct target. Identity-based abuse aimed at an athlete, official, or other public figure can also affect fans who share that identity, contributing to an environment in which they may feel unwelcome or unsafe."}}}},"exploreImpacts":{"ui":{"eyebrow":{"text":"Explore"},"prompt":{"text":"After receiving repeated abusive messages online, an athlete begins posting on social media less frequently. Their coach notices they seem distracted during training, and they have recently mentioned sleeping poorly and feeling anxious about attending public events."},"hint":{"text":"Select at least 4 that apply, then submit."},"count":{"text":"{n} selected"},"ok":{"text":"\u003cstrong>These impacts can be interconnected.\u003c/strong> Online abuse may affect several areas of a person’s life at the same time, and the effects may develop or intensify over time. Recognising these signs can help people across sport respond with greater awareness and support.","note":"HTML allowed"},"bad":{"text":"\u003cstrong>Not quite. Try again.\u003c/strong>","note":"HTML allowed — shown when first submit is missing some impacts"}},"labels":{"c0":{"text":"Emotional distress"},"c1":{"text":"Sleep disruption"},"c2":{"text":"Reduced confidence"},"c3":{"text":"Sense of safety"},"c4":{"text":"Focus and performance"},"c5":{"text":"Stepping away"}}},"impacts":{"ui":{"pathwayAria":{"text":"Impact pathway"},"navAria":{"text":"Carousel navigation"},"prevAria":{"text":"Previous impact"},"nextAria":{"text":"Next impact"},"researchHeading":{"text":"What the research shows"},"done":{"text":"Activity complete — you’ve reviewed all six impacts"}},"cards":{"c1":{"title":{"text":"Emotional distress"},"short":{"text":"Distress","note":"Pathway short label"},"alt":{"text":"Temporary illustration · emotional distress","note":"Image alt"},"body":{"text":"\u003cp>Receiving online abuse can trigger feelings of fear, sadness, anger, and frustration. For athletes, these experiences may also raise concerns about their reputation, career opportunities, relationships with family and friends, and team performance. When abuse occurs publicly, its visibility and potential spread can further intensify psychological distress.\u003c/p>","note":"HTML allowed"},"research":{"text":"In a survey of 85 NCAA Division I athletes, greater exposure to online harassment was associated with \u003cstrong>higher levels of depressive symptoms\u003c/strong>. The researchers describe hostile online content as a meaningful source of psychological stress for college athletes.","note":"HTML allowed"},"source":{"text":"Hughes, M. C., Demaray, M. K., Skiba, E. A., & Warriner, S. E. (2026). Online harassment and mental health among collegiate student-athletes: Findings from an NCAA Division I conference survey. Journal of Issues in Intercollegiate Athletics.","note":"Citation; keep author names"}},"c2":{"title":{"text":"Sleep"},"short":{"text":"Sleep","note":"Pathway short label"},"alt":{"text":"Temporary illustration · sleep","note":"Image alt"},"body":{"text":"\u003cp>Online abuse can disrupt sleep and recovery. Harmful online experiences can continue beyond the initial interaction, affecting an athlete’s ability to rest and recover.\u003c/p>","note":"HTML allowed"},"research":{"text":"In a study of 912 young athletes aged 12–24, 10.4% reported experiencing online abuse. Among those affected, 44.3% reported moderate to severe effects on their sleep quality.","note":"HTML allowed"},"source":{"text":"Tooth, C., Kaux, J.-F., Tscholl, P., Touré, A., Muller, F., & Seil, K. (2026). The influence of social media on young athletes' mental health: A cross-sectional study. Frontiers in Psychology.","note":"Citation; keep author names"}},"c3":{"title":{"text":"Confidence and self-esteem"},"short":{"text":"Confidence","note":"Pathway short label"},"alt":{"text":"Temporary illustration · confidence","note":"Image alt"},"body":{"text":"\u003cp>Online abuse often targets a person's abilities, body, or identity. Repeated criticism, including comments shared publicly to humiliate or hurt someone, can affect the targeted person's confidence and make them doubt their skills, decisions, and place in sport.\u003c/p>","note":"HTML allowed"},"research":{"text":"Research suggests that internal factors can shape how people respond to online hate. In a study of \u003cstrong>60 public figures, including Olympic athletes, and 1,128 internet users\u003c/strong>, higher \u003cstrong>resilience and self-esteem were associated with lower levels of concern about the online hate they received\u003c/strong>. This suggests that people can experience the same type of hostility differently, depending in part on their psychological resources.","note":"HTML allowed"},"source":{"text":"Jędryczka, W., Sorokowski, P., & Dobrowolska, M. (2022). The role of victim's resilience and self-esteem in experiencing internet hate. International Journal of Environmental Research and Public Health.","note":"Citation; keep author names"}},"c4":{"title":{"text":"Sense of safety"},"short":{"text":"Safety","note":"Pathway short label"},"alt":{"text":"Temporary illustration · sense of safety","note":"Image alt"},"body":{"text":"\u003cp>Threats and hostility online can extend concerns about safety \u003cstrong>beyond digital spaces\u003c/strong>. People targeted may worry about their own safety \u003cstrong>at home, during competition, and in public spaces.\u003c/strong> When threats also involve those close to them, these concerns can extend to \u003cstrong>family members and loved ones.\u003c/strong>\u003c/p>","note":"HTML allowed"},"research":{"text":"In the 2025 UAOA Barometer, \u003cstrong>nearly three in four sporting federations surveyed\u003c/strong> reported that threats to harm sportspeople or their dependents remain a reality for those using social media platforms. The finding was also reported in the previous edition of the Barometer, indicating an ongoing concern across sport.","note":"HTML allowed"},"source":{"text":"United Against Online Abuse. (2025). Online Abuse in Sport Barometer 2025.","note":"Citation; keep author names"}},"c5":{"title":{"text":"Focus and performance"},"short":{"text":"Focus","note":"Pathway short label"},"alt":{"text":"Temporary illustration · focus and performance","note":"Image alt"},"body":{"text":"\u003cp>The detrimental effects of psychological stress on focus and performance are well documented. Because online abuse can cause mental distress, it can thus negatively affect the focus and performance of sportpeople, making it harder to concentrate, make decisions under pressure, and perform consistently.\u003c/p>","note":"HTML allowed"},"research":{"text":"In a study of \u003cstrong>274 Canadian basketball referees\u003c/strong>, higher wellbeing was significantly associated with \u003cstrong>better self-rated officiating performance\u003c/strong>, even after accounting for experience. Previous research cited by the authors also found that \u003cstrong>90% of football referees believed common mental health symptoms could negatively affect their refereeing performance.\u003c/strong>","note":"HTML allowed"},"source":{"text":"Taylor, N., Hancock, D., & Sullivan, P. (2026). Mental health and officiating performance. Frontiers in Psychology.","note":"Citation; keep author names"}},"c6":{"title":{"text":"Stepping away"},"short":{"text":"Stepping away","note":"Pathway short label"},"alt":{"text":"Temporary illustration · stepping away","note":"Image alt"},"body":{"text":"\u003cp>Online abuse can influence whether people \u003cstrong>continue participating, working, or communicating openly in sport.\u003c/strong> Some may reduce their social media presence, reconsider their involvement, or become more cautious about what they share publicly.\u003c/p>","note":"HTML allowed"},"research":{"text":"Research on abuse in sport found that both \u003cstrong>physical and non-physical abuse were associated with a greater intention to quit\u003c/strong> among association football referees in England and Canada. Abuse was also associated with reduced wellbeing. In the 2025 UAOA Barometer, \u003cstrong>90% of sporting federations surveyed expressed concern that online abuse could drive talented athletes out of sport.\u003c/strong>","note":"HTML allowed"},"source":{"text":"Downward, P., Webb, T., & Dawson, P. (2024). Referee abuse, intention to quit, and well-being. Research Quarterly for Exercise and Sport. United Against Online Abuse. (2025). Online Abuse in Sport Barometer 2025.","note":"Citation; keep author names"}}}},"takeaways":{"heading":{"text":"Key Takeaways"},"items":{"i1":{"text":"\u003cstrong>Online abuse can have wide-ranging effects.\u003c/strong> Its impact can extend across wellbeing, confidence, sense of safety, performance, participation, and other areas of a person’s life.","note":"HTML allowed"},"i2":{"text":"\u003cstrong>The effects can be interconnected.\u003c/strong> Emotional distress, disrupted sleep, reduced confidence, safety concerns, and difficulties with focus can overlap and influence one another.","note":"HTML allowed"},"i3":{"text":"\u003cstrong>People can be affected differently.\u003c/strong> Personal and contextual factors can shape how someone experiences and responds to online abuse.","note":"HTML allowed"},"i4":{"text":"\u003cstrong>The impact extends beyond those directly targeted.\u003c/strong> Families, teammates, colleagues, fans, organisations, and others across sporting communities can also experience its consequences.","note":"HTML allowed"},"i5":{"text":"\u003cstrong>Online abuse can affect participation and sporting culture.\u003c/strong> Persistent hostility can influence who feels safe, welcome, and able to participate in sport.","note":"HTML allowed"},"i6":{"text":"\u003cstrong>The consequences can extend beyond sport.\u003c/strong> When discriminatory and abusive behaviours become normalised, they can reinforce prejudice, exclusion, and hostility in wider society.","note":"HTML allowed"}}},"slide":{"title":{"text":"Module 2: Understanding the Impact","note":"Module / summary slide title"},"section1":{"text":"Why the human impact matters","note":"Section heading"},"section2":{"text":"Who is affected by online abuse?","note":"Section heading"},"section3":{"text":"The impact of online abuse on people","note":"Section heading"},"section4":{"text":"Explore: Which potential impacts of online abuse can you identify?","note":"Section heading"},"section5":{"text":"The wider picture","note":"Section heading"}}},"m3":{"regionTabs":{"ui":{"eyebrow":{"text":"Regional example"},"prompt":{"text":"Select a region"},"placeholder":{"text":"Select a region to view an example."},"regionsAria":{"text":"Regions"},"close":{"text":"Close"},"closeAria":{"text":"Close"},"subCountriesAria":{"text":"EU member examples"},"overview":{"text":"Overview"}},"tabs":{"t1":{"title":{"text":"European Union"},"html":{"text":"\u003cp>The \u003ca href=\"https://eur-lex.europa.eu/eli/reg/2024/1689/\" target=\"_blank\" rel=\"noopener\">\u003cstrong>European Union AI Act\u003c/strong>\u003c/a> uses a risk-based framework for AI and introduces transparency requirements for certain AI-generated and manipulated content, including some deepfakes.\u003c/p>","note":"HTML allowed — European Union AI Act links to EUR-Lex"},"subs":{"slovenia":{"title":{"text":"Slovenia"},"html":{"text":"\u003cp>In Slovenia, AI is governed by \u003ca href=\"https://pisrs.si/pregledPredpisa?id=ZAKO9225#naslov-parent-393613415\" target=\"_blank\" rel=\"noopener\">national legislation\u003c/a> and the \u003ca href=\"https://eur-lex.europa.eu/legal-content/SL/TXT/HTML/?uri=OJ:L_202401689\" target=\"_blank\" rel=\"noopener\">EU AI Act\u003c/a>. \u003ca href=\"https://www.gov.si/novice/2026-08-03-zacela-so-se-uporabljati-pravila-o-preglednosti-sistemov-umetne-inteligence/\" target=\"_blank\" rel=\"noopener\">Government guidance\u003c/a>, \u003ca href=\"https://www.ip-rs.si/umetna-inteligenca/pogosta-vpra%C5%A1anja/\" target=\"_blank\" rel=\"noopener\">answers to common questions\u003c/a>, and regulatory information from the \u003ca href=\"https://www.gov.si/en/state-authorities/ministries/ministry-of-the-interior-and-public-administration/about-the-ministry/\" target=\"_blank\" rel=\"noopener\">responsible ministry\u003c/a> are also available.\u003c/p>","note":"HTML allowed — linked phrases open official sources"}},"sweden":{"title":{"text":"Sweden"},"html":{"text":"\u003cp>In Sweden, the EU AI Act applies directly and provides the legal framework for regulating artificial intelligence, including AI-generated content. Sweden has no separate national legislation specifically addressing AI-generated content.\u003c/p>","note":"HTML allowed"}},"czechia":{"title":{"text":"Czechia"},"html":{"text":"\u003cp>In Czechia, the EU AI Act applies directly and provides the legal framework for regulating artificial intelligence, including AI-generated content.\u003c/p>","note":"HTML allowed"}},"spain":{"title":{"text":"Spain"},"html":{"text":"\u003cp>In Spain, the EU AI Act applies directly and provides the legal framework for regulating artificial intelligence, including AI-generated content. The Spanish Agency for the Supervision of Artificial Intelligence (AESIA) oversees compliance with AI regulations and supports their implementation at the national level.\u003c/p>","note":"HTML allowed"}}}},"t2":{"title":{"text":"United Kingdom"},"html":{"text":"\u003cp>Under the \u003ca href=\"https://www.legislation.gov.uk/ukpga/2023/50\" target=\"_blank\" rel=\"noopener\">\u003cstrong>Online Safety Act\u003c/strong>\u003c/a>, AI-generated content shared by users can fall within the responsibilities of regulated online services, including relevant duties concerning illegal content and user safety.\u003c/p>","note":"HTML allowed"}},"t3":{"title":{"text":"United States"},"html":{"text":"\u003cp>The \u003ca href=\"https://www.congress.gov/bill/119th-congress/senate-bill/146\" target=\"_blank\" rel=\"noopener\">\u003cstrong>TAKE IT DOWN Act\u003c/strong>\u003c/a> addresses the sharing of intimate images without consent, including AI-generated deepfakes. It requires covered online platforms to provide a way to request their removal and to remove qualifying content within 48 hours of a valid request.\u003c/p>","note":"HTML allowed"}}}},"checklist":{"ui":{"eyebrow":{"text":"Checklist"},"title":{"text":"Reporting steps"},"progress":{"text":"{n} of {total} reviewed"},"hint":{"text":"Tick each step as you review it. Not graded.","note":"Removed from widget UI; kept for translators / legacy"},"done":{"text":"All steps reviewed."}},"items":{"i1":{"text":"1. Assess the situation and your safety. Consider the nature of the content and whether you or someone else may be at immediate risk."},"i2":{"text":"2. Collect evidence. Save abusive posts, messages, profile information, URLs, and screenshots where appropriate."},"i3":{"text":"3. Record key details. Note the date, time, username or account, and relevant information about what occurred."},"i4":{"text":"4. Use platform safety tools. Restrict, mute, or block the account where appropriate to limit further contact or exposure."},"i5":{"text":"5. Report through the platform. Review the platform’s relevant policies and flag the content or account using its built-in reporting options."},"i6":{"text":"6. Seek additional support or escalate when needed. Contact your organisation’s welfare or safeguarding lead where relevant. If you feel there is a threat to your safety, contact the appropriate local authorities or emergency services."}}},"reportingSystems":{"ui":{"listAria":{"text":"Reporting systems by country","note":"aria-label on accordion list"},"placeholder":{"text":"Select a country to view reporting systems and support resources."}},"items":{"uk":{"title":{"text":"United Kingdom"},"html":{"text":"\u003cp>In the UK, online abuse can be reported to the relevant platform or, when it may constitute a criminal offence, to the police. Individuals are encouraged to preserve evidence, including screenshots, messages and URLs. Specialist organisations also provide confidential support and guidance.\u003c/p>\u003cul>\u003cli>\u003cstrong>Police\u003c/strong> — Report threats, stalking, harassment and other potentially criminal online behaviour. Call 999 in an emergency or 101 for non-emergency assistance.\u003c/li>\u003cli>\u003ca href=\"https://reportharmfulcontent.com/\" target=\"_blank\" rel=\"noopener\">\u003cstrong>Report Harmful Content\u003c/strong>\u003c/a> — Guidance and assistance with reporting harmful online content, including harassment, threats and abuse.\u003c/li>\u003cli>\u003ca href=\"https://www.stophateuk.org/report-hate-crime/\" target=\"_blank\" rel=\"noopener\">\u003cstrong>Stop Hate UK\u003c/strong>\u003c/a> — Independent, confidential support and general hate crime reporting services in participating areas.\u003c/li>\u003c/ul>","note":"HTML allowed — linked resource names open official sources"}},"us":{"title":{"text":"United States"},"html":{"text":"\u003cp>In the United States, online abuse can be reported to the relevant platform or law enforcement, depending on the nature of the incident. Threats, stalking and other potentially criminal behaviour can be reported to local police, while federal agencies provide additional reporting channels. Individuals are encouraged to preserve evidence, including screenshots, messages and URLs.\u003c/p>\u003cul>\u003cli>\u003ca href=\"https://www.usa.gov/report-crime\" target=\"_blank\" rel=\"noopener\">\u003cstrong>Local Law Enforcement\u003c/strong>\u003c/a> — Police departments can receive reports of threats, stalking, harassment and other potentially criminal online behaviour. Call 911 in an emergency.\u003c/li>\u003cli>\u003ca href=\"https://www.stopbullying.gov/cyberbullying/how-to-report\" target=\"_blank\" rel=\"noopener\">\u003cstrong>StopBullying.gov: Report Cyberbullying\u003c/strong>\u003c/a> — Government guidance on documenting cyberbullying, reporting harmful content to platforms and contacting law enforcement when appropriate.\u003c/li>\u003cli>\u003ca href=\"https://www.ic3.gov/\" target=\"_blank\" rel=\"noopener\">\u003cstrong>FBI: Internet Crime Complaint Center (IC3)\u003c/strong>\u003c/a> — Reports of cyber-enabled crime, including online extortion, harassment and stalking where criminal conduct is suspected.\u003c/li>\u003cli>\u003ca href=\"https://tips.fbi.gov/\" target=\"_blank\" rel=\"noopener\">\u003cstrong>FBI: Report a Federal Crime\u003c/strong>\u003c/a> — Reports of suspected federal crimes, including serious threats and other criminal activity that may involve online abuse.\u003c/li>\u003c/ul>","note":"HTML allowed — linked resource names open official sources"}},"si":{"title":{"text":"Slovenia"},"html":{"text":"\u003cp>In Slovenia, athletes and sports professionals can seek independent support and guidance on online abuse through the Ombudsman for Athletes’ Rights. Additional resources address cybersecurity incidents, personal data protection and misconduct within sport, including dedicated reporting channels.\u003c/p>\u003cul>\u003cli>\u003ca href=\"https://www.gov.si/en/state-authorities/ministries/ministry-of-the-economy-labour-and-sport/about-the-ministry-of-economy-tourism-and-sport/sport-directorate/\" target=\"_blank\" rel=\"noopener\">\u003cstrong>Ombudsman for Athletes’ Rights\u003c/strong>\u003c/a> — Independent support and free legal guidance for athletes and sports professionals.\u003c/li>\u003cli>\u003ca href=\"https://www.cert.si/en/about-si-cert/\" target=\"_blank\" rel=\"noopener\">\u003cstrong>SI.CERT\u003c/strong>\u003c/a> — Slovenia’s national cybersecurity incident response centre, providing assistance with online security incidents.\u003c/li>\u003cli>\u003ca href=\"https://www.gov.si/drzavni-organi/vladne-sluzbe/urad-vlade-za-informacijsko-varnost/\" target=\"_blank\" rel=\"noopener\">\u003cstrong>Government Information Security Office\u003c/strong>\u003c/a> — Government authority responsible for national information security and cybersecurity.\u003c/li>\u003cli>\u003ca href=\"https://www.ip-rs.si/en/about/information-commissioner\" target=\"_blank\" rel=\"noopener\">\u003cstrong>Information Commissioner\u003c/strong>\u003c/a> — Independent authority overseeing personal data protection and privacy rights.\u003c/li>\u003cli>\u003ca href=\"https://oks.zvizgavka.si/\" target=\"_blank\" rel=\"noopener\">\u003cstrong>Olympic Committee of Slovenia: Whistleblowing Channel\u003c/strong>\u003c/a> — Reporting channel for raising concerns about misconduct within sport.\u003c/li>\u003c/ul>","note":"HTML allowed — linked resource names open official sources"}},"se":{"title":{"text":"Sweden"},"html":{"text":"\u003cp>In Sweden, potentially criminal online abuse, including threats, harassment and defamation, can be reported to the police. Athletes and sports professionals can also seek independent support or report misconduct within sport through the Swedish Sports Confederation’s Sports Ombudsman.\u003c/p>\u003cul>\u003cli>\u003ca href=\"https://polisen.se/utsatt-for-brott/polisanmalan/\" target=\"_blank\" rel=\"noopener\">\u003cstrong>Swedish Police\u003c/strong>\u003c/a> — Official reporting channel for potential crimes, including online threats, harassment and defamation. Reports can also be made by calling 114 14.\u003c/li>\u003cli>\u003ca href=\"https://www.rf.se/rf-arbetar-med/idrottsombudsmannen/kontakta-idrottsombudsmannen\" target=\"_blank\" rel=\"noopener\">\u003cstrong>Swedish Sports Confederation (RF): Sports Ombudsman\u003c/strong>\u003c/a> — Independent support and whistleblowing service for reporting harassment, abuse and misconduct within Swedish sport.\u003c/li>\u003c/ul>","note":"HTML allowed — linked resource names open official sources"}},"cz":{"title":{"text":"Czechia"},"html":{"text":"\u003cp>In Czechia, online abuse can be reported through several channels, depending on the nature of the incident. STOPonline accepts reports of illegal or harmful online content, including cyberbullying, cyber grooming, non-consensual sharing of intimate images and cyber threats. Reports are reviewed by specialists and may be referred to the Czech Police or international partners. Incidents involving potential criminal offences, such as threats, stalking or extortion, should be reported directly to the Czech Police. Individuals are encouraged to preserve evidence, including screenshots, messages and links, and can also report harmful content directly to online platforms.\u003c/p>\u003cul>\u003cli>\u003ca href=\"https://www.stoponline.cz/en/\" target=\"_blank\" rel=\"noopener\">\u003cstrong>STOPonline.cz\u003c/strong>\u003c/a> — Online reporting service operated by CZ.NIC in cooperation with CSIRT.CZ. Accepts reports of illegal or harmful online content and refers potentially illegal cases to relevant authorities. The service focuses on content assessment and reporting, not counselling.\u003c/li>\u003cli>\u003ca href=\"https://policie.gov.cz/hlaseni-kyberkriminality\" target=\"_blank\" rel=\"noopener\">\u003cstrong>Czech Police: Cybercrime Reporting\u003c/strong>\u003c/a> — Official information on reporting suspected cybercrime, including online threats, stalking, extortion and other potentially criminal activities.\u003c/li>\u003cli>\u003ca href=\"https://policie.gov.cz/kyberkriminalita/co-delat-vpripade-ze-se-setkate-spodezrelou-aktivitou-vonline-prostoru\" target=\"_blank\" rel=\"noopener\">\u003cstrong>Czech Police: Guidance on Suspicious Online Activity\u003c/strong>\u003c/a> — Practical guidance on responding to suspicious online activity, preserving evidence and seeking police assistance.\u003c/li>\u003c/ul>","note":"HTML allowed — linked resource names open official sources"}},"es":{"title":{"text":"Spain"},"html":{"text":"\u003cp>In Spain, potentially criminal online abuse, including harassment, threats and hate-related offences, can be reported to the Spanish National Police or Civil Guard. Individuals are encouraged to preserve evidence, including screenshots, messages and URLs. Additional services provide confidential guidance and assistance with removing harmful content.\u003c/p>\u003cul>\u003cli>\u003ca href=\"https://www.policia.es/\" target=\"_blank\" rel=\"noopener\">\u003cstrong>Spanish National Police (Policía Nacional)\u003c/strong>\u003c/a> and Civil Guard (Guardia Civil) — Official authorities for reporting potentially criminal online abuse.\u003c/li>\u003cli>\u003ca href=\"https://www.incibe.es/linea-de-ayuda-en-ciberseguridad\" target=\"_blank\" rel=\"noopener\">\u003cstrong>INCIBE: Cybersecurity Helpline (017)\u003c/strong>\u003c/a> — Free, confidential advice on cyberbullying, online harassment and digital privacy. This is an advisory service, not a formal criminal reporting channel.\u003c/li>\u003cli>\u003ca href=\"https://www.aepd.es/canalprioritario\" target=\"_blank\" rel=\"noopener\">\u003cstrong>Spanish Data Protection Agency (AEPD): Priority Channel\u003c/strong>\u003c/a> — Allows individuals to request the urgent removal of unlawfully shared sexual or violent content in particularly serious cases.\u003c/li>\u003c/ul>","note":"HTML allowed — linked resource names open official sources"}}}},"sorting":{"ui":{"eyebrow":{"text":"Ordering","note":"Removed from widget UI; kept for translators / legacy"},"prompt":{"text":"1. Put the steps below in the recommended order."},"hint":{"text":"Drag items or use the arrows to reorder, then submit."},"moveUp":{"text":"Move up"},"moveDown":{"text":"Move down"},"ok":{"text":"\u003cstrong>Correct!\u003c/strong> You’ve identified the recommended sequence for responding to online abuse on social media. Following a clear process helps preserve important information, reduce further exposure, and ensure the situation is reported or escalated appropriately.","note":"HTML allowed"},"bad":{"text":"\u003cstrong>Not quite. Review the options and try again.\u003c/strong>","note":"HTML allowed"}},"items":{"i1":{"text":"Assess the situation and your safety"},"i2":{"text":"Collect evidence"},"i3":{"text":"Record key details"},"i4":{"text":"Use platform safety tools"},"i5":{"text":"Report through the platform"},"i6":{"text":"Seek additional support or escalate when needed"}}},"trueFalse":{"bad":{"text":"\u003cstrong>Not quite. Review the statement and try again.\u003c/strong>","note":"HTML allowed"},"questions":{"q1":{"prompt":{"text":"If an athlete receives abusive content, they should delete it immediately and respond directly to the person responsible."},"choices":{"c0":{"text":"True"},"c1":{"text":"False"}},"ok":{"text":"\u003cstrong>Correct!\u003c/strong> It is recommended to collect relevant evidence before deleting content, and avoid engaging directly with the person responsible for the abuse.","note":"HTML allowed"}},"q2":{"prompt":{"text":"Publicly sharing abusive content can help address the situation by drawing more attention to it."},"choices":{"c0":{"text":"True"},"c1":{"text":"False"}},"ok":{"text":"\u003cstrong>Correct!\u003c/strong> Sharing or reposting abusive content can increase its reach and expose the person targeted, and others, to the harmful content again. Use appropriate reporting channels instead.","note":"HTML allowed"}},"q3":{"prompt":{"text":"AI can help identify potentially harmful content, but human judgement remains important when interpreting context."},"choices":{"c0":{"text":"True"},"c1":{"text":"False"}},"ok":{"text":"\u003cstrong>Correct!\u003c/strong> AI can support early detection and flag potentially harmful content for review, but context, language, and changing abuse tactics can make human judgement important.","note":"HTML allowed"}}}},"takeaways":{"heading":{"text":"Key Takeaways"},"items":{"i1":{"text":"\u003cstrong>Platform design influences how content spreads.\u003c/strong> Different digital environments shape who encounters content, how people interact with it, and how long it remains visible.","note":"HTML allowed"},"i2":{"text":"\u003cstrong>Online harm can be amplified.\u003c/strong> Recommendation systems, sharing, live interaction, and community dynamics can increase the reach and intensity of harmful content.","note":"HTML allowed"},"i3":{"text":"\u003cstrong>Abusive tactics can adapt.\u003c/strong> Harmful content may use altered language, visual formats, indirect targeting, or different digital spaces to make detection more difficult.","note":"HTML allowed"},"i4":{"text":"\u003cstrong>People can take steps to reduce exposure.\u003c/strong> Privacy controls, interaction settings, blocking, muting, and thoughtful choices about online spaces can support digital wellbeing.","note":"HTML allowed"},"i5":{"text":"\u003cstrong>Effective reporting follows a clear process.\u003c/strong> Assess the situation, document relevant evidence, report through an appropriate channel, and seek support or escalate when safety is at risk.","note":"HTML allowed"},"i6":{"text":"\u003cstrong>AI has a dual role.\u003c/strong> It can increase the scale and sophistication of harmful content, and it can also support detection, moderation, and other online safety measures.","note":"HTML allowed"},"i7":{"text":"\u003cstrong>Technology alone cannot address online abuse.\u003c/strong> Effective responses combine platform tools, responsible user behaviour, human judgement, organisational support, and appropriate regulation.","note":"HTML allowed"}}},"slide":{"title":{"text":"Module 3: How Online Harm Spreads","note":"Module / summary slide title"}}},"m4":{"lawTabs":{"ui":{"prompt":{"text":"Select a pathway"},"placeholder":{"text":"Select a pathway"},"pathwaysAria":{"text":"Legal pathways"},"seeExample":{"text":"See an example"},"backToPathway":{"text":"Back to pathway"},"returnMain":{"text":"Return to main page"},"closeAria":{"text":"Close"}},"tabs":{"t1":{"title":{"text":"Criminal law"},"image":{"text":"https://preview.scormstack.io/medias/courses/428b8e0e-9238-4608-a1a3-962afd799ccf/UAOA_pathway_crimina_64f037dc-941a-4af3-90b3-ac5e5fb45a9f.jpg","note":"CDN URL for scenario illustration"},"imageAlt":{"text":"Referee receiving repeated warning alerts on a phone"},"pathway":{"text":"\u003cp>\u003cstrong>What it can cover:\u003c/strong> Conduct that constitutes a criminal offence under the applicable law, which may include certain threats, stalking, hate crimes, or non-consensual sharing of intimate images.\u003c/p>\u003cp>\u003cstrong>Who takes action:\u003c/strong> Law enforcement may investigate, and the relevant prosecuting authority determines whether a case proceeds.\u003c/p>\u003cp>\u003cstrong>Possible outcomes:\u003c/strong> Criminal penalties can include fines or imprisonment, depending on the offence and jurisdiction.\u003c/p>","note":"HTML allowed"},"example":{"text":"\u003cp>Following a decision during a match, a referee begins receiving repeated messages in their social media from the same account. The messages become increasingly threatening and include references to seriously harming the referee and members of their family.\u003c/p>\u003cp>Depending on the applicable law and circumstances, threats of this nature could lead to a report to law enforcement and a criminal investigation.\u003c/p>","note":"HTML allowed"}},"t2":{"title":{"text":"Civil law"},"image":{"text":"https://preview.scormstack.io/medias/courses/428b8e0e-9238-4608-a1a3-962afd799ccf/UAOA_pathway_civil_e89ec7dc-a23c-4bea-af45-ba6d00b25544.jpg","note":"CDN URL for scenario illustration"},"imageAlt":{"text":"Athlete facing circulating online claims and a lost sponsorship"},"pathway":{"text":"\u003cp>\u003cstrong>What it can cover:\u003c/strong> Disputes involving legal rights between individuals or organisations, which may include defamation, harassment, misuse of private information, or other privacy-related claims.\u003c/p>\u003cp>\u003cstrong>Who takes action:\u003c/strong> The person or organisation bringing the claim initiates the legal process.\u003c/p>\u003cp>\u003cstrong>Possible outcomes:\u003c/strong> Depending on the applicable law, remedies can include compensation or court orders requiring particular conduct to stop.\u003c/p>","note":"HTML allowed"},"example":{"text":"\u003cp>False allegations about an athlete begin circulating online and are repeatedly shared. The claims damage the athlete’s professional reputation, and a sponsor ends its relationship with them after seeing such allegations.\u003c/p>\u003cp>Depending on the applicable law and circumstances, the athlete may be able to bring a civil claim seeking a remedy for the harm caused, including orders for removal of existing false content, injunctions to prevent further publication, monetary claims against the perpetuator if identifiable etc..\u003c/p>","note":"HTML allowed"}},"t3":{"title":{"text":"Administrative law and regulations"},"image":{"text":"https://preview.scormstack.io/medias/courses/428b8e0e-9238-4608-a1a3-962afd799ccf/UAOA_pathway_admin_55f163bb-0d7b-4f46-9cb3-20fd51f67cd0.jpg","note":"CDN URL for scenario illustration"},"imageAlt":{"text":"Athlete concerned about personal contact details exposed online"},"pathway":{"text":"\u003cp>\u003cstrong>What it can cover:\u003c/strong> Legal obligations enforced by regulators, including rules applying to online services or the handling of personal data.\u003c/p>\u003cp>\u003cstrong>Who takes action:\u003c/strong> Relevant regulatory authorities oversee and enforce these requirements. Individuals and organisations may also be able to submit complaints.\u003c/p>\u003cp>\u003cstrong>Possible outcomes:\u003c/strong> Regulators may investigate, require changes, or impose penalties where the applicable law gives them those powers.\u003c/p>","note":"HTML allowed"},"example":{"text":"\u003cp>An athlete discovers that their personal contact information has been published online without their permission. The information continues to circulate, creating concerns about their privacy and safety.\u003c/p>\u003cp>Depending on the applicable data protection rules, the athlete or their organisation may be able to raise the matter with the relevant regulatory authority.\u003c/p>","note":"HTML allowed"}}}},"limits":{"items":{"i1":{"title":{"text":"Jurisdiction"},"html":{"text":"\u003cp>Online abuse can cross national borders immediately. The person targeted, the person responsible, and the platform may all be located in different jurisdictions, with different laws and enforcement processes.\u003c/p>","note":"HTML allowed"}},"i2":{"title":{"text":"Identifying who is responsible"},"html":{"text":"\u003cp>Accounts may use pseudonyms, false identities, or limited identifying information, making it difficult to determine who is responsible for particular behaviour. Identifying an account holder can require information held by platforms and, in some cases, formal legal processes.\u003c/p>","note":"HTML allowed"}},"i3":{"title":{"text":"Enforcement"},"html":{"text":"\u003cp>The volume and speed of online activity can make investigation and enforcement difficult. Available resources, specialist expertise, evidentiary requirements, and enforcement priorities can all affect what happens after an incident is reported.\u003c/p>","note":"HTML allowed"}},"i4":{"title":{"text":"Legal thresholds"},"html":{"text":"\u003cp>Each harmful or abusive behaviour does not automatically constitute a legal offence or give rise to a legal claim. The applicable legal definition, evidence, context, and jurisdiction all matter.\u003c/p>\u003cp>This means that legal action is one part of the response to online abuse. Policies of the online platforms and the sporting organisations’ own standards and policies can also help address certain behaviours that may not have enough grounds for a legal action.\u003c/p>","note":"HTML allowed"}}}},"regions":{"ui":{"prompt":{"text":"Select a region"},"placeholder":{"text":"Select a region to see an example of how existing laws can apply to online behaviour."},"countriesAria":{"text":"Regions"}},"items":{"i1":{"title":{"text":"United Kingdom"},"html":{"text":"\u003cp>In the UK, several laws address harmful online conduct. The \u003cstrong>Online Safety Act 2023\u003c/strong> introduces offences relating to threatening communications, cyberflashing, and sharing or threatening to share intimate images without consent. The \u003cstrong>Protection from Harassment Act 1997\u003c/strong> also covers harassment and stalking, including conduct involving digital communications. The Online Safety Act additionally places duties on regulated platforms to address illegal content and protect children from harmful material. The applicable protections depend on the conduct and jurisdiction.\u003c/p>\u003cp>\u003cem>Source: \u003ca href=\"https://www.legislation.gov.uk/\" target=\"_blank\" rel=\"noopener\">Legislation.gov.uk\u003c/a>\u003c/em>\u003c/p>","note":"HTML allowed"}},"i2":{"title":{"text":"United States"},"html":{"text":"\u003cp>In the United States, online abuse is addressed through a combination of federal and state laws. Federal legislation, including \u003cstrong>18 U.S.C. 2261A\u003c/strong>, addresses certain forms of cyberstalking involving electronic communications. Other federal provisions cover threats and specific forms of online harassment, while state laws may provide additional protections against cyberbullying, harassment, stalking, and non-consensual sharing of intimate images. Legal definitions, enforcement, and available remedies vary by jurisdiction and the circumstances of each case.\u003c/p>\u003cp>\u003cem>Source: \u003ca href=\"https://uscode.house.gov/\" target=\"_blank\" rel=\"noopener\">U.S. Code\u003c/a>\u003c/em>\u003c/p>","note":"HTML allowed"}},"i3":{"title":{"text":"Czechia"},"html":{"text":"\u003cp>Czech law does not rely on a single offence of “online abuse”. Existing legislation can apply to specific harmful behaviours carried out online. For example, \u003cstrong>Section 354 of the Czech Criminal Code (Act No. 40/2009 Coll.)\u003c/strong> addresses stalking, including conduct carried out through electronic communications. \u003ca href=\"https://policie.gov.cz/stalking---nebezpecne-pronasledovani--354-trestniho-zakoniku\" target=\"_blank\" rel=\"noopener\">Czech Police guidance on stalking\u003c/a> explains this provision and identifies repeated social media messages, threats, misuse of personal data, and reputational attacks among behaviours that may occur in stalking cases.\u003c/p>\u003cp>The \u003cstrong>Czech Civil Code (Act No. 89/2012 Coll.)\u003c/strong> also protects personality rights, including a person’s dignity, honour and privacy. A person affected by unlawful interference can seek to have the interference stopped and its consequences remedied.\u003c/p>\u003cp>\u003cem>Source: \u003ca href=\"https://e-sbirka.gov.cz\" target=\"_blank\" rel=\"noopener\">e-Sbírka\u003c/a>\u003c/em>\u003c/p>","note":"HTML allowed"}},"i4":{"title":{"text":"Spain"},"html":{"text":"\u003cp>\u003ca href=\"https://www.boe.es/buscar/act.php?id=BOE-A-1995-25444\" target=\"_blank\" rel=\"noopener\">\u003cstrong>Spain’s Criminal Code (Organic Law 10/1995)\u003c/strong>\u003c/a> addresses several forms of online abuse. \u003cstrong>Article 172 ter\u003c/strong> covers stalking, including repeated unwanted contact, misuse of personal data and the creation of fake social-media profiles using someone’s image without consent when this causes harassment or humiliation.\u003c/p>\u003cp>\u003cstrong>Article 510\u003c/strong> addresses online hate speech, with increased penalties for certain offences when digital platforms make the content accessible to a large audience.\u003c/p>\u003cp>Victims can report suspected offences to \u003ca href=\"https://www.policia.es/\" target=\"_blank\" rel=\"noopener\">the Spanish National Police\u003c/a> or Civil Guard (Guardia Civil). Additional support is available through \u003ca href=\"https://www.incibe.es/linea-de-ayuda-en-ciberseguridad\" target=\"_blank\" rel=\"noopener\">INCIBE’s free, confidential 017 helpline\u003c/a>, while the \u003ca href=\"https://www.aepd.es/canalprioritario\" target=\"_blank\" rel=\"noopener\">Spanish Data Protection Agency (AEPD)\u003c/a> provides a Priority Channel for requesting the urgent removal of unlawfully shared sexual or violent content.\u003c/p>\u003cp>\u003cem>Source: \u003ca href=\"https://www.mpr.gob.es/Paginas/index.aspx\" target=\"_blank\" rel=\"noopener\">Gobierno de España\u003c/a>\u003c/em>\u003c/p>","note":"HTML allowed"}},"i5":{"title":{"text":"Sweden"},"html":{"text":"\u003cp>In Sweden, online hate or abuse is not a separate legal category. The Swedish Police explains that the same criminal laws generally apply to conduct online as they do offline, with relevant offences potentially including unlawful threats, harassment, defamation, insult, unlawful invasion of privacy, sexual harassment, unlawful identity misuse (e.g. fake profiles in someone else's name), and agitation against a population group. If an offence is motivated by, for example, the victim's ethnicity, religion or sexual orientation, this is an aggravating circumstance in sentencing.\u003c/p>\u003cp>Swedish law also recognises unlawful persecution, which can arise from repeated criminal acts against the same person. Police guidance specifically advises people experiencing stalking to preserve emails, text messages, call records and other digital communications as potential evidence.\u003c/p>\u003cp>\u003cem>Sources: \u003ca href=\"https://polisen.se\" target=\"_blank\" rel=\"noopener\">polisen.se\u003c/a>; \u003ca href=\"https://www.riksdagen.se/sv/dokument-och-lagar/\" target=\"_blank\" rel=\"noopener\">Swedish Parliament\u003c/a>\u003c/em>\u003c/p>","note":"HTML allowed"}},"i6":{"title":{"text":"Slovenia"},"html":{"text":"\u003cp>Slovenian law addresses online abuse through existing legislation covering specific harmful behaviours. A particularly relevant example is \u003cstrong>Article 134a of the Slovenian Criminal Code (KZ-1)\u003c/strong>, which defines stalking to include repeated attempts to establish unwanted contact through electronic communications, where the conduct causes fear or a sense of threat. Slovenian authorities have also recognised the online dimension of stalking in guidance concerning the application of this provision.\u003c/p>\u003cp>Slovenian Police guidance recognises online violence as including behaviours such as threats, harassment, spreading false or insulting content, misuse of photographs, impersonation and the creation of harmful fake profiles. Whether particular conduct constitutes a criminal offence depends on the circumstances of the individual case.\u003c/p>\u003cp>\u003cem>Source: \u003ca href=\"https://www.gov.si/\" target=\"_blank\" rel=\"noopener\">GOV.SI\u003c/a>\u003c/em>\u003c/p>","note":"HTML allowed"}}}},"check":{"questions":{"q1":{"prompt":{"text":"An abusive online incident may potentially involve more than one legal pathway. Which statement best explains why?"},"choices":{"c0":{"text":"The person targeted can choose whichever law they prefer."},"c1":{"text":"The same incident may raise different legal issues depending on the conduct, circumstances, and applicable law."},"c2":{"text":"Online incidents automatically involve criminal and civil law."},"c3":{"text":"Each social media platform determines which legal pathway applies."}},"ok":{"text":"\u003cstrong>Correct!\u003c/strong>","note":"HTML allowed"}},"q2":{"prompt":{"text":"Someone experiences harmful online behaviour, but the conduct does not meet the legal threshold for an offence or claim. What does this mean?"},"choices":{"c0":{"text":"The behaviour cannot be considered online abuse because the words used in the comments are not identical to what the law describes."},"c1":{"text":"The platform is solely responsible for responding and deciding what is online abuse."},"c2":{"text":"Other responses may still be available through platform rules, organisational policies, safeguarding procedures, or codes of conduct."},"c3":{"text":"The person should wait to see whether the behaviour becomes more serious."}},"ok":{"text":"\u003cstrong>Correct!\u003c/strong>","note":"HTML allowed"}},"q3":{"prompt":{"text":"Why can responding to online abuse through the law be challenging?"},"choices":{"c0":{"text":"Online behaviour falls outside national laws."},"c1":{"text":"People, platforms, and harmful activity may cross jurisdictions, and identifying those responsible or gathering evidence can be difficult."},"c2":{"text":"Online abuse can only be investigated when the responsible account uses a real name."},"c3":{"text":"Sporting organisations must complete their own investigation before authorities can become involved."}},"ok":{"text":"\u003cstrong>Correct!\u003c/strong>","note":"HTML allowed"}},"q4":{"prompt":{"text":"Which statement best describes how legal responses to online abuse can differ between countries?"},"choices":{"c0":{"text":"Every country has a specific offence called online abuse."},"c1":{"text":"European countries apply the same national laws because they share regional regulations."},"c2":{"text":"Online conduct is governed primarily by the country where the social media company is based."},"c3":{"text":"Countries may apply different existing laws to online conduct, and some legislation explicitly addresses particular digital behaviours."}},"ok":{"text":"\u003cstrong>Correct!\u003c/strong>","note":"HTML allowed"}}}},"takeaways":{"heading":{"text":"Key Takeaways"},"items":{"i1":{"text":"\u003cstrong>Online abuse can engage different areas of law.\u003c/strong> Criminal, civil, and administrative pathways involve different processes, actors, and possible outcomes.","note":"HTML allowed"},"i2":{"text":"\u003cstrong>More than one pathway may apply.\u003c/strong> The same incident can raise criminal, civil, or regulatory issues depending on the circumstances.","note":"HTML allowed"},"i3":{"text":"\u003cstrong>Legal responses depend on context and jurisdiction.\u003c/strong> The applicable law, available evidence, and location of the people and services involved can affect what action is possible.","note":"HTML allowed"},"i4":{"text":"\u003cstrong>Legal pathways have practical limits.\u003c/strong> Cross-border activity, identifying responsible individuals, enforcement capacity, and legal thresholds can make action difficult.","note":"HTML allowed"},"i5":{"text":"\u003cstrong>Responsibility extends beyond the law.\u003c/strong> Sporting organisations can establish policies, reporting procedures, safeguarding support, and consequences for harmful behaviour.","note":"HTML allowed"},"i6":{"text":"\u003cstrong>Sportsmanship extends to digital spaces.\u003c/strong> Respect, fair play, and responsible conduct remain relevant when people participate in sport online.","note":"HTML allowed"}}},"slide":{"title":{"text":"Module 4: Knowing Your Rights and Responsibilities","note":"Module / summary slide title"}}},"m5":{"layers":{"ui":{"prompt":{"text":"Explore the three layers of action."},"tracksAria":{"text":"Action layers"},"backToLayers":{"text":"Back to layers"},"done":{"text":"All three layers explored"},"openLayer":{"text":"Open layer"},"overview":{"text":"Overview"}},"tracks":{"t1":{"num":{"text":"1"},"title":{"text":"Individual"},"eyebrow":{"text":"Layer 1 · Individuals"},"labels":{"l1":{"text":"Protect yourself"},"l2":{"text":"Support others"},"l3":{"text":"Act safely"}},"intro":{"text":"\u003cp>\u003cstrong>Action starts with people.\u003c/strong>\u003c/p>\u003cp>Everyone in sport can contribute, whether they are experiencing online abuse, witnessing it, or supporting someone who has been targeted.\u003c/p>\u003cp>Explore ways in which you can:\u003c/p>","note":"HTML allowed"}},"t2":{"num":{"text":"2"},"title":{"text":"Organisations"},"eyebrow":{"text":"Layer 2 · Organisations"},"labels":{"l1":{"text":"Build frameworks"},"l2":{"text":"Strengthen safeguarding"},"l3":{"text":"Coordinate action"}},"intro":{"text":"\u003cp>Organisations can provide the framework, resources, and coordinated support needed to protect people and respond effectively to online abuse. These include sporting organisations and federations, clubs and associations, media organisations, online platforms, advocacy groups, and other institutions across the sporting community.\u003c/p>\u003cp>Explore how organisations can prepare for, prevent and respond to online abuse.\u003c/p>","note":"HTML allowed"}},"t3":{"num":{"text":"3"},"title":{"text":"Society"},"eyebrow":{"text":"Layer 3 · Society"},"labels":{"l1":{"text":"Advance education"},"l2":{"text":"Generate evidence"},"l3":{"text":"Shape norms"}},"intro":{"text":"\u003cp>Online abuse is often shaped by factors beyond the immediate control of individuals and organisations. The personal contexts of people, the technologies they use, their access to education, and the general cultural norms around them can all influence whether harmful behaviour is encouraged, normalised, challenged, or prevented.\u003c/p>\u003cp>Learn how wider social contexts can influence online abuse and help create safer digital spaces in sport.\u003c/p>","note":"HTML allowed"}}}},"flow1":{"ui":{"title":{"text":"What each of us can do"}},"steps":{"s1":{"title":{"text":"Protect yourself"},"body":{"text":"\u003cp>For athletes and others with public-facing roles:\u003c/p>\u003cul>\u003cli>\u003cstrong>Manage your exposure.\u003c/strong> Review privacy and safety settings and control who can contact, mention, or tag you.\u003c/li>\u003cli>\u003cstrong>Use safety tools.\u003c/strong> Mute, restrict, block, and report harmful accounts or content.\u003c/li>\u003cli>\u003cstrong>Preserve evidence.\u003c/strong> Save relevant information when behaviour may need to be reported or escalated.\u003c/li>\u003cli>\u003cstrong>Protect your wellbeing.\u003c/strong> You can choose to take a break from online interactions and seek support from people you trust.\u003c/li>\u003c/ul>\u003cdetails>\u003csummary>\u003cstrong>Why does this matter?\u003c/strong>\u003c/summary>\u003cp>Your wellbeing matters, and support is a shared responsibility. When people use safety and wellbeing tools, they are better equipped to prevent harm within the wider sporting community.\u003c/p>\u003c/details>","note":"HTML allowed"}},"s2":{"title":{"text":"Support others"},"body":{"text":"\u003cp>As a teammate, colleague, fan, friend, or bystander:\u003c/p>\u003cul>\u003cli>\u003cstrong>Avoid amplification.\u003c/strong> Prevent further circulation of abusive content.\u003c/li>\u003cli>\u003cstrong>Check in privately.\u003c/strong> Offer personal support to the person targeted.\u003c/li>\u003cli>\u003cstrong>Report appropriately.\u003c/strong> Take action through established channels, generally without public confrontation.\u003c/li>\u003cli>\u003cstrong>Speak up safely.\u003c/strong> Express concern about abusive behaviour or seek help from someone who can intervene, including organisational authorities or the police when necessary.\u003c/li>\u003c/ul>\u003cdetails>\u003csummary>\u003cstrong>Why does this matter?\u003c/strong>\u003c/summary>\u003cp>Supporting others strengthens the sporting community. Small actions from teammates, colleagues, friends, fans, and other bystanders can help create a social support system where people feel heard, protected, and cared for, and harmful behaviour is less likely to go unchallenged.\u003c/p>\u003c/details>","note":"HTML allowed"}},"s3":{"title":{"text":"Act safely"},"body":{"text":"\u003cp>When responding to online abuse, consider the situation, personal safety, and whether additional support is needed:\u003c/p>\u003cul>\u003cli>\u003cstrong>Assess the situation.\u003c/strong> Consider the nature of the behaviour, whether it is escalating, and whether anyone may be at risk.\u003c/li>\u003cli>\u003cstrong>Avoid unsafe engagement.\u003c/strong> Do not confront or engage directly when doing so could increase harm or place someone at risk.\u003c/li>\u003cli>\u003cstrong>Know when to seek support.\u003c/strong> Involve a trusted person or the appropriate organisational contact when the situation requires additional help.\u003c/li>\u003cli>\u003cstrong>Escalate safety concerns.\u003c/strong> Threats, repeated unwanted contact, exposure of personal information, or other safety concerns may require further organisational or external support.\u003c/li>\u003c/ul>\u003cdetails>\u003csummary>\u003cstrong>Why does this matter?\u003c/strong>\u003c/summary>\u003cp>Acting safely helps connect individual action with the right level of support. Recognising when a situation requires additional help allows others to become involved and helps ensure that safety remains the priority.\u003c/p>\u003c/details>","note":"HTML allowed"}}}},"flow2":{"ui":{"title":{"text":"What organisations can do"}},"steps":{"s1":{"title":{"text":"Prepare"},"body":{"text":"\u003cp>Develop policies and codes of conduct, provide education and training, and establish clear expectations for digital behaviour.\u003c/p>","note":"HTML allowed"}},"s2":{"title":{"text":"Protect"},"body":{"text":"\u003cp>Provide welfare and safeguarding support, platform safety tools, moderation, and appropriate mechanisms for people at risk.\u003c/p>","note":"HTML allowed"}},"s3":{"title":{"text":"Respond"},"body":{"text":"\u003cp>Create accessible reporting pathways, preserve appropriate records, apply organisational procedures, and coordinate escalation when necessary.\u003c/p>","note":"HTML allowed"}},"s4":{"title":{"text":"Connect"},"body":{"text":"\u003cp>Work with other organisations, platforms, authorities, researchers, advocacy groups, and specialist services when a response extends beyond the organisation’s own capabilities.\u003c/p>","note":"HTML allowed"}},"s5":{"title":{"text":"Stronger together"},"body":{"text":"\u003cp>\u003cstrong>Organisations are stronger when they work together.\u003c/strong> Clubs can provide frontline support, federations set shared standards, platforms enable reporting and moderation, media organisations manage published content, and advocacy groups may contribute with specialised support and education. Together, they can create a coordinated network of protection and response against online abuse.\u003c/p>\u003cp>UAOA’s Organisational Readiness Platform (ORP) supports these efforts by helping sporting organisations assess their preparedness, identify areas for improvement, and strengthen their approaches to preventing and responding to online abuse.\u003c/p>","note":"HTML allowed"}}}},"flow3":{"ui":{"title":{"text":"What shapes safer digital sport"}},"steps":{"s1":{"title":{"text":"Education"},"body":{"text":"\u003cp>Education can help people recognise online abuse, understand its consequences, and know how to respond safely. Digital and media literacy can also strengthen critical thinking about what behaviours are appropriate in online settings.\u003c/p>","note":"HTML allowed"}},"s2":{"title":{"text":"Shared standards"},"body":{"text":"\u003cp>Clear expectations help establish which behaviours are considered acceptable within sporting communities. Shared standards around respect, inclusion, fair play, and digital participation can guide behaviour and give individuals and organisations a stronger basis for challenging abuse.\u003c/p>","note":"HTML allowed"}},"s3":{"title":{"text":"Research and evidence"},"body":{"text":"\u003cp>Evidence and data-driven research help map the patterns where online abuse occurs, how harmful behaviour evolves in time, and which responses are more effective. Stronger knowledge can inform prevention, education, organisational practice, technology, and policy.\u003c/p>","note":"HTML allowed"
