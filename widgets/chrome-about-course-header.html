<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UAOA · About course header</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  body {
    font-family: 'Cerebri Sans Pro', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  /* Same column as sibling blocks: contentMaxWidth 3 → max-w-3xl px-4 mx-auto */
  .column {
    max-width: 48rem;
    margin: 0 auto;
    padding: 0 1rem;
    box-sizing: border-box;
  }
  .banner {
    display: block;
    width: 100%;
    position: relative;
    overflow: hidden;
    background: #1c3564;
    border-radius: 10px;
    min-height: 176px;
    padding: 32px 36% 32px 28px;
    box-sizing: border-box;
  }
  .title {
    display: block;
    color: #ffffff;
    font-size: 36px;
    font-weight: 700;
    line-height: 1.15;
  }
  .subtitle {
    display: block;
    color: #ffffff;
    font-size: 24px;
    font-weight: 400;
    line-height: 1.3;
    margin-top: 8px;
  }
  .figures {
    position: absolute;
    right: 10px;
    bottom: -16px;
    width: 34%;
    max-width: 300px;
    height: auto;
    pointer-events: none;
  }
</style>
</head>
<body>
  <!-- Static review preview of the live About This Course UAOA Header banner. -->
  <div class="column">
    <div class="banner uaoa-about-header" role="img" aria-label="UAOA eLearning Course">
      <span class="title">UAOA eLearning Course</span>
      <span class="subtitle">Understanding and Responding<br>to Online Abuse in Sport</span>
      <img class="figures" src="https://preview.scormstack.io/medias/courses/428b8e0e-9238-4608-a1a3-962afd799ccf/art_uaoa_header_figu_fb0c9f9a-1f10-453c-b6ca-6324e485bb78.png" alt="" width="300" height="84" />
    </div>
  </div>
</body>
</html>
