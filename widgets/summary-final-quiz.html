<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; color-scheme: light; }
  body {
    font-family: 'Cerebri Sans Pro', system-ui, -apple-system, 'Segoe UI', sans-serif;
    color: #091324; padding: 8px 4px 12px;
  }

  /* Open layout — no card chrome */
  .shell {
    width: 100%; max-width: 760px; margin: 0 auto;
    display: flex; flex-direction: column; gap: 0;
    position: relative;
  }

  .q-index {
    margin: 0 0 8px;
    font-size: 15px; line-height: 20px; font-weight: 800;
    color: #21b7cb; letter-spacing: .02em;
  }
  .q-index .arrow { margin-left: 4px; }
  .bar {
    height: 4px; border-radius: 999px; background: #E8ECF3; overflow: hidden;
    margin: 0 0 14px;
  }
  .bar > i {
    display: block; height: 100%; width: 0; border-radius: inherit;
    background: linear-gradient(90deg, #7C5297, #21b7cb);
    transition: width .35s ease-out;
  }

  .prompt {
    margin: 0 0 8px;
    font-size: clamp(22px, 3.2vw, 28px); line-height: 1.3;
    font-weight: 800; color: #1C3564;
  }
  .prompt .scenario {
    display: block; font-weight: 700; color: #091324; margin-bottom: 10px;
    font-size: 0.92em;
  }
  .prompt strong { color: #1C3564; }

  .hint {
    margin: 0 0 22px;
    font-size: 14px; line-height: 20px; font-weight: 600; color: #5A6478;
  }

  .options { display: flex; flex-direction: column; gap: 12px; margin: 0 0 18px; }

  .opt {
    display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
    font: inherit; cursor: pointer;
    border: 1.5px solid #E5E7EB; border-radius: 999px;
    padding: 14px 18px; background: #fff;
    transition: border-color .15s, background .15s, box-shadow .15s;
  }
  .opt:hover:not(:disabled) { border-color: #21b7cb; }
  .opt:focus-visible { outline: none; box-shadow: 0 0 0 2px #fff, 0 0 0 4px #7C5297; }
  .opt.pending {
    border-color: #21b7cb; background: #E8F7F9;
  }
  .opt.selected {
    border-color: #21b7cb; background: #E8F7F9;
  }
  .opt:disabled { cursor: default; }
  .opt.locked:not(.selected) { opacity: .72; }

  .badge {
    flex: none; width: 32px; height: 32px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 8px; border: 1.5px solid #D1D5DB;
    background: #fff; color: #1C3564;
    font-size: 14px; font-weight: 800;
  }
  .opt.pending .badge,
  .opt.selected .badge {
    border-color: #21b7cb; background: #21b7cb; color: #fff;
  }

  /* Q11: answer | shared divider column | links (left-aligned to pipe). D: no divider. */
  .lbl-stack {
    flex: 1 1 auto; min-width: 0;
    display: block;
  }
  .lbl-stack.has-links {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 1px minmax(10.5rem, 38%);
    column-gap: 14px;
    align-items: center;
  }
  .lbl {
    min-width: 0;
    font-size: 15px; line-height: 22px; font-weight: 600; color: #091324;
  }
  .opt-divider {
    width: 1px; align-self: stretch;
    margin: 2px 0; background: #D1D5DB;
  }
  .opt-links {
    min-width: 0;
    font-size: 13px; line-height: 18px; font-weight: 700;
    text-align: left;
  }
  .opt-link {
    color: #1C3564; text-decoration: underline; text-underline-offset: 2px;
  }
  .opt-link:hover { color: #21b7cb; }
  .opt-link:focus-visible {
    outline: none; box-shadow: 0 0 0 2px #fff, 0 0 0 4px #7C5297; border-radius: 4px;
  }
  .opt-link-sep { color: #5A6478; font-weight: 600; }

  @media (max-width: 520px) {
    .lbl-stack.has-links {
      grid-template-columns: minmax(0, 1fr) 1px minmax(8.5rem, 40%);
      column-gap: 10px;
    }
    .opt-links { font-size: 12px; }
  }

  .check {
    flex: none; width: 22px; height: 22px; color: #21b7cb;
    opacity: 0; transform: scale(.85);
    transition: opacity .15s, transform .15s;
  }
  .opt.pending .check,
  .opt.selected .check { opacity: 1; transform: scale(1); }

  .confirm-row {
    display: flex; align-items: center; gap: 14px;
    margin: 0 0 18px; min-height: 48px;
  }
  .btn-ok {
    font: inherit; font-weight: 800; font-size: 15px;
    color: #fff; background: #F1A01F; border: 0;
    border-radius: 999px; padding: 12px 22px;
    cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
    transition: background .15s, opacity .15s;
  }
  .btn-ok:hover:not(:disabled) { background: #D35420; }
  .btn-ok:disabled {
    opacity: .35; cursor: default; pointer-events: none;
  }
  .btn-ok:focus-visible { outline: none; box-shadow: 0 0 0 2px #fff, 0 0 0 4px #7C5297; }
  .btn-ok svg { flex: none; }
  .enter-hint {
    font-size: 13px; line-height: 18px; font-weight: 600; color: #5A6478;
  }
  .enter-hint kbd {
    font: inherit; font-weight: 800; color: #5A6A85;
  }
  .confirm-row.is-hidden { visibility: hidden; pointer-events: none; }

  /* Feedback response popup — unique next label dismisses + advances */
  .feedback-modal {
    position: fixed; inset: 0; z-index: 35;
    display: flex; align-items: center; justify-content: center;
    padding: 20px 16px;
    /* Full white-out — hide quiz chrome; only the feedback card remains */
    background: #fff;
    opacity: 0; pointer-events: none;
    transition: opacity .2s ease;
  }
  .feedback-modal.show { opacity: 1; pointer-events: auto; }
  .feedback-dialog {
    width: min(540px, 100%);
    max-height: min(80vh, 640px);
    overflow: auto;
    background: #fff; border: 1px solid #E5E7EB; border-radius: 18px;
    box-shadow: 0 18px 40px rgba(28,53,100,.18);
    padding: 26px 26px 22px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .feedback {
    margin: 0; padding: 4px 0 4px 14px;
    font-size: 17px; line-height: 27px; color: #091324;
    border-left: 3px solid #21b7cb;
  }
  .feedback strong { color: #1C3564; font-weight: 800; }
  .feedback-actions {
    display: flex; justify-content: flex-end; margin-top: 4px;
  }

  /* Readiness score flip modal
     - .score-modal = solid white backdrop (quiz behind fully covered)
     - .face = scorecard; .is-pass / .is-fail two-tone (match correct/incorrect feedback) */
  .score-modal {
    position: fixed; inset: 0; z-index: 40;
    display: flex; align-items: center; justify-content: center;
    padding: 20px 16px;
    background: #fff;
    opacity: 0; pointer-events: none;
    transition: opacity .25s ease;
  }
  .score-modal.show { opacity: 1; pointer-events: auto; }
  .flip-scene {
    width: min(504px, 100%);
    height: min(552px, 86vh);
    perspective: 1600px;
  }
  .flip-card {
    position: relative; width: 100%; height: 100%;
    transform-style: preserve-3d;
    transition: transform .7s cubic-bezier(.2,.7,.2,1);
    cursor: pointer;
  }
  .flip-card:focus-visible { outline: none; box-shadow: 0 0 0 3px #fff, 0 0 0 5px #7C5297; border-radius: 22px; }
  .flip-card.is-flipped { transform: rotateY(180deg); cursor: default; }
  .face {
    position: absolute; inset: 0;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border-radius: 22px; border: 1.5px solid #C5D0E4;
    background: #EEF3FB;
    box-shadow: 0 18px 40px rgba(28,53,100,.18);
    padding: 32px 32px 28px;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  /* Pass ≥60% — correct-answer two-tone (lighter fill + darker border) */
  .face.is-pass {
    background: #E6F6F8;
    border-color: #21B7CB;
  }
  .face.is-pass .you-scored,
  .face.is-pass .pct-huge,
  .face.is-pass .back-pct,
  .face.is-pass .back-body,
  .face.is-pass .click-complete {
    color: #03707D;
  }
  .face.is-pass .back-note { color: #03707D; opacity: .85; }
  /* Fail — incorrect-answer two-tone */
  .face.is-fail {
    background: #FEF3E2;
    border-color: #D35420;
  }
  .face.is-fail .you-scored,
  .face.is-fail .pct-huge,
  .face.is-fail .back-pct,
  .face.is-fail .back-body,
  .face.is-fail .back-note,
  .face.is-fail .click-complete {
    color: #990000;
  }
  .face-front {
    align-items: center; justify-content: space-between; text-align: center;
  }
  .face-back { transform: rotateY(180deg); }
  .you-scored {
    margin: 8px 0 0; font-size: 24px; line-height: 30px; font-weight: 800;
    letter-spacing: .04em; text-transform: uppercase; color: #1C3564;
  }
  .pct-huge {
    margin: 0; font-size: clamp(84px, 20vw, 128px); line-height: 1;
    font-weight: 800; color: #21b7cb; letter-spacing: -0.03em;
  }
  .pct-huge .unit { font-size: .45em; margin-left: .05em; }
  .click-complete {
    margin: 0 0 8px; font-size: 16px; line-height: 24px; font-weight: 700; color: #7C5297;
  }
  .back-pct {
    margin: 0 0 20px; align-self: flex-start;
    font-size: 44px; line-height: 48px; font-weight: 800; color: #21b7cb;
  }
  .back-pct .unit { font-size: .55em; }
  .back-body {
    margin: 0 0 16px; font-size: 19px; line-height: 30px; font-weight: 600; color: #091324;
    text-align: left;
  }
  .back-note {
    margin: 0 0 20px; font-size: 16px; line-height: 26px; color: #5A6A85; text-align: left;
  }
  .back-actions {
    margin-top: auto; display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap;
    flex: none; padding-top: 8px;
  }
  .btn-primary {
    font: inherit; font-weight: 700; font-size: 15px;
    color: #fff; background: #1C3564; border: 0;
    border-radius: 999px; padding: 12px 22px; cursor: pointer;
  }
  .btn-primary:hover { background: #152A52; }
  .btn-primary:focus-visible { outline: none; box-shadow: 0 0 0 2px #fff, 0 0 0 4px #7C5297; }
  .btn-ghost {
    font: inherit; font-weight: 700; font-size: 15px;
    color: #1C3564; background: transparent;
    border: 1.5px solid #1C3564; border-radius: 999px;
    padding: 11px 20px; cursor: pointer;
  }
  .btn-ghost:hover { background: #EEF3FB; }
  .btn-ghost:focus-visible { outline: none; box-shadow: 0 0 0 2px #fff, 0 0 0 4px #7C5297; }
  .btn-ghost.is-hidden,
  .btn-primary.is-hidden { display: none; }

  @media (max-width: 560px) {
    .prompt { font-size: 20px; }
    .opt { border-radius: 16px; padding: 12px 14px; }
  }
</style></head><body>
<div class="shell" id="shell">
  <div id="quiz">
    <p class="q-index" id="qIndex" aria-live="polite"><span id="qIndexN">1</span><span class="arrow">→</span></p>
    <div class="bar" id="progressBar" role="progressbar" aria-valuemin="1" aria-valuemax="11" aria-valuenow="1" aria-label="Quiz progress"><i id="bar"></i></div>
    <p class="prompt" id="prompt"></p>
    <p class="hint" id="hint" data-i18n="summary.quiz.ui.chooseOne">Choose one answer</p>
    <div class="options" id="options" role="radiogroup" data-i18n-aria="summary.quiz.ui.choicesAria" aria-label="Answer choices"></div>
    <div class="confirm-row" id="confirmRow">
      <button type="button" class="btn-ok" id="okBtn" disabled>
        <span data-i18n="summary.quiz.ui.ok">OK</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 6 9 17l-5-5"/>
        </svg>
      </button>
      <span class="enter-hint" id="enterHint"><span data-i18n="summary.quiz.ui.pressEnter">press Enter ↵</span></span>
    </div>
  </div>
</div>

<div class="feedback-modal" id="feedbackModal" aria-hidden="true" inert>
  <div class="feedback-dialog" role="dialog" aria-modal="true" aria-labelledby="feedback">
    <div class="feedback" id="feedback" role="status"></div>
    <div class="feedback-actions">
      <button type="button" class="btn-primary" id="feedbackAdvance"></button>
    </div>
  </div>
</div>

<div class="score-modal" id="scoreModal" aria-hidden="true" inert>
  <div class="flip-scene">
    <div class="flip-card" id="flipCard" role="button" tabindex="0" aria-label="Readiness score card">
      <div class="face face-front">
        <p class="you-scored" id="youScored">You scored</p>
        <p class="pct-huge" id="pctHuge"><span id="pctFront">0</span><span class="unit">%</span></p>
        <p class="click-complete" id="clickComplete">Click to complete</p>
      </div>
      <div class="face face-back">
        <p class="back-pct" id="pctBackWrap"><span id="pctBack">0</span><span class="unit">%</span></p>
        <p class="back-body" id="scoreBody"></p>
        <p class="back-note" id="scoreNote"></p>
        <div class="back-actions">
          <button type="button" class="btn-ghost is-hidden" id="retryBtn" data-i18n="common.tryAgain">Try again</button>
          <button type="button" class="btn-primary" id="finishBtn">Close</button>
        </div>
      </div>
    </div>
  </div>
</div>
<!--UAOA_I18N-->
<script>
(function(){
  var t = window.t || function (k, fb) { return fb != null ? fb : k; };
  if (typeof window.applyDataI18n === 'function') window.applyDataI18n(document);

  var LINK_FALLBACKS = {
    act: [
      { href: 'https://unitedagainstonlineabuse.com/resources/', label: 'UAOA resources' },
      { href: 'https://unitedagainstonlineabuse.com/uaoa-day/', label: '#UAOAday' }
    ],
    learn: [
      { href: 'https://unitedagainstonlineabuse.com/webinar-series/', label: 'UAOA webinar series' }
    ],
    org: [
      {
        href: 'https://orp.unitedagainstonlineabuse.com/',
        label: 'UAOA – Organisational Readiness Platform'
      }
    ]
  };

  var LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  var MAX_ATTEMPTS = 3;
  var PASS_PCT = 60;

  // answer: correct index for scored items; null = ungraded (Q11)
  // linkKeys: optional Q11 resource keys (null = no link for that choice)
  var QUESTION_META = [
    { id: 'q1', answer: 2, choiceCount: 3 },
    { id: 'q2', answer: 0, choiceCount: 3 },
    { id: 'q3', answer: 2, choiceCount: 3 },
    { id: 'q4', answer: 2, choiceCount: 3 },
    { id: 'q5', answer: 1, choiceCount: 3 },
    { id: 'q6', answer: 0, choiceCount: 3 },
    { id: 'q7', answer: 1, choiceCount: 3 },
    { id: 'q8', answer: 0, choiceCount: 3 },
    { id: 'q9', answer: 1, choiceCount: 3 },
    { id: 'q10', answer: 3, choiceCount: 4 },
    { id: 'q11', answer: null, choiceCount: 4, linkKeys: ['act', 'learn', 'org', null] }
  ];

  function resolveI18n(key) {
    var pack = window.UAOA_I18N;
    if (!pack || !key) return undefined;
    var parts = String(key).split('.');
    var cur = pack;
    for (var i = 0; i < parts.length; i++) {
      if (cur == null || typeof cur !== 'object') return undefined;
      cur = cur[parts[i]];
    }
    return cur;
  }

  function unwrapText(val) {
    if (val == null) return undefined;
    if (typeof val === 'string') return val;
    if (typeof val === 'object' && typeof val.text === 'string') return val.text;
    return undefined;
  }

  /** Returns [{href,label}, ...] or null. Supports single {text,url} or {items:[...]} catalogs. */
  function resourceLinks(key) {
    if (!key) return null;
    var out = [];
    var node = resolveI18n('summary.quiz.questions.q11.links.' + key);
    if (node && Array.isArray(node.items)) {
      node.items.forEach(function (item) {
        var href = unwrapText(item && item.url) || '';
        var label = unwrapText(item) || '';
        if (href && label) out.push({ href: href, label: label });
      });
    } else if (node) {
      var href = unwrapText(node.url) || t('summary.quiz.questions.q11.links.' + key + '.url', '');
      var label = unwrapText(node) || t('summary.quiz.questions.q11.links.' + key, key);
      if (href && label) out.push({ href: href, label: label });
    }
    if (!out.length) {
      var fb = LINK_FALLBACKS[key];
      if (Array.isArray(fb) && fb.length) out = fb.slice();
    }
    return out.length ? out : null;
  }

  function appendInlineLinks(parent, links) {
    if (!links || !links.length) return;
    parent.classList.add('has-links');
    var divider = document.createElement('span');
    divider.className = 'opt-divider';
    divider.setAttribute('aria-hidden', 'true');
    parent.appendChild(divider);

    var row = document.createElement('span');
    row.className = 'opt-links';
    links.forEach(function (link, li) {
      if (li > 0) {
        var sep = document.createElement('span');
        sep.className = 'opt-link-sep';
        sep.textContent = ' / ';
        row.appendChild(sep);
      }
      var a = document.createElement('a');
      a.className = 'opt-link';
      a.href = link.href;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.textContent = link.label;
      a.addEventListener('click', function (e) {
        e.stopPropagation();
      });
      a.addEventListener('mousedown', function (e) {
        e.stopPropagation();
      });
      row.appendChild(a);
    });
    parent.appendChild(row);
  }

  var Q = QUESTION_META.map(function (m) {
    var base = 'summary.quiz.questions.' + m.id;
    var choices = [];
    for (var c = 0; c < m.choiceCount; c++) choices.push(t(base + '.choices.c' + c));
    var links = null;
    if (m.linkKeys) {
      links = m.linkKeys.map(function (key) { return resourceLinks(key); });
    }
    return {
      id: m.id,
      prompt: t(base + '.prompt'),
      choices: choices,
      links: links,
      answer: m.answer,
      reveal: t(base + '.reveal'),
      next: t(base + '.next')
    };
  });

  var i = 0;
  var pending = null;   // selected but not yet confirmed
  var answered = false;
  var locking = false;
  var scoredTotal = QUESTION_META.filter(function (m) { return m.answer != null; }).length;
  var responses = [];
  var attempt = 0;
  var outcome = null; // 'pass' | 'retry' | 'exhausted'
  var scoreReported = false;

  function correctCount() {
    var n = 0;
    QUESTION_META.forEach(function (m, idx) {
      if (m.answer != null && responses[idx] === m.answer) n += 1;
    });
    return n;
  }

  function publishReadinessScore(pct) {
    var payload = 'uaoa-final-quiz-score|' + String(pct);
    try { window.postMessage(payload, '*'); } catch (e0) {}
    try { window.parent && window.parent.postMessage(payload, '*'); } catch (e1) {}
    try { window.top && window.top.postMessage(payload, '*'); } catch (e2) {}
  }

  function reportScoreToScorm(finalizing) {
    var points = correctCount();
    var total = scoredTotal || 10;
    var pct = Math.round((points / total) * 100);
    try {
      if (window.SCORMSTACK && typeof SCORMSTACK.submitScore === 'function') {
        SCORMSTACK.submitScore({
          score: points,
          totalPoints: total,
          scorePercent: pct,
          attempts: Math.max(1, attempt)
        });
        if (finalizing) scoreReported = true;
      }
    } catch (e) {}
    publishReadinessScore(pct);
  }

  function markComplete() {
    try {
      reportScoreToScorm(true);
      if (window.SCORMSTACK && typeof SCORMSTACK.markBlockCompleted === 'function') {
        SCORMSTACK.markBlockCompleted();
      }
    } catch (e) {}
  
    try {
      window.__uaoaInteractiveComplete = true;
      window.__uaoaAwaitComplete = false;
      try {
        var __uaoaAf2 = window.frameElement;
        if (__uaoaAf2) {
          __uaoaAf2.setAttribute('data-uaoa-complete', '1');
          __uaoaAf2.removeAttribute('data-uaoa-await');
        }
      } catch (__uaoaAe2) {}
      var __uaoaFrame = window.frameElement;
      if (__uaoaFrame && __uaoaFrame.ownerDocument) {
        __uaoaFrame.ownerDocument.dispatchEvent(new CustomEvent('uaoa-interactive-completed', {
          bubbles: true,
          detail: { frame: __uaoaFrame }
        }));
      }
    } catch (__uaoaE2) {}}

  function syncHeight() {
    try {
      var f = window.frameElement;
      if (f) {
        f.style.setProperty('height', Math.ceil(document.documentElement.scrollHeight) + 'px', 'important');
        f.style.setProperty('border', '0', 'important');
      }
    } catch (e) {}
  }

  var prompt = document.getElementById('prompt');
  var options = document.getElementById('options');
  var feedbackModal = document.getElementById('feedbackModal');
  var feedback = document.getElementById('feedback');
  var feedbackAdvance = document.getElementById('feedbackAdvance');
  var qIndexN = document.getElementById('qIndexN');
  var progressBar = document.getElementById('progressBar');
  var bar = document.getElementById('bar');
  var confirmRow = document.getElementById('confirmRow');
  var okBtn = document.getElementById('okBtn');
  var scoreModal = document.getElementById('scoreModal');
  var flipCard = document.getElementById('flipCard');
  var pctFront = document.getElementById('pctFront');
  var pctBack = document.getElementById('pctBack');
  var scoreBody = document.getElementById('scoreBody');
  var scoreNote = document.getElementById('scoreNote');
  var finishBtn = document.getElementById('finishBtn');
  var retryBtn = document.getElementById('retryBtn');
  var clickComplete = document.getElementById('clickComplete');
  var flipped = false;

  document.getElementById('youScored').textContent = t('summary.quiz.score.youScored', 'You scored');
  clickComplete.textContent = t('summary.quiz.score.clickToComplete', 'Click to complete');
  finishBtn.textContent = t('summary.quiz.score.finish', 'Close');
  if (typeof window.applyDataI18n === 'function') window.applyDataI18n(retryBtn.parentNode);

  function closeScoreModal() {
    scoreModal.classList.remove('show');
    scoreModal.setAttribute('aria-hidden', 'true');
    scoreModal.setAttribute('inert', '');
  }

  finishBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    if (outcome === 'retry') return;
    closeScoreModal();
    markComplete();
  });

  retryBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    if (outcome !== 'retry') return;
    restartQuiz();
  });

  function updateProgress() {
    var n = i + 1;
    var total = Q.length;
    bar.style.width = Math.round((n / total) * 100) + '%';
    progressBar.setAttribute('aria-valuemax', String(total));
    progressBar.setAttribute('aria-valuenow', String(n));
    progressBar.setAttribute(
      'aria-label',
      t('summary.quiz.ui.questionOf', 'Question {n} of {total}')
        .replace('{n}', String(n))
        .replace('{total}', String(total))
    );
  }

  function checkSvg() {
    return '<svg class="check" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';
  }

  function fillOptions(q) {
    options.innerHTML = '';
    q.choices.forEach(function (label, idx) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'opt';
      b.setAttribute('role', 'radio');
      b.setAttribute('aria-checked', 'false');

      var badge = document.createElement('span');
      badge.className = 'badge';
      badge.textContent = LETTERS.charAt(idx);

      var stack = document.createElement('span');
      stack.className = 'lbl-stack';
      var lbl = document.createElement('span');
      lbl.className = 'lbl';
      lbl.textContent = label;
      stack.appendChild(lbl);
      appendInlineLinks(stack, q.links && q.links[idx]);

      b.appendChild(badge);
      b.appendChild(stack);
      b.insertAdjacentHTML('beforeend', checkSvg());
      b.addEventListener('click', function () { selectPending(idx, b); });
      options.appendChild(b);
    });
  }

  function setOkEnabled(on) {
    okBtn.disabled = !on;
  }

  function feedbackOpen() {
    return feedbackModal.classList.contains('show');
  }

  function openFeedback(q, choiceIdx) {
    feedback.innerHTML = q.reveal;
    feedbackAdvance.textContent = q.next || t('common.next', 'Next');
    feedbackModal.classList.add('show');
    feedbackModal.setAttribute('aria-hidden', 'false');
    feedbackModal.removeAttribute('inert');
    try { feedbackAdvance.focus(); } catch (e) {}
  }

  function closeFeedback() {
    feedbackModal.classList.remove('show');
    feedbackModal.setAttribute('aria-hidden', 'true');
    feedbackModal.setAttribute('inert', '');
    feedback.innerHTML = '';
    feedbackAdvance.textContent = '';
  }

  function optionNodes() {
    return options.querySelectorAll('.opt');
  }

  function selectPending(idx, btn) {
    if (answered || responses[i] != null) return;
    pending = idx;
    var nodes = optionNodes();
    nodes.forEach(function (el, n) {
      el.classList.toggle('pending', n === idx);
      el.setAttribute('aria-checked', n === idx ? 'true' : 'false');
    });
    setOkEnabled(true);
    syncHeight();
  }

  function confirmAnswer() {
    if (answered || responses[i] != null) return;
    if (pending == null) return;
    var q = Q[i];
    var idx = pending;
    answered = true;
    responses[i] = idx;

    var nodes = optionNodes();
    nodes.forEach(function (el, n) {
      el.disabled = true;
      el.classList.remove('pending');
      el.classList.toggle('selected', n === idx);
      el.classList.toggle('locked', n !== idx);
      el.setAttribute('aria-checked', n === idx ? 'true' : 'false');
    });

    setOkEnabled(false);
    confirmRow.classList.add('is-hidden');
    openFeedback(q, idx);
    syncHeight();
  }

  function restoreAnswered() {
    var prev = responses[i];
    if (prev == null) return false;
    answered = true;
    pending = prev;
    var nodes = optionNodes();
    nodes.forEach(function (el, n) {
      el.disabled = true;
      el.classList.toggle('selected', n === prev);
      el.classList.toggle('locked', n !== prev);
      el.setAttribute('aria-checked', n === prev ? 'true' : 'false');
    });
    confirmRow.classList.add('is-hidden');
    return true;
  }

  function render() {
    closeFeedback();
    var q = Q[i];
    answered = false;
    pending = null;
    qIndexN.textContent = String(i + 1);
    updateProgress();
    prompt.innerHTML = q.prompt;
    confirmRow.classList.remove('is-hidden');
    setOkEnabled(false);
    fillOptions(q);
    restoreAnswered();
    syncHeight();
  }

  function lockLayout() {
    if (locking) return;
    locking = true;
    var saved = i;
    var modalOpen = scoreModal.classList.contains('show');
    var wasFlipped = flipped;
    var fbOpen = feedbackOpen();

    prompt.style.minHeight = '';
    options.style.minHeight = '';

    var maxP = 0, maxO = 0;
    for (var n = 0; n < Q.length; n++) {
      var q = Q[n];
      prompt.innerHTML = q.prompt;
      maxP = Math.max(maxP, prompt.getBoundingClientRect().height);
      fillOptions(q);
      maxO = Math.max(maxO, options.getBoundingClientRect().height);
    }

    prompt.style.minHeight = Math.ceil(maxP) + 'px';
    options.style.minHeight = Math.ceil(maxO) + 'px';

    i = saved;
    locking = false;
    render();
    if (modalOpen) {
      scoreModal.classList.add('show');
      scoreModal.setAttribute('aria-hidden', 'false');
      scoreModal.removeAttribute('inert');
      if (wasFlipped) flipCard.classList.add('is-flipped');
    } else if (fbOpen && responses[i] != null) {
      openFeedback(Q[i], responses[i]);
    }
    syncHeight();
  }

  function pctScore() {
    if (!scoredTotal) return 0;
    return Math.round((correctCount() / scoredTotal) * 100);
  }

  function passed() {
    return pctScore() >= PASS_PCT;
  }

  function fillScoreCopy(pct) {
    if (outcome === 'pass') {
      scoreBody.textContent = t(
        'summary.quiz.score.body',
        'You’ve learned how to recognise online abuse, understand its impact, and respond more safely across individual, organisational, and wider sporting contexts.'
      );
      scoreNote.textContent = t(
        'summary.quiz.score.note',
        'Your score reflects your understanding of the key concepts covered in this course.'
      );
      clickComplete.textContent = t('summary.quiz.score.clickToComplete', 'Click to complete');
      retryBtn.classList.add('is-hidden');
      finishBtn.classList.remove('is-hidden');
    } else if (outcome === 'retry') {
      scoreBody.textContent = t(
        'summary.quiz.score.didNotPass',
        'A score of {pass}% or higher is required to pass. This was attempt {n} of {max}.'
      )
        .replace('{pass}', String(PASS_PCT))
        .replace('{n}', String(attempt))
        .replace('{max}', String(MAX_ATTEMPTS));
      scoreNote.textContent = t(
        'summary.quiz.score.retryHint',
        'Review the course material, then try the quiz again.'
      );
      clickComplete.textContent = t('summary.quiz.score.clickForDetails', 'Click for details');
      retryBtn.classList.remove('is-hidden');
      finishBtn.classList.add('is-hidden');
    } else {
      scoreBody.textContent = t(
        'summary.quiz.score.didNotPass',
        'A score of {pass}% or higher is required to pass. This was attempt {n} of {max}.'
      )
        .replace('{pass}', String(PASS_PCT))
        .replace('{n}', String(attempt))
        .replace('{max}', String(MAX_ATTEMPTS));
      scoreNote.textContent = t(
        'summary.quiz.score.attemptsExhausted',
        'You’ve used all {max} attempts. You can close this quiz and continue.'
      ).replace('{max}', String(MAX_ATTEMPTS));
      clickComplete.textContent = t('summary.quiz.score.clickToComplete', 'Click to complete');
      retryBtn.classList.add('is-hidden');
      finishBtn.classList.remove('is-hidden');
    }
  }

  function setScorecardState(didPass) {
    flipCard.querySelectorAll('.face').forEach(function (el) {
      el.classList.toggle('is-pass', !!didPass);
      el.classList.toggle('is-fail', !didPass);
    });
  }

  function clearScorecardState() {
    flipCard.querySelectorAll('.face').forEach(function (el) {
      el.classList.remove('is-pass', 'is-fail');
    });
  }

  function showScore() {
    closeFeedback();
    attempt += 1;
    var pct = pctScore();
    if (passed()) outcome = 'pass';
    else if (attempt < MAX_ATTEMPTS) outcome = 'retry';
    else outcome = 'exhausted';

    pctFront.textContent = String(pct);
    pctBack.textContent = String(pct);
    fillScoreCopy(pct);
    setScorecardState(outcome === 'pass');
    flipped = false;
    flipCard.classList.remove('is-flipped');
    scoreModal.classList.add('show');
    scoreModal.setAttribute('aria-hidden', 'false');
    scoreModal.removeAttribute('inert');
    reportScoreToScorm(outcome !== 'retry');
  }

  function restartQuiz() {
    closeScoreModal();
    closeFeedback();
    i = 0;
    pending = null;
    answered = false;
    responses = [];
    outcome = null;
    flipped = false;
    flipCard.classList.remove('is-flipped');
    clearScorecardState();
    scoreReported = false;
    render();
    syncHeight();
  }

  function completeFlip() {
    if (flipped) return;
    flipped = true;
    flipCard.classList.add('is-flipped');
    // Only complete the block when passed or attempts are exhausted.
    if (outcome === 'pass' || outcome === 'exhausted') markComplete();
  }

  function goNext() {
    if (!(answered || responses[i] != null)) return;
    closeFeedback();
    if (i < Q.length - 1) {
      i += 1;
      render();
    } else {
      showScore();
    }
  }

  function dismissAndAdvance() {
    if (!feedbackOpen()) return;
    goNext();
  }

  okBtn.addEventListener('click', confirmAnswer);
  feedbackAdvance.addEventListener('click', dismissAndAdvance);

  document.addEventListener('keydown', function (e) {
    if (scoreModal.classList.contains('show')) return;
    if (e.key === 'Enter') {
      if (feedbackOpen()) {
        e.preventDefault();
        dismissAndAdvance();
      } else if (!answered && pending != null) {
        e.preventDefault();
        confirmAnswer();
      } else if (answered) {
        e.preventDefault();
        goNext();
      }
    }
  });

  flipCard.addEventListener('click', function () {
    if (!scoreModal.classList.contains('show')) return;
    if (!flipped) completeFlip();
  });
  flipCard.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      if (!flipped) completeFlip();
    }
  });

  render();
  lockLayout();
  var rt = null;
  window.addEventListener('resize', function () {
    clearTimeout(rt);
    rt = setTimeout(lockLayout, 120);
  });
  window.addEventListener('load', lockLayout);
  if (window.ResizeObserver) {
    new ResizeObserver(syncHeight).observe(document.body);
  }
})();
</script></body></html>
