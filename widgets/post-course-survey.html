r ensamt ansvarig för att agera och avgöra vad som är onlineövergrepp."},"c2":{"text":"Andra svar kan fortfarande vara tillgängliga genom plattformsregler, organisationspolicyer, skyddsrutiner eller uppförandekoder."},"c3":{"text":"Personen bör vänta och se om beteendet blir allvarligare."}},"ok":{"text":"\u003cstrong>Rätta!\u003c/strong>","note":"HTML allowed"}},"q3":{"prompt":{"text":"Varför kan det vara svårt att hantera övergrepp online genom lagen?"},"choices":{"c0":{"text":"Onlinebeteende faller utanför nationella lagar."},"c1":{"text":"Människor, plattformar och skadlig aktivitet kan korsa jurisdiktioner, och det kan vara svårt att identifiera de ansvariga eller samla in bevis."},"c2":{"text":"Onlineövergrepp kan bara utredas när det ansvariga kontot använder ett riktigt namn."},"c3":{"text":"Idrottsorganisationerna måste slutföra sin egen utredning innan myndigheterna kan ingripa."}},"ok":{"text":"\u003cstrong>Rätta!\u003c/strong>","note":"HTML allowed"}},"q4":{"prompt":{"text":"Vilket påstående beskriver bäst hur rättsliga reaktioner på onlineövergrepp kan skilja sig åt mellan länder?"},"choices":{"c0":{"text":"Varje land har ett specifikt brott som kallas nätmisshandel."},"c1":{"text":"Europeiska länder tillämpar samma nationella lagar eftersom de delar regionala bestämmelser."},"c2":{"text":"Onlinebeteende styrs främst av det land där sociala medieföretaget är baserat."},"c3":{"text":"Länder kan tillämpa olika befintliga lagar för beteende online, och viss lagstiftning tar uttryckligen upp specifika digitala beteenden."}},"ok":{"text":"\u003cstrong>Rätta!\u003c/strong>","note":"HTML allowed"}}}},"takeaways":{"heading":{"text":"Viktiga slutsatser"},"items":{"i1":{"text":"\u003cstrong>Onlineövergrepp kan påverka olika rättsområden. Straffrättsliga, civilrättsliga och administrativa vägar involverar olika processer, aktörer och möjliga utfall.\u003c/strong>","note":"HTML allowed"},"i2":{"text":"\u003cstrong>Mer än en väg kan vara tillämplig. Samma incident kan ge upphov till brottmåls-, civilrättsliga eller regulatoriska frågor beroende på omständigheterna.\u003c/strong>","note":"HTML allowed"},"i3":{"text":"\u003cstrong>Rättsliga svar beror på sammanhang och jurisdiktion. Tillämplig lag, tillgänglig bevis och var de inblandade personerna och tjänsterna befinner sig kan påverka vilka åtgärder som är möjliga.\u003c/strong>","note":"HTML allowed"},"i4":{"text":"\u003cstrong>Lagliga vägar har praktiska begränsningar. Gränsöverskridande verksamhet, identifiering av ansvariga individer, verkställighetskapacitet och rättsliga trösklar kan försvåra åtgärder.\u003c/strong>","note":"HTML allowed"},"i5":{"text":"\u003cstrong>Ansvaret sträcker sig bortom lagen. Idrottsorganisationer kan fastställa policyer, rapporteringsrutiner, skyddsstöd och konsekvenser för skadligt beteende.\u003c/strong>","note":"HTML allowed"},"i6":{"text":"\u003cstrong>Sportsmannaanda sträcker sig även till digitala utrymmen. Respekt, rent spel och ansvarsfullt uppförande är fortfarande relevant när människor deltar i sport online.\u003c/strong>","note":"HTML allowed"}}},"slide":{"title":{"text":"Modul 4 - Att känna till dina rättigheter och skyldigheter","note":"slide_intro title"},"continueToModule5":{"text":"Fortsätt till modul 5","note":"End-of-module navigation_button label"},"callout":{"pleaseNote":{"body":{"text":"\u003cp>\u003cspan style=\"color: #091324\">Denna modul ger en allmän översikt över juridiska åtgärder vid onlineövergrepp och utgör inte juridisk rådgivning. Lagar skiljer sig åt mellan olika jurisdiktioner och kan ändras över tid. För råd om en specifik situation, kontakta en lämpligt kvalificerad yrkesperson.\u003c/span>\u003c/p>","note":"Callout body on Knowing Your Rights and Responsibilities"},"title":{"text":"\u003cspan style=\"color: #1c3564\">Observera\u003c/span>","note":"Callout title on Knowing Your Rights and Responsibilities"}}},"howCanLegalResponsesDifferBy":{"body":{"text":"\u003cp>\u003cspan style=\"color: #091324\">Det rättsliga svaret på onlineövergrepp beror på var en incident inträffar och vilka lagar som gäller. Välj en region för att se ett exempel på hur befintliga lagar kan tillämpas på onlinebeteende.\u003c/span>\u003c/p>","note":"Native text body on Knowing Your Rights and Responsibilities"},"heading":{"text":"\u003cspan style=\"color: #21b7cb\">Hur kan rättsliga svar skilja sig åt mellan länder?\u003c/span>","note":"Native heading on Knowing Your Rights and Responsibilities"}},"internationalFederationsNationalGoverningBodiesClubs":{"body":{"text":"\u003cp>\u003cspan style=\"color: #091324\">\u003cstrong>Internationella förbund, nationella styrande organ, klubbar, ligor och andra idrottsorganisationer kan ha olika ansvarsområden och resurser. Tydliga policyer och konsekventa processer hjälper till att omsätta gemensamma standarder i handling på olika nivåer inom idrott.\u003c/strong>\u003c/span>\u003c/p>","note":"Native text body on Knowing Your Rights and Responsibilities"}},"introSubtitle":{"text":"Beräknad tid: 15 minuter","note":"slide_intro subtitle (estimated time)"},"responsibilitiesBeyondTheLaw":{"body":{"text":"\u003cp>\u003cspan style=\"color: #091324\">\u003cstrong>Lagen fastställer rättsliga skyldigheter. Idrotten fastställer också standarder för deltagande och uppförande. Uppförandekoder, skyddsrutiner, säkerhetspolicyer, disciplinära processer och samhällsnormer kan hjälpa idrottsorganisationer att reagera på skadligt beteende även när en laglig väg inte är tillgänglig eller olämplig.\u003c/strong>\u003c/span>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003c/p>","note":"Native text body on Knowing Your Rights and Responsibilities"},"heading":{"text":"\u003cspan style=\"color: #21b7cb\">Ansvar utöver lagen\u003c/span>","note":"Native heading on Knowing Your Rights and Responsibilities"}},"selectTheBestOptionForEach":{"body":{"text":"\u003cp>\u003cspan style=\"color: #091324\">Välj det bästa alternativet för varje fråga. Du måste svara korrekt på varje fråga innan du fortsätter. Du kan försöka igen så många gånger du vill.\u003c/span>\u003c/p>","note":"Native text body on Knowing Your Rights and Responsibilities"}},"threeLegalPathways":{"body":{"text":"\u003cp>\u003cstrong>Onlineövergrepp kan omfattas av straffrättsliga, civilrättsliga eller administrativa lagar och förordningar. Varje väg involverar olika aktörer, processer och potentiella utfall, och samma incident kan involvera mer än en. Dessa vägar utesluter inte varandra. Samma incident kan ge upphov till olika rättsliga frågor beroende på vad som inträffade och vilka lagar som gäller.\u003c/strong>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003c/p>","note":"Native text body on Knowing Your Rights and Responsibilities"},"heading":{"text":"\u003cspan style=\"color: #21b7cb\">Tre juridiska vägar\u003c/span>","note":"Native heading on Knowing Your Rights and Responsibilities"}},"whenOnlineAbuseOccursImportantQuestions":{"body":{"text":"\u003cp>\u003cspan style=\"color: #091324\">\u003cstrong>När övergrepp online inträffar kan viktiga frågor uppstå: Finns det en lag som kan hjälpa? Vem kan vidta åtgärder? Vilka andra skyddsåtgärder finns tillgängliga? Svaren beror på beteendet, var det inträffar och vilka lagar som kan hjälpa. Att förstå de viktigaste rättsliga vägarna kan hjälpa dig att identifiera var rättsligt ansvarsskyldighet kan vara möjlig och när andra former av åtgärder är viktiga. Inom idrott fungerar rättsligt skydd tillsammans med organisationspolicyer, uppförandekoder, skyddsrutiner och standarder för sportsmannaanda. Tillsammans bidrar dessa mekanismer till att skapa förväntningar på säkrare deltagande online.\u003c/strong>\u003c/span>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003c/p>","note":"Native text body on Knowing Your Rights and Responsibilities"},"heading":{"text":"\u003cspan style=\"color: #1c3564; font-size: 14px\">\u003cstrong>När övergrepp online inträffar kan viktiga frågor uppstå: Finns det en lag som kan hjälpa? Vem kan vidta åtgärder? Vilka andra skyddsåtgärder finns tillgängliga? Svaren beror på beteendet, var det inträffar och vilka lagar som kan hjälpa. Att förstå de viktigaste rättsliga vägarna kan hjälpa dig att identifiera var rättsligt ansvarsskyldighet kan vara möjlig och när andra former av åtgärder är viktiga. Inom idrott fungerar rättsligt skydd tillsammans med organisationspolicyer, uppförandekoder, skyddsrutiner och standarder för sportsmannaanda. Tillsammans bidrar dessa mekanismer till att skapa förväntningar på säkrare deltagande online.\u003c/strong>\u003c/span>","note":"Native heading on Knowing Your Rights and Responsibilities"}},"whereLegalResponsesHaveLimits":{"body":{"text":"\u003cp>\u003cspan style=\"color: #091324\">Rättsliga vägar kan ge viktiga former av ansvarsskyldighet, men onlinemiljöer skapar praktiska utmaningar för utredning och verkställighet.\u003c/span>\u003c/p>","note":"Native text body on Knowing Your Rights and Responsibilities"},"heading":{"text":"\u003cspan style=\"color: #21b7cb\">Där juridiska svar har begränsningar\u003c/span>","note":"Native heading on Knowing Your Rights and Responsibilities"}},"whoCanDoWhat":{"col1":{"text":"\u003ch4 class=\"course-block-heading\">\u003cspan style=\"color: #091324\">Idrottsorganisationer bör: Definiera onlineövergrepp och förväntade uppförandekoder online i organisationens policyer. Upprätta tydliga och tillgängliga rapporteringsrutiner. Tillämpa organisatoriska konsekvenser när uppförandekoder bryts. Tillhandahålla utbildning i hur man känner igen, förebygger och reagerar på onlineövergrepp. Ge tillgång till välfärds- och skyddsstöd. Samarbeta med plattformar, tillsynsmyndigheter eller relevanta myndigheter där så är lämpligt.\u003c/span>\u003c/h4>\u003cul style=\"margin-left: 10px; padding-left: 1.25em;\">\u003cli>\u003cp>\u003c/p>\u003c/li>\u003cli>\u003cp>\u003c/p>\u003c/li>\u003cli>\u003cp>\u003c/p>\u003c/li>\u003cli>\u003cp>\u003c/p>\u003c/li>\u003cli>\u003cp>\u003c/p>\u003c/li>\u003cli>\u003cp>\u003c/p>\u003c/li>\u003c/ul>","note":"Native text body on Knowing Your Rights and Responsibilities"},"col2":{"text":"\u003ch4 class=\"course-block-heading\">\u003cspan style=\"color: #091324\">Alla inom idrott bör: Följa de uppförandekoder och policyer som är kopplade till deras roll Använda lämpliga kanaler för att rapportera skadligt beteende Undvika att dela eller förstärka kränkande innehåll Stödja personer som är måltavlor Inse att standarder för respekt, fair play och sportsmannaanda även gäller i digitala utrymmen\u003c/span>\u003c/h4>\u003cul style=\"margin-left: 10px; padding-left: 1.25em;\">\u003cli>\u003cp>\u003c/p>\u003c/li>\u003cli>\u003cp>\u003c/p>\u003c/li>\u003cli>\u003cp>\u003c/p>\u003c/li>\u003cli>\u003cp>\u003c/p>\u003c/li>\u003cli>\u003cp>\u003c/p>\u003c/li>\u003c/ul>","note":"Native text body on Knowing Your Rights and Responsibilities"},"heading":{"text":"Vem kan göra vad","note":"Native heading on Knowing Your Rights and Responsibilities"}}}},"m5":{"layers":{"ui":{"prompt":{"text":"Säkrare sport är beroende av handling på varje nivå. Välj ett lager för att utforska vad var och en kan göra."},"tracksAria":{"text":"Åtgärdslager"},"backToLayers":{"text":"Tillbaka till lager"},"done":{"text":"Alla tre lager utforskade"},"openLayer":{"text":"Utforska"},"overview":{"text":"Översikt"},"exploredOf":{"text":"{n} av 3 lager utforskade"},"exploredReview":{"text":"Utforskad · Recension"},"startExploring":{"text":"Börja utforska"},"whyMatter":{"text":"Varför spelar detta roll?"},"hideWhy":{"text":"Dölj förklaring"},"orpShort":{"text":"ORP"},"clickToReveal":{"text":"Klicka för att visa"},"nextPrefix":{"text":"Nästa:"},"howItConnects":{"text":"Hur det ansluter"},"actionLevelOf":{"text":"Åtgärdsnivå {n} av 3"},"layerOf":{"text":"Lager {n} av 3"}},"tracks":{"t1":{"num":{"text":"1"},"title":{"text":"Enskild"},"eyebrow":{"text":"Nivå 1 · Individer"},"headline":{"text":"Handling börjar med människor."},"prompt":{"text":"Utforska sätt på vilka du kan:"},"labels":{"l1":{"text":"Skydda dig själv"},"l2":{"text":"Stöd andra"},"l3":{"text":"Agera säkert"}},"intro":{"text":"\u003cp>\u003cstrong>Handling börjar med människor. Alla inom idrott kan bidra, oavsett om de upplever övergrepp online, bevittnar dem eller stödjer någon som har blivit utsatt. Utforska sätt på vilka du kan: Skydda dig själv Stödja andra Agera säkert\u003c/strong>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003c/p>\u003cul>\u003cli>\u003c/li>\u003cli>\u003c/li>\u003cli>\u003c/li>\u003c/ul>","note":"HTML allowed"}},"t2":{"num":{"text":"2"},"title":{"text":"Organisationer"},"eyebrow":{"text":"Nivå 2 · Organisationer"},"headline":{"text":""},"prompt":{"text":"Utforska hur organisationer kan förbereda sig för, förebygga och reagera på onlineövergrepp:"},"labels":{"l1":{"text":"Bygg ramverk"},"l2":{"text":"Stärk skyddet"},"l3":{"text":"Samordna åtgärder"}},"intro":{"text":"\u003cp>Organisationer kan tillhandahålla det ramverk, de resurser och det samordnade stöd som behövs för att skydda människor och effektivt reagera på onlineövergrepp. Dessa inkluderar idrottsorganisationer och förbund, klubbar och föreningar, medieorganisationer, onlineplattformar, intresseorganisationer och andra institutioner inom idrottsgemenskapen. Utforska hur organisationer kan förbereda sig för, förebygga och reagera på onlineövergrepp: Bygga ramverk Stärka skyddet Samordna åtgärder\u003c/p>\u003cp>\u003c/p>\u003cul>\u003cli>\u003c/li>\u003cli>\u003c/li>\u003cli>\u003c/li>\u003c/ul>","note":"HTML allowed"},"safeguardLead":{"text":"Skydd innebär att skydda människor i riskzonen och agera effektivt när övergrepp inträffar."},"prepareItems":{"i1":{"text":"Policyer och uppförandekoder"},"i2":{"text":"Utbildning och fortbildning"},"i3":{"text":"Tydliga förväntningar på digitalt beteende"}},"protectItems":{"i1":{"text":"Välfärds- och trygghetsstöd"},"i2":{"text":"Verktyg för plattformssäkerhet och moderering"},"i3":{"text":"Mekanismer för personer i riskzonen"}},"respondItems":{"i1":{"text":"Tillgängliga rapporteringsvägar"},"i2":{"text":"Lämplig registerhållning"},"i3":{"text":"Organisatoriska rutiner och eskalering"}},"whoLabel":{"text":"Vem gör vad"},"who":{"clubs":{"title":{"text":"Klubbar"},"body":{"text":"Ge stöd i frontlinjen till idrottare."}},"federations":{"title":{"text":"Federationer"},"body":{"text":"Samordna gemensamma standarder."}},"platforms":{"title":{"text":"Digitala plattformar"},"body":{"text":"Aktivera rapportering och moderering."}},"media":{"title":{"text":"Medieorganisationer"},"body":{"text":"Hantera publicerat innehåll."}},"advocacy":{"title":{"text":"Påverkansgrupper"},"body":{"text":"Bidra med specialiserat stöd och utbildning."}}},"orpTitle":{"text":""},"orpBody":{"text":"\u003cstrong>UAOA:s plattform för organisationsberedskap (ORP) stöder dessa insatser genom att hjälpa idrottsorganisationer att bedöma sin beredskap, identifiera förbättringsområden och stärka sina metoder för att förebygga och hantera onlineövergrepp.\u003c/strong>","note":"HTML allowed"}},"t3":{"num":{"text":"3"},"title":{"text":"Samhälle"},"eyebrow":{"text":"Nivå 3 · Samhälle"},"headline":{"text":""},"prompt":{"text":"Lär dig hur bredare sociala sammanhang kan påverka onlineövergrepp och bidra till att skapa säkrare digitala utrymmen inom sport:"},"labels":{"l1":{"text":"Avancerad utbildning"},"l2":{"text":"Generera bevis"},"l3":{"text":"Formnormer"}},"intro":{"text":"\u003cp>Onlineövergrepp formas ofta av faktorer utanför individers och organisationers omedelbara kontroll. Människors personliga sammanhang, den teknik de använder, deras tillgång till utbildning och de allmänna kulturella normerna kring dem kan alla påverka huruvida skadligt beteende uppmuntras, normaliseras, utmanas eller förebyggs. Lär dig hur bredare sociala sammanhang kan påverka onlineövergrepp och bidra till att skapa säkrare digitala utrymmen inom idrotten: Främja utbildningGenerera bevisForma normer\u003c/p>\u003cp>\u003c/p>\u003cul>\u003cli>\u003c/li>\u003cli>\u003c/li>\u003cli>\u003c/li>\u003c/ul>","note":"HTML allowed"}}}},"flow1":{"ui":{"title":{"text":"Vad var och en av oss kan göra"}},"steps":{"s1":{"title":{"text":"Skydda dig själv"},"body":{"text":"\u003cp>\u003c/p>\u003cul>\u003cli>\u003cstrong>För idrottare och andra med offentliga roller: Hantera din exponering. Granska sekretess- och säkerhetsinställningar och kontrollera vem som kan kontakta, nämna eller tagga dig. Använd säkerhetsverktyg. Stäng av, begränsa, blockera och rapportera skadligt konton eller innehåll. Bevara bevis. Spara relevant information när beteende kan behöva rapporteras eller eskaleras. Skydda ditt välbefinnande. Du kan välja att ta en paus från onlineinteraktioner och söka stöd från personer du litar på. Varför är detta viktigt? Ditt välbefinnande är viktigt, och stöd är ett gemensamt ansvar. När människor använder säkerhets- och välbefinnandeverktyg är de bättre rustade att förhindra skada inom den bredare idrottsgemenskapen.\u003c/strong>\u003c/li>\u003cli>\u003c/li>\u003cli>\u003c/li>\u003cli>\u003c/li>\u003c/ul>\u003cdetails>\u003csummary>\u003c/summary>\u003cp>\u003c/p>\u003c/details>","note":"HTML allowed"}},"s2":{"title":{"text":"Stöd andra"},"body":{"text":"\u003cp>\u003c/p>\u003cul>\u003cli>\u003cstrong>Som lagkamrat, kollega, fan, vän eller åskådare: Undvik förstärkning. Förhindra ytterligare spridning av kränkande innehåll. Hör av dig privat. Erbjud personligt stöd till personen som är utsatt för kränkande beteende. Rapportera på lämpligt sätt. Agera via etablerade kanaler, vanligtvis utan offentlig konfrontation. Tala ut på ett säkert sätt. Uttryck oro över kränkande beteende eller sök hjälp från någon som kan ingripa, inklusive organisatoriska myndigheter eller polisen vid behov. Varför är detta viktigt? Att stödja andra stärker idrottsgemenskapen. Små handlingar från lagkamrater, kollegor, vänner, fans och andra åskådare kan bidra till att skapa ett socialt stödsystem där människor känner sig hörda, skyddade och omhändertagna, och där skadligt beteende är mindre sannolikt att förbli obestridligt.\u003c/strong>\u003c/li>\u003cli>\u003c/li>\u003cli>\u003c/li>\u003cli>\u003c/li>\u003c/ul>\u003cdetails>\u003csummary>\u003c/summary>\u003cp>\u003c/p>\u003c/details>","note":"HTML allowed"}},"s3":{"title":{"text":"Agera säkert"},"body":{"text":"\u003cp>\u003c/p>\u003cul>\u003cli>\u003cstrong>När du hanterar övergrepp online, beakta situationen, din personliga säkerhet och om ytterligare stöd behövs: Bedöm situationen. Överväg beteendets art, om det eskalerar och om någon kan vara i riskzonen. Undvik osäker interaktion. Konfrontera eller engagera dig inte direkt när det kan öka skadan eller utsätta någon för risk. Vet när du ska söka stöd. Involvera en betrodd person eller lämplig organisatorisk kontaktperson när situationen kräver ytterligare hjälp. Eskalera säkerhetsproblem. Hot, upprepad oönskad kontakt, exponering av personlig information eller andra säkerhetsproblem kan kräva ytterligare organisatoriskt eller externt stöd. Varför är detta viktigt? Att agera säkert hjälper till att koppla samman individuella åtgärder med rätt nivå av stöd. Att inse när en situation kräver ytterligare hjälp gör att andra kan engagera sig och hjälper till att säkerställa att säkerhet förblir prioritet.\u003c/strong>\u003c/li>\u003cli>\u003c/li>\u003cli>\u003c/li>\u003cli>\u003c/li>\u003c/ul>\u003cdetails>\u003csummary>\u003c/summary>\u003cp>\u003c/p>\u003c/details>","note":"HTML allowed"}}}},"flow2":{"ui":{"title":{"text":"Vad organisationer kan göra"}},"steps":{"s1":{"title":{"text":"Förbereda"},"body":{"text":"\u003cp>Utveckla policyer och uppförandekoder, tillhandahålla utbildning och fortbildning samt fastställa tydliga förväntningar på digitalt beteende.\u003c/p>","note":"HTML allowed"}},"s2":{"title":{"text":"Skydda"},"body":{"text":"\u003cp>Tillhandahålla stöd för välfärd och skydd, säkerhetsverktyg för plattformen, moderering och lämpliga mekanismer för personer i riskzonen.\u003c/p>","note":"HTML allowed"}},"s3":{"title":{"text":"Svara"},"body":{"text":"\u003cp>Skapa tillgängliga rapporteringsvägar, bevara lämpliga register, tillämpa organisatoriska rutiner och samordna eskalering vid behov.\u003c/p>","note":"HTML allowed"}},"s4":{"title":{"text":"Ansluta"},"body":{"text":"\u003cp>\u003cstrong>Koppla samman. Samarbeta med andra organisationer, plattformar, myndigheter, forskare, påverkansgrupper och specialisttjänster när en respons sträcker sig bortom organisationens egna kapacitet.\u003c/strong>\u003c/p>","note":"HTML allowed"}},"s5":{"title":{"text":"Starkare tillsammans"},"body":{"text":"\u003cp>\u003cstrong>Organisationer är starkare när de arbetar tillsammans. Var och en spelar en annan roll, och tillsammans kan de skapa ett samordnat nätverk för skydd och insatser mot onlineövergrepp. UAOA:s plattform för organisationsberedskap (ORP) stöder dessa insatser genom att hjälpa idrottsorganisationer att bedöma sin beredskap, identifiera förbättringsområden och stärka sina metoder för att förebygga och hantera onlineövergrepp.\u003c/strong>\u003c/p>\u003cp>\u003c/p>","note":"HTML allowed"}}}},"flow3":{"ui":{"title":{"text":"Vad som formar säkrare digital sport"}},"steps":{"s1":{"title":{"text":"Utbildning"},"body":{"text":"\u003cp>Utbildning kan hjälpa människor att känna igen övergrepp online, förstå dess konsekvenser och veta hur man reagerar på ett säkert sätt. Digital och mediekunskap kan också stärka kritiskt tänkande kring vilka beteenden som är lämpliga i online-miljöer.\u003c/p>","note":"HTML allowed"}},"s2":{"title":{"text":"Delade standarder"},"body":{"text":"\u003cp>Tydliga förväntningar hjälper till att fastställa vilka beteenden som anses acceptabla inom idrottsgemenskaper. Gemensamma standarder kring respekt, inkludering, rent spel och digitalt deltagande kan vägleda beteenden och ge individer och organisationer en starkare grund för att utmana övergrepp.\u003c/p>","note":"HTML allowed"}},"s3":{"title":{"text":"Forskning och bevis"},"body":{"text":"\u003cp>Evidensbaserad och datadriven forskning hjälper till att kartlägga mönster där onlineövergrepp förekommer, hur skadligt beteende utvecklas över tid och vilka åtgärder som är mer effektiva. Starkare kunskap kan ligga till grund för förebyggande åtgärder, utbildning, organisatorisk praxis, teknik och policy.\u003c/p>","note":"HTML allowed"}},"s4":{"title":{"text":"Politik och lag"},"body":{"text":"\u003cp>Policyer och lagar kan etablera gränser, ansvar, skydd och vägar till ansvarsskyldighet. De kan påverka beteenden genom att förtydliga konsekvenser och tillhandahålla mekanismer för rapportering, ingripande och gottgörelse.\u003c/p>","note":"HTML allowed"}},"s5":{"title":{"text":"Teknik- och plattformsdesign"},"body":{"text":"\u003cp>Utformningen av digitala plattformar kan påverka hur lätt skadligt innehåll skapas, upptäcks, förstärks, rapporteras eller tas bort. Moderering, detektering, rapporteringsverktyg och andra säkerhetsfunktioner kan bidra till att minska risken för att missbruk sprids och består.\u003c/p>","note":"HTML allowed"}},"s6":{"title":{"text":"Gemenskapsnormer"},"body":{"text":"\u003cp>Sociala normer påverkar vad människor uppfattar som normalt, acceptabelt eller värt att utmana. Idrottare, fans, media, organisationer och offentliga personer bidrar alla till kulturen kring sport. När samhällen konsekvent utmanar kränkande beteende och förstärker respekt kan de bidra till att förändra de normer som gör att kränkningar online kan fortsätta.\u003c/p>","note":"HTML allowed"}},"s7":{"title":{"text":"Att arbeta tillsammans"},"body":{"text":"\u003cp>\u003cstrong>Dessa faktorer samverkar inom sport och i vårt samhälle. Utbildning kan forma hur människor förstår beteenden online, medan gemensamma standarder och lagar kan förtydliga förväntningar, forskning kan identifiera nya risker och teknik kan påverka hur skadligt innehåll sprids. Idrottsgemenskaper är bara en del av vårt samhälle: de påverkas av bredare kulturella normer, och idrottare, fans, media, organisationer och andra röster inom sport kan också bidra till att forma den värld vi lever i tillsammans.\u003c/strong>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003c/p>","note":"HTML allowed"}}}},"match":{"ui":{"eyebrow":{"text":"Kontrollera din förståelse"},"prompt":{"text":"Matcha varje scenario till en nivå"},"hint":{"text":"Dra varje nivåkort till matchande scenario till höger. Placera alla tre innan du skickar in dem."},"choicesAria":{"text":"Välj en handlingsnivå"},"trayAria":{"text":"Nivåkort"},"dropHint":{"text":"Sänk nivån här"},"submit":{"text":"Överlämna"},"feedbackOk":{"text":"\u003cstrong>Det stämmer! Du har matchat varje scenario med lämplig åtgärdsnivå.\u003c/strong>","note":"HTML allowed"},"feedbackBad":{"text":"\u003cstrong>Inte riktigt. Granska dina val och försök igen.\u003c/strong>","note":"HTML allowed"},"done":{"text":"\u003cstrong>Det stämmer! Du har matchat varje scenario med lämplig åtgärdsnivå.\u003c/strong>","note":"HTML allowed"}},"labels":{"l0":{"text":"Enskild"},"l1":{"text":"Organisation"},"l2":{"text":"Samhälle"}},"scenarios":{"s1":{"text":{"text":"Efter att ha sett en idrottare bli måltavla online, checkar någon in privat och rapporterar det skadliga innehållet utan att dela det vidare."},"ok":{"text":"\u003cstrong>Korrekt! Att checka in privat och rapportera utan att utöka det är individuella handlingar.\u003c/strong>","note":"HTML allowed"},"bad":{"text":"\u003cstrong>Inte riktigt. Tänk på vem som vidtar den här åtgärden just nu. Försök igen.\u003c/strong>","note":"HTML allowed"}},"s2":{"text":{"text":"Efter flera incidenter av övergrepp online inför ett idrottsförbund en rapporteringsväg, personalutbildning och skyddsrutiner."},"ok":{"text":"\u003cstrong>Korrekt! Rapporteringsvägar, utbildning och skyddsrutiner är organisatoriska ramverk.\u003c/strong>","note":"HTML allowed"},"bad":{"text":"\u003cstrong>Inte riktigt. Fundera över vilken nivå som sätter ramar och procedurer för en idrottsorganisation. Försök igen.\u003c/strong>","note":"HTML allowed"}},"s3":{"text":{"text":"Forskning visar hur en ny form av onlineövergrepp sprids, vilket bidrar till att informera utbildning, teknik och framtida politiska åtgärder."},"ok":{"text":"\u003cstrong>Korrekt! Forskning och evidens som ligger till grund för utbildning, teknik och policy verkar på samhällsnivå.\u003c/strong>","note":"HTML allowed"},"bad":{"text":"\u003cstrong>Inte riktigt. Fundera över vilken nivå som formar utbildning, teknologi och policy i bredare perspektiv. Försök igen.\u003c/strong>","note":"HTML allowed"}}}},"widerSystem":{"heading":{"text":"Du är en del av ett större system"},"rows":{"individual":{"text":"\u003cstrong>Individuella handlingar kan minska skador och stödja andra.\u003c/strong>","note":"HTML allowed"},"organisations":{"text":"\u003cstrong>Organisationer tillhandahåller de strukturer som omvandlar dessa handlingar till kollektiva svar.\u003c/strong>","note":"HTML allowed"},"society":{"text":"\u003cstrong>Över hela samhället kan sammankopplade insatser inom utbildning, politik, teknik, forskning och samhällsstandarder bidra till att skapa säkrare digitala utrymmen inom idrotten.\u003c/strong>","note":"HTML allowed"}},"connectLead":{"text":"UAOA hjälper till att koppla samman dessa handlingsnivåer."},"connectBody":{"text":"Genom Stronger Together sammanför UAOA människor och organisationer inom idrott för att stärka hur de förbereder sig för, förebygger och reagerar på onlineövergrepp, och omvandlar delad kunskap och samordnade åtgärder till praktiskt stöd för idrottsgemenskapen.\u003ca href=\"https://unitedagainstonlineabuse.com/about-us/\" target=\"_blank\" rel=\"noopener\">\u003c/a>","note":"HTML allowed"}},"takeaways":{"heading":{"text":"Viktiga slutsatser"},"items":{"i1":{"text":"\u003cstrong>Att bekämpa övergrepp online är ett gemensamt ansvar. Individer, idrottsorganisationer, plattformar, media, intressegrupper, beslutsfattare och andra intressenter har alla en roll i förebyggande åtgärder och åtgärder.\u003c/strong>","note":"HTML allowed"},"i2":{"text":"\u003cstrong>Individuella åtgärder kan minska skador. Att hantera exponering, använda säkerhetsverktyg, bevara bevis, stödja andra och veta när man ska söka ytterligare hjälp kan skydda säkerhet och välbefinnande.\u003c/strong>","note":"HTML allowed"},"i3":{"text":"\u003cstrong>Organisationer tillhandahåller struktur och stöd. Tydliga ramverk, skydd, rapporteringsvägar och samordnade åtgärder hjälper organisationer att förbereda sig för och reagera på onlineövergrepp.\u003c/strong>","note":"HTML allowed"},"i4":{"text":"\u003cstrong>Samarbete stärker insatsen. Klubbar, förbund, plattformar, medieorganisationer, intressegrupper och andra intressenter kan bidra med olika former av stöd, expertis och åtgärder.\u003c/strong>","note":"HTML allowed"},"i5":{"text":"\u003cstrong>Sociala förhållanden påverkar beteendet online. Utbildning, standarder, forskning, policy, teknologi och kulturella normer kan påverka hur övergrepp online förstås, möjliggörs, förebyggs och utmanas.\u003c/strong>","note":"HTML allowed"},"i6":{"text":"\u003cstrong>Idrott är en del av ett bredare socialt sammanhang. Idrottsgemenskaper påverkas av bredare kulturella normer och kan också bidra till att forma förväntningar och beteenden i hela samhället.\u003c/strong>","note":"HTML allowed"}}},"slide":{"title":{"text":"Modul 5 - Agera: Bygg säkrare digitala idrottsgemenskaper","note":"slide_intro title"},"continueLayer2":{"text":"Fortsätt till lager 2","note":"Nav button label"},"continueLayer3":{"text":"Fortsätt till lager 3","note":"Nav button label"},"goToFinalQuiz":{"text":"Gå till slutquiz","note":"Nav button label"},"exploreTheThreeLayersOfAction":{"body":{"text":"\u003cp>Handling sker på tre sammankopplade nivåer. Skikten är sammankopplade och kompletterar varandra: individuella handlingar kopplas till organisatoriskt stöd och till bredare kollektiva handlingar.\u003c/p>","note":"Native text body on Take Action: Building Safer Digital Sport Communities"},"heading":{"text":"\u003cspan style=\"color: #21b7cb\">Utforska de tre handlingslagren\u003c/span>","note":"Native heading on Take Action: Building Safer Digital Sport Communities"}},"image":{"throughStrongerTogetherUaoaBringsPeople":{"text":"\u003cp>Genom Stronger Together sammanför UAOA människor och organisationer inom idrott för att stärka hur de förbereder sig för, förebygger och reagerar på onlineövergrepp, och omvandlar delad kunskap och samordnade åtgärder till praktiskt stöd för idrottsgemenskapen.\u003c/p>","note":"Image body text on Take Action: Building Safer Digital Sport Communities"}},"introSubtitle":{"text":"Beräknad tid: 15 minuter","note":"slide_intro subtitle (estimated time)"},"onlineAbuseCanBeAddressedAt":{"body":{"text":"\u003cp>\u003cspan style=\"color: #091324\">Onlineövergrepp kan hanteras på olika nivåer. Dra varje scenario till den nivå som är bäst lämpad att vidta åtgärder.\u003c/span>\u003cbr>\u003c/p>","note":"Native text body on Take Action: Building Safer Digital Sport Communities"}},"onlineAbuseInSportCanAffect":{"body":{"text":"\u003cp>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003cspan style=\"color: #091324\">Onlineövergrepp inom idrott kan drabba en person direkt, men ingen behöver reagera ensam på det. Vi kan alla bidra till att skapa säkrare digitala utrymmen, oavsett om vi skyddar vårt eget välbefinnande, stödjer någon som blir utsatt för övergrepp, bevittnar skadligt beteende eller hjälper andra genom vårt arbete inom idrott. De åtgärder vi kan vidta beror på vår roll och våra omständigheter. Individer kan skydda sig själva och stödja andra. Organisationer kan tillhandahålla tydliga vägar för rapportering, stöd och samordnade åtgärder. Inom idrottsgemenskaper kan utbildning, forskning, policy och gemensamma standarder bidra till att förebygga skada och stärka hur vi reagerar. I den här sista modulen kommer du att utforska hur dessa olika nivåer av handling kopplas samman, var du kan bidra och hur samarbete kan bidra till att bygga säkrare digitala idrottsgemenskaper.\u003c/span>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003c/p>","note":"Native text body on Take Action: Building Safer Digital Sport Communities"},"heading":{"text":"\u003cbr>\u003cbr>\u003cspan style=\"color: #1c3564; font-size: 14px\">Onlineövergrepp inom idrott kan drabba en person direkt, men ingen behöver reagera ensam på det. Vi kan alla bidra till att skapa säkrare digitala utrymmen, oavsett om vi skyddar vårt eget välbefinnande, stödjer någon som blir utsatt för övergrepp, bevittnar skadligt beteende eller hjälper andra genom vårt arbete inom idrott. De åtgärder vi kan vidta beror på vår roll och våra omständigheter. Individer kan skydda sig själva och stödja andra. Organisationer kan tillhandahålla tydliga vägar för rapportering, stöd och samordnade åtgärder. Inom idrottsgemenskaper kan utbildning, forskning, policy och gemensamma standarder bidra till att förebygga skada och stärka hur vi reagerar. I den här sista modulen kommer du att utforska hur dessa olika nivåer av handling kopplas samman, var du kan bidra och hur samarbete kan bidra till att bygga säkrare digitala idrottsgemenskaper.\u003c/span>","note":"Native heading on Take Action: Building Safer Digital Sport Communities"}},"uaoaHelpsConnectTheseLevelsOf":{"heading":{"text":"\u003cspan style=\"color: #21b7cb\">UAOA hjälper till att koppla samman dessa handlingsnivåer.\u003c/span>","note":"Native heading on Take Action: Building Safer Digital Sport Communities"}},"youArePartOfAWider":{"heading":{"text":"\u003cspan style=\"color: #21b7cb\">Du är en del av ett större system\u003c/span>","note":"Native heading on Take Action: Building Safer Digital Sport Communities"}}}},"summary":{"quiz":{"questions":{"q1":{"prompt":{"text":"\u003cstrong>Ungefär hur många idrottsförbund var i 2025 års UAOA-barometer oroliga för att online-trakasserier skulle kunna driva ut talangfulla idrottare från sporten?\u003c/strong>","note":"HTML allowed — do not bold option list items"},"choices":{"c0":{"text":"Mindre än 50 %"},"c1":{"text":"Cirka 72 %"},"c2":{"text":"Cirka 90 %"}},"reveal":{"text":"\u003cstrong>Cirka 90 % UAOA-barometern visar att ungefär nio av tio idrottsförbund i undersökningen uttryckte oro för att online-övergrepp skulle kunna driva ut begåvade idrottare från sporten. Online-övergrepp kan i slutändan påverka huruvida människor fortsätter att delta i idrottsgemenskaper.\u003c/strong>","note":"HTML allowed"},"next":{"text":"Det verkar mycket"}},"q2":{"prompt":{"text":"Enligt forskning, vad har ökad exponering för trakasserier online förknippats med bland idrottare?"},"choices":{"c0":{"text":"Psykisk stress"},"c1":{"text":"Färre vänner"},"c2":{"text":"Fler träningstimmar"}},"reveal":{"text":"\u003cstrong>Ökad exponering för trakasserier online har förknippats med högre nivåer av psykisk stress, vilket belyser hur fientligt onlineinnehåll kan påverka det psykiska välbefinnandet.\u003c/strong>","note":"HTML allowed"},"next":{"text":"Det är oroande"}},"q3":{"prompt":{"text":"När en skadlig kommentar om en idrottare dyker upp online, vilka egenskaper kan påverka hur långt den når?"},"choices":{"c0":{"text":"Plattformsdesign och rekommendationssystem"},"c1":{"text":"Användarinteraktioner och rapporteringsmekanismer"},"c2":{"text":"Både"}},"reveal":{"text":"\u003cstrong>Både. Plattformsdesign, rekommendationssystem, användarinteraktioner och rapporteringsmekanismer kan påverka hur skadligt innehåll sprids och når nya målgrupper.\u003c/strong>","note":"HTML allowed"},"next":{"text":"Det är vettigt"}},"q4":{"prompt":{"text":"\u003cspan class=\"scenario\">Om en spelare får förödmjukande kommentarer efter en förlust. Liknande meddelanden översvämmar deras konto i dagar och attackerar även deras ras. Vad händer?\u003c/span>","note":"HTML allowed"},"choices":{"c0":{"text":"Endast kränkande tal"},"c1":{"text":"Endast digital fientlighet och hatpropaganda"},"c2":{"text":"Flera former av onlineövergrepp överlappar varandra"}},"reveal":{"text":"\u003cstrong>Flera former kan överlappa varandra. Det förödmjukande språket är kränkande tal, den upprepade offentliga aggressionen skapar digital fientlighet och rasistiska riktade insatser kan utgöra hatpropaganda.\u003c/strong>","note":"HTML allowed"},"next":{"text":"Låt oss agera!"}},"q5":{"prompt":{"text":"Vilket är det bästa rådet för att vara säker när någon utsätts för övergrepp online?"},"choices":{"c0":{"text":"Svara direkt för att stoppa beteendet"},"c1":{"text":"Bedöm situationen, undvik osäkert engagemang och rapportera på lämpligt sätt"},"c2":{"text":"Ta bort innehållet och lämna plattformen"}},"reveal":{"text":"\u003cstrong>Agera säkert och använd rätt rapporteringskanaler. Bedöm om beteendet eskalerar eller om någon kan vara i riskzonen, undvik osäker interaktion, bevara relevant bevis och rapportera via lämplig plattform eller organisatoriska kanaler. Sök ytterligare stöd vid behov.\u003c/strong>","note":"HTML allowed"},"next":{"text":"Fortsätta"}},"q6":{"prompt":{"text":"Kan befintliga lagar bidra till att skydda människor från onlineövergrepp, inklusive övergrepp som involverar AI-genererat innehåll?"},"choices":{"c0":{"text":"Ja, men skyddet varierar mellan länder."},"c1":{"text":"Endast när misshandeln innefattar fysiska hot."},"c2":{"text":"Endast när innehållet delas offentligt."}},"reveal":{"text":"\u003cstrong>Lagar kan bidra till att skydda människor från onlineövergrepp. Rättsligt skydd och ansvar varierar dock mellan länder. Vissa jurisdiktioner har infört specifika åtgärder mot AI-genererade intima bilder och andra former av digitala övergrepp.\u003c/strong>","note":"HTML allowed"},"next":{"text":"Lagar är bara en del av svaret. Vad mer kan vi göra?"}},"q7":{"prompt":{"text":"\u003cspan class=\"scenario\">En lagkamrat har fått kränkande meddelanden och verkar alltmer bekymrad. Vilken är den starkaste reaktionen från ett stödjande system?\u003c/span>","note":"HTML allowed"},"choices":{"c0":{"text":"Dela meddelandena offentligt så att andra kan försvara dem"},"c1":{"text":"Hör av dig privat och hjälp dem att få tillgång till lämpligt stöd"},"c2":{"text":"Begränsa interaktionerna med lagkamraterna"}},"reveal":{"text":"\u003cstrong>Stöd börjar med dig! Hör av dig privat, undvik att förstärka övergreppen, använd lämpliga rapporteringskanaler och säg ifrån när det är säkert att göra det.\u003c/strong>","note":"HTML allowed"},"next":{"text":"Allas säkerhet är viktig!"}},"q8":{"prompt":{"text":"Positiv handling börjar med var och en av oss. Vad kan vi göra?"},"choices":{"c0":{"text":"Skydda dig själv, stöd andra, agera säkert"},"c1":{"text":"Övervaka innehåll, konfrontera förövaren, radera bevis"},"c2":{"text":"Rapportera allt, svara offentligt, stanna online"}},"reveal":{"text":"\u003cstrong>Skydda dig själv. Stöd andra. Agera säkert. Vi kan hantera vår exponering på sociala medier, använda säkerhetsverktyg, bevara bevis, stödja andra som är måltavlor och känna igen när en situation kräver ytterligare hjälp.\u003c/strong>","note":"HTML allowed"},"next":{"text":"Självklart kan vi det!"}},"q9":{"prompt":{"text":"\u003cstrong>Organisationer har också en roll. Flera personer inom en idrottsorganisation har rapporterat övergrepp online. Vad skulle skapa den starkaste organisationsresponsen?\u003c/strong>","note":"HTML allowed"},"choices":{"c0":{"text":"Fokusera främst på att hantera enskilda incidenter"},"c1":{"text":"Bygg ramverk, stärk skyddsåtgärder och samordna åtgärder"},"c2":{"text":"Förvänta dig att plattformarna ska hantera problemet"}},"reveal":{"text":"Effektiva organisatoriska åtgärder kopplar samman förberedelse, skydd, respons och samarbete.","note":"HTML allowed"},"next":{"text":"Berätta mer!"}},"q10":{"prompt":{"text":"\u003cspan class=\"scenario\">Onlineövergrepp formas också av omständigheter som går utöver en enskild person eller organisation. Vilka kan påverka om skadligt beteende normaliseras, utmanas eller förebyggs?\u003c/span>","note":"HTML allowed"},"choices":{"c0":{"text":"Utbildning och samhällsnormer"},"c1":{"text":"Forskning och policyer"},"c2":{"text":"Teknik och AI-lösningar"},"c3":{"text":"Alla dessa"}},"reveal":{"text":"\u003cstrong>Allt detta. Utbildning, gemensamma standarder, forskning och evidens, policy och lagar, tekniska lösningar och plattformsdesign, samt samhällsnormer kan alla forma beteenden online. Sport påverkas av dessa bredare sociala förhållanden, och idrottsgemenskaper kan också bidra till att forma den värld vi lever i tillsammans.\u003c/strong>","note":"HTML allowed"},"next":{"text":"Starkare tillsammans!"}},"q11":{"prompt":{"text":"Vill du vidta ytterligare åtgärder med UAOA?"},"choices":{"c0":{"text":"Jag vill vidta åtgärder"},"c1":{"text":"Jag vill fortsätta lära mig"},"c2":{"text":"Jag vill stärka min organisation"},"c3":{"text":"Inte just nu"}},"reveal":{"text":"\u003cstrong>Det finns olika sätt att agera. UAOA sammanför människor och organisationer inom idrotten för att stärka hur de förbereder sig för, förebygger och reagerar på nätövergrepp.\u003c/strong>","note":"HTML allowed — ungraded item"},"next":{"text":"Se din beredskap!"},"links":{"act":{"note":{"text":"Inline-maskerade länkar för Q11-val c0 — flera objekt sammanfogas med en vanlig \"/\"-avgränsare inuti svarspillan"},"items":[{"text":"UAOA resources","url":{"text":"https://unitedagainstonlineabuse.com/resources/","note":"External URL for Q11 choice c0 — opens in new tab"}},{"text":"#UAOAday","url":{"text":"https://unitedagainstonlineabuse.com/uaoa-day/","note":"External URL for Q11 choice c0 — opens in new tab"}}]},"learn":{"text":{"text":"UAOA-webbinariumserie"},"url":{"text":"https://unitedagainstonlineabuse.com/webinar-series/","note":"External URL for Q11 choice c1 — opens in new tab"}},"org":{"text":{"text":"UAOA – Plattform för organisatorisk beredskap"},"url":{"text":"https://orp.unitedagainstonlineabuse.com/","note":"External URL for Q11 choice c2 — opens in new tab"}}}}},"ui":{"chooseOne":{"text":"Välj ett svar","note":"Hint under the question on the open final-quiz layout"},"ok":{"text":"OK","note":"Confirm selection before reveal"},"pressEnter":{"text":"tryck Enter ↵","note":"Keyboard hint beside OK"},"questionOf":{"text":"Fråga {n} av {totalt}","note":"Footer progress; {n} and {total} are replaced in JS"},"choicesAria":{"text":"Svarsalternativ","note":"aria-label on options group"},"prevAria":{"text":"Föregående fråga","note":"aria-label on prev chevron"},"nextAria":{"text":"Nästa fråga","note":"aria-label on next chevron when advancing"},"openResource":{"text":"Öppen resurs","note":"Legacy; Q11 now shows masked link labels inline inside answer pills"}},"score":{"youScored":{"text":"Du gjorde mål","note":"Flip-card modal front label above large %"},"yourScore":{"text":"Your score","note":"Flip-card modal front label above large % after third failed attempt"},"clickToComplete":{"text":"Klicka för att slutföra","note":"Flip-card modal front CTA when passed or attempts exhausted"},"clickForDetails":{"text":"Klicka för detaljer","note":"Flip-card modal front CTA when below pass score with retries left"},"headline":{"text":"Du fick {pct}%!","note":"Legacy / optional; modal uses youScored + large %"},"body":{"text":"Du har lärt dig att känna igen övergrepp online, förstå dess inverkan och agera säkrare i individuella, organisatoriska och bredare idrottsliga sammanhang."},"note":{"text":"Ditt resultat återspeglar din förståelse av de viktigaste begreppen som behandlas i den här kursen."},"didNotPass":{"text":"Ett resultat på {pass}% eller högre krävs för att bli godkänd. Detta var försök {n} av {max}.","note":"Shown on score back when below pass threshold; {pass}, {n}, {max} replaced in JS"},"retryHint":{"text":"Gå igenom kursmaterialet och försök sedan göra testet igen.","note":"Score back note when retries remain"},"exhaustedBody":{"text":"You’re making progress in understanding online abuse in sport. A score of {pass}% or higher is required to complete the course and earn your certificate.","note":"Score back body after third failed attempt; {pass} replaced in JS from ScormStack grade_required"},"exhaustedNote":{"text":"Review the key concepts and learning materials, then try the final quiz again when you’re ready.","note":"Score back note after third failed attempt"},"attemptsExhausted":{"text":"Du har använt alla {max} försök. Du kan stänga det här testet och fortsätta.","note":"Score back note after final failed attempt; {max} replaced in JS"},"finish":{"text":"Nära","note":"Closes readiness flip modal on the back face"}}},"furtherAction":{"questions":{"q1":{"prompt":{"text":"Vill du vidta ytterligare åtgärder med UAOA?"},"choices":{"c0":{"text":"Jag vill vidta åtgärder"},"c1":{"text":"Jag vill fortsätta lära mig"},"c2":{"text":"Jag vill stärka min organisation"},"c3":{"text":"Inte just nu"}},"ok":{"text":"\u003cstrong>Det finns olika sätt att agera. UAOA sammanför människor och organisationer inom idrotten för att stärka hur de förbereder sig för, förebygger och reagerar på nätövergrepp.\u003c/strong>","note":"HTML allowed — legacy further-action widget; Q11 lives in summary.quiz"}}}},"slide":{"title":{"text":"Sammanfattning: Viktiga slutsatser","note":"Module / summary slide title"},"finishCourse":{"text":"Avsluta kursen","note":"Nav button label"},"postSurvey":{"text":"Gör enkäten efter kursen","note":"Nav button label"},"getCertificate":{"text":"Avsluta och hämta certifikat","note":"Nav button label"},"exit":{"congratulations":{"heading":{"text":"\u003cspan style=\"color: #21B7CB\">Grattis!\u003c/span>","note":"Native heading on Exit Page"}},"youAreNowBetterPreparedTo":{"body":{"text":"\u003cp>\u003cspan style=\"color: rgb(9, 19, 36)\">\u003cbr>\u003cbr>\u003c/span>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003cspan style=\"color: rgb(9, 19, 36)\">Du är nu bättre förberedd att vidta åtgärder mot onlineövergrepp. Tack för att du tar dig tid att lära dig med oss. Den kunskap och praktiska förståelse du har utvecklat kan hjälpa dig att känna igen skadligt beteende, reagera mer självsäkert, stödja andra och bidra till säkrare digitala idrottsgemenskaper. Varje välgrundad handling spelar roll. Tillsammans kan vi bidra till att göra idrott säkrare online. Tack för att du har genomfört \u003c/span>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003cspan style=\"color: rgb(9, 19, 36)\">\u003cstrong>UAOA\u003c/strong>\u003c/span>\u003c/p>","note":"Native text body on Exit Page"}}},"finalQuiz":{"summaryScoredQuiz":{"body":{"text":"\u003cp>\u003cspan style=\"color: #091324\">Kontrollera vad du har lärt dig under kursens gång. Besvara varje fråga och granska sedan dina resultat.\u003c/span>\u003c/p>","note":"Native text body on Final Quiz"},"heading":{"text":"\u003cspan style=\"color: var(--background)\">\u003cstrong>Sammanfattning (poängsatt quiz)\u003c/strong>\u003c/span>","note":"Native heading on Final Quiz"}},"youAreReadyToActAgainst":{"body":{"text":"\u003cp>\u003cspan style=\"color: #091324\">\u003cstrong>Du började den här kursen med ett mål: att gå från medvetenhet till beredskap. Du har nu kunskapen och de praktiska verktygen för att känna igen övergrepp online, förstå hur och varför det händer, reagera med större självförtroende och stödja andra i din idrottsgemenskap. Ett sista steg: sammanför det du har lärt dig i det avslutande testet.\u003c/strong>\u003c/span>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003c/p>","note":"Native text body on Final Quiz"},"heading":{"text":"\u003cspan style=\"color: #21b7cb\">Du är redo att agera mot nätövergrepp\u003c/span>","note":"Native heading on Final Quiz"}},"yourReadiness":{"body":{"text":"\u003cp>\u003cspan style=\"color: #091324; font-size: 30px\">\u003cstrong>Din beredskapspoäng är {{score}}%! Du har lärt dig att känna igen onlineövergrepp, förstå dess inverkan och agera säkrare i individuella, organisatoriska och bredare idrottsliga sammanhang. Din poäng återspeglar din nuvarande beredskap att känna igen onlineövergrepp och fatta välgrundade beslut när de inträffar.\u003c/strong>\u003c/span>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003c/p>","note":"Native text body on Final Quiz"},"heading":{"text":"Din beredskap","note":"Native heading on Final Quiz"}}}}},"embeds":{"sensitiveNotice":{"title":{"text":"Meddelande om känsligt ämne"},"body":{"text":"Den här kursen behandlar ämnen som vissa läsare kan tycka är svåra eller upprörande. Du uppmuntras att arbeta dig igenom materialet i en takt som känns lämplig och att söka stöd där det behövs. Kom ihåg att du kan avsluta kursen när som helst och återvända när du känner dig redo."},"viewSupport":{"text":"Visa supportalternativ"},"supportTitle":{"text":"Supportalternativ"},"supportIntro":{"text":"Om något i den här kursen har påverkat dig kan du pausa och återkomma när du känner dig redo."},"someoneTrusted":{"text":"Någon du litar på"},"someoneTrustedDetail":{"text":"En vän, familjemedlem, lagkamrat eller tränare."},"orgLead":{"text":"Din organisations ansvariga för välfärd eller skydd"},"closeAria":{"text":"Nära"},"close":{"text":"Nära","note":"Support dialog primary close button"},"orgLeadDetail":{"text":"Klubbar och förbund kan erbjuda stöd och agera vid övergrepp."},"platformReporting":{"text":"Verktyg för plattformsrapportering"},"platformReportingDetail":{"text":"Alla större plattformar låter dig rapportera inlägg och konton."},"emergencyServices":{"text":"Räddningstjänst"},"emergencyServicesDetail":{"text":"Om du eller någon annan är i omedelbar fara, kontakta ditt lokala nödnummer."},"bodyM2":{"text":"Den här modulen diskuterar de emotionella och psykologiska effekterna av onlineövergrepp. Du uppmuntras att arbeta dig igenom materialet i en takt som känns lämplig och att söka stöd där det behövs. Du kan återvända till kursen när du är redo.","note":"Module 2 sensitive-notice body"},"bodyM3":{"text":"Den här modulen handlar om former av online-övergrepp. Inget kränkande innehåll visas. Ta pauser när du behöver dem och kom ihåg att stöd finns tillgängligt. Du kan återgå till kursen när du är redo.","note":"Module 4 sensitive-notice body (forms-of-abuse wording)"},"bodyM4":{"text":"Den här modulen diskuterar kränkningar online och hur man hanterar dem. Inget kränkande innehåll visas. Ta pauser när du behöver dem och kom ihåg att stöd finns tillgängligt. Du kan återgå till kursen när du är redo.","note":"Module 5 sensitive-notice body"}},"miniDictionary":{"teaser":{"text":"Vill du lära dig om andra former av nätövergrepp?"},"bodyBefore":{"text":"Onlineövergrepp kan ta sig många former utöver de tre beteenden som presenteras här. Utforska"},"linkLabel":{"text":"Miniordbok"},"bodyAfter":{"text":"för en snabb referens till andra taktiker du kan stöta på online."},"discretionLabel":{"text":"Läsarens bedömning:"},"discretion":{"text":"Vissa inlägg beskriver skadliga eller kränkande beteenden som kan vara känsliga eller upprörande. Utforska denna resurs efter eget gottfinnande och återvänd till kursen när du är redo."},"cta":{"text":"Utforska miniordboken"},"closeAria":{"text":"Nära"},"backToCourse":{"text":"Back to course","note":"Mini Dictionary dialog close button"},"termsCount":{"text":"{n} terms","note":"Section badge in Mini Dictionary; {n} = entry count"},"title":{"text":"Miniordbok: Andra möjliga former av onlinemissbruk","note":"Dictionary document title"},"fullText":{"text":"Miniordbok: Andra möjliga former av onlinemissbruk\nGiftigt innehåll\n* Avsiktlig förlägenhet - Att avsiktligt orsaka någon skam eller förödmjukelse, ofta offentligt.\n* Cybermobbning - Upprepad användning av elektronisk kommunikation för att skrämma, skrämma eller skämma ut en person.\n* Trolling - Att publicera provocerande eller stötande meddelanden för att utlösa starka reaktioner eller störa diskussionen.\n* Svordomar eller stötande innehåll - Vulgärt eller respektlöst språk, bilder eller kommunikation.\n* Hot om våld - Meddelanden avsedda att skapa rädsla för fysisk skada.\n* Uppvigling - Att uppmana andra att agera våldsamt eller olagligt.\n* Sexuella trakasserier - Oönskade sexuella närmanden eller kommentarer.\n* Oönskat explicit innehåll - Att dela sexuellt explicita bilder eller meddelanden utan samtycke.\n\nInnehållsläckage\n* Sextortion - Utpressning som hotar att släppa privat material om inte krav uppfylls.\n* Doxxing - Att publicera privat eller identifierande information med illvillig avsikt.\n* Outing - Att avslöja någons sexualitet eller könsidentitet utan tillstånd.\n* Deadnaming - Att använda en transperson eller icke-binär persons tidigare namn utan samtycke.\n* Bildexponering utan samtycke - Dela privata eller intima bilder eller videor utan samtycke.\n* Läckta chattar eller profiler - Exponera privata konversationer eller konton utan tillstånd.\n\nÖverbelastning\n* System- eller kontoöversvämning - Överväldiga en person eller plattform med överdrivet innehåll eller förfrågningar om att störa tjänsten eller tysta tal.\n* Zoombombning - Oönskat intrång i ett videosamtal för att störa det.\n* Negativa betyg och recensioner - Samordnad orättvis eller partisk feedback avsedd att skada ett rykte.\n\nFalsk rapportering\n* Swatting - Ett falskt nödsamtal avsett att utlösa en beväpnad polisinsats på någons plats.\n* Förfalskad missbruksrapport - Medvetet lämna in en falsk rapport för att orsaka skada.\n* Förfalskad missbruksflagga - Felaktigt flagga legitimt innehåll som kränkande för att få det borttaget eller censurerat.\n\nImitation\n* Imiterade profiler - Falska konton skapade för att lura eller bedra.\n* Imiterade chattar eller bilder - Fabricerat eller förändrat innehåll som falskeligen tillskrivs någon.\n* Syntetisk pornografi - Deepfake-teknik som används för att skapa explicit innehåll utan samtycke.\n* Personifierade webbsidor - Förfalskade webbplatser byggda för att lura användare eller skada en konkurrents ställning.\n* Kapad kommunikation - Obehörigt övertagande av ett konto eller en kanal för att sprida falska meddelanden.\n\nÖvervakning\n* Stalking eller spårning - Upprepad, oönskad övervakning av en persons rörelser eller aktivitet.\n* Kontoövervakning - Obehörig åtkomst till och spårning av någons kontoaktivitet.\n* Enhetsövervakning - Obehörig spårning av aktivitet på en persons telefon, dator eller surfplatta.\n* IoT-övervakning - Passiv datainsamling från bärbara enheter eller smarta enheter utan samtycke.\n* Webbläsarövervakning - Spårning av någons webbhistorik eller aktivitet utan deras vetskap.\n\nUtlåsning och kontroll\n* Innehållsradering - Obehörig borttagning av filer, inlägg eller data för att undertrycka information eller orsaka skada.\n* Kapning av webbläsare eller enheter - Ta kontroll över någons webbläsare eller anslutna enheter utan samtycke.\n* Kontoutlåsningar - Avsiktligt blockera en person från att komma åt sina egna konton eller innehåll.","note":"Full mini-dictionary source; HTML/markdown structure — translate carefully"}},"scroll":{"continue":{"text":"Fortsätta","note":"Scroll / fade continue control"},"continueAria":{"text":"Fortsätt till mer innehåll"},"continueRevealAria":{"text":"Fortsätt att avslöja mer innehåll"},"noBlock":{"text":"Inget följande block hittades på den här bilden.","note":"Dev/fallback message"}},"supportFloater":{"breakPill":{"text":"Need to take a break?","note":"Bottom-left floater pill → support options dialog"},"regionAria":{"text":"Course support","note":"aria-label on floater stack"}}},"welcome":{"partners":{"caption":{"text":"UAOA tackar Erasmus+-partnern FIA-medlemsklubbarna Autoklub Ceske republiky (Tjeckien), Zveza za avto sport Slovenije - AS (Slovenien), Real Federación Española De Automovilismo (Spanien) och Svenska Bilsportförbundet (Sverige) tillsammans med respektive akademiska partners Charles University, Prag, professor Matej Tusak (Slovenien), ESBS (European Sport Business School (ESBS Spanien)) och biträdande professor Lisa Kaati (Stockholms universitet) för bidrag till utvecklingen av denna e-lärandekurs.","note":"Welcome partner-acknowledgements caption embed (teal italic box under video)"}},"outcomes":{"listAria":{"text":"Vad du kommer att få ut av den här kursen","note":"aria-label on Welcome learning-objectives timeline list"},"items":{"i1":{"text":"\u003cstrong>Identifiera övergrepp online och dess olika former, inklusive vem som kan utsättas för oproportionerlig risk.\u003c/strong>","note":"HTML allowed — bold lead verb"},"i2":{"text":"\u003cstrong>Förstå effekterna av online-övergrepp i din idrottsgemenskap, med hjälp av verkliga bevis för att identifiera dess konsekvenser för psykisk hälsa och idrottsprestationer.\u003c/strong>","note":"HTML allowed — bold lead verb"},"i3":{"text":"\u003cstrong>Utforska hur digitala plattformar, algoritmer för sociala medier och AI kan förstärka övergrepp online, och hur effektiv styrning kan bidra till att minska dem.\u003c/strong>","note":"HTML allowed — bold lead verb"},"i4":{"text":"\u003cstrong>Tillämpa rapporteringsrutiner med tillförsikt och flagga kränkande innehåll på ett säkert och effektivt sätt på större sociala medier och spelplattformar.\u003c/strong>","note":"HTML allowed — bold lead verb"},"i5":{"text":"\u003cstrong>Vidta välgrundade åtgärder i din idrottsmiljö, individuellt och tillsammans med andra, för att bidra till att skapa säkrare miljöer inom idrotten.\u003c/strong>","note":"HTML allowed — bold lead verb"}}},"slide":{"whatYouWillGain":{"text":"Vad du kommer att få ut av den här kursen:","note":"Welcome native subheading above learning-objectives timeline"},"buildReadiness":{"text":"Bygg upp din handlingsberedskap","note":"Welcome native subheading above Continue CTA"},"euDisclaimer":{"body":{"text":"\u003cp style=\"text-align: left\">\u003cspan style=\"font-size: 11px\">\u003cem>Finansiering sker av Europeiska unionen. De åsikter och uppfattningar som uttrycks är dock endast författarnas/författarnas egna och återspeglar inte nödvändigtvis Europeiska unionens eller Europeiska genomförandeorganet för utbildning och kultur (EACEA). Varken Europeiska unionen eller EACEA kan hållas ansvariga för dem.\u003c/em>\u003c/span>\u003c/p>","note":"Native text body on Welcome"}},"sportConnectsMillionsOfPeopleAcross":{"body":{"text":"\u003cp>\u003cspan style=\"color: #091324\">\u003cstrong>Sport förenar miljontals människor över länder, kulturer och generationer genom passion, stolthet och spänningen i tävling. Onlineövergrepp sätter den kopplingen i fara. När idrottare, funktionärer, volontärer och fans attackeras online för vilka de är eller hur de presterar, kan konsekvenserna sträcka sig långt bortom skärmen - skada människor, spåra ur karriärer och normalisera kränkande beteende. United Against Online Abuse (UAOA) sammanför mer än 75 regeringar, sporter, akademiker och teknikplattformar kring ett gemensamt mål: att göra sporten säkrare från onlineövergrepp. Varaktig förändring kräver åtgärder från institutioner, samhällen och individer, och det inkluderar dig. Utvecklad i samarbete med University of Notre Dame, med denna e-lärandekurs, är huvudmålet med UAOA-initiativet att hjälpa dig att känna igen olika former av onlineövergrepp, förstå deras inverkan på din idrottsgemenskap och använda rapporteringsrutiner med självförtroende. När den är avslutad kommer kursen att förbereda dig för att vidta välgrundade åtgärder och bidra till en säkrare idrottsmiljö. Tack för att du deltar i arbetet.\u003c/strong>\u003cbr>\u003cbr>\u003cbr>\u003cbr>\u003c/span>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003c/p>","note":"Native text body on Welcome"},"p3":{"text":"\u003cp>United Against Online Abuse (UAOA) sammanför fler än 75 regeringar, sporter, akademiker och teknikplattformar kring ett gemensamt mål: att göra sporten säkrare från onlineövergrepp. Varaktig förändring kräver handling från institutioner, samhällen och individer, och det inkluderar dig.\u003c/p>","note":"Native text body on Welcome"}},"welcomeTitle":{"heading":{"text":"\u003cspan style=\"color: #1c3564\">Välkommen: Tack för att du deltar i UAOA-uppdraget!\u003c/span>","note":"Native heading on Welcome"}},"buildReadinessBody":{"text":"\u003cp>\u003cspan style=\"color: #091324\">Medvetenhet är bara början. Den här kursen bygger upp de praktiska kunskaper och färdigheter som behövs för att förstå övergrepp online och vidta välgrundade åtgärder för dig själv och för din idrottsgemenskap. Kursen är utformad för att möta dig var du än befinner dig i din förståelse av ämnet: Om du redan är bekant med övergrepp online, fördjupa din förståelse för rapporteringssystem, digitala plattformar, AI och nya metoder för förebyggande och respons. Om ämnet är nytt för dig, bygg en stark grund och identifiera praktiska sätt att bidra till säkrare onlinepraxis och digitala utrymmen inom idrotten. Vid slutet av kursen kommer du att vara bättre rustad att känna igen övergrepp online, reagera med självförtroende och spela en aktiv roll i att skapa säkrare idrott.\u003c/span>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003c/p>\u003cul style=\"margin: 0.5em 0 0.75em; padding-left: calc(1.35em + 10pt);\">\u003cli style=\"margin: 0 0 10pt; color: #091324;\">\u003cp style=\"margin: 0;\">\u003c/p>\u003c/li>\u003cli style=\"margin: 0; color: #091324;\">\u003cp style=\"margin: 0;\">\u003c/p>\u003c/li>\u003c/ul>\u003cp>\u003c/p>","note":"Native text body on Welcome"}},"about":{"aboutTheCourse":{"body":{"text":"\u003cp>\u003cspan style=\"color: #091324\">\u003cstrong>Kursens längdCirka 90 minuter, genomförs i din egen takt.Vem riktar sig kursen till?Alla som deltar i, arbetar med eller engagerar sig i idrott och vill bättre förstå och hantera online-övergrepp, inklusive idrottare, tränare, funktionärer, personal, volontärer, administratörer, medieproffs, fans och andra inom idrottsvärlden.Vad kan du förvänta dig?Fem korta moduler kombinerar praktisk vägledning, scenarier och möjligheter att tillämpa det du lär dig. Inga förkunskaper om online-övergrepp krävs.\u003c/strong>\u003c/span>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003c/p>","note":"Native text body on About This Course"},"heading":{"text":"\u003cspan style=\"color: #21b7cb\">Om kursen\u003c/span>","note":"Native heading on About This Course"}},"courseTitle":{"text":"\u003cspan style=\"color: var(--background); font-size: 22pt\">UAOA e-lärandekursFörstå och hantera onlineövergrepp inom idrotten\u003c/span>","note":"About course hero title (HTML)"},"readyToBegin":{"heading":{"text":"\u003cspan style=\"color: #21b7cb\">Redo att börja?\u003c/span>","note":"Native heading on About This Course"}},"startCourse":{"text":"Starta kursen","note":"Native navigation_button on About This Course"},"tagline":{"body":{"text":"\u003cp>\u003cspan style=\"color: #091324; font-size: 18px\">Den här kursen från \u003cstrong>United Against Online Abuse (UAOA)\u003c/strong> ger praktisk kunskap och verktyg som hjälper dig att känna igen övergrepp online, förstå dess effekter, navigera i rapporteringsförfaranden och vidta välgrundade åtgärder inom din idrottsgemenskap.\u003c/span>\u003c/p>","note":"Native text body on About This Course"},"heading":{"text":"\u003cspan style=\"color: #1c3564\">Bygga säkrare digitala utrymmen inom sport\u003c/span>","note":"Native heading on About This Course"}},"whatYoullExplore":{"body":{"text":"\u003cdiv style=\"margin:0;border:0;border-left:none;background:transparent;\">\u003cp style=\"margin:0 0 0.35em;\">\u003cspan style=\"color: #091324\">\u003cstrong>Modul 1 · Förstå onlineövergrepp\u003c/strong>\u003c/span>\u003c/p>\u003cp style=\"margin:0 0 1.35em; padding-left: 5em;\">\u003cspan style=\"color: #091324\">Lär dig känna igen olika former av onlineövergrepp, hur de kan överlappa varandra och eskalera, och vilka grupper av människor som utsätts för oproportionerliga risker.\u003c/span>\u003c/p>\u003cp style=\"margin:0 0 0.35em;\">\u003cspan style=\"color: #091324\">\u003cstrong>Modul 2 · Onlineövergrepp inom idrotten: Den mänskliga påverkan\u003c/strong>\u003c/span>\u003c/p>\u003cp style=\"margin:0 0 1.35em; padding-left: 5em;\">\u003cspan style=\"color: #091324\">Utforska hur onlineövergrepp kan påverka idrottare med konsekvenser för välbefinnande, prestation, deltagande och idrottsgemenskaper.\u003c/span>\u003c/p>\u003cp style=\"margin:0 0 0.35em;\">\u003cspan style=\"color: #091324\">\u003cstrong>Modul 3 · Hur onlineskada sprids\u003c/strong>\u003c/span>\u003c/p>\u003cp style=\"margin:0 0 1.35em; padding-left: 5em;\">\u003cspan style=\"color: #091324\">Förstå hur digitala plattformar, onlinebeteenden och framväxande tekniker kan förstärka skadligt innehåll och påverka hur övergrepp utvecklas och sprids.\u003c/span>\u003c/p>\u003cp style=\"margin:0 0 0.35em;\">\u003cspan style=\"color: #091324\">\u003cstrong>Modul 4 · Känna till dina rättigheter och skyldigheter\u003c/strong>\u003c/span>\u003c/p>\u003cp style=\"margin:0 0 1.35em; padding-left: 5em;\">\u003cspan style=\"color: #091324\">Bygg medvetenhet om dina rättigheter, skyldigheter och tillgängliga rapporteringsvägar, inklusive plattformarnas, idrottsorganisationernas och andra relevanta organens roller.\u003c/span>\u003c/p>\u003cp style=\"margin:0 0 0.35em;\">\u003cspan style=\"color: #091324\">\u003cstrong>Modul 5 · Agera: Bygg säkrare digitala idrottsgemenskaper\u003c/strong>\u003c/span>\u003c/p>\u003cp style=\"margin:0 0 0; padding-left: 5em;\">\u003cspan style=\"color: #091324\">Omsätt kunskap till handling genom att utforska praktiska sätt att förebygga, reagera på och utmana onlineövergrepp inom din idrottsgemenskap.\u003c/span>\u003c/p>\u003c/div>","note":"Native text body on About This Course"},"heading":{"text":"\u003cspan style=\"color: #21b7cb\">Vad du kommer att utforska\u003c/span>","note":"Native heading on About This Course"}}}},"course":{"outline":{"sections":{"uaoaCourse":{"text":"UAOA e-lärandekurs","note":"Sidebar section title (outline) — ScormStack section `71c3c17e-9739-4b2e-8e61-040352b392d8`"},"introduction":{"text":"Introduktion","note":"Sidebar section     });
    scope.querySelectorAll('[data-i18n-html]').forEach(function (el) {
      var key = el.getAttribute('data-i18n-html');
      if (!key) return;
      el.innerHTML = t(key, el.innerHTML);
    });

<script>
(function () {
  var SURVEY_ID = 'SV_byFcx7CeUVtiDki';
  var STORE_KEY = 'uaoa-post-course-survey-done';
  var RELAY = 'uaoa-qualtrics-eos';
  var t = window.t || function (k, fb) { return fb != null ? fb : k; };
  if (typeof window.applyDataI18n === 'function') window.applyDataI18n(document);

  var statusEl = document.getElementById('status');
  var fallback = document.getElementById('fallback');
  var doneBtn = document.getElementById('doneBtn');
  var finished = false;
  var readyAt = Date.now() + 8000; /* ignore load-time / returning-respondent EOS */

  /* Never restore a prior false-complete — start clean each visit. */
  try { sessionStorage.removeItem(STORE_KEY); } catch (e) {}
  statusEl.classList.remove('show', 'is-done');
  statusEl.textContent = '';

  function markComplete() {
    var tries = 0;
    function attempt() {
      try {
        if (window.SCORMSTACK && typeof SCORMSTACK.markBlockCompleted === 'function') {
          SCORMSTACK.markBlockCompleted();
          return;
        }
      } catch (e) {}
      tries += 1;
      if (tries < 8) setTimeout(attempt, 250);
    }
    attempt();
  }

  function setDone() {
    if (finished) return;
    finished = true;
    try { sessionStorage.setItem(STORE_KEY, '1'); } catch (e) {}
    statusEl.textContent = t(
      'survey.postCourse.completeStatus',
      'Survey complete — you can continue.'
    );
    statusEl.classList.add('show', 'is-done');
    fallback.classList.remove('show');
    markComplete();
  }

  /** String EOS/relay for this SV_ only — never object/JSON substring matches. */
  function isRelay(data) {
    return typeof data === 'string' && (
      data === RELAY + '|' + SURVEY_ID ||
      data.indexOf(RELAY + '|' + SURVEY_ID + '|') === 0
    );
  }

  function isRawEos(data) {
    if (typeof data !== 'string' || data.indexOf('QualtricsEOS') === -1) return false;
    var parts = data.split('|');
    if (parts[0] !== 'QualtricsEOS') return false;
    return (parts[1] || '').trim() === SURVEY_ID;
  }

  function onMessage(e) {
    var origin = String(e.origin || '');
    var fromQualtrics = origin.indexOf('qualtrics.com') !== -1;
    var fromPlayer = origin.indexOf('scormstack') !== -1 || origin.indexOf('docebo') !== -1;
    var fromSelf = !origin || origin === 'null' || origin === window.location.origin;
    var data = e.data;
    var ok = false;
    if (isRawEos(data) && fromQualtrics) ok = true;
    else if (isRelay(data) && (fromSelf || fromPlayer)) ok = true;
    if (!ok) return;
    /* Returning respondents often get thank-you + EOS immediately — wait it out. */
    if (Date.now() < readyAt) return;
    setDone();
  }

  window.addEventListener('message', onMessage);

  doneBtn.addEventListener('click', function () {
    setDone();
  });

  /* Fallback after ~10s so EOS can unlock first without a long wait */
  setTimeout(function () {
    if (!finished) fallback.classList.add('show');
  }, 10000);
})();
</script>
