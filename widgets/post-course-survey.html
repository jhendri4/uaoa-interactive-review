<style>
* { box-sizing: border-box; }
html, body {
  margin: 0;
  background: #fff;
  color-scheme: light;
}
body {
  font-family: 'Cerebri Sans Pro', system-ui, -apple-system, 'Segoe UI', sans-serif;

}
.wrap { max-width: 960px; margin: 0 auto; }
.frame-shell {
  border: 1px solid #C4CAD6;
  border-radius: 16px;
  overflow: hidden;
  background: #fff;
  min-height: 1800px;
}
iframe {
  display: block;
  width: 100%;
  height: 1800px;
  border: 0;
  background: #fff;
}
.status {
  margin: 0 0 14px;
  padding: 12px 16px;

  background: #EEF7F9;
  border: 1px solid #B7DCE4;
  color: #1C3564;

  line-height: 22px;
  font-weight: 600;
  display: none;
}
.status.show { display: block; }
.status.is-done {
  background: #E8F6EE;
  border-color: #A8D5B8;
  color: #1C3564;
}
.fallback {
  margin-top: 12px;
  display: none;
}
.fallback.show { display: block; }
.fallback p {
  margin: 0 0 10px;
  font-size: 14px;
  line-height: 20px;
  color: #5A6478;
}
.btn-done {
  font: inherit;
  font-weight: 800;
  font-size: 14px;
  color: #091324;
  background: #21B7CB;
  border: 0;
  border-radius: 999px;
  padding: 10px 18px;
  cursor: pointer;
}
.btn-done:hover { background: #1A9FB1; }
.btn-done:focus-visible {
  outline: none;
  box-shadow: 0 0 0 2px #fff, 0 0 0 4px #7C5297;
}
</style>

a långt efter att de har publicerats, vilket gör att kränkningar kan fortsätta över tid. Under livesändningar kan kränkande meddelanden dyka upp och mångfaldigas snabbt när tittarna reagerar i realtid."}},"g3":{"title":{"text":"Offentliga samtal"},"platforms":{"text":"X, Trådar"},"body":{"text":"Svar, återpubliceringar och omnämnanden kan sprida kränkande meddelanden i offentliga samtal. När många användare deltar kan en enda skadlig kommentar utvecklas till upprepade eller samordnade attacker mot en individ."}},"g4":{"title":{"text":"Diskussionsgrupper"},"platforms":{"text":"Reddit, Facebook-grupper"},"body":{"text":"Skadliga kommentarer kan spridas inom onlinegrupper när medlemmar svarar, delar eller uppmuntrar till liknande beteenden. Gruppdiskussioner kan förstärka negativa attityder och leda till upprepade övergrepp riktade mot samma person."}},"g5":{"title":{"text":"Meddelanden och gruppchattar"},"platforms":{"text":"Discord, WhatsApp"},"body":{"text":"Kränkande meddelanden kan vidarebefordras eller delas mellan individer och grupper, vilket sprider skadligt innehåll genom privata samtal. Begränsad synlighet utanför dessa utrymmen kan göra det svårt att identifiera och åtgärda pågående kränkningar."}}}},"factors":{"ui":{"prompt":{"text":"Välj de tre faktorer som direkt kan påverka hur skadligt innehåll sprids och når nya målgrupper online."},"hint":{"text":"Välj exakt tre alternativ."},"hintReady":{"text":"Tre utvalda – redo att skickas in."},"hintDone":{"text":"Alla tre korrekta faktorer valda."},"choicesAria":{"text":"Välj exakt tre faktorer"},"count":{"text":"{n} av {total} valda"},"ok":{"text":"\u003cstrong>Korrekt! Plattformfunktioner, rekommendationssystem och användarinteraktioner kan alla påverka hur innehåll distribueras, förstärks och exponeras för nya målgrupper.\u003c/strong>","note":"HTML allowed"},"bad":{"text":"\u003cstrong>Inte riktigt. Granska alternativen och försök igen.\u003c/strong>","note":"HTML allowed"}},"labels":{"a":{"text":"Plattformsdesign och funktioner","note":"Correct"},"b":{"text":"Åldern på den person som är föremål för målgruppen"},"c":{"text":"Rekommendations- och distributionssystem","note":"Correct"},"d":{"text":"Den utvalda personens idrottsliga roll"},"e":{"text":"Användarinteraktioner som att kommentera, dela och återpublicera","note":"Correct"},"f":{"text":"Huruvida det ursprungliga innehållet anses stötande"}}},"check":{"ui":{"instructionComplete":{"text":"Komplettera meningen."},"instructionBlanks":{"text":"Välj ett ord för varje tomrum. Varje ord används en gång."},"instructionMulti":{"text":"Markera alla som gäller."},"instructionPair":{"text":"Välj det ordpar som kompletterar meningen."},"blankAria":{"text":"Tomt","note":"aria-label; {n} = 1-based index"},"questionsCorrect":{"text":"frågorna korrekta"},"scorePerfect":{"text":"Perfekt – du svarade rätt på alla frågor.","note":"Score message; may vary — check widget"},"scorePartial":{"text":"Bra jobbat – granska eventuella missade artiklar nedan.","note":"Fallback score message"},"scoreLow":{"text":"Fortsätt – försök igen att stärka din förståelse."}},"questions":{"q1":{"label":{"text":"1. Komplettera meningen: Vad definierar övergrepp online?"},"prompt":{"text":"Onlineövergrepp innebär skadligt beteende riktat mot en person eller grupp genom __________."},"choices":{"a":{"text":"konkurrensutsatta miljöer"},"b":{"text":"digitala plattformar","note":"Correct"},"c":{"text":"offentliga utrymmen"},"d":{"text":"sportevenemang"}}},"q2":{"label":{"text":"2. Fyll i påståendet: Vad hjälper dig att förstå sammanhanget som definierar onlineövergrepp"},"sentenceBefore":{"text":"När du identifierar övergrepp online, överväg"},"sentenceMid1":{"text":"används, om beteendet har en tydlig"},"sentenceMid2":{"text":"och den"},"sentenceAfter":{"text":"av upprepade interaktioner."},"choices":{"language":{"text":"språk","note":"Correct blank 1"},"target":{"text":"mål","note":"Correct blank 2 — clear target"},"pattern":{"text":"mönster","note":"Correct blank 3 — pattern of repeated interactions"}}},"q3":{"label":{"text":"3. Vilken är en skyddad egenskap?"},"choices":{"religion":{"text":"Religion","note":"Correct"},"performance":{"text":"Atletisk prestation"},"disability":{"text":"Handikapp","note":"Correct"},"position":{"text":"Lagposition"},"ethnicity":{"text":"Etnicitet","note":"Correct"}}},"q4":{"label":{"text":"4. Fyll i luckorna: Hur kan övergrepp online utvecklas?"},"prompt":{"text":"Olika former av onlineövergrepp kan ___________, och en enda skadlig interaktion kan ___________ när andra kommenterar, delar, återpublicerar eller förstärker den."},"choices":{"a":{"text":"överlappning · eskalera","note":"Correct"},"b":{"text":"förbli separat · försvinna"},"c":{"text":"alternativ · bli privat"},"d":{"text":"interagera · bli ofarlig"}}}}},"matteo":{"ui":{"navAria":{"text":"Kortnavigering"},"prevAria":{"text":"Föregående kort"},"nextAria":{"text":"Nästa kort"}},"cards":{"c1":{"title":{"text":"1 - Tryck"},"alt":{"text":"Matteo förbereder sig under press","note":"Image alt text"},"html":{"text":"\u003cp>\u003cstrong>Matteo är en högpresterande volleybollspelare på college med ambitioner att komma med i landslaget. Mellan krävande kursarbete och intensiv träning har han varit under avsevärd press och kämpat för att hålla fokus.\u003c/strong>\u003c/p>\u003cp>\u003c/p>","note":"HTML allowed"}},"c2":{"title":{"text":"2 - Matchen"},"alt":{"text":"Matteo under matchen","note":"Image alt text"},"html":{"text":"\u003cp>\u003c/p>\u003cp>\u003c/p>\u003cp>Under en viktig match servar Matteo i nätet på matchboll, vilket kostar hans lag matchen. Publiken reagerar starkt, och några åskådare börjar skrika hård kritik om hans prestation från läktarna. Reaktionen fortsätter när Matteo lämnar planen. Är detta kränkningar online? Nej. Kritiken kan vara aggressiv och skadlig, men detta händer fortfarande \u003cstrong>offline\u003c/strong>. Reaktioner som börjar vid ett sportevenemang/på planen kan dock snabbt förflytta sig till digitala utrymmen, där de kan nå en mycket bredare publik.\u003c/p>","note":"HTML allowed"}},"c3":{"title":{"text":"3 - Det flyttar online"},"alt":{"text":"Kritiken sprider sig till sociala medier","note":"Image alt text"},"html":{"text":"\u003cp>\u003c/p>\u003cp>\u003cstrong>Efter matchen sprider sig kritiken online. En supporter publicerar en video på Matteos missade serve, taggar Matteos konto på sociala medier och lägger till förolämpande och förödmjukande kommentarer som syftar till att förlöjliga honom. Situationen har utvecklats till online-kränkningar. Supportern använder förolämpande och förödmjukande innehåll riktat mot Matteo via en digital plattform. Detta är kränkande språk.\u003c/strong>\u003c/p>\u003cp>\u003c/p>","note":"HTML allowed"}},"c4":{"title":{"text":"4 - Situationen eskalerar"},"alt":{"text":"Fientliga kommentarer sprids på nätet","note":"Image alt text"},"html":{"text":"\u003cp>\u003c/p>\u003cp>\u003cstrong>Nästa dag hade många användare anslutit sig. Fientliga kommentarer dyker upp på Matteos sociala mediekonton, och videon på hans missade serve delas upprepade gånger tillsammans med förolämpande inlägg. Situationen har eskalerat till digital fientlighet. Det som började med en användare har utvecklats till ett upprepat och kollektivt mönster av fientliga interaktioner online.\u003c/strong>\u003c/p>\u003cp>\u003c/p>","note":"HTML allowed"}}}},"takeaways":{"heading":{"text":"Viktiga slutsatser"},"items":{"i1":{"text":"\u003cstrong>Onlineövergrepp tar sig olika uttryck. Kränkande språk, hatpropaganda och digital fientlighet hjälper oss att känna igen olika sätt som skadligt beteende kan uppstå och utvecklas online.\u003c/strong>","note":"HTML allowed"},"i2":{"text":"\u003cstrong>Kontext spelar roll. Tänk på språket som används, vem eller vad som riktas mot och interaktionsmönstret när du identifierar övergrepp online.\u003c/strong>","note":"HTML allowed"},"i3":{"text":"\u003cstrong>Olika former av övergrepp kan överlappa varandra. En enda interaktion kan innefatta mer än ett beteende, och dess egenskaper kan förändras allt eftersom situationen utvecklas.\u003c/strong>","note":"HTML allowed"},"i4":{"text":"\u003cstrong>Onlineövergrepp kan eskalera. Ett enda skadligt inlägg kan utvecklas till upprepad eller kollektiv fientlighet när andra kommenterar, delar, återpublicerar eller förstärker innehållet.\u003c/strong>","note":"HTML allowed"},"i5":{"text":"\u003cstrong>Vissa människor löper oproportionerligt hög risk. Identitet, synlighet, roll och andra kontextuella faktorer kan påverka vem som utsätts för övergrepp och arten eller intensiteten av de övergrepp de utsätts för.\u003c/strong>","note":"HTML allowed"},"i6":{"text":"\u003cstrong>Erkännande är det första steget mot handling. Att förstå hur övergrepp online ser ut hjälper människor att identifiera skadliga situationer och reagera mer effektivt.\u003c/strong>","note":"HTML allowed"}}},"slide":{"title":{"text":"Modul 1 - Att förstå övergrepp online","note":"slide_intro title"},"continueToModule2":{"text":"Fortsätt till modul 2","note":"End-of-module navigation_button label"},"applyWhatDoYouSee":{"body":{"text":"\u003cp>\u003cspan style=\"color: #091324\">\u003cstrong>Övergrepp online kan ta sig olika uttryck. Läs varje scenario och välj det beteende som bäst beskriver vad som händer.\u003c/strong>\u003c/span>\u003c/p>","note":"Native text body on Understanding Online Abuse"},"heading":{"text":"\u003cspan style=\"color: #21b7cb\">Tillämpa: Vad ser du?\u003c/span>","note":"Native heading on Understanding Online Abuse"}},"contextMatters":{"body":{"text":"\u003cp>\u003cspan style=\"color: #091324\">Onlineövergrepp passar inte alltid perfekt in i en kategori. För att förstå vad som händer, tänk på:\u003c/span>\u003c/p>","note":"Native text body on Understanding Online Abuse"},"heading":{"text":"\u003cspan style=\"color: #21b7cb\">Kontext spelar roll\u003c/span>","note":"Native heading on Understanding Online Abuse"}},"exploreHowCanOnlineAbuseEvolve":{"body":{"text":"\u003cp>\u003cspan style=\"color: #091324\">\u003cstrong>Onlineövergrepp kan börja med personliga interaktioner och utvecklas i takt med att skadligt innehåll sprids och andra blir inblandade. Följ Matteos erfarenhet för att se hur detta kan hända.\u003c/strong>\u003c/span>\u003c/p>","note":"Native text body on Understanding Online Abuse"},"heading":{"text":"\u003cspan style=\"color: #21b7cb\">Utforska: Hur kan övergrepp online utvecklas?\u003c/span>","note":"Native heading on Understanding Online Abuse"}},"introSubtitle":{"text":"Beräknad tid: 15 minuter","note":"slide_intro subtitle (estimated time)"},"languageWhatIsBeingSaidOr":{"body":{"text":"\u003cul style=\"margin:0; padding-left: 3.0em; list-style:disc; color: #091324; font-family:'Cerebri Sans Pro', system-ui, -apple-system, 'Segoe UI', sans-serif; font-size:16px; line-height:1.55;\">\u003cli style=\"margin:0 0 8px;\">\u003cp>\u003cstrong>Språk: Vad sägs eller delas? Mål: Är attacken inriktad på prestation, utseende, identitet eller en skyddad egenskap? Mönster: Är det en enskild interaktion eller en del av upprepad eller kollektiv fientlighet?\u003c/strong>\u003c/p>\u003c/li>\u003cli style=\"margin:0 0 8px;\">\u003cp>\u003c/p>\u003c/li>\u003cli style=\"margin:0;\">\u003cp>\u003c/p>\u003c/li>\u003c/ul>","note":"Native text body on Understanding Online Abuse"}},"onlineAbuseDoesNotAffectEveryone":{"body":{"text":"\u003cp style=\"text-align: left\">\u003cspan style=\"color: #091324\">\u003cstrong>Onlineövergrepp drabbar inte alla lika. Vissa människor utsätts för mer frekventa eller riktade övergrepp när fientlighet fokuserar på personliga egenskaper som anses vara skyddade. Skyddade egenskaper kan inkludera ras, etnicitet, nationalitet, religion, kön, sexuell läggning, funktionsnedsättning, ålder, graviditetsstatus och civilstånd. Denna lista är inte uttömmande, och erkända eller skyddade egenskaper kan variera mellan rättssystem, språk, kulturer och länder. När fientligt eller illvilligt språk riktar sig mot någon baserat på dessa eller andra skyddade egenskaper kan det utgöra hatpropaganda.\u003c/strong>\u003cbr>\u003cbr>\u003c/span>\u003c/p>\u003cp style=\"text-align: left\">\u003c/p>\u003cp style=\"text-align: left\">\u003c/p>","note":"Native text body on Understanding Online Abuse"}},"onlineConversationsArePartOfSport":{"body":{"text":"\u003cp>\u003cspan style=\"color: #091324; font-size: 18px\">\u003cstrong>Nätkonversationer är en del av sporten\u003c/strong>att fira ett resultat, diskutera ett beslut eller få kontakt med ett lag eller en idrottare. Men dessa utrymmen kan också bli platser där människor blir förödmjukade, utsatta för övergrepp eller överväldigade av kritik och kränkningar.\u003c/span>\u003c/p>","note":"Native text body on Understanding Online Abuse"},"heading":{"text":"\u003cspan style=\"color: #1c3564; font-size: 14px\">Nätkonversationer är en del av sporten: att fira ett resultat, diskutera ett beslut eller få kontakt med ett lag eller en idrottare. Men dessa utrymmen kan också bli platser där människor blir förödmjukade, utsatta för övergrepp eller överväldigade av kritik och kränkningar.\u003c/span>","note":"Native heading on Understanding Online Abuse"}},"whatDoWeUnderstandByOnline":{"body":{"text":"\u003cp>\u003cspan style=\"color: #091324\">\u003cstrong>Onlineövergrepp är allt skadligt beteende riktat mot en person eller grupp via digitala plattformar. Definitioner varierar mellan länder och sammanhang, så vi fokuserar på det som är viktigast: att identifiera skadan och bygga upp kunskapen för att förebygga den inom idrotten. För att identifiera onlineövergrepp hjälper det att förstå de olika former det kan ta sig. Tänk på det som ett paraply som täcker tre sammanhängande beteenden:\u003c/strong>\u003cbr>\u003cbr>\u003c/span>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003c/p>","note":"Native text body on Understanding Online Abuse"},"heading":{"text":"\u003cspan style=\"color: #21b7cb\">Vad menar vi med nätmisshandel?\u003c/span>","note":"Native heading on Understanding Online Abuse"},"p4":{"text":"\u003cp>För att känna igen övergrepp online är det bra att förstå de olika former det kan ta sig. Tänk på det som ett paraply som täcker tre sammankopplade beteenden. Markera varje kort för att visa definitionen.\u003c/p>","note":"Native text body on Understanding Online Abuse"}},"whenTheBehavioursOverlap":{"body":{"text":"\u003cp style=\"text-align: left\">\u003cspan style=\"color: #091324\">\u003cbr>\u003cbr>\u003cstrong>Tänk dig att en spelare får en förödmjukande kommentar efter en förlust. Liknande meddelanden översvämmar sedan deras konto i flera dagar. Vissa attackerar också deras etnicitet. Det förödmjukande språket är kränkande tal. Den upprepade offentliga aggressionen på en eller flera sociala medieplattformar skapar digital fientlighet. Den rasistiska inriktningen betraktas som hatpropaganda. För att identifiera vad som händer, titta på språket, vem eller vad det riktar sig mot och interaktionsmönstret. Mer än ett beteende kan förekomma.\u003c/strong>\u003cbr>\u003cbr>\u003c/span>\u003c/p>","note":"Native text body on Understanding Online Abuse"},"heading":{"text":"\u003cspan style=\"color: #21b7cb\">När beteendena överlappar varandra:\u003c/span>","note":"Native heading on Understanding Online Abuse"}}}},"m2":{"check":{"questions":{"q1":{"prompt":{"text":"Vilka kan drabbas av nätövergrepp inom sport?","note":"MCQ stem"},"choices":{"c0":{"text":"Endast främst professionella idrottare och tävlingsfunktionärer."},"c1":{"text":"Vem som helst med ett offentligt konto på sociala medier."},"c2":{"text":"Idrottare, funktionärer, journalister, organisationer och deras representanter, familjer, fans och andra inom idrottsgemenskaper.","note":"Correct answer"},"c3":{"text":"Främst personer vars arbete innebär att kommunicera direkt med fans."}},"ok":{"text":"\u003cstrong>Korrekt! Onlineövergrepp kan drabba människor i hela sportens ekosystem, inklusive de som är direkt utsatta och andra som bevittnar eller upplever dess bredare konsekvenser.\u003c/strong>","note":"HTML allowed"}},"q2":{"prompt":{"text":"Vilket påstående beskriver bäst den potentiella effekten av online-övergrepp inom sport?"},"choices":{"c0":{"text":"Dess effekter är huvudsakligen begränsade till hur människor känner eller reagerar omedelbart efter att ha mottagit kränkande innehåll."},"c1":{"text":"Det kan ha långsiktiga effekter på välbefinnande, professionell aktivitet, relationer, deltagande och det bredare idrottssamhället.","note":"Correct answer"},"c2":{"text":"Det är något som bara berör elitidrottarna eftersom de har störst offentlig synlighet."},"c3":{"text":"Dess inverkan beror främst på hur ofta någon använder sociala medier."}},"ok":{"text":"\u003cstrong>Korrekt! Onlineövergrepp kan påverka flera områden i en persons liv och arbete. Inom idrott kan det drabba idrottare mest, oavsett deras nivå, men konsekvenserna kan också drabba familjer, kollegor, lag, fans och idrottsgemenskaper.\u003c/strong>","note":"HTML allowed"}},"q3":{"prompt":{"text":"En idrottare som har upplevt upprepade övergrepp online börjar sova dåligt, har svårt att koncentrera sig under träning och publicerar mer sällan online. Vad illustrerar detta exempel?"},"choices":{"c0":{"text":"Olika effekter av onlineövergrepp kan överlappa varandra och påverka flera områden i en persons liv.","note":"Correct answer"},"c1":{"text":"Minskad aktivitet på sociala medier är oftast den primära effekten av övergrepp online."},"c2":{"text":"Prestationseffekter uppstår efter att en coach rekommenderar att man använder mindre sociala medier."},"c3":{"text":"Effekterna av online-övergrepp beror främst på hur ofta en person använder sociala medier."}},"ok":{"text":"\u003cstrong>Korrekt! Effekter kan vara sammankopplade. Känslomässig stress, sömn, självförtroende, trygghet, prestation och deltagande kan påverka varandra och kan utvecklas över tid.\u003c/strong>","note":"HTML allowed"}},"q4":{"prompt":{"text":"Vad antyder bevisen som presenteras i den här modulen om hur människor reagerar på övergrepp online?"},"choices":{"c0":{"text":"Människor upplever generellt liknande effekter när de exponeras för liknande innehåll."},"c1":{"text":"Stark motståndskraft förhindrar att onlineövergrepp påverkar välbefinnandet."},"c2":{"text":"Effekterna kan variera mellan människor, och personliga och kontextuella faktorer kan forma hur någon reagerar.","note":"Correct answer"},"c3":{"text":"Människor som fortsätter att idrotta har sannolikt inte påverkats nämnvärt."}},"ok":{"text":"\u003cstrong>Korrekt! Effekten av onlineövergrepp varierar. Forskning som diskuteras i modulen visar att faktorer som motståndskraft och självkänsla kan kopplas till hur människor reagerar, men att fortsätta delta betyder inte att någon inte har påverkats.\u003c/strong>","note":"HTML allowed"}}}},"affected":{"ui":{"progress":{"text":"{n} av {total} utforskade"}},"cards":{"c1":{"name":{"text":"Idrottare"},"body":{"text":"Hög offentlig synlighet kan göra idrottare till frekventa måltavlor för online-övergrepp. Hatiska reaktioner kan uppstå på grund av sportresultat, allmänhetens uppfattningar eller tolkningar av en idrottares prestationer, handlingar eller personliga beslut. Dessa reaktioner kan eskalera snabbt, vilket gör att skadligt innehåll sprids över digitala plattformar."}},"c2":{"name":{"text":"Matchfunktionärer"},"body":{"text":"Domare kan utsättas för online-trakasserier efter beslut som fattats under tävlingar, vilket förvärrar de verbala och fysiska trakasserier de redan kan uppleva personligen. Upprepad kritik, hot och fientlighet kan bidra till stress och påverka deras självförtroende, upplevda auktoritet och välbefinnande."}},"c3":{"name":{"text":"Journalister"},"body":{"text":"Journalister spelar en viktig roll i att koppla samman idrottare, lag och idrottsorganisationer med en bredare publik. Journalister kan bli måltavlor för fientlighet online som svar på sin rapportering, kommentarer eller upplevda ståndpunkt i en fråga."}},"c4":{"name":{"text":"Sponsorer och representanter"},"body":{"text":"Idrottsorganisationer och de personer som finansierar, förvaltar och representerar dem kan också bli måltavlor för online-övergrepp. Fientlig innehåll kan riktas mot en organisation i sig, dess beslut, policyer eller handlingar, eller mot enskilda anställda och representanter. Detta kan påverka organisationens rykte, professionella verksamhet, beslutsfattande och de inblandades välbefinnande."}},"c5":{"name":{"text":"Familjer"},"body":{"text":"Effekterna av onlineövergrepp kan drabba familjer och nära och kära till de som utsätts för övergrepp. De kan bevittna övergreppen och dess konsekvenser, bli indirekta måltavlor genom sin kontakt med den person som upplever övergrepp, eller ta emot skadliga meddelanden riktade mot dem personligen. Dessa upplevelser kan också öka oron och rädslan för säkerheten och välbefinnandet hos någon som står dem nära."}},"c6":{"name":{"text":"Fläktar"},"body":{"text":"Fans är den största gruppen inom sport och förbises ofta. De kan påverkas av de övergrepp de möter inom idrottsgemenskaper, även när de inte är ett direkt mål. Identitetsbaserade övergrepp riktade mot en idrottare, funktionär eller annan offentlig person kan också påverka fans som delar den identiteten och bidra till en miljö där de kan känna sig oönskade eller otrygga."}}}},"exploreImpacts":{"ui":{"eyebrow":{"text":"Utforska"},"prompt":{"text":"Efter att ha fått upprepade kränkande meddelanden online börjar en idrottare posta mer sällan på sociala medier. Deras tränare märker att de verkar distraherade under träningen, och de har nyligen nämnt att de sover dåligt och känner sig oroliga inför att delta i offentliga evenemang."},"hint":{"text":"Välj minst fyra som passar och skicka sedan in."},"count":{"text":"{n} vald"},"ok":{"text":"\u003cstrong>Dessa effekter kan vara sammankopplade. Onlineövergrepp kan påverka flera områden i en persons liv samtidigt, och effekterna kan utvecklas eller intensifieras över tid. Att känna igen dessa tecken kan hjälpa människor inom idrott att reagera med större medvetenhet och stöd.\u003c/strong>","note":"HTML allowed"},"bad":{"text":"\u003cstrong>Inte riktigt. Försök igen.\u003c/strong>","note":"HTML allowed — shown when submit has fewer than 4 impacts selected"}},"labels":{"c0":{"text":"Känslomässig nöd"},"c1":{"text":"Sömnstörningar"},"c2":{"text":"Minskat självförtroende"},"c3":{"text":"Känsla av trygghet"},"c4":{"text":"Fokus och prestation"},"c5":{"text":"Att ta ett steg bort"}}},"impacts":{"ui":{"pathwayAria":{"text":"Påverkansväg"},"navAria":{"text":"Karusellnavigering"},"prevAria":{"text":"Tidigare påverkan"},"nextAria":{"text":"Nästa påverkan"},"researchHeading":{"text":"Vad forskningen visar"},"done":{"text":"Aktivitet klar — du har granskat alla sex effekter"}},"cards":{"c1":{"title":{"text":"Känslomässig nöd"},"short":{"text":"Nöd","note":"Pathway short label"},"alt":{"text":"Tillfällig illustration · känslomässig stress","note":"Image alt"},"body":{"text":"\u003cp>Att bli utsatt för övergrepp online kan utlösa känslor av rädsla, sorg, ilska och frustration. För idrottare kan dessa upplevelser också väcka oro kring deras rykte, karriärmöjligheter, relationer med familj och vänner och lagprestationer. När övergrepp sker offentligt kan dess synlighet och potentiella spridning ytterligare intensifiera den psykiska stressen.\u003c/p>","note":"HTML allowed"},"research":{"text":"\u003cstrong>I en undersökning av 85 idrottare i NCAA Division I var större exponering för trakasserier online associerad med högre nivåer av depressiva symtom. Forskarna beskriver fientligt onlineinnehåll som en betydande källa till psykologisk stress för universitetsidrottare.\u003c/strong>","note":"HTML allowed"},"source":{"text":"Hughes, M. C., Demaray, M. K., Skiba, E. A., & Warriner, S. E. (2026). Trakasserier online och psykisk hälsa bland studentidrottare på universitetsnivå: Resultat från en undersökning vid NCAA Division I-konferensen. Journal of Issues in Intercollegiate Athletics.","note":"Citation; keep author names"}},"c2":{"title":{"text":"Sova"},"short":{"text":"Sova","note":"Pathway short label"},"alt":{"text":"Tillfällig illustration · sömn","note":"Image alt"},"body":{"text":"\u003cp>Onlineövergrepp kan störa sömn och återhämtning. Skadliga onlineupplevelser kan fortsätta efter den första interaktionen och påverka en idrottares förmåga att vila och återhämta sig.\u003c/p>","note":"HTML allowed"},"research":{"text":"I en studie av 912 unga idrottare i åldrarna 12–24 rapporterade 10,4 % att de upplevt online-övergrepp. Bland de drabbade rapporterade 44,3 % måttliga till svåra effekter på sin sömnkvalitet.","note":"HTML allowed"},"source":{"text":"Tooth, C., Kaux, J.-F., Tscholl, P., Touré, A., Muller, F., & Seil, K. (2026). Sociala mediers inverkan på unga idrottares psykiska hälsa: En tvärsnittsstudie. Frontiers in Psychology.","note":"Citation; keep author names"}},"c3":{"title":{"text":"Självförtroende och självkänsla"},"short":{"text":"Förtroende","note":"Pathway short label"},"alt":{"text":"Tillfällig illustration · självförtroende","note":"Image alt"},"body":{"text":"\u003cp>Onlineövergrepp riktar sig ofta mot en persons förmågor, kropp eller identitet. Upprepad kritik, inklusive kommentarer som delas offentligt för att förödmjuka eller såra någon, kan påverka den utsatta personens självförtroende och få dem att tvivla på sina färdigheter, beslut och plats inom idrotten.\u003c/p>","note":"HTML allowed"},"research":{"text":"\u003cstrong>Forskning tyder på att interna faktorer kan forma hur människor reagerar på hat online. I en studie av 60 offentliga personer, inklusive olympiska idrottare, och 1 128 internetanvändare, var högre motståndskraft och självkänsla förknippade med lägre nivåer av oro över det hat online de utsattes för. Detta tyder på att människor kan uppleva samma typ av fientlighet på olika sätt, delvis beroende på deras psykologiska resurser.\u003c/strong>","note":"HTML allowed"},"source":{"text":"Jędryczka, W., Sorokowski, P., & Dobrowolska, M. (2022). Offrets motståndskraft och självkänslas roll i upplevelsen av internethat. International Journal of Environmental Research and Public Health.","note":"Citation; keep author names"}},"c4":{"title":{"text":"Känsla av trygghet"},"short":{"text":"Säkerhet","note":"Pathway short label"},"alt":{"text":"Tillfällig illustration · känsla av trygghet","note":"Image alt"},"body":{"text":"\u003cp>\u003cstrong>Hot och fientlighet online kan utvidga oron kring säkerhet bortom digitala utrymmen. Personer som utsätts för hot kan oroa sig för sin egen säkerhet hemma, under tävlingar och i offentliga utrymmen. När hoten även involverar deras nära och kära kan dessa farhågor även omfatta familjemedlemmar och nära och kära.\u003c/strong>\u003c/p>","note":"HTML allowed"},"research":{"text":"\u003cstrong>I UAOA-barometern 2025 rapporterade nästan tre av fyra tillfrågade idrottsförbund att hot om att skada idrottare eller deras anhöriga fortfarande är verklighet för dem som använder sociala medieplattformar. Resultatet rapporterades också i den föregående upplagan av barometern, vilket tyder på en fortsatt oro inom idrotten.\u003c/strong>","note":"HTML allowed"},"source":{"text":"Enade mot nätövergrepp. (2025). Barometer för nätövergrepp inom idrott 2025.","note":"Citation; keep author names"}},"c5":{"title":{"text":"Fokus och prestation"},"short":{"text":"Fokus","note":"Pathway short label"},"alt":{"text":"Tillfällig illustration · fokus och prestanda","note":"Image alt"},"body":{"text":"\u003cp>De skadliga effekterna av psykisk stress på fokus och prestation är väl dokumenterade. Eftersom online-övergrepp kan orsaka psykisk stress kan det negativt påverka idrottares fokus och prestation, vilket gör det svårare att koncentrera sig, fatta beslut under press och prestera konsekvent.\u003c/p>","note":"HTML allowed"},"research":{"text":"\u003cstrong>I en studie av 274 kanadensiska basketdomare var högre välbefinnande signifikant associerat med bättre självskattade domarprestationer, även efter att erfarenhet beaktats. Tidigare forskning som författarna citerade fann också att 90 % av fotbollsdomarna trodde att vanliga psykiska hälsosymptom kunde påverka deras domarprestationer negativt.\u003c/strong>","note":"HTML allowed"},"source":{"text":"Taylor, N., Hancock, D., & Sullivan, P. (2026). Psykisk hälsa och domarprestationer. Frontiers in Psychology.","note":"Citation; keep author names"}},"c6":{"title":{"text":"Att ta ett steg bort"},"short":{"text":"Att ta ett steg bort","note":"Pathway short label"},"alt":{"text":"Tillfällig illustration · att ta ett steg tillbaka","note":"Image alt"},"body":{"text":"\u003cp>\u003cstrong>Onlineövergrepp kan påverka huruvida människor fortsätter att delta, arbeta eller kommunicera öppet inom idrott. Vissa kan minska sin närvaro på sociala medier, ompröva sitt engagemang eller bli mer försiktiga med vad de delar offentligt.\u003c/strong>\u003c/p>","note":"HTML allowed"},"research":{"text":"\u003cstrong>Forskning om övergrepp inom idrott fann att både fysisk och icke-fysisk misshandel var förknippad med en större avsikt att sluta bland fotbollsdomare i England och Kanada. Övergrepp var också förknippade med minskat välbefinnande. I UAOA-barometern 2025 uttryckte 90 % av de tillfrågade idrottsförbunden oro för att onlineövergrepp skulle kunna driva ut begåvade idrottare från idrott.\u003c/strong>","note":"HTML allowed"},"source":{"text":"Downward, P., Webb, T., & Dawson, P. (2024). Domarmisshandel, avsikt att sluta och välbefinnande. Research Quarterly for Exercise and Sport. United Against Online Abuse. (2025). Online Abuse in Sport Barometer 2025.","note":"Citation; keep author names"}}}},"takeaways":{"heading":{"text":"Viktiga slutsatser"},"items":{"i1":{"text":"\u003cstrong>Onlineövergrepp kan ha omfattande effekter. Dess inverkan kan sträcka sig över välbefinnande, självförtroende, trygghetskänsla, prestation, deltagande och andra områden i en persons liv.\u003c/strong>","note":"HTML allowed"},"i2":{"text":"\u003cstrong>Effekterna kan vara sammankopplade. Känslomässig stress, störd sömn, minskat självförtroende, säkerhetsproblem och svårigheter att fokusera kan överlappa varandra och påverka varandra.\u003c/strong>","note":"HTML allowed"},"i3":{"text":"\u003cstrong>Människor kan påverkas olika. Personliga och kontextuella faktorer kan forma hur någon upplever och reagerar på onlineövergrepp.\u003c/strong>","note":"HTML allowed"},"i4":{"text":"\u003cstrong>Effekten sträcker sig bortom de som är direkt drabbade. Familjer, lagkamrater, kollegor, fans, organisationer och andra inom idrottsgemenskaper kan också uppleva dess konsekvenser.\u003c/strong>","note":"HTML allowed"},"i5":{"text":"\u003cstrong>Onlineövergrepp kan påverka deltagande och idrottskultur. Ihållande fientlighet kan påverka vilka som känner sig trygga, välkomna och kan delta i idrott.\u003c/strong>","note":"HTML allowed"},"i6":{"text":"\u003cstrong>Konsekvenserna kan sträcka sig bortom sporten. När diskriminerande och kränkande beteenden normaliseras kan de förstärka fördomar, utanförskap och fientlighet i samhället i stort.\u003c/strong>","note":"HTML allowed"}}},"slide":{"title":{"text":"Modul 2 - Onlineövergrepp inom idrotten: Den mänskliga påverkan","note":"slide_intro title"},"section1":{"text":"Varför den mänskliga påverkan är viktig","note":"Section heading on Online Abuse in Sport: The Human Impact"},"section2":{"text":"Vilka drabbas av nätövergrepp?","note":"Section heading on Online Abuse in Sport: The Human Impact"},"section3":{"text":"Effekten av online-övergrepp på människor","note":"Section heading on Online Abuse in Sport: The Human Impact"},"section4":{"text":"Utforska: Vilka potentiella effekter av onlineövergrepp kan du identifiera?","note":"Section heading on Online Abuse in Sport: The Human Impact"},"section5":{"text":"Den bredare bilden","note":"Section heading on Online Abuse in Sport: The Human Impact"},"barometerCallout":{"text":"\u003cp>För att lära dig mer om effekterna och skadorna av online-övergrepp, inbjuder vi dig att utforska resultaten från UAOA:s banbrytande studie som samlats in i \u003ca href=\"https://unitedagainstonlineabuse.com/uaoa-barometer-2025/\" target=\"_blank\" rel=\"noopener\">UAOA Barometer 2025\u003c/a> - som mäter online-övergrepp inom idrott, med deltagande från ledande icke-statliga organisationer och internationella förbund.\u003c/p>","note":"Module 2 Barometer image_with_text"},"continueToModule3":{"text":"Fortsätt till modul 3","note":"End-of-module navigation_button label"},"checkYourUnderstandingOfTheKey":{"body":{"text":"\u003cp>\u003cspan style=\"color: #091324\">Kontrollera din förståelse av huvudidéerna från den här modulen.\u003c/span>\u003c/p>","note":"Native text body on Online Abuse in Sport: The Human Impact"}},"introSubtitle":{"text":"Beräknad tid: 15 minuter","note":"slide_intro subtitle (estimated time)"},"section1Body":{"text":"\u003cp>\u003cspan style=\"color: #091324\">\u003cstrong>Att förstå hur onlineövergrepp påverkar människor hjälper oss att bygga empati för de som utsätts för övergrepp och reagera med omsorg och respekt. Effekterna av onlineövergrepp på människor kan vara allvarliga och långtgående: ett enda inlägg kan få någon att känna sig orolig, otrygg eller tvivla på sig själv även långt efter den första interaktionen. Allt eftersom övergrepp fortsätter eller sprider sig över digitala plattformar kan dess inverkan intensifieras. Onlineövergrepp kan påverka mental hälsa och välbefinnande, såväl som hur idrottare presterar, hur domare tar beslut och hur journalister och andra yrkesverksamma engagerar sig i sitt arbete. Sådana effekter kan också sträcka sig bortom den person som utsätts för övergrepp. Familjer, lagkamrater, kollegor och fans kan bevittna eller uppleva konsekvenserna av övergrepp. På en bredare nivå kan ihållande fientlighet online forma idrottskulturen, påverka deltagandet och påverka vem som känner sig trygg och välkommen inom idrotten.\u003c/strong>\u003c/span>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003c/p>","note":"Section body on Online Abuse in Sport: The Human Impact"},"section2Body":{"text":"\u003cp>\u003cspan style=\"color: #091324\">\u003cstrong>Idrottare med hög profil tenderar att utsättas för en stor mängd online-övergrepp. Idrottare är dock inte de enda som är måltavlor.\u003c/strong>\u003c/span>\u003c/p>","note":"Section body on Online Abuse in Sport: The Human Impact"},"section3Body":{"text":"\u003cp>\u003cspan style=\"color: #091324\">Nätrelaterade övergrepp kan drabba alla som är involverade i idrott. Konsekvenserna varierar beroende på individen och deras omständigheter, och vissa effekter är särskilt relevanta för idrottare. Dessa effekter kan också förstärka varandra: ångest kan störa sömnen, dålig sömn kan påverka koncentration och självförtroende, och dessa kombinerade effekter kan påverka dagliga aktiviteter, idrottsprestationer och det allmänna välbefinnandet.\u003c/span>\u003c/p>","note":"Section body on Online Abuse in Sport: The Human Impact"},"section4Body":{"text":"\u003cp>\u003cspan style=\"color: #091324\">Efter att ha fått upprepade kränkande meddelanden online börjar en idrottare posta mer sällan på sociala medier. Deras tränare märker att de verkar distraherade under träningen, och de har nyligen nämnt att de sover dåligt och känner sig oroliga inför att delta i offentliga evenemang.\u003c/span>\u003c/p>","note":"Section body on Online Abuse in Sport: The Human Impact"},"section5Body":{"text":"\u003cp>\u003cspan style=\"color: #091324\">\u003cstrong>Effekterna av online-övergrepp kan sträcka sig bortom individer och forma idrottskulturen och de samhällen som omger den. Utbredd fientlighet kan påverka vilka som känner sig välkomna, trygga och kan delta, med konsekvenser för inkludering och hållbarhet i idrottsgemenskaper. Idrott har också ett bredare socialt inflytande. De beteenden och attityder som uttrycks i idrottsmiljöer kan bidra till bredare sociala normer. När diskriminerande eller kränkande beteende normaliseras kan det förstärka fördomar, utanförskap och fientlighet bortom idrott.\u003c/strong>\u003cbr>\u003cbr>\u003c/span>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003c/p>","note":"Section body on Online Abuse in Sport: The Human Impact"},"section5Body3":{"text":"\u003cp>För att lära dig mer, läs UAOA-barometern 2025.\u003ca href=\"https://unitedagainstonlineabuse.com/uaoa-barometer-2025/\" target=\"_blank\" rel=\"noopener\">\u003c/a>\u003c/p>","note":"Section body on Online Abuse in Sport: The Human Impact"}}},"m3":{"regionTabs":{"ui":{"eyebrow":{"text":"Regionalt exempel"},"prompt":{"text":"Välj en region"},"placeholder":{"text":"Välj en region för att se ett exempel."},"regionsAria":{"text":"Regioner"},"close":{"text":"Nära"},"closeAria":{"text":"Nära"},"subCountriesAria":{"text":"Exempel på EU-medlemmar"},"overview":{"text":"Översikt"}},"tabs":{"t1":{"title":{"text":"Europeiska unionen"},"html":{"text":"\u003cp>\u003ca href=\"https://eur-lex.europa.eu/eli/reg/2024/1689/\" target=\"_blank\" rel=\"noopener\">\u003cstrong>Europeiska unionens AI-lag använder ett riskbaserat ramverk för AI och inför transparenskrav för visst AI-genererat och manipulerat innehåll, inklusive vissa djupförfalskningar.\u003c/strong>\u003c/a>\u003c/p>","note":"HTML allowed — European Union AI Act links to EUR-Lex"},"subs":{"slovenia":{"title":{"text":"Slovenien"},"html":{"text":"\u003cp>I Slovenien regleras AI av nationell lagstiftning och EU:s AI-lag. Statlig vägledning, svar på vanliga frågor och information om reglering från ansvarigt ministerium finns också tillgänglig.\u003ca href=\"https://pisrs.si/pregledPredpisa?id=ZAKO9225#naslov-parent-393613415\" target=\"_blank\" rel=\"noopener\">\u003c/a>\u003ca href=\"https://eur-lex.europa.eu/legal-content/SL/TXT/HTML/?uri=OJ:L_202401689\" target=\"_blank\" rel=\"noopener\">\u003c/a>\u003ca href=\"https://www.gov.si/novice/2026-08-03-zacela-so-se-uporabljati-pravila-o-preglednosti-sistemov-umetne-inteligence/\" target=\"_blank\" rel=\"noopener\">\u003c/a>\u003ca href=\"https://www.ip-rs.si/umetna-inteligenca/pogosta-vpra%C5%A1anja/\" target=\"_blank\" rel=\"noopener\">\u003c/a>\u003ca href=\"https://www.gov.si/en/state-authorities/ministries/ministry-of-the-interior-and-public-administration/about-the-ministry/\" target=\"_blank\" rel=\"noopener\">\u003c/a>\u003c/p>","note":"HTML allowed — linked phrases open official sources"}},"sweden":{"title":{"text":"Sverige"},"html":{"text":"\u003cp>I Sverige gäller EU:s AI-lag direkt och utgör den rättsliga ramen för reglering av artificiell intelligens, inklusive AI-genererat innehåll. Sverige har ingen separat nationell lagstiftning som specifikt behandlar AI-genererat innehåll.\u003c/p>","note":"HTML allowed"}},"czechia":{"title":{"text":"Tjeckien"},"html":{"text":"\u003cp>I Tjeckien gäller EU:s AI-lag direkt och tillhandahåller den rättsliga ramen för att reglera artificiell intelligens, inklusive AI-genererat innehåll.\u003c/p>","note":"HTML allowed"}},"spain":{"title":{"text":"Spanien"},"html":{"text":"\u003cp>I Spanien gäller EU:s AI-lag direkt och tillhandahåller den rättsliga ramen för reglering av artificiell intelligens, inklusive AI-genererat innehåll. Den spanska myndigheten för tillsyn av artificiell intelligens (AESIA) övervakar efterlevnaden av AI-förordningar och stöder deras genomförande på nationell nivå.\u003c/p>","note":"HTML allowed"}}}},"t2":{"title":{"text":"Storbritannien"},"html":{"text":"\u003cp>\u003ca href=\"https://www.legislation.gov.uk/ukpga/2023/50\" target=\"_blank\" rel=\"noopener\">\u003cstrong>Enligt lagen om nätsäkerhet kan AI-genererat innehåll som delas av användare falla inom reglerade onlinetjänsters ansvarsområden, inklusive relevanta skyldigheter gällande olagligt innehåll och användarsäkerhet.\u003c/strong>\u003c/a>\u003c/p>","note":"HTML allowed"}},"t3":{"title":{"text":"Förenta staterna"},"html":{"text":"\u003cp>\u003ca href=\"https://www.congress.gov/bill/119th-congress/senate-bill/146\" target=\"_blank\" rel=\"noopener\">\u003cstrong>TAKE IT DOWN Act\u003c/strong>\u003c/a> behandlar delning av intima bilder utan samtycke, inklusive AI-genererade deepfakes. Den kräver att berörda onlineplattformar tillhandahåller ett sätt att begära borttagning av bilder och att kvalificerat innehåll tas bort inom 48 timmar efter en giltig begäran.\u003c/p>","note":"HTML allowed"}}}},"checklist":{"ui":{"eyebrow":{"text":"Checklista"},"title":{"text":"Rapporteringssteg"},"progress":{"text":"{n} av {total} recenserade"},"hint":{"text":"Markera varje steg när du går igenom det. Inte betygsatt.","note":"Removed from widget UI; kept for translators / legacy"},"done":{"text":"Alla steg granskade."}},"items":{"i1":{"text":"1. Bedöm situationen och din säkerhet. Tänk på innehållets karaktär och om du eller någon annan kan vara i omedelbar risk."},"i2":{"text":"2. Samla bevis. Spara kränkande inlägg, meddelanden, profilinformation, webbadresser och skärmdumpar där det är lämpligt."},"i3":{"text":"3. Registrera viktiga detaljer. Notera datum, tid, användarnamn eller konto och relevant information om vad som hände."},"i4":{"text":"4. Använd plattformens säkerhetsverktyg. Begränsa, tysta eller blockera kontot där det är lämpligt för att begränsa ytterligare kontakt eller exponering."},"i5":{"text":"5. Rapportera via plattformen. Granska plattformens relevanta policyer och flagga innehållet eller kontot med hjälp av dess inbyggda rapporteringsalternativ."},"i6":{"text":"6. Sök ytterligare stöd eller eskalera vid behov. Kontakta din organisations välfärds- eller skyddsansvariga där det är relevant. Om du anser att det finns ett hot mot din säkerhet, kontakta lämpliga lokala myndigheter eller räddningstjänster."}}},"reportingSystems":{"ui":{"listAria":{"text":"Rapporteringssystem per land","note":"aria-label on accordion list"},"placeholder":{"text":"Välj ett land för att visa rapporteringssystem och supportresurser."},"closeAria":{"text":"Nära"}},"items":{"uk":{"title":{"text":"Storbritannien"},"html":{"text":"\u003cp>\u003c/p>\u003cul>\u003cli>\u003cstrong>I Storbritannien kan onlineövergrepp rapporteras till relevant plattform eller, när det kan utgöra ett brott, till polisen. Individer uppmuntras att bevara bevis, inklusive skärmdumpar, meddelanden och webbadresser. Specialistorganisationer tillhandahåller också konfidentiellt stöd och vägledning. Polis — Rapportera hot, stalkning, trakasserier och annat potentiellt kriminellt onlinebeteende. Ring 999 i en nödsituation eller 101 för icke-akut hjälp. Rapportera skadligt innehåll — Vägledning och hjälp med att rapportera skadligt onlineinnehåll, inklusive trakasserier, hot och övergrepp. Stop Hate UK — Oberoende, konfidentiellt stöd och allmänna rapporteringstjänster för hatbrott i deltagande områden.\u003c/strong>\u003c/li>\u003cli>\u003ca href=\"https://reportharmfulcontent.com/\" target=\"_blank\" rel=\"noopener\">\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://www.stophateuk.org/report-hate-crime/\" target=\"_blank\" rel=\"noopener\">\u003c/a>\u003c/li>\u003c/ul>","note":"HTML allowed — linked resource names open official sources"}},"us":{"title":{"text":"Förenta staterna"},"html":{"text":"\u003cp>\u003c/p>\u003cul>\u003cli>\u003ca href=\"https://www.usa.gov/report-crime\" target=\"_blank\" rel=\"noopener\">\u003cstrong>I USA kan onlineövergrepp rapporteras till relevant plattform eller brottsbekämpande myndigheter, beroende på händelsens art. Hot, stalking och annat potentiellt kriminellt beteende kan rapporteras till lokal polis, medan federala myndigheter tillhandahåller ytterligare rapporteringskanaler. Individer uppmuntras att bevara bevis, inklusive skärmdumpar, meddelanden och webbadresser. Lokal brottsbekämpning — Polisavdelningar kan ta emot rapporter om hot, stalking, trakasserier och annat potentiellt kriminellt onlinebeteende. Ring 911 i en nödsituation. StopBullying.gov: Rapportera cybermobbning — Myndighetens riktlinjer för att dokumentera cybermobbning, rapportera skadligt innehåll till plattformar och kontakta brottsbekämpande myndigheter när det är lämpligt. FBI: Internet Crime Complaint Center (IC3) — Rapporter om cyberaktiverad brottslighet, inklusive onlineutpressning, trakasserier och stalking där kriminellt beteende misstänks. FBI: Rapportera ett federalt brott — Rapporter om misstänkta federala brott, inklusive allvarliga hot och annan kriminell verksamhet som kan innebära onlineövergrepp.\u003c/strong>\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://www.stopbullying.gov/cyberbullying/how-to-report\" target=\"_blank\" rel=\"noopener\">\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://www.ic3.gov/\" target=\"_blank\" rel=\"noopener\">\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://tips.fbi.gov/\" target=\"_blank\" rel=\"noopener\">\u003c/a>\u003c/li>\u003c/ul>","note":"HTML allowed — linked resource names open official sources"}},"si":{"title":{"text":"Slovenien"},"html":{"text":"\u003cp>\u003c/p>\u003cul>\u003cli>\u003ca href=\"https://www.gov.si/en/state-authorities/ministries/ministry-of-the-economy-labour-and-sport/about-the-ministry-of-economy-tourism-and-sport/sport-directorate/\" target=\"_blank\" rel=\"noopener\">\u003cstrong>I Slovenien kan idrottare och idrottsproffs söka oberoende stöd och vägledning om onlineövergrepp genom ombudsmannen för idrottares rättigheter. Ytterligare resurser behandlar cybersäkerhetsincidenter, skydd av personuppgifter och misskötsel inom idrotten, inklusive särskilda rapporteringskanaler. Ombudsmannen för idrottares rättigheter — Oberoende stöd och kostnadsfri juridisk vägledning för idrottare och idrottsproffs. SI.CERT — Sloveniens nationella centrum för cybersäkerhetsincidenter, som tillhandahåller hjälp med onlinesäkerhetsincidenter. Statens kontor för informationssäkerhet — Myndighet som ansvarar för nationell informationssäkerhet och cybersäkerhet. Informationskommissionär — Oberoende myndighet som övervakar skydd av personuppgifter och integritetsrättigheter. Sloveniens olympiska kommitté: Visselblåsningskanal — Rapporteringskanal för att ta upp farhågor om misskötsel inom idrotten.\u003c/strong>\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://www.cert.si/en/about-si-cert/\" target=\"_blank\" rel=\"noopener\">\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://www.gov.si/drzavni-organi/vladne-sluzbe/urad-vlade-za-informacijsko-varnost/\" target=\"_blank\" rel=\"noopener\">\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://www.ip-rs.si/en/about/information-commissioner\" target=\"_blank\" rel=\"noopener\">\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://oks.zvizgavka.si/\" target=\"_blank\" rel=\"noopener\">\u003c/a>\u003c/li>\u003c/ul>","note":"HTML allowed — linked resource names open official sources"}},"se":{"title":{"text":"Sverige"},"html":{"text":"\u003cp>\u003c/p>\u003cul>\u003cli>\u003ca href=\"https://polisen.se/utsatt-for-brott/polisanmalan/\" target=\"_blank\" rel=\"noopener\">\u003cstrong>I Sverige kan potentiellt kriminella övergrepp online, inklusive hot, trakasserier och förtal, anmälas till polisen. Idrottare och idrottsproffs kan också söka oberoende stöd eller anmäla misskötsel inom idrotten via Riksidrottsförbundets idrottsombudsman. Svensk polis — Officiell anmälningskanal för potentiella brott, inklusive hot online, trakasserier och förtal. Anmälningar kan också göras genom att ringa 114 14. Riksidrottsförbundet (RF): Idrottsombudsman — Oberoende stöd- och visselblåsartjänst för anmälan av trakasserier, övergrepp och misskötsel inom svensk idrott.\u003c/strong>\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://www.rf.se/rf-arbetar-med/idrottsombudsmannen/kontakta-idrottsombudsmannen\" target=\"_blank\" rel=\"noopener\">\u003c/a>\u003c/li>\u003c/ul>","note":"HTML allowed — linked resource names open official sources"}},"cz":{"title":{"text":"Tjeckien"},"html":{"text":"\u003cp>\u003c/p>\u003cul>\u003cli>\u003ca href=\"https://www.stoponline.cz/en/\" target=\"_blank\" rel=\"noopener\">\u003cstrong>I Tjeckien kan onlineövergrepp rapporteras via flera kanaler, beroende på händelsens art. STOPonline tar emot rapporter om olagligt eller skadligt onlineinnehåll, inklusive cybermobbning, cybergrooming, icke-samtyckande delning av intima bilder och cyberhot. Rapporter granskas av specialister och kan hänvisas till den tjeckiska polisen eller internationella partners. Incidenter som involverar potentiella brott, såsom hot, stalking eller utpressning, bör rapporteras direkt till den tjeckiska polisen. Individer uppmuntras att bevara bevis, inklusive skärmdumpar, meddelanden och länkar, och kan också rapportera skadligt innehåll direkt till onlineplattformar. STOPonline.cz — Onlinerapporteringstjänst som drivs av CZ.NIC i samarbete med CSIRT.CZ. Tar emot rapporter om olagligt eller skadligt onlineinnehåll och hänvisar potentiellt olagliga fall till relevanta myndigheter. Tjänsten fokuserar på innehållsbedömning och rapportering, inte rådgivning. Tjeckisk polis: Rapportering av cyberbrottslighet — Officiell information om rapportering av misstänkt cyberbrottslighet, inklusive onlinehot, stalking, utpressning och annan potentiellt kriminell verksamhet. Tjeckisk polis: Vägledning om misstänkt onlineaktivitet — Praktisk vägledning om hur man reagerar på misstänkt onlineaktivitet, bevarar bevis och söker polishjälp.\u003c/strong>\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://policie.gov.cz/hlaseni-kyberkriminality\" target=\"_blank\" rel=\"noopener\">\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://policie.gov.cz/kyberkriminalita/co-delat-vpripade-ze-se-setkate-spodezrelou-aktivitou-vonline-prostoru\" target=\"_blank\" rel=\"noopener\">\u003c/a>\u003c/li>\u003c/ul>","note":"HTML allowed — linked resource names open official sources"}},"es":{"title":{"text":"Spanien"},"html":{"text":"\u003cp>\u003c/p>\u003cul>\u003cli>\u003ca href=\"https://www.policia.es/\" target=\"_blank\" rel=\"noopener\">\u003cstrong>I Spanien kan potentiellt kriminella onlineövergrepp, inklusive trakasserier, hot och hatrelaterade brott, rapporteras till den spanska nationella polisen eller civilgardet. Individer uppmuntras att bevara bevis, inklusive skärmdumpar, meddelanden och webbadresser. Ytterligare tjänster erbjuder konfidentiell vägledning och hjälp med att ta bort skadligt innehåll. Spansk nationella polis (Policía Nacional) och civilgardet (Guardia Civil) — Officiella myndigheter för rapportering av potentiellt kriminella onlineövergrepp. INCIBE: Cybersecurity Helpline (017) — Gratis, konfidentiell rådgivning om cybermobbning, onlinetrakasserier och digital integritet. Detta är en rådgivningstjänst, inte en formell kanal för brottsanmälan. Spanska dataskyddsmyndigheten (AEPD): Prioriterad kanal — Tillåter individer att begära omedelbar borttagning av olagligt delat sexuellt eller våldsamt innehåll i särskilt allvarliga fall.\u003c/strong>\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://www.incibe.es/linea-de-ayuda-en-ciberseguridad\" target=\"_blank\" rel=\"noopener\">\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://www.aepd.es/canalprioritario\" target=\"_blank\" rel=\"noopener\">\u003c/a>\u003c/li>\u003c/ul>","note":"HTML allowed — linked resource names open official sources"}}}},"sorting":{"ui":{"eyebrow":{"text":"Beställning","note":"Removed from widget UI; kept for translators / legacy"},"prompt":{"text":"1. Ordna stegen nedan i rekommenderad ordning."},"hint":{"text":"Dra objekt eller använd pilarna för att ändra ordning och skicka sedan."},"moveUp":{"text":"Flytta upp"},"moveDown":{"text":"Flytta nedåt"},"ok":{"text":"\u003cstrong>Korrekt! Du har identifierat den rekommenderade sekvensen för att hantera kränkningar online på sociala medier. Att följa en tydlig process hjälper till att bevara viktig information, minska ytterligare exponering och säkerställa att situationen rapporteras eller eskaleras på lämpligt sätt.\u003c/strong>","note":"HTML allowed"},"bad":{"text":"\u003cstrong>Inte riktigt. Granska alternativen och försök igen.\u003c/strong>","note":"HTML allowed"}},"items":{"i1":{"text":"Bedöm situationen och din säkerhet"},"i2":{"text":"Samla bevis"},"i3":{"text":"Registrera viktiga detaljer"},"i4":{"text":"Använd säkerhetsverktyg för plattformen"},"i5":{"text":"Rapportera via plattformen"},"i6":{"text":"Sök ytterligare stöd eller eskalera vid behov"}}},"trueFalse":{"bad":{"text":"\u003cstrong>Inte riktigt. Granska påståendet och försök igen.\u003c/strong>","note":"HTML allowed"},"questions":{"q1":{"prompt":{"text":"Om en idrottare får ta emot kränkande innehåll bör de omedelbart radera det och svara direkt till den ansvariga personen."},"choices":{"c0":{"text":"SANN"},"c1":{"text":"FALSK"}},"ok":{"text":"\u003cstrong>Korrekt! Det rekommenderas att samla in relevant bevis innan innehåll tas bort, och att undvika att kontakta den person som är ansvarig för övergreppet direkt.\u003c/strong>","note":"HTML allowed"}},"q2":{"prompt":{"text":"Att offentligt dela kränkande innehåll kan bidra till att åtgärda situationen genom att dra mer uppmärksamhet till den."},"choices":{"c0":{"text":"SANN"},"c1":{"text":"FALSK"}},"ok":{"text":"\u003cstrong>Korrekt! Att dela eller återpublicera kränkande innehåll kan öka dess räckvidd och exponera den utsatta personen, och andra, för det skadliga innehållet igen. Använd lämpliga rapporteringskanaler istället.\u003c/strong>","note":"HTML allowed"}},"q3":{"prompt":{"text":"AI kan hjälpa till att identifiera potentiellt skadligt innehåll, men mänskligt omdöme är fortfarande viktigt när man tolkar sammanhang."},"choices":{"c0":{"text":"SANN"},"c1":{"text":"FALSK"}},"ok":{"text":"\u003cstrong>Korrekt! AI kan stödja tidig upptäckt och flagga potentiellt skadligt innehåll för granskning, men sammanhang, språk och förändrade övergreppstaktik kan göra mänsklig bedömning viktig.\u003c/strong>","note":"HTML allowed"}}}},"takeaways":{"heading":{"text":"Viktiga slutsatser"},"items":{"i1":{"text":"\u003cstrong>Plattformsdesign påverkar hur innehåll sprids. Olika digitala miljöer formar vem som möter innehåll, hur människor interagerar med det och hur länge det förblir synligt.\u003c/strong>","note":"HTML allowed"},"i2":{"text":"\u003cstrong>Skada online kan förstärkas. Rekommendationssystem, delning, liveinteraktion och samhällsdynamik kan öka räckvidden och intensiteten av skadligt innehåll.\u003c/strong>","note":"HTML allowed"},"i3":{"text":"\u003cstrong>Kränkande taktiker kan anpassas. Skadligt innehåll kan använda ändrat språk, visuella format, indirekt målgruppsinriktning eller olika digitala utrymmen för att göra upptäckt svårare.\u003c/strong>","note":"HTML allowed"},"i4":{"text":"\u003cstrong>Människor kan vidta åtgärder för att minska exponeringen. Integritetskontroller, interaktionsinställningar, blockering, ljudavstängning och genomtänkta val kring onlineutrymmen kan stödja digitalt välbefinnande.\u003c/strong>","note":"HTML allowed"},"i5":{"text":"\u003cstrong>Effektiv rapportering följer en tydlig process. Bedöm situationen, dokumentera relevanta bevis, rapportera via en lämplig kanal och sök stöd eller eskalera när säkerheten är i fara.\u003c/strong>","note":"HTML allowed"},"i6":{"text":"\u003cstrong>AI har en dubbel roll. Den kan öka omfattningen och sofistikeringen av skadligt innehåll, och den kan också stödja upptäckt, moderering och andra säkerhetsåtgärder online.\u003c/strong>","note":"HTML allowed"},"i7":{"text":"\u003cstrong>Teknologi ensam kan inte hantera onlinemissbruk. Effektiva åtgärder kombinerar plattformsverktyg, ansvarsfullt användarbeteende, mänskligt omdöme, organisatoriskt stöd och lämplig reglering.\u003c/strong>","note":"HTML allowed"}}},"slide":{"title":{"text":"Modul 3 - Hur skada online sprids","note":"slide_intro title"},"continueToModule4":{"text":"Fortsätt till modul 4","note":"End-of-module navigation_button label"},"aiAndOnlineHarm":{"body":{"text":"\u003cp>\u003cspan style=\"color: #091324\">AI förändrar hur skada online kan skapas och hur den delas. Men AI kan också vara ett kraftfullt verktyg för att förhindra att oönskat innehåll sprids online.\u003c/span>\u003c/p>","note":"Native text body on How Online Harm Spreads"},"heading":{"text":"\u003cspan style=\"color: #21b7cb\">AI och onlineskada\u003c/span>","note":"Native heading on How Online Harm Spreads"}},"exploreReportingSystemsInYourCountry":{"body":{"text":"\u003cp>\u003cspan style=\"color: #091324\">Lär dig var du kan rapportera övergrepp online, söka stöd och få tillgång till resurser för att ta itu med skadligt innehåll och beteende.\u003c/span>\u003c/p>","note":"Native text body on How Online Harm Spreads"},"heading":{"text":"\u003cspan style=\"color: #21b7cb\">Utforska rapporteringssystem i ditt land:\u003c/span>","note":"Native heading on How Online Harm Spreads"}},"exploreWhichFactorsCanInfluenceHow":{"body":{"text":"\u003cp>\u003cspan style=\"color: #091324\">Välj de tre faktorer som direkt kan påverka hur skadligt innehåll sprids och når nya målgrupper online.\u003c/span>\u003c/p>","note":"Native text body on How Online Harm Spreads"},"heading":{"text":"\u003cspan style=\"color: #21b7cb\">Utforska: Vilka faktorer kan påverka hur skadligt innehåll sprids online?\u003c/span>","note":"Native heading on How Online Harm Spreads"}},"howPlatformsHelpReduceOnlineAbuse":{"body":{"text":"\u003cp>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003cspan style=\"color: #091324\">Plattformar fungerar som mellanhänder mellan människor, innehåll och samhällen. Deras design kan påverka räckvidden för skadligt innehåll, och deras inbyggda verktyg kan också hjälpa till att upptäcka, begränsa, rapportera och reagera på missbruk. Dessa åtgärder kan inkludera innehållsmoderering, minskad distribution av skadligt innehåll, uppmaningar före publicering, användarsäkerhetsinställningar, rapporteringsmekanismer och communitystandarder. Reglering formar också i allt högre grad plattformarnas ansvar. I de flesta länder i världen har dessa plattformar en förvaltarplikt (i Storbritannien, till exempel \u003ca href=\"https://www.gov.uk/government/publications/online-safety-act-explainer/online-safety-act-explainer\" target=\"_blank\" rel=\"noopener\">Online Safety Act\u003c/a> och i Europa \u003ca href=\"https://digital-strategy.ec.europa.eu/en/policies/digital-services-act\" target=\"_blank\" rel=\"noopener\">Digital Services Act\u003c/a>) att bedöma risker, skydda användare från olagligt innehåll, tillhandahålla rapporteringsmekanismer och implementera proportionella säkerhetsåtgärder.\u003c/span>\u003c/p>","note":"Native text body on How Online Harm Spreads"},"heading":{"text":"\u003cspan style=\"color: #21b7cb\">Hur plattformar bidrar till att minska online-övergrepp\u003c/span>","note":"Native heading on How Online Harm Spreads"}},"howPlatformsShapeTheSpreadOf":{"body":{"text":"\u003cp>\u003cspan style=\"color: #091324\">\u003cstrong>Varje plattform fungerar olika. Designfunktioner påverkar hur innehåll sprids, vem som möter det och hur människor interagerar med det. Välj varje kort för att läsa mer.\u003c/strong>\u003c/span>\u003c/p>","note":"Native text body on How Online Harm Spreads"},"heading":{"text":"\u003cspan style=\"color: #21b7cb\">Hur plattformar formar spridningen av online-övergrepp\u003c/span>","note":"Native heading on How Online Harm Spreads"}},"humanJudgementRemainsEssentialLanguageContext":{"body":{"text":"\u003cp>\u003cspan style=\"color: #091324\">\u003cstrong>Mänskligt omdöme är fortfarande avgörande. Språk, sammanhang, kulturella skillnader och föränderliga övergreppstaktiker kan göra det svårt att tolka skadligt innehåll korrekt. I takt med att AI används i allt större utsträckning utvecklas även regleringar för att hantera dessa risker och etablera skyddsåtgärder för dess användning i olika jurisdiktioner.\u003c/strong>\u003c/span>\u003c/p>","note":"Native text body on How Online Harm Spreads"}},"image":{"useThisImageToIllustrateYour":{"text":"\u003cp>Använd den här bilden för att illustrera ditt ämne. Lägg till en beskrivning som kopplar det visuella till huvudidéerna i din lektion.\u003c/p>","note":"Image body text on How Online Harm Spreads"}},"introSubtitle":{"text":"Beräknad tid: 15 minuter","note":"slide_intro subtitle (estimated time)"},"lookingAhead":{"body":{"text":"\u003cp>\u003cspan style=\"color: #091324\">\u003cstrong>I takt med att AI-genererat innehåll blir allt vanligare blir transparens en viktig del av onlinesäkerheten. Nya metoder inkluderar att identifiera eller märka AI-genererat och manipulerat innehåll och att tillhandahålla information om dess ursprung. Reglering kommer att fortsätta att utvecklas i takt med tekniken.\u003c/strong>\u003c/span>\u003c/p>","note":"Native text body on How Online Harm Spreads"},"heading":{"text":"\u003cspan style=\"color: #21b7cb\">Framåtblickande\u003c/span>","note":"Native heading on How Online Harm Spreads"}},"onlineAbuseCanSpreadQuicklyAnd":{"body":{"text":"\u003cp>\u003cspan style=\"color: #091324\">\u003cstrong>Onlineövergrepp kan spridas snabbt och nå målgrupper långt bortom de personer som var inblandade i den ursprungliga interaktionen. Digitala plattformar, användarbeteende och algoritmiska system påverkar alla vilket innehåll människor ser och hur brett det sprids. Att förstå dessa mekanismer hjälper oss att inse hur skadligt innehåll kan förstärkas, hur onlinemiljöer kan förstärka fientlighet och var det finns möjligheter att avbryta dess spridning. Samma plattformar och tekniker som kan förstärka skadligt innehåll kan också stödja dess upptäckt, moderering och förebyggande.\u003c/strong>\u003c/span>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003c/p>","note":"Native text body on How Online Harm Spreads"}},"reportingOnlineAbuseOnSocialMedia":{"body":{"text":"\u003cp>\u003cstrong>Rapportering kan hjälpa plattformar och organisationer att reagera på skadligt innehåll och kan stödja ytterligare åtgärder när en situation blir allvarligare. Läs igenom dessa steg och markera varje steg allt eftersom du lär dig.\u003c/strong>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003c/p>","note":"Native text body on How Online Harm Spreads"},"heading":{"text":"\u003cspan style=\"color: #21b7cb\">Anmäla övergrepp online på sociala medier\u003c/span>","note":"Native heading on How Online Harm Spreads"}},"selectARegionToLearnMore":{"body":{"text":"\u003cp>\u003cspan style=\"color: #091324\">Dessa regionala exempel är valfritt kompletterande innehåll och påverkar inte dina kursframsteg.\u003c/span>\u003c/p>","note":"Native text body on How Online Harm Spreads"},"heading":{"text":"\u003cspan style=\"color: #21b7cb\">Välj en region för att lära dig mer om onlineövergrepp.\u003c/span>","note":"Native heading on How Online Harm Spreads"}}},"risksBenefits":{"risksHeading":{"text":"Potentiella risker","note":"M3 AI risks/benefits widget"},"benefitsHeading":{"text":"Potentiella fördelar","note":"M3 AI risks/benefits widget"},"risks":{"r1":{"text":"\u003cstrong>Skapa och förstärka skada\u003c/strong>Generativ AI kan producera eller manipulera text, bilder, ljud och video snabbt och i stor skala.","note":"HTML allowed"}},"benefits":{"b1":{"text":"\u003cstrong>Upptäcka skadligt innehåll\u003c/strong>AI kan hjälpa till att identifiera potentiellt skadligt innehåll och mönster i stora volymer onlineaktivitet.","note":"HTML allowed"},"b2":{"text":"\u003cstrong>Stödjer moderering\u003c/strong>Automatiserade system kan flagga innehåll för granskning och hjälpa moderatorer att prioritera potentiella risker.","note":"HTML allowed"},"b3":{"text":"\u003cstrong>Stödja användare\u003c/strong>AI-aktiverade verktyg kan hjälpa till att filtrera oönskat innehåll och koppla samman människor med rapporterings- och säkerhetsfunktioner.","note":"HTML allowed"}}}},"m4":{"lawTabs":{"ui":{"prompt":{"text":"Välj en väg"},"placeholder":{"text":"Välj en väg"},"pathwaysAria":{"text":"Rättsliga vägar"},"seeExample":{"text":"Se ett exempel"},"backToPathway":{"text":"Tillbaka till stigen"},"returnMain":{"text":"Återgå till huvudsidan"},"closeAria":{"text":"Nära"}},"tabs":{"t1":{"title":{"text":"Strafflag"},"image":{"text":"https://preview.scormstack.io/medias/courses/428b8e0e-9238-4608-a1a3-962afd799ccf/UAOA_pathway_crimina_64f037dc-941a-4af3-90b3-ac5e5fb45a9f.jpg","note":"CDN URL for scenario illustration"},"imageAlt":{"text":"Domare får upprepade varningsmeddelanden på en telefon"},"pathway":{"text":"\u003cp>\u003cstrong>Vad det kan omfatta: Uppförande som utgör ett brott enligt tillämplig lag, vilket kan inkludera vissa hot, stalking, hatbrott eller icke-samtyckande delning av intima bilder. Vem vidtar åtgärder: Polismyndigheten kan utreda, och den relevanta åklagarmyndigheten avgör om ett ärende går vidare. Möjliga resultat: Straffrättsliga påföljder kan inkludera böter eller fängelse, beroende på brottet och jurisdiktion.\u003c/strong>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003c/p>","note":"HTML allowed"},"example":{"text":"\u003cp>Efter ett beslut under en match börjar en domare få upprepade meddelanden på sina sociala medier från samma konto. Meddelandena blir alltmer hotfulla och inkluderar hänvisningar till att allvarligt skada domaren och deras familjemedlemmar. Beroende på tillämplig lag och omständigheter kan hot av detta slag leda till en anmälan till polisen och en brottsutredning.\u003c/p>\u003cp>\u003c/p>","note":"HTML allowed"}},"t2":{"title":{"text":"Civilrätt"},"image":{"text":"https://preview.scormstack.io/medias/courses/428b8e0e-9238-4608-a1a3-962afd799ccf/UAOA_pathway_civil_e89ec7dc-a23c-4bea-af45-ba6d00b25544.jpg","note":"CDN URL for scenario illustration"},"imageAlt":{"text":"Idrottare står inför cirkulerande onlineanklagelser och förlorat sponsorskap"},"pathway":{"text":"\u003cp>\u003cstrong>Vad det kan omfatta: Tvister som rör juridiska rättigheter mellan individer eller organisationer, vilket kan innefatta förtal, trakasserier, missbruk av privat information eller andra integritetsrelaterade anspråk. Vem vidtar åtgärder: Den person eller organisation som väcker anspråket inleder den rättsliga processen. Möjliga resultat: Beroende på tillämplig lag kan gottgörelser inkludera ersättning eller domstolsbeslut som kräver att ett visst beteende upphör.\u003c/strong>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003c/p>","note":"HTML allowed"},"example":{"text":"\u003cp>Falska anklagelser om en idrottare börjar cirkulera online och delas upprepade gånger. Påståendena skadar idrottarens professionella rykte, och en sponsor avslutar sin relation med dem efter att ha sett sådana anklagelser. Beroende på tillämplig lag och omständigheter kan idrottaren ha möjlighet att väcka civilrättsligt talan för att söka gottgörelse för den skada som orsakats, inklusive beslut om borttagning av befintligt falskt innehåll, förbudsförelägganden för att förhindra ytterligare publicering, monetära krav mot förövaren om identifierbar etc.\u003c/p>\u003cp>\u003c/p>","note":"HTML allowed"}},"t3":{"title":{"text":"Förvaltningsrätt och förordningar"},"image":{"text":"https://preview.scormstack.io/medias/courses/428b8e0e-9238-4608-a1a3-962afd799ccf/UAOA_pathway_admin_55f163bb-0d7b-4f46-9cb3-20fd51f67cd0.jpg","note":"CDN URL for scenario illustration"},"imageAlt":{"text":"Idrottare oroad över personliga kontaktuppgifter som exponerats online"},"pathway":{"text":"\u003cp>\u003cstrong>Vad det kan omfatta: Rättsliga skyldigheter som upprätthålls av tillsynsmyndigheter, inklusive regler som gäller för onlinetjänster eller hantering av personuppgifter. Vem vidtar åtgärder: Relevanta tillsynsmyndigheter övervakar och upprätthåller dessa krav. Individer och organisationer kan också ha möjlighet att lämna in klagomål. Möjliga resultat: Tillsynsmyndigheter kan utreda, kräva ändringar eller ålägga påföljder där tillämplig lag ger dem dessa befogenheter.\u003c/strong>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003c/p>","note":"HTML allowed"},"example":{"text":"\u003cp>En idrottare upptäcker att deras personliga kontaktuppgifter har publicerats online utan deras tillstånd. Informationen fortsätter att cirkulera, vilket skapar oro kring deras integritet och säkerhet. Beroende på gällande dataskyddsregler kan idrottaren eller deras organisation eventuellt ta upp ärendet med relevant tillsynsmyndighet.\u003c/p>\u003cp>\u003c/p>","note":"HTML allowed"}}}},"limits":{"items":{"i1":{"title":{"text":"Jurisdiktion"},"html":{"text":"\u003cp>Onlineövergrepp kan omedelbart överskrida nationsgränser. Den utsatta personen, den ansvarige och plattformen kan alla befinna sig i olika jurisdiktioner, med olika lagar och verkställighetsprocesser.\u003c/p>","note":"HTML allowed"}},"i2":{"title":{"text":"Identifiera vem som är ansvarig"},"html":{"text":"\u003cp>Konton kan använda pseudonymer, falska identiteter eller begränsad identifierande information, vilket gör det svårt att avgöra vem som är ansvarig för ett visst beteende. Att identifiera en kontoinnehavare kan kräva information som innehas av plattformar och, i vissa fall, formella rättsliga processer.\u003c/p>","note":"HTML allowed"}},"i3":{"title":{"text":"Tillämpning"},"html":{"text":"\u003cp>Volymen och hastigheten på onlineaktivitet kan försvåra utredning och verkställighet. Tillgängliga resurser, specialistkompetens, beviskrav och prioriteringar för verkställighet kan alla påverka vad som händer efter att en incident har rapporterats.\u003c/p>","note":"HTML allowed"}},"i4":{"title":{"text":"Rättsliga tröskelvärden"},"html":{"text":"\u003cp>Varje skadligt eller kränkande beteende utgör inte automatiskt ett lagbrott eller ger upphov till ett rättsligt anspråk. Tillämplig rättslig definition, bevis, sammanhang och jurisdiktion spelar alla roll. Detta innebär att rättsliga åtgärder är en del av svaret på onlineövergrepp. Onlineplattformarnas policyer och idrottsorganisationernas egna standarder och policyer kan också bidra till att hantera vissa beteenden som kanske inte har tillräckliga skäl för rättsliga åtgärder.\u003c/p>\u003cp>\u003c/p>","note":"HTML allowed"}}}},"regions":{"ui":{"prompt":{"text":"Välj en region"},"placeholder":{"text":"Välj en region för att se ett exempel på hur befintliga lagar kan tillämpas på beteende online."},"countriesAria":{"text":"Regioner"}},"items":{"i1":{"title":{"text":"Storbritannien"},"html":{"text":"\u003cp>I Storbritannien finns flera lagar som behandlar skadligt beteende online. \u003cstrong>Online Safety Act 2023\u003c/strong> inför brott som rör hotfulla kommunikationer, cyberflashing och delning eller hot om att dela intima bilder utan samtycke. \u003cstrong>Protection from Harassment Act 1997\u003c/strong>\u003c/p>\u003cp>\u003cem> omfattar även trakasserier och stalking, inklusive beteende som involverar digital kommunikation. Online Safety Act ålägger dessutom reglerade plattformar skyldigheter att hantera olagligt innehåll och skydda barn från skadligt material. De tillämpliga skydden beror på beteendet och jurisdiktionen. Källa: \u003ca href=\"https://www.legislation.gov.uk/\" target=\"_blank\" rel=\"noopener\">Legislation.gov.uk\u003c/a>\u003c/em>\u003c/p>","note":"HTML allowed"}},"i2":{"title":{"text":"Förenta staterna"},"html":{"text":"\u003cp>I USA hanteras online-övergrepp genom en kombination av federala och statliga lagar. Federal lagstiftning, inklusive \u003cstrong>18 U.S.C. 2261A\u003c/strong>\u003c/p>\u003cp>\u003cem>, behandlar vissa former av cyberstalking som involverar elektronisk kommunikation. Andra federala bestämmelser täcker hot och specifika former av online-trakasserier, medan statliga lagar kan ge ytterligare skydd mot cybermobbning, trakasserier, stalking och icke-samtyckande delning av intima bilder. Juridiska definitioner, verkställighet och tillgängliga åtgärder varierar beroende på jurisdiktion och omständigheterna i varje enskilt fall. Källa: \u003ca href=\"https://uscode.house.gov/\" target=\"_blank\" rel=\"noopener\">U.S. Code\u003c/a>\u003c/em>\u003c/p>","note":"HTML allowed"}},"i3":{"title":{"text":"Tjeckien"},"html":{"text":"\u003cp>\u003cstrong>Tjeckisk lag bygger inte på ett enda brott, \"onlinemissbruk\". Befintlig lagstiftning kan tillämpas på specifika skadliga beteenden som utförs online. Till exempel behandlar paragraf 354 i den tjeckiska strafflagen (lag nr 40/2009 Coll.) stalking, inklusive beteenden som utförs via elektronisk kommunikation. Tjeckisk polis vägledning om stalking förklarar denna bestämmelse och identifierar upprepade meddelanden på sociala medier, hot, missbruk av personuppgifter och anseendeskadande attacker bland beteenden som kan förekomma i stalkingfall. Den tjeckiska civillagen (lag nr 89/2012 Coll.) skyddar också personlighetsrättigheter, inklusive en persons värdighet, heder och integritet. En person som drabbats av olaglig inblandning kan begära att inblandningen upphör och att dess konsekvenser åtgärdas. Källa: e-Sbírka\u003c/strong>\u003ca href=\"https://policie.gov.cz/stalking---nebezpecne-pronasledovani--354-trestniho-zakoniku\" target=\"_blank\" rel=\"noopener\">\u003c/a>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003cem>\u003ca href=\"https://e-sbirka.gov.cz\" target=\"_blank\" rel=\"noopener\">\u003c/a>\u003c/em>\u003c/p>","note":"HTML allowed"}},"i4":{"title":{"text":"Spanien"},"html":{"text":"\u003cp>\u003ca href=\"https://www.boe.es/buscar/act.php?id=BOE-A-1995-25444\" target=\"_blank\" rel=\"noopener\">\u003cstrong>Spaniens strafflag (organisk lag 10/1995) behandlar flera former av online-övergrepp. Artikel 172 ter omfattar stalking, inklusive upprepad oönskad kontakt, missbruk av personuppgifter och skapandet av falska profiler på sociala medier med hjälp av någons bild utan samtycke när detta orsakar trakasserier eller förödmjukelse. Artikel 510 behandlar hatpropaganda online, med ökade straff för vissa brott när digitala plattformar gör innehållet tillgängligt för en stor publik. Offer kan anmäla misstänkta brott till den spanska nationella polisen eller civilgardet (Guardia Civil). Ytterligare stöd finns tillgängligt via INCIBE:s kostnadsfria, konfidentiella hjälplinje 017, medan den spanska dataskyddsmyndigheten (AEPD) tillhandahåller en prioriterad kanal för att begära omedelbar borttagning av olagligt delat sexuellt eller våldsamt innehåll. Källa: Gobierno de España\u003c/strong>\u003c/a>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003ca href=\"https://www.policia.es/\" target=\"_blank\" rel=\"noopener\">\u003c/a>\u003ca href=\"https://www.incibe.es/linea-de-ayuda-en-ciberseguridad\" target=\"_blank\" rel=\"noopener\">\u003c/a>\u003ca href=\"https://www.aepd.es/canalprioritario\" target=\"_blank\" rel=\"noopener\">\u003c/a>\u003c/p>\u003cp>\u003cem>\u003ca href=\"https://www.mpr.gob.es/Paginas/index.aspx\" target=\"_blank\" rel=\"noopener\">\u003c/a>\u003c/em>\u003c/p>","note":"HTML allowed"}},"i5":{"title":{"text":"Sverige"},"html":{"text":"\u003cp>I Sverige är hat eller övergrepp på nätet inte en separat juridisk kategori. Polisen förklarar att samma strafflagar i allmänhet gäller för beteende online som offline, med relevanta brott som potentiellt inkluderar olaga hot, trakasserier, förtal, förolämpning, olaga intrång i privatlivet, sexuella trakasserier, olaga identitetsmissbruk (t.ex. falska profiler i någon annans namn) och hets mot en befolkningsgrupp. Om ett brott är motiverat av till exempel offrets etnicitet, religion eller sexuella läggning är detta en försvårande omständighet vid straffmätning. Svensk lag erkänner också olaga förföljelse, som kan uppstå vid upprepade brott mot samma person. Polisens vägledning råder specifikt personer som upplever stalking att bevara e-postmeddelanden, sms, samtalsregister och annan digital kommunikation som potentiella bevis. Källor: polisen.se; Riksdagen\u003c/p>\u003cp>\u003c/p>\u003cp>\u003cem>\u003ca href=\"https://polisen.se\" target=\"_blank\" rel=\"noopener\">\u003c/a>\u003ca href=\"https://www.riksdagen.se/sv/dokument-och-lagar/\" target=\"_blank\" rel=\"noopener\">\u003c/a>\u003c/em>\u003c/p>","note":"HTML allowed"}},"i6":{"title":{"text":"Slovenien"},"html":{"text":"\u003cp>\u003cstrong>Slovensk lag behandlar online-övergrepp genom befintlig lagstiftning som täcker specifika skadliga beteenden. Ett särskilt relevant exempel är artikel 134a i den slovenska strafflagen (KZ-1), som definierar stalking som att inkludera upprepade försök att upprätta oönskad kontakt genom elektronisk kommunikation, där beteendet orsakar rädsla eller en känsla av hot. Slovenska myndigheter har också erkänt onlinedimensionen av stalking i vägledning om tillämpningen av denna bestämmelse. Slovensk polisvägledning erkänner onlinevåld som inkluderar beteenden som hot, trakasserier, spridning av falskt eller förolämpande innehåll, missbruk av fotografier, identitetsstöld och skapande av skadliga falska profiler. Huruvida ett visst beteende utgör ett brott beror på omständigheterna i det enskilda fallet. Källa: GOV.SI\u003c/strong>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003cem>\u003ca href=\"https://www.gov.si/\" target=\"_blank\" rel=\"noopener\">\u003c/a>\u003c/em>\u003c/p>","note":"HTML allowed"}}}},"check":{"questions":{"q1":{"prompt":{"text":"En kränkande händelse online kan potentiellt innebära mer än en rättslig väg. Vilket påstående förklarar bäst varför?"},"choices":{"c0":{"text":"Den berörda personen kan välja vilken lag de föredrar."},"c1":{"text":"Samma incident kan ge upphov till olika rättsliga frågor beroende på beteende, omständigheter och tillämplig lag."},"c2":{"text":"Onlineincidenter omfattar automatiskt straffrättsliga och civilrättsliga åtgärder."},"c3":{"text":"Varje social medieplattform avgör vilken juridisk väg som gäller."}},"ok":{"text":"\u003cstrong>Rätta!\u003c/strong>","note":"HTML allowed"}},"q2":{"prompt":{"text":"Någon upplever skadligt beteende online, men beteendet uppfyller inte den lagliga gränsen för ett brott eller en skadeståndsanspråk. Vad innebär detta?"},"choices":{"c0":{"text":"Beteendet kan inte betraktas som nätövergrepp eftersom orden som används i kommentarerna inte är identiska med vad lagen beskriver."},"c1":{"text":"Plattformen ä
